name: Run Cloudflare observability diagnostics
description: Collect persisted telemetry, live-tail diagnostics, and public health snapshots in parallel
inputs:
  live-tail-worker:
    description: Cloudflare Worker script to observe with Live Tail
    required: true
  live-tail-seconds:
    description: Number of seconds to keep Live Tail open
    required: false
    default: '90'
  live-tail-probes:
    description: Optional comma-separated workers.dev probe paths
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Query persisted telemetry, capture live events, and snapshot public health
      shell: bash
      env:
        LIVE_TAIL_WORKER: ${{ inputs.live-tail-worker }}
        LIVE_TAIL_SECONDS: ${{ inputs.live-tail-seconds }}
        LIVE_TAIL_PROBES: ${{ inputs.live-tail-probes }}
      run: |
        set -uo pipefail
        actual_summary="$GITHUB_STEP_SUMMARY"
        (
          GITHUB_STEP_SUMMARY=observability-summary.md \
            python3 .github/scripts/query-cloudflare-observability.py \
            > observability-query.log 2>&1
        ) &
        query_pid=$!
        (
          set +e
          node .github/scripts/capture-cloudflare-live-tail.mjs 2>&1 | tee live-tail.log
          exit 0
        ) &
        tail_pid=$!
        (
          PUBLIC_HEALTH_OUTPUT=public-health-endpoints.md \
            node .github/scripts/capture-public-health-endpoints.mjs \
            > public-health-endpoints.log 2>&1
        ) &
        health_pid=$!

        query_status=0
        health_status=0
        wait "$query_pid" || query_status=$?
        wait "$tail_pid" || true
        wait "$health_pid" || health_status=$?

        aggregate_error_only=0
        if (( query_status != 0 )) && \
          grep -Eq '^::error title=Cloudflare Worker errors::invocation_errors=[1-9][0-9]* persisted_error_events=0 ' observability-query.log && \
          ! grep -q '^::error title=Cloudflare Observability::' observability-query.log; then
          aggregate_error_only=1
          sed 's/^::error title=Cloudflare Worker errors::/::warning title=Cloudflare Worker aggregate errors::/' observability-query.log
        else
          cat observability-query.log
        fi
        cat public-health-endpoints.log
        if [[ -f observability-summary.md ]]; then
          cat observability-summary.md >> "$actual_summary"
        fi
        if [[ -f public-health-endpoints.md ]]; then
          cat public-health-endpoints.md >> "$actual_summary"
        fi
        if (( query_status != 0 && aggregate_error_only == 0 )); then
          exit "$query_status"
        fi
        exit "$health_status"
