name: Resolve Cloudflare context
description: Export the Cloudflare token and resolve exactly one accessible account
inputs:
  api-token:
    description: Optional Cloudflare API token; falls back to the job environment
    required: false
    default: ''
  account-id:
    description: Optional explicit Cloudflare account ID
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Resolve account
      shell: bash
      env:
        INPUT_API_TOKEN: ${{ inputs.api-token || env.CLOUDFLARE_API_TOKEN || env.CLOUDFLARE_BUILDS_API_TOKEN }}
        INPUT_ACCOUNT_ID: ${{ inputs.account-id || env.CLOUDFLARE_ACCOUNT_ID }}
      run: node .github/scripts/resolve-cloudflare-account.mjs
