name: CI

on:
  pull_request:
    paths:
      - 'site/**'
      - 'database/**'
      - 'worker/**'
      - 'packages/sh-shared/**'
      - 'scripts/check-js-syntax.mjs'
      - 'scripts/cloudflare-d1-*.mjs'
      - 'scripts/discover-sh-page.mjs'
      - 'scripts/enforce-d1-*.mjs'
      - 'scripts/prepare-other-archive-import.py'
      - 'scripts/rebuild-local-facts.py'
      - 'scripts/rebuild-minute-facts-from-buddies.py'
      - 'scripts/validate-email-recaps*.ps1'
      - 'scripts/validate-monorepo.mjs'
      - 'tests/**'
      - '!tests/cloudflare-*.test.mjs'
      - '!tests/homepanel-*.test.mjs'
      - '!tests/observability-*.test.mjs'
      - '!tests/helpers/source-contract.mjs'
      - 'package.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Stationhead checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            worker/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pages dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: site

      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: worker

      - name: Check repository JavaScript syntax
        run: node scripts/check-js-syntax.mjs scripts tests .github/scripts/ci

      - name: Run repository JavaScript tests
        run: npm run test:js

      - name: Run SQL migration tests
        run: npm run test:sql

      - name: Check Pages
        run: npm run check
        working-directory: site

      - name: Run Pages integration tests
        run: node --test tests/*.test.js
        working-directory: site

      - name: Check Worker bundles
        run: npm run check
        working-directory: worker

      - name: Run Worker tests
        run: npm test
        working-directory: worker
