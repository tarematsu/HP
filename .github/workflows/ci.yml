name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/scripts/prepare-final-monorepo.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare final monorepo artifacts
    if: github.head_ref == 'agent/import-sh-snapshot' || github.ref_name == 'agent/import-sh-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-sh-snapshot
          fetch-depth: 0

      - name: Prepare latest HP main worktree
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/hp-main" origin/main

      - name: Fetch pinned SH source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/tarematsu/SH.git "$RUNNER_TEMP/SH-source"
          expected="741ccc82c94a17cbe3f3b57f8b6f180105ee1922"
          current="$(git -C "$RUNNER_TEMP/SH-source" rev-parse HEAD)"
          if [[ "$current" != "$expected" ]]; then
            git -C "$RUNNER_TEMP/SH-source" fetch --depth 1 origin "$expected"
            git -C "$RUNNER_TEMP/SH-source" checkout --detach "$expected"
          fi

      - name: Normalize applications, scripts, and workflows
        env:
          HP_MAIN: ${{ runner.temp }}/hp-main
          SH_SOURCE: ${{ runner.temp }}/SH-source
        run: |
          set -euo pipefail
          sed -i '/"prune-homepanel-updates.yml",/d' .github/scripts/prepare-final-monorepo.py
          python3 .github/scripts/prepare-final-monorepo.py
          python3 - <<'PY'
          from pathlib import Path

          for path in Path('corrected-workflows').glob('*.yml'):
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              output = []
              for index, line in enumerate(lines):
                  if line.strip() != 'env:':
                      output.append(line)
                      continue
                  indent = len(line) - len(line.lstrip(' '))
                  next_indent = None
                  for following in lines[index + 1:]:
                      if not following.strip():
                          continue
                      next_indent = len(following) - len(following.lstrip(' '))
                      break
                  if next_indent is not None and next_indent > indent:
                      output.append(line)
              path.write_text(''.join(output), encoding='utf-8')
          PY

      - name: Commit prepared artifacts
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hp .github/scripts corrected-workflows
          if git diff --cached --quiet; then
            echo "No preparation changes"
            exit 0
          fi
          git commit -m "Finalize synchronized HP and workflow bundle"
          git push origin HEAD:agent/import-sh-snapshot
