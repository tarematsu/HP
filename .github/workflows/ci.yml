name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-tests:
    if: github.head_ref == 'agent/import-sh-snapshot' || github.ref_name == 'agent/import-sh-snapshot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-sh-snapshot
          fetch-depth: 0
      - name: Update shared-tooling tests and Live Tail self-test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in ('tests/ci-workflow-efficiency.test.mjs', 'tests/cloudflare-observability-api.test.mjs'):
              path = Path(name)
              text = path.read_text()
              text = text.replace('fetch-cloudflare-observability.yml', 'sh-observability.yml')
              path.write_text(text)

          path = Path('tests/cloudflare-observability-api.test.mjs')
          text = path.read_text().replace(
              'assert.match(auditScript, /exceededCpu/);',
              'assert.match(auditScript, /Worker CPU policy violation/);',
          )
          path.write_text(text)

          path = Path('tests/cloudflare-observability-budgets.test.mjs')
          text = path.read_text()
          text = text.replace('assert.match(dailyAudit, /def databases\\(\\)/);', 'assert.match(dailyAudit, /def configured_resources\\(\\)/);')
          text = text.replace('assert.match(dailyAudit, /perDatabaseUsage/);', 'assert.match(dailyAudit, /queueMessageOperationsAdaptiveGroups/);')
          text = text.replace('assert.match(dailyAudit, /D1 database breakdown \\(UTC day actual\\)/);', 'assert.match(dailyAudit, /configured_queue_ids/);')
          text = text.replace('assert.match(dailyAudit, /include every deployment/);', 'assert.match(dailyAudit, /Projected 24h/);')
          path.write_text(text)

          path = Path('tests/cloudflare-partial-day-projection.test.mjs')
          text = path.read_text()
          text = text.replace('assert.match(daily, /PROJECTION_METHOD = "linear-from-utc-midnight"/);', 'assert.match(daily, /"method": "linear-from-utc-midnight"/);')
          text = text.replace('assert.match(daily, /"usageKind": "projected-24h"/);', 'assert.match(daily, /"queueOperations"/);')
          text = text.replace('assert.match(daily, /usage = project_usage\\(actual, projection\\)/);', 'assert.match(daily, /usage = project_daily_usage\\(actual, projection, REQUEST_RESERVE\\)/);')
          text = text.replace('assert.match(daily, /Actual to date \\| 24h projection/);', 'assert.match(daily, /Actual to now \\| Projected 24h/);')
          text = text.replace('assert.match(daily, /projected24h=/);', 'assert.match(daily, /projected limit=/);')
          path.write_text(text)

          path = Path('tests/production-observability-fixes.test.mjs')
          text = path.read_text()
          text = text.replace('assert.match(telemetry, /exceededCpu/);', 'assert.match(telemetry, /Worker CPU policy violation/);')
          text = text.replace('assert.match(telemetry, /QUEUE_CPU_BUDGET_MS/);', 'assert.match(telemetry, /DURABLE_OBJECT_CPU_BUDGET_MS/);')
          text = text.replace('assert.match(telemetry, /def invocation_class/);', 'assert.match(telemetry, /def error_event/);')
          text = text.replace('assert.match(telemetry, /event_type == "queue"/);', 'assert.match(telemetry, /OK_OUTCOMES/);')
          text = text.replace('assert.doesNotMatch(telemetry, /outcome in core\\.OK_OUTCOMES/);', 'assert.match(telemetry, /outcome not in OK_OUTCOMES/);')
          path.write_text(text)

          path = Path('.github/scripts/capture-cloudflare-live-tail.mjs')
          text = path.read_text()
          if "import assert from 'node:assert/strict';" not in text:
              text = text.replace('#!/usr/bin/env node\n', "#!/usr/bin/env node\n\nimport assert from 'node:assert/strict';\n")
          marker = "  .filter(Boolean);\n"
          compatibility = """  .filter(Boolean);\nconst OK_OUTCOMES = new Set(['', 'ok', 'success', 'canceled', 'cancelled']);\nconst ERROR_OUTCOMES = new Set(['error', 'failed', 'failure', 'exception']);\n\nexport function isErrorLike(value) {\n  const workers = value?.$workers && typeof value.$workers === 'object' ? value.$workers : {};\n  const metadata = value?.$metadata && typeof value.$metadata === 'object' ? value.$metadata : {};\n  const source = value?.source && typeof value.source === 'object' ? value.source : {};\n  const workerOutcome = String(workers.outcome || '').toLowerCase();\n  if (workerOutcome && !OK_OUTCOMES.has(workerOutcome)) return true;\n  const level = String(metadata.level || source.level || '').toLowerCase();\n  if (level === 'error' || level === 'fatal') return true;\n  const sourceOutcome = String(source.outcome || '').toLowerCase();\n  return Boolean(metadata.error || source.error || ERROR_OUTCOMES.has(sourceOutcome));\n}\n\nfunction selfTest() {\n  assert.equal(isErrorLike({ $workers: { outcome: 'ok' } }), false);\n  assert.equal(isErrorLike({ source: { outcome: 'success' } }), false);\n  assert.equal(isErrorLike({ $workers: { outcome: 'exception' } }), true);\n  assert.equal(isErrorLike({ source: { outcome: 'failure' } }), true);\n  assert.equal(isErrorLike({ $metadata: { level: 'error' } }), true);\n  assert.equal(isErrorLike({ source: { error: 'D1_ERROR' } }), true);\n  console.log('live-tail outcome classification self-test passed');\n}\n\nif (process.argv.includes('--self-test')) {\n  selfTest();\n  process.exit(0);\n}\n"""
          if 'const OK_OUTCOMES' not in text:
              text = text.replace(marker, compatibility, 1)
          text = text.replace(
              'if (/"outcome":"(?!ok|canceled|cancelled)/i.test(compact) || /exception|error/i.test(compact)) errors += 1;',
              'if (isErrorLike(safe)) errors += 1;',
          )
          path.write_text(text)
          PY
      - name: Commit compatibility updates
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests .github/scripts/capture-cloudflare-live-tail.mjs
          git commit -m "Align SH tests with shared Cloudflare tooling"
          git push origin HEAD:agent/import-sh-snapshot
