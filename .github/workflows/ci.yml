name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/scripts/prepare-final-monorepo.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare final monorepo artifacts
    if: github.head_ref == 'agent/import-sh-snapshot' || github.ref_name == 'agent/import-sh-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-sh-snapshot
          fetch-depth: 0

      - name: Prepare latest HP main worktree
        run: |
          set -euo pipefail
          git fetch origin main
          git worktree add --detach "$RUNNER_TEMP/hp-main" origin/main

      - name: Fetch pinned SH source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/tarematsu/SH.git "$RUNNER_TEMP/SH-source"
          expected="741ccc82c94a17cbe3f3b57f8b6f180105ee1922"
          current="$(git -C "$RUNNER_TEMP/SH-source" rev-parse HEAD)"
          if [[ "$current" != "$expected" ]]; then
            git -C "$RUNNER_TEMP/SH-source" fetch --depth 1 origin "$expected"
            git -C "$RUNNER_TEMP/SH-source" checkout --detach "$expected"
          fi

      - name: Normalize applications, scripts, and workflows
        env:
          HP_MAIN: ${{ runner.temp }}/hp-main
          SH_SOURCE: ${{ runner.temp }}/SH-source
        run: |
          set +e
          python3 .github/scripts/prepare-final-monorepo.py > prepare-final-monorepo.log 2>&1
          status=$?
          cat prepare-final-monorepo.log
          echo "$status" > prepare-final-monorepo.status
          exit 0

      - name: Commit and attempt push
        id: publish
        run: |
          set +e
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hp .github/scripts corrected-workflows prepare-final-monorepo.log prepare-final-monorepo.status
          git status --short > git-status.log
          git diff --cached --stat > staged-stat.log
          if git diff --cached --quiet; then
            echo "No preparation changes" | tee push.log
            exit 0
          fi
          git commit -m "Synchronize latest HP and prepare final workflows" > commit.log 2>&1
          commit_status=$?
          if [[ "$commit_status" -eq 0 ]]; then
            git push origin HEAD:agent/import-sh-snapshot > push.log 2>&1
            push_status=$?
          else
            cp commit.log push.log
            push_status=$commit_status
          fi
          cat commit.log || true
          cat push.log || true
          echo "$push_status" > push.status
          exit 0

      - name: Upload preparation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monorepo-preparation-${{ github.run_id }}
          path: |
            prepare-final-monorepo.log
            prepare-final-monorepo.status
            git-status.log
            staged-stat.log
            commit.log
            push.log
            push.status
          if-no-files-found: warn
          retention-days: 1

      - name: Fail when preparation or push failed
        if: always()
        run: |
          test "$(cat prepare-final-monorepo.status)" = "0"
          test "$(cat push.status)" = "0"
