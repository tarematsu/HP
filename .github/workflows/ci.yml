name: CI

on:
  pull_request:
    paths:
      - 'site/**'
      - 'database/**'
      - 'worker/**'
      - 'packages/sh-shared/**'
      - 'scripts/check-js-syntax.mjs'
      - '.github/scripts/ci/**'
      - 'scripts/cloudflare-d1-*.mjs'
      - 'scripts/discover-sh-page.mjs'
      - 'scripts/enforce-d1-*.mjs'
      - 'scripts/prepare-other-archive-import.py'
      - 'scripts/rebuild-local-facts.py'
      - 'scripts/rebuild-minute-facts-from-buddies.py'
      - 'scripts/validate-email-recaps*.ps1'
      - 'scripts/validate-monorepo.mjs'
      - 'tests/**'
      - '!tests/cloudflare-*.test.mjs'
      - '!tests/homepanel-*.test.mjs'
      - '!tests/observability-*.test.mjs'
      - '!tests/helpers/source-contract.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Stationhead checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            worker/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci --prefix site --prefer-offline --no-audit --no-fund
          npm ci --prefix worker --prefer-offline --no-audit --no-fund

      - name: Validate Stationhead
        run: npm run check:ci
