name: One-shot trigger HomePanel update check

on:
  push:
    branches:
      - ops/trigger-homepanel-update-2609230350
    paths:
      - '.github/workflows/one-shot-trigger-homepanel-update.yml'

permissions:
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe Stationhead weekly leaderboard API without session
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          status="$(curl --silent --show-error --location \
            --output "$body" --write-out '%{http_code}' \
            -H 'Accept: application/json' \
            'https://www.stationhead.com/api/weeklyLeaderboard' || true)"
          echo "status=$status"
          echo "content-type=$(file -b --mime-type "$body")"
          head -c 2000 "$body" | sed -E 's/[[:cntrl:]]/ /g'
          echo

      - name: Wake production update check
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{}' \
            'https://homepanel-cloud.tarematsu.workers.dev/v1/update/ping')"
          echo "$response"
          jq -e '.queued == true or .queued == false' <<< "$response" >/dev/null

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Query device update state
        shell: bash
        env:
          DATABASE_ID: 1c8eb0f8-cd73-4156-9ba7-b49bb18f13a3
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DATABASE_ID}/query"
          query() {
            local sql="$1"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg sql "$sql" '{sql:$sql}')" \
              "$api" | jq -c '{success,errors,result:[.result[]? | {results,success}]}'
          }

          echo '--- HEARTBEATS ---'
          query "SELECT device_id,last_seen_at,app_version,stationhead_ok,outbox_count,last_sequence FROM device_heartbeats ORDER BY last_seen_at DESC LIMIT 10"
          echo '--- UPDATE COMMANDS ---'
          query "SELECT id,device_id,command,created_at,expires_at,delivered_at,completed_at,success,result,payload FROM device_commands WHERE command='check_update' ORDER BY id DESC LIMIT 20"
          echo '--- UPDATE STATE ---'
          query "SELECT source,version,payload,observed_at,fetched_at,status FROM current_state WHERE source='update'"