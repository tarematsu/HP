name: Refresh played tracks day

on:
  schedule:
    - cron: '46 0 * * *'
  # Historical Track History reconstruction is a high-read D1 operation.
  # Keep it on the once-daily schedule or explicit manual dispatch; ordinary
  # main pushes must not rebuild the same completed day repeatedly.
  workflow_dispatch:
    inputs:
      day:
        description: UTC day to rebuild (YYYY-MM-DD). Empty means the latest completed UTC day.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: refresh-played-tracks-day
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      FACTS_DATABASE_NAME: stationhead-minute
      PAGES_RESPONSE_BUCKET: sh-pages-responses
      TRACK_HISTORY_REPAIR_DAY: ${{ inputs.day || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Refresh one completed Track History day and publish it to R2
        shell: bash
        run: |
          set -o pipefail
          node scripts/repair-track-history-day-actions.mjs 2>&1 | tee repair-track-history-day.log
      - name: Upload refresh failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-track-history-day-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker/repair-track-history-day.log
          if-no-files-found: error
          retention-days: 7
