name: Cleanup hidden regional services v2

on:
  push:
    branches:
      - cleanup/remove-hidden-regional-services-v2-20261003

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'chore: run hidden regional service cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-hidden-regional-services-v2-20261003
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply cleanup
        run: python3 .github/scripts/cleanup_hidden_regional_services.py
      - name: Commit cleanup
        shell: bash
        run: |
          git status --short
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove hidden regional music services"
          git push origin HEAD:cleanup/remove-hidden-regional-services-v2-20261003
