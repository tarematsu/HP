name: Cleanup hidden regional services

on:
  push:
    branches:
      - cleanup/remove-hidden-regional-services-v2-20261003

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-hidden-regional-services-v2-20261003
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 .github/scripts/cleanup_hidden_regional_services.py
      - name: Commit cleanup
        run: |
          if git diff --quiet && git diff --cached --quiet; then exit 0; fi
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove hidden regional music services"
          git push origin HEAD:cleanup/remove-hidden-regional-services-v2-20261003
