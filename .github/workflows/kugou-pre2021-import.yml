name: Kugou pre-2021 import

on:
  push:
    branches:
      - feat/kugou-japan-history-2021-final
    paths:
      - .github/workflows/kugou-pre2021-import.yml

permissions:
  contents: write
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kugou-japan-history-2021-final
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download verified Kugou backfills
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/kugou-pre /tmp/kugou-post
          gh run download 37005755911 -n kugou-pre2021-web-history-backfill -D /tmp/kugou-pre
          gh run download 36988590743 -n kugou-web-history-backfill -D /tmp/kugou-post
      - name: Extend history to first Japan chart issue
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pre = JSON.parse(fs.readFileSync('/tmp/kugou-pre/kugou-pre2021-web-history-backfill.json', 'utf8'));
          const post = JSON.parse(fs.readFileSync('/tmp/kugou-post/kugou-web-history-backfill.json', 'utf8'));

          const preRows = pre.matches.map((x) => ({
            published_at: x.date,
            year: Number(x.year),
            issue: Number(x.issue),
            volid: Number(x.volid),
            canonical_artist: x.group,
            rank: Number(x.rank),
            title: x.title,
          }));
          if (preRows.length !== 484) throw new Error(`expected 484 pre-2021 rows, got ${preRows.length}`);
          fs.writeFileSync(
            'worker/src/kugou-japan-chart-legacy-pre2021.js',
            `export const KUGOU_JAPAN_CHART_LEGACY_PRE2021 = Object.freeze(${JSON.stringify(preRows)});\n`,
          );

          const preDates = pre.issues
            .filter((x) => x.date && x.page_count === 4 && x.date_matches !== false && x.date < '2021-01-01')
            .map((x) => x.date);
          const postDates = post.issues
            .filter((x) => x.date && x.page_count === 4 && x.date >= '2021-01-01' && x.date < '2024-10-31')
            .map((x) => x.date);
          const covered = [...new Set([...preDates, ...postDates])].sort();
          if (covered.length !== 1809) throw new Error(`expected 1809 legacy covered dates, got ${covered.length}`);
          if (covered[0] !== '2017-11-22' || covered.at(-1) !== '2024-10-30') throw new Error(`unexpected coverage ${covered[0]}..${covered.at(-1)}`);
          fs.writeFileSync(
            'worker/src/kugou-japan-chart-legacy-covered-dates.js',
            `export const KUGOU_JAPAN_CHART_LEGACY_COVERED_DATES = Object.freeze(${JSON.stringify(covered)});\n`,
          );

          const history = `import { KUGOU_JAPAN_CHART_LEGACY_PRE2021 } from './kugou-japan-chart-legacy-pre2021.js';
          import { KUGOU_JAPAN_CHART_LEGACY_2021 } from './kugou-japan-chart-legacy-2021.js';
          import { KUGOU_JAPAN_CHART_LEGACY_2022 } from './kugou-japan-chart-legacy-2022.js';
          import { KUGOU_JAPAN_CHART_LEGACY_2023 } from './kugou-japan-chart-legacy-2023.js';
          import { KUGOU_JAPAN_CHART_LEGACY_2024 } from './kugou-japan-chart-legacy-2024.js';
          import { KUGOU_JAPAN_CHART_LEGACY_COVERED_DATES } from './kugou-japan-chart-legacy-covered-dates.js';
          import { KUGOU_JAPAN_CHART_2024 } from './kugou-japan-chart-2024.js';
          import { KUGOU_JAPAN_CHART_2025 } from './kugou-japan-chart-2025.js';
          import { KUGOU_JAPAN_CHART_2026 } from './kugou-japan-chart-2026.js';

          export const KUGOU_JAPAN_CHART_HISTORY = Object.freeze([
            ...KUGOU_JAPAN_CHART_LEGACY_PRE2021,
            ...KUGOU_JAPAN_CHART_LEGACY_2021,
            ...KUGOU_JAPAN_CHART_LEGACY_2022,
            ...KUGOU_JAPAN_CHART_LEGACY_2023,
            ...KUGOU_JAPAN_CHART_LEGACY_2024,
            ...KUGOU_JAPAN_CHART_2024,
            ...KUGOU_JAPAN_CHART_2025,
            ...KUGOU_JAPAN_CHART_2026,
          ]);

          export const KUGOU_JAPAN_CHART_COVERAGE = Object.freeze({
            chart_id: 'japan_31312',
            oldest_available: '2017-11-22',
            legacy_latest_available: '2024-10-30',
            current_api_oldest_available: '2024-10-31 10:10:01',
            latest_available: '2026-09-30 10:10:01',
            latest_checked: '2026-10-01 10:10:00',
            latest_rank_in: '2026-09-30 10:10:01',
            legacy_covered_dates: KUGOU_JAPAN_CHART_LEGACY_COVERED_DATES,
            entries: KUGOU_JAPAN_CHART_HISTORY.length,
            note: '2017-11-22〜2024-10-30はKugou旧Web日本榜の保存ページから各公開号を復元。初期の一部号は当時の公開件数自体が100曲未満。2024-10-31以降は現行ランキングAPIを使用。',
          });
          `.replace(/^          /gm, '');
          fs.writeFileSync('worker/src/kugou-japan-chart-history.js', history);

          const testPath = 'worker/tests/regional-music-read-model.test.js';
          let test = fs.readFileSync(testPath, 'utf8');
          const replacements = [
            [`assert.equal(history.length, 1012);`, `assert.equal(history.length, 1496);`],
            [`assert.equal(payload.kugou_japan_chart.coverage.oldest_available, '2021-01-01');`, `assert.equal(payload.kugou_japan_chart.coverage.oldest_available, '2017-11-22');`],
            [`assert.equal(payload.kugou_japan_chart.coverage.legacy_covered_dates.length, 841);`, `assert.equal(payload.kugou_japan_chart.coverage.legacy_covered_dates.length, 1809);`],
            [`assert.equal(counts.get('nogizaka46'), 784);`, `assert.equal(counts.get('nogizaka46'), 1127);`],
            [`assert.equal(counts.get('hinatazaka46'), 115);`, `assert.equal(counts.get('hinatazaka46'), 256);`],
          ];
          for (const [from, to] of replacements) {
            if (!test.includes(from)) throw new Error(`test anchor missing: ${from}`);
            test = test.replace(from, to);
          }
          test = test.replaceAll('kugou_japan_chart.history.length, 1012', 'kugou_japan_chart.history.length, 1496');
          test = test.replaceAll('kugou_japan_chart_entries: 1012', 'kugou_japan_chart_entries: 1496');
          const bestAnchor = `  assert.equal(best('hinatazaka46'), 4);`;
          if (!test.includes(bestAnchor)) throw new Error('best-rank anchor missing');
          test = test.replace(bestAnchor, `${bestAnchor}\n  assert.ok(history.some((item) => item.published_at === '2019-04-22' && item.canonical_artist === 'hinatazaka46' && item.rank === 50));\n  assert.ok(history.some((item) => item.published_at === '2019-05-30' && item.canonical_artist === 'nogizaka46' && item.rank === 45));`);
          fs.writeFileSync(testPath, test);

          console.log({ rows: preRows.length, legacy_covered_dates: covered.length, first: covered[0], last: covered.at(-1) });
          NODE
      - name: Commit extension
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker/src/kugou-japan-chart-legacy-pre2021.js worker/src/kugou-japan-chart-legacy-covered-dates.js worker/src/kugou-japan-chart-history.js worker/tests/regional-music-read-model.test.js
          git commit -m "Extend Kugou Japan chart history to 2017"
          git push origin HEAD:feat/kugou-japan-history-2021-final
