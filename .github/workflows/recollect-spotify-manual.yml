name: Recollect Spotify today manually
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/recollect-spotify-manual.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: spotify-manual-collection
  cancel-in-progress: false
jobs:
  recollect:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-spotify-today]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for official production deployment
        if: github.event_name == 'workflow_dispatch'
        working-directory: worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-production-deploy.mjs
      - name: Install dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Recollect today and verify all three artists
        working-directory: worker
        run: node scripts/recollect-spotify-actions.mjs
