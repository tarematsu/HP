name: Spotify playcount debug

on:
  push:
    branches:
      - fix/spotify-playcount-collection
    paths:
      - '.github/workflows/spotify-playcount-debug.yml'
      - 'worker/src/spotify-playcount-collector.js'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify full Spotify discography query
        working-directory: worker
        run: |
          node --input-type=module <<'NODE'
          import { SPOTIFY_TARGET_ARTISTS } from './src/spotify-playcount-collector.js';
          const artist = SPOTIFY_TARGET_ARTISTS.find((entry) => entry.artist_key === 'sakurazaka46');
          const headers = {
            accept: 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
            'accept-language': 'ja-JP,ja;q=0.9,en;q=0.7',
            'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145.0.0.0 Safari/537.36',
          };
          const embed = await fetch(`https://open.spotify.com/embed/artist/${artist.spotify_artist_id}`, { headers });
          const html = await embed.text();
          const match = html.match(/<script[^>]+id=["']__NEXT_DATA__["'][^>]*>([\s\S]*?)<\/script>/i);
          if (!match) throw new Error('__NEXT_DATA__ missing');
          const token = JSON.parse(match[1]).props?.pageProps?.state?.settings?.session?.accessToken;
          if (!token) throw new Error('anonymous token missing');
          const url = new URL('https://api-partner.spotify.com/pathfinder/v1/query');
          url.searchParams.set('operationName', 'queryArtistDiscographyAll');
          url.searchParams.set('variables', JSON.stringify({ uri: `spotify:artist:${artist.spotify_artist_id}`, offset: 0, limit: 100 }));
          url.searchParams.set('extensions', JSON.stringify({ persistedQuery: { version: 1, sha256Hash: '9380995a9d4663cbcb5113fef3c6aabf70ae6d407ba61793fd01e2a1dd6929b0' } }));
          const response = await fetch(url, { headers: { authorization: `Bearer ${token}`, accept: 'application/json' } });
          const body = await response.json();
          const all = body?.data?.artistUnion?.discography?.all;
          const releases = (all?.items || []).flatMap((group) => group?.releases?.items || []);
          const unique = [...new Map(releases.map((release) => [release.id || release.uri, release])).values()];
          const types = unique.reduce((acc, release) => { const key = release.type || 'UNKNOWN'; acc[key] = (acc[key] || 0) + 1; return acc; }, {});
          console.log(JSON.stringify({ status: response.status, errors: body?.errors?.map((e) => e.message) || [], totalCount: all?.totalCount ?? null, groups: all?.items?.length ?? 0, releases: releases.length, unique: unique.length, types, first: unique[0] ? { id: unique[0].id, uri: unique[0].uri, name: unique[0].name, type: unique[0].type, tracks: unique[0].tracks?.totalCount } : null }));
          if (!response.ok || unique.length < 20) process.exit(1);
          NODE
