name: Spotify playcount debug

on:
  push:
    branches:
      - fix/spotify-playcount-collection
    paths:
      - '.github/workflows/spotify-playcount-debug.yml'
      - 'worker/src/spotify-playcount-collector.js'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe known Spotify album and track SSR
        working-directory: worker
        run: |
          node --input-type=module <<'NODE'
          const albumId = '5i6dKEtZzYKYnigumydAgo';
          const trackId = '1CCL2gp0Y9eJLrVgt0lOEq';
          const baseHeaders = {
            accept: 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
            'accept-language': 'ja-JP,ja;q=0.9,en;q=0.7',
          };
          const uas = {
            chrome: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145.0.0.0 Safari/537.36',
            googlebot: 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)',
            bingbot: 'Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)',
          };

          async function inspect(kind, url, uaName, ua) {
            const response = await fetch(url, { headers: { ...baseHeaders, 'user-agent': ua }, redirect: 'follow' });
            const html = await response.text();
            const playcountJson = [...html.matchAll(/"playcount"\s*:\s*"?(\d+)"?/g)].map((m) => m[1]);
            const commaNumbers = [...html.matchAll(/>(\d{1,3}(?:,\d{3})+)</g)].map((m) => m[1]);
            const trackUris = [...new Set([...html.matchAll(/spotify:track:([A-Za-z0-9]{16,32})/g)].map((m) => m[1]))];
            const albumUris = [...new Set([...html.matchAll(/spotify:album:([A-Za-z0-9]{16,32})/g)].map((m) => m[1]))];
            console.log(kind + '=' + JSON.stringify({ ua: uaName, status: response.status, finalUrl: response.url, bytes: html.length, initialState: /id=["']initialState["']/.test(html), nextData: /id=["']__NEXT_DATA__["']/.test(html), playcountJson: playcountJson.length, firstPlaycountJson: playcountJson[0] || null, commaNumbers: commaNumbers.slice(0, 10), trackUris: trackUris.length, albumUris: albumUris.length, hasKikkake: html.includes('きっかけ'), hasKnownCount: html.includes('13,446,180') }));
          }

          for (const [uaName, ua] of Object.entries(uas)) {
            await inspect('ALBUM', `https://open.spotify.com/intl-ja/album/${albumId}`, uaName, ua);
            await inspect('TRACK', `https://open.spotify.com/intl-ja/track/${trackId}`, uaName, ua);
          }
          NODE
