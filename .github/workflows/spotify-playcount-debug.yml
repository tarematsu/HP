name: Spotify playcount debug

on:
  push:
    branches:
      - fix/spotify-playcount-collection
    paths:
      - '.github/workflows/spotify-playcount-debug.yml'
      - 'worker/src/spotify-playcount-collector.js'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Spotify public pages
        working-directory: worker
        run: |
          node --input-type=module <<'NODE'
          import {
            SPOTIFY_TARGET_ARTISTS,
            albumIdsFromDiscographyHtml,
          } from './src/spotify-playcount-collector.js';

          const headers = {
            accept: 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8',
            'accept-language': 'ja-JP,ja;q=0.9,en;q=0.7',
            'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145.0.0.0 Safari/537.36',
          };

          function summarize(html) {
            const rawAlbumUris = [...html.matchAll(/spotify:album:([A-Za-z0-9]{16,32})/g)].map((m) => m[1]);
            const hrefAlbums = [...html.matchAll(/\/album\/([A-Za-z0-9]{16,32})/g)].map((m) => m[1]);
            return {
              parsedAlbums: albumIdsFromDiscographyHtml(html).length,
              rawAlbumUris: new Set(rawAlbumUris).size,
              hrefAlbums: new Set(hrefAlbums).size,
              initialState: /id=["']initialState["']/.test(html),
              nextData: /id=["']__NEXT_DATA__["']/.test(html),
            };
          }

          const artist = SPOTIFY_TARGET_ARTISTS.find((entry) => entry.artist_key === 'sakurazaka46');
          const id = artist.spotify_artist_id;
          const urls = [
            `https://open.spotify.com/artist/${id}`,
            `https://open.spotify.com/artist/${id}/discography/all`,
            `https://open.spotify.com/artist/${id}/discography/album`,
            `https://open.spotify.com/artist/${id}/discography/single`,
            `https://open.spotify.com/embed/artist/${id}`,
            `https://open.spotify.com/intl-ja/artist/${id}`,
          ];

          for (const url of urls) {
            const response = await fetch(url, { headers, redirect: 'follow' });
            const html = await response.text();
            console.log(JSON.stringify({ url, status: response.status, finalUrl: response.url, bytes: html.length, contentType: response.headers.get('content-type'), ...summarize(html) }));
          }
          NODE
