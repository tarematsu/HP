name: Run daily deep repair

on:
  # Runs after the 09:31 JST four-hour integrity pass so bounded minute repairs
  # can land before aggregate reconciliation.
  schedule:
    - cron: '46 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-deep-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      BUDDIES_DATABASE_NAME: stationhead-buddies
      FACTS_DATABASE_NAME: stationhead-minute
      OTHER_DATABASE_NAME: stationhead-other
      RUNTIME_MAINTENANCE_DEADLINE_MS: '720000'
      RUNTIME_MAINTENANCE_COLLECTOR_ID: daily-deep-repair-actions
      RUNTIME_MAINTENANCE_FORCE: 'true'
      RUNTIME_MAINTENANCE_SKIP_REBUILD: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Repair recent daily summaries
        shell: bash
        run: node scripts/publish-recent-daily-summaries-actions.mjs 2>&1 | tee daily-deep-repair.log
      - name: Reconcile rollups and retention
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-runtime-offline-maintenance-actions.mjs 2>&1 | tee -a daily-deep-repair.log
      - name: Upload daily deep repair failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-deep-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker/daily-deep-repair.log
          if-no-files-found: error
          retention-days: 7
