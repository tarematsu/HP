name: PR256 apply Cloudflare free-tier fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr256-apply-cloudflare-free-tier-fix.yml'
      - '.github/scripts/pr256_cloudflare_free_tier_fix.py'

permissions:
  contents: write

concurrency:
  group: pr256-apply-cloudflare-free-tier-fix
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-sh-snapshot
          fetch-depth: 0
          show-progress: false
      - name: Apply policy patch
        run: python3 .github/scripts/pr256_cloudflare_free_tier_fix.py
      - name: Validate targeted contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit-cloudflare-daily-usage.py --self-test
          python3 .github/scripts/audit-cloudflare-free-tier.py --self-test
          node --test \
            scripts/cloudflare-d1-hourly-usage.test.mjs \
            tests/cloudflare-free-tier-budgets.test.mjs \
            tests/cloudflare-runtime-relay-budget.test.mjs \
            tests/cloudflare-observability-budgets.test.mjs \
            tests/homepanel-observability-contract.test.mjs \
            tests/d1-budget-regressions.test.mjs \
            tests/ci-workflow-efficiency.test.mjs \
            tests/d1-free-tier-budget-enforcement.test.mjs \
            tests/d1-storage-audit.test.mjs
          git diff --check
      - name: Commit fixes and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/pr256-cloudflare-free-tier-100.yml \
            .github/workflows/pr256-apply-cloudflare-free-tier-fix.yml \
            .github/scripts/pr256_cloudflare_free_tier_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: enforce full Cloudflare free-tier budgets'
          git push origin HEAD:agent/import-sh-snapshot
