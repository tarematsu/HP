name: Target old NetEase Japanese chart Bilibili video

on:
  pull_request:
    paths:
      - '.github/workflows/research-netease-japan-bilibili-old.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install yt-dlp
        run: python -m pip install --disable-pip-version-check -U yt-dlp
      - name: Search exact old chart video and inspect candidates
        shell: bash
        run: |
          mkdir -p research-bilibili-old
          python - <<'PY'
          import json, pathlib, subprocess, urllib.request, urllib.error, re
          queries=[
            '[网易云日语榜]来听听网易云日语榜前三十都是什么歌',
            '来听听网易云日语榜前三十都是什么歌',
            'Ajisai_Z 网易云日语榜',
            '网易云日语榜 前三十',
            '网易云日语榜 TOP30 2024',
          ]
          aids=[]; raw=[]
          for qi,q in enumerate(queries):
            cmd=['yt-dlp','--flat-playlist','--dump-single-json',f'bilisearch20:{q}']
            cp=subprocess.run(cmd,capture_output=True,text=True,timeout=90)
            pathlib.Path(f'research-bilibili-old/search-{qi}.out').write_text(cp.stdout or '')
            pathlib.Path(f'research-bilibili-old/search-{qi}.err').write_text(cp.stderr or '')
            print('\nQUERY',q,'exit',cp.returncode)
            try:
              d=json.loads(cp.stdout)
            except Exception:
              d={}
            for e in d.get('entries') or []:
              if not isinstance(e,dict): continue
              aid=str(e.get('id') or '')
              if aid and aid not in aids: aids.append(aid)
              raw.append({'query':q,'id':aid,'title':e.get('title'),'url':e.get('url'),'webpage_url':e.get('webpage_url')})
              print(json.dumps(raw[-1],ensure_ascii=False))
          pathlib.Path('research-bilibili-old/search-entries.json').write_text(json.dumps(raw,ensure_ascii=False,indent=2))
          print('\nUNIQUE AIDs',len(aids),aids)
          headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36','Referer':'https://www.bilibili.com/'}
          def get_json(url,aid):
            req=urllib.request.Request(url,headers={**headers,'Referer':'https://www.bilibili.com/video/av'+aid})
            try:
              with urllib.request.urlopen(req,timeout=12) as r: return r.status,json.loads(r.read().decode('utf-8','replace'))
            except Exception as e: return None,{'error':repr(e)}
          summaries=[]
          for aid in aids:
            s={'aid':aid}
            for key,url in [
              ('pages',f'https://api.bilibili.com/x/player/pagelist?aid={aid}'),
              ('tags',f'https://api.bilibili.com/x/tag/archive/tags?aid={aid}'),
              ('desc',f'https://api.bilibili.com/x/web-interface/archive/desc?aid={aid}')]:
              st,j=get_json(url,aid); s[key+'_status']=st
              data=j.get('data') if isinstance(j,dict) else None
              if key=='pages' and isinstance(data,list):
                s['parts']=[{'cid':x.get('cid'),'part':x.get('part'),'duration':x.get('duration')} for x in data if isinstance(x,dict)]
              elif key=='tags' and isinstance(data,list):
                s['tags']=[x.get('tag_name') for x in data if isinstance(x,dict)]
              elif key=='desc':
                s['desc']=data
            hay=json.dumps(s,ensure_ascii=False)
            s['target_score']=sum(x in hay for x in ['网易云日语榜','前三十','日语','日語','Ajisai','JPOP'])
            summaries.append(s)
            if s['target_score'] or '日语' in hay:
              print('TARGET?',json.dumps(s,ensure_ascii=False)[:18000])
          summaries.sort(key=lambda x:x.get('target_score',0),reverse=True)
          pathlib.Path('research-bilibili-old/candidates.json').write_text(json.dumps(summaries,ensure_ascii=False,indent=2))
          print('\nTOP CANDIDATES')
          for s in summaries[:20]: print(json.dumps(s,ensure_ascii=False)[:18000])
          PY
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netease-japan-bilibili-old-research
          path: research-bilibili-old
          if-no-files-found: warn
