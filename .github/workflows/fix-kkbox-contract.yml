name: Fix KKBOX API contract test

on:
  push:
    branches:
      - feature/kkbox-regional-collection
    paths:
      - '.github/workflows/fix-kkbox-contract.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/kkbox-regional-collection
      - name: Update contract version expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site/tests/pages-api-gateway.test.js')
          s = p.read_text()
          old = "assert.equal(catalog.contract_version, 19);"
          new = "assert.equal(catalog.contract_version, 20);"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one contract assertion, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Verify full test file remains intact
        run: |
          grep -q "unified health reports individual component failures" site/tests/pages-api-gateway.test.js
          grep -q "only the unified public health Function route exists" site/tests/pages-api-gateway.test.js
          node --check site/tests/pages-api-gateway.test.js
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site/tests/pages-api-gateway.test.js
          git commit -m "Fix Pages API contract expectations for KKBOX"
          git push origin HEAD:feature/kkbox-regional-collection
