name: Stationhead leaderboard probe report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Pull sanitized probe status and latest payload directly from R2
        shell: bash
        env:
          STATUS_KEY: diagnostics/stationhead-leaderboard/status.json
          LATEST_KEY: diagnostics/stationhead-leaderboard/latest.json
        run: |
          set -euo pipefail
          mkdir -p probe-artifact
          status_artifact='probe-artifact/stationhead-leaderboard-probe-status.json'
          latest_artifact='probe-artifact/stationhead-leaderboard-latest.json'
          latest_raw="$(mktemp)"
          trap 'rm -f "$latest_raw"' EXIT

          api='https://api.cloudflare.com/client/v4'
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          encoded_status_key="$(jq -rn --arg value "$STATUS_KEY" '$value | split("/") | map(@uri) | join("/")')"
          encoded_latest_key="$(jq -rn --arg value "$LATEST_KEY" '$value | split("/") | map(@uri) | join("/")')"

          bucket_cursor=''
          found_status=0
          found_latest=0
          while true; do
            query=(--get --data-urlencode 'per_page=1000')
            [[ -z "$bucket_cursor" ]] || query+=(--data-urlencode "cursor=$bucket_cursor")
            buckets_response="$(curl --fail-with-body --silent --show-error \
              -H "$auth_header" "${query[@]}" \
              "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets")"
            jq -e '.success == true and (.result.buckets | type == "array")' <<< "$buckets_response" >/dev/null
            mapfile -t bucket_names < <(jq -r '.result.buckets[]?.name' <<< "$buckets_response")

            for bucket in "${bucket_names[@]}"; do
              [[ "$bucket" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || continue
              status_candidate="$(mktemp)"
              status_code="$(curl --silent --show-error -H "$auth_header" --output "$status_candidate" --write-out '%{http_code}' \
                "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${bucket}/objects/${encoded_status_key}" || true)"
              if [[ "$status_code" == '200' ]]; then
                found_status=$((found_status + 1))
                [[ "$found_status" -eq 1 ]] || { echo 'Leaderboard probe status exists in more than one R2 bucket.' >&2; exit 1; }
                mv "$status_candidate" "$status_artifact"
              else
                rm -f "$status_candidate"
                [[ "$status_code" == '404' ]] || { echo "R2 status lookup failed with HTTP ${status_code}." >&2; exit 1; }
              fi

              latest_candidate="$(mktemp)"
              latest_code="$(curl --silent --show-error -H "$auth_header" --output "$latest_candidate" --write-out '%{http_code}' \
                "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${bucket}/objects/${encoded_latest_key}" || true)"
              if [[ "$latest_code" == '200' ]]; then
                found_latest=$((found_latest + 1))
                [[ "$found_latest" -eq 1 ]] || { echo 'Leaderboard latest payload exists in more than one R2 bucket.' >&2; exit 1; }
                mv "$latest_candidate" "$latest_raw"
              else
                rm -f "$latest_candidate"
                [[ "$latest_code" == '404' ]] || { echo "R2 latest lookup failed with HTTP ${latest_code}." >&2; exit 1; }
              fi
            done

            next_cursor="$(jq -r '.result_info.cursor // empty' <<< "$buckets_response")"
            [[ -n "$next_cursor" ]] || break
            [[ "$next_cursor" != "$bucket_cursor" ]] || { echo 'Cloudflare R2 bucket listing returned a repeated cursor.' >&2; exit 1; }
            bucket_cursor="$next_cursor"
          done

          if [[ "$found_status" -eq 0 ]]; then
            printf '%s\n' '{"version":1,"updated_at":null,"stage":"no_status"}' > "$status_artifact"
          fi
          if [[ "$found_latest" -eq 0 ]]; then
            printf '%s\n' '{"version":1,"available":false,"received_at":null,"digest":null,"record_count":0,"records":[]}' > "$latest_artifact"
          else
            RAW_LATEST="$latest_raw" LATEST_ARTIFACT="$latest_artifact" node - <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync(process.env.RAW_LATEST, 'utf8'));
          if (!source || source.version !== 1 || !Array.isArray(source.records)) throw new Error('invalid leaderboard latest payload');
          const forbiddenKey = /authorization|token|secret|password|cookie|device.?uid|device_?id|session/i;
          const forbiddenValue = /\bBearer\s+|authorization:|cookie:/i;
          const sanitize = (value, depth = 0) => {
            if (depth > 12) return '[depth-limit]';
            if (Array.isArray(value)) return value.slice(0, 500).map((item) => sanitize(item, depth + 1));
            if (!value || typeof value !== 'object') return typeof value === 'string' ? value.replace(/Bearer\s+[^\s]+/gi, 'Bearer [redacted]') : value;
            return Object.fromEntries(Object.entries(value).slice(0, 500)
              .filter(([key]) => !forbiddenKey.test(key))
              .map(([key, item]) => [key, sanitize(item, depth + 1)]));
          };
          const artifact = {
            version: 1,
            available: true,
            received_at: Number.isSafeInteger(source.received_at) ? source.received_at : null,
            digest: typeof source.digest === 'string' ? source.digest.slice(0, 128) : null,
            record_count: Math.min(source.records.length, 8),
            records: source.records.slice(0, 8).map((record) => sanitize(record)),
          };
          const verify = (value, trail = []) => {
            if (Array.isArray(value)) return value.forEach((entry, index) => verify(entry, trail.concat(String(index))));
            if (value && typeof value === 'object') {
              for (const [key, entry] of Object.entries(value)) {
                if (forbiddenKey.test(key)) throw new Error(`forbidden leaderboard field: ${trail.concat(key).join('.')}`);
                verify(entry, trail.concat(key));
              }
            } else if (typeof value === 'string' && forbiddenValue.test(value)) {
              throw new Error(`forbidden diagnostic field: ${trail.join('.')}`);
            }
          };
          verify(artifact);
          fs.writeFileSync(process.env.LATEST_ARTIFACT, `${JSON.stringify(artifact, null, 2)}\n`);
          NODE
          fi

          echo 'Status and sanitized latest records were read through the Cloudflare R2 REST API without using a Worker public URL.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe status artifact
        uses: actions/upload-artifact@v4
        with:
          name: stationhead-leaderboard-probe-status
          path: probe-artifact/stationhead-leaderboard-probe-status.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload latest leaderboard records artifact
        uses: actions/upload-artifact@v4
        with:
          name: stationhead-leaderboard-latest
          path: probe-artifact/stationhead-leaderboard-latest.json
          if-no-files-found: error
          retention-days: 7
