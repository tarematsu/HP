name: Stationhead leaderboard probe report

on:
  repository_dispatch:
    types: [stationhead-leaderboard-probe]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Build private probe artifact
        env:
          EVENT_PATH: ${{ github.event_path }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          event_path = os.environ["EVENT_PATH"]
          with open(event_path, "r", encoding="utf-8") as handle:
              event = json.load(handle)
          payload = event.get("client_payload") or {}
          if not isinstance(payload, dict):
              raise SystemExit("client_payload must be an object")

          forbidden = re.compile(
              r"authorization|token|secret|password|cookie|device.?uid|session",
              re.IGNORECASE,
          )

          def redact(value):
              if isinstance(value, dict):
                  return {
                      str(key): "[redacted]" if forbidden.search(str(key)) else redact(item)
                      for key, item in value.items()
                  }
              if isinstance(value, list):
                  return [redact(item) for item in value]
              if isinstance(value, str):
                  return re.sub(r"Bearer\s+[A-Za-z0-9._~+\/-]+=*", "Bearer [redacted]", value)
              return value

          payload = redact(payload)
          artifact = Path("probe-artifact")
          artifact.mkdir(parents=True, exist_ok=True)
          output = artifact / "stationhead-leaderboard-probe.json"
          output.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          best = payload.get("best") if isinstance(payload.get("best"), dict) else {}
          top_summary = {
              "received_at": payload.get("received_at", ""),
              "records": payload.get("records", ""),
              "history_key": payload.get("history_key", ""),
          }
          best_summary = {
              "source": best.get("source", ""),
              "url": best.get("url", ""),
              "method": best.get("method", ""),
              "status": best.get("status", ""),
              "content_type": best.get("content_type", ""),
              "body_chars": best.get("body_chars", ""),
          }
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Stationhead leaderboard probe received\n\n")
              for key, value in {**top_summary, **best_summary}.items():
                  text = str(value).replace("\n", " ").replace("\r", " ")[:2000]
                  summary.write(f"- **{key}**: `{text}`\n")
              summary.write("\nResponse bodies and candidate previews are intentionally omitted from logs and stored only in the Actions artifact.\n")
          PY

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: stationhead-leaderboard-probe
          path: probe-artifact/stationhead-leaderboard-probe.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
