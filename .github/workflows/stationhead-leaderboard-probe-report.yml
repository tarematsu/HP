name: Stationhead leaderboard probe report

on:
  repository_dispatch:
    types: [stationhead-leaderboard-probe]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Build private probe artifact
        env:
          EVENT_PATH: ${{ github.event_path }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event_path = os.environ["EVENT_PATH"]
          with open(event_path, "r", encoding="utf-8") as handle:
              event = json.load(handle)
          payload = event.get("client_payload") or {}
          if not isinstance(payload, dict):
              raise SystemExit("client_payload must be an object")

          forbidden = {
              "authorization", "token", "secret", "password", "cookie",
              "sth-device-uid", "device_uid", "deviceUid",
          }
          for key in list(payload):
              if key in forbidden:
                  payload[key] = "[redacted]"

          artifact = Path("probe-artifact")
          artifact.mkdir(parents=True, exist_ok=True)
          output = artifact / "stationhead-leaderboard-probe.json"
          output.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          summary_keys = (
              "received_at", "device_id", "records", "history_key",
              "source", "url", "method", "status", "content_type", "body_chars",
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Stationhead leaderboard probe received\n\n")
              for key in summary_keys:
                  value = payload.get(key, "")
                  text = str(value).replace("\n", " ").replace("\r", " ")[:2000]
                  summary.write(f"- **{key}**: `{text}`\n")
              summary.write("\nResponse body is intentionally omitted from logs and stored only in the Actions artifact.\n")
          PY

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: stationhead-leaderboard-probe
          path: probe-artifact/stationhead-leaderboard-probe.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
