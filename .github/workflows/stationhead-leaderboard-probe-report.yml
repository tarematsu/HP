name: Stationhead leaderboard probe report

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: stationhead-leaderboard-r2-import
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Pull probe status and latest payload directly from R2
        shell: bash
        env:
          STATUS_KEY: diagnostics/stationhead-leaderboard/status.json
          LATEST_KEY: diagnostics/stationhead-leaderboard/latest.json
        run: |
          set -euo pipefail
          mkdir -p probe-artifact
          status_artifact='probe-artifact/stationhead-leaderboard-probe-status.json'
          latest_artifact='probe-artifact/stationhead-leaderboard-latest.json'
          latest_raw="$(mktemp)"
          trap 'rm -f "$latest_raw"' EXIT

          api='https://api.cloudflare.com/client/v4'
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          encoded_status_key="$(jq -rn --arg value "$STATUS_KEY" '$value | split("/") | map(@uri) | join("/")')"
          encoded_latest_key="$(jq -rn --arg value "$LATEST_KEY" '$value | split("/") | map(@uri) | join("/")')"

          bucket_cursor=''
          found_status=0
          found_latest=0
          while true; do
            query=(--get --data-urlencode 'per_page=1000')
            [[ -z "$bucket_cursor" ]] || query+=(--data-urlencode "cursor=$bucket_cursor")
            buckets_response="$(curl --fail-with-body --silent --show-error \
              -H "$auth_header" "${query[@]}" \
              "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets")"
            jq -e \
              '.success == true and
               (.result.buckets | type == "array") and
               all(.result.buckets[]?; .name | type == "string") and
               ((.result_info.cursor? // null) | type == "null" or type == "string")' \
              <<< "$buckets_response" >/dev/null

            mapfile -t bucket_names < <(jq -r '.result.buckets[]?.name' <<< "$buckets_response")
            for bucket in "${bucket_names[@]}"; do
              [[ "$bucket" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || continue

              status_candidate="$(mktemp)"
              status_code="$(curl --silent --show-error \
                -H "$auth_header" \
                --output "$status_candidate" \
                --write-out '%{http_code}' \
                "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${bucket}/objects/${encoded_status_key}" || true)"
              if [[ "$status_code" == '200' ]]; then
                found_status=$((found_status + 1))
                [[ "$found_status" -eq 1 ]] || {
                  echo 'Leaderboard probe status exists in more than one R2 bucket.' >&2
                  exit 1
                }
                mv "$status_candidate" "$status_artifact"
              else
                rm -f "$status_candidate"
                [[ "$status_code" == '404' ]] || {
                  echo "R2 status lookup failed with HTTP ${status_code}." >&2
                  exit 1
                }
              fi

              latest_candidate="$(mktemp)"
              latest_code="$(curl --silent --show-error \
                -H "$auth_header" \
                --output "$latest_candidate" \
                --write-out '%{http_code}' \
                "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${bucket}/objects/${encoded_latest_key}" || true)"
              if [[ "$latest_code" == '200' ]]; then
                found_latest=$((found_latest + 1))
                [[ "$found_latest" -eq 1 ]] || {
                  echo 'Leaderboard latest payload exists in more than one R2 bucket.' >&2
                  exit 1
                }
                mv "$latest_candidate" "$latest_raw"
              else
                rm -f "$latest_candidate"
                [[ "$latest_code" == '404' ]] || {
                  echo "R2 latest lookup failed with HTTP ${latest_code}." >&2
                  exit 1
                }
              fi
            done

            next_cursor="$(jq -r '.result_info.cursor // empty' <<< "$buckets_response")"
            [[ -n "$next_cursor" ]] || break
            [[ "$next_cursor" != "$bucket_cursor" ]] || {
              echo 'Cloudflare R2 bucket listing returned a repeated cursor.' >&2
              exit 1
            }
            bucket_cursor="$next_cursor"
          done

          if [[ "$found_status" -eq 0 ]]; then
            cat > "$status_artifact" <<'JSON'
          {
            "version": 1,
            "updated_at": null,
            "stage": "no_status",
            "native": {
              "spool_records": null,
              "batch_records": null,
              "diagnostic_schema": null,
              "collector_stage": null,
              "last_success_stage": null,
              "collector_started": false,
              "collector_ticked": false,
              "last_transition_at": null,
              "last_failure_at": null,
              "last_error": null,
              "exchange_at": null
            },
            "cloud": {
              "reached": false,
              "probe_submitted": false,
              "accepted": 0,
              "stored": false,
              "dispatch_ok": false,
              "error": "none"
            },
            "history": {
              "last_probe_received_at": null,
              "last_stored_at": null,
              "last_reported_at": null
            }
          }
          JSON
          fi

          if [[ "$found_latest" -eq 0 ]]; then
            cat > "$latest_artifact" <<'JSON'
          {
            "version": 1,
            "available": false,
            "received_at": null,
            "digest": null,
            "record_count": 0,
            "records": []
          }
          JSON
          else
            RAW_LATEST="$latest_raw" LATEST_ARTIFACT="$latest_artifact" node - <<'NODE'
          const fs = require('node:fs');

          const source = JSON.parse(fs.readFileSync(process.env.RAW_LATEST, 'utf8'));
          if (!source || source.version !== 1 || !Array.isArray(source.records)) {
            throw new Error('invalid leaderboard latest payload');
          }

          const forbiddenKey = /authorization|token|secret|password|cookie|device.?uid|device_?id|session/i;
          const forbiddenQuery = /authorization|token|auth|code|key|secret|password|cookie|device.?uid|session|signature/i;
          const bearer = /Bearer\s+[A-Za-z0-9._~+\/-]+=*/gi;
          const credentialLike = /\bBearer\s+[A-Za-z0-9._~+\/-]+=*|authorization:|cookie:/i;

          function sanitizeValue(value, depth = 0) {
            if (depth > 12) return '[depth-limit]';
            if (Array.isArray(value)) return value.slice(0, 500).map((item) => sanitizeValue(item, depth + 1));
            if (!value || typeof value !== 'object') {
              return typeof value === 'string' ? value.replace(bearer, 'Bearer [redacted]') : value;
            }
            const output = {};
            for (const [key, item] of Object.entries(value).slice(0, 500)) {
              if (forbiddenKey.test(key)) continue;
              output[key] = sanitizeValue(item, depth + 1);
            }
            return output;
          }

          function sanitizeUrl(value, maximum) {
            const raw = String(value ?? '').trim().slice(0, maximum);
            if (!raw) return '';
            try {
              const url = new URL(raw);
              const host = url.hostname.toLowerCase();
              if (url.protocol !== 'https:' || (host !== 'stationhead.com' && !host.endsWith('.stationhead.com'))) return '';
              for (const key of [...url.searchParams.keys()]) {
                if (forbiddenQuery.test(key)) url.searchParams.set(key, '[redacted]');
              }
              return url.toString().slice(0, maximum);
            } catch {
              return '';
            }
          }

          function sanitizeBody(value) {
            const raw = String(value ?? '').slice(0, 65_536);
            if (!raw) return '';
            try {
              return JSON.stringify(sanitizeValue(JSON.parse(raw))).slice(0, 65_536);
            } catch {
              return raw.replace(bearer, 'Bearer [redacted]').slice(0, 65_536);
            }
          }

          const records = source.records.slice(0, 8).map((raw) => {
            const record = raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {};
            return {
              observed_at: Number.isSafeInteger(record.observed_at) ? record.observed_at : null,
              source: String(record.source ?? '').slice(0, 32),
              page: sanitizeUrl(record.page, 1_000),
              url: sanitizeUrl(record.url, 2_000),
              method: String(record.method ?? '').slice(0, 16),
              status: Number.isInteger(record.status) ? record.status : 0,
              content_type: String(record.content_type ?? '').slice(0, 160),
              body: sanitizeBody(record.body),
            };
          });

          const artifact = {
            version: 1,
            available: true,
            received_at: Number.isSafeInteger(source.received_at) ? source.received_at : null,
            digest: typeof source.digest === 'string' ? source.digest.slice(0, 128) : null,
            record_count: records.length,
            records,
          };

          function verify(value, trail = []) {
            if (Array.isArray(value)) {
              value.forEach((entry, index) => verify(entry, trail.concat(String(index))));
              return;
            }
            if (value && typeof value === 'object') {
              for (const [key, entry] of Object.entries(value)) {
                if (forbiddenKey.test(key)) throw new Error(`forbidden leaderboard field: ${trail.concat(key).join('.')}`);
                verify(entry, trail.concat(key));
              }
              return;
            }
            if (typeof value === 'string' && credentialLike.test(value)) {
              throw new Error(`credential-like leaderboard value at ${trail.join('.')}`);
            }
          }
          verify(artifact);

          fs.writeFileSync(process.env.LATEST_ARTIFACT, `${JSON.stringify(artifact, null, 2)}\n`);
          NODE
          fi

          STATUS_ARTIFACT="$status_artifact" LATEST_ARTIFACT="$latest_artifact" node - <<'NODE'
          const fs = require('node:fs');
          const status = JSON.parse(fs.readFileSync(process.env.STATUS_ARTIFACT, 'utf8'));
          const latest = JSON.parse(fs.readFileSync(process.env.LATEST_ARTIFACT, 'utf8'));
          if (!status || status.version !== 1) throw new Error('invalid leaderboard probe status payload');
          if (!latest || latest.version !== 1 || !Array.isArray(latest.records)) throw new Error('invalid leaderboard latest artifact');

          const forbiddenKeys = /^(device_?id|authorization|cookie|token|secret)$/i;
          const forbiddenValue = /\bBearer\s+[A-Za-z0-9._~+\/-]+=*|authorization:|cookie:/i;
          const visit = (value, trail = []) => {
            if (Array.isArray(value)) {
              value.forEach((entry, index) => visit(entry, trail.concat(String(index))));
              return;
            }
            if (value && typeof value === 'object') {
              for (const [key, entry] of Object.entries(value)) {
                if (forbiddenKeys.test(key)) throw new Error(`forbidden diagnostic field: ${trail.concat(key).join('.')}`);
                visit(entry, trail.concat(key));
              }
              return;
            }
            if (typeof value === 'string' && forbiddenValue.test(value)) {
              throw new Error(`credential-like diagnostic value at ${trail.join('.')}`);
            }
          };
          visit(status);
          visit(latest);

          const summary = process.env.GITHUB_STEP_SUMMARY;
          fs.appendFileSync(summary, [
            '## Stationhead leaderboard probe (direct R2 read)',
            '',
            `- **updated_at**: \`${String(status.updated_at ?? '')}\``,
            `- **stage**: \`${String(status.stage ?? '')}\``,
            `- **native collector_stage**: \`${String(status.native?.collector_stage ?? '')}\``,
            `- **native spool_records**: \`${String(status.native?.spool_records ?? '')}\``,
            `- **cloud stored**: \`${String(status.cloud?.stored ?? false)}\``,
            `- **cloud accepted**: \`${String(status.cloud?.accepted ?? 0)}\``,
            `- **latest available**: \`${String(latest.available ?? false)}\``,
            `- **latest record_count**: \`${String(latest.record_count ?? 0)}\``,
            '',
            'Status and sanitized latest records were read through the Cloudflare R2 REST API without using a Worker public URL.',
            '',
          ].join('\n'));
          NODE

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Import weekly leaderboard into Other.db
        working-directory: worker
        env:
          OTHER_DATABASE_NAME: stationhead-other
          STATIONHEAD_LEADERBOARD_ARTIFACT: ../probe-artifact/stationhead-leaderboard-latest.json
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          node scripts/import-stationhead-weekly-leaderboard-actions.mjs "$STATIONHEAD_LEADERBOARD_ARTIFACT" \
            2>&1 | tee stationhead-weekly-leaderboard-import.log

      - name: Upload leaderboard import failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stationhead-weekly-leaderboard-import-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker/stationhead-weekly-leaderboard-import.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload probe status artifact
        uses: actions/upload-artifact@v4
        with:
          name: stationhead-leaderboard-probe-status
          path: probe-artifact/stationhead-leaderboard-probe-status.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Upload latest leaderboard records artifact
        uses: actions/upload-artifact@v4
        with:
          name: stationhead-leaderboard-latest
          path: probe-artifact/stationhead-leaderboard-latest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
