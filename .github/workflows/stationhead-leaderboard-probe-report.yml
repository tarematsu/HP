name: Stationhead leaderboard probe report

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Resolve HomePanel probe status URL
        id: probe-url
        run: node .github/scripts/cloudflare-worker-public-url.mjs homepanel-cloud /api/health/stationhead-leaderboard-probe

      - name: Pull R2-backed probe status
        shell: bash
        env:
          PROBE_URL: ${{ steps.probe-url.outputs.health-url }}
        run: |
          set -euo pipefail
          mkdir -p probe-artifact
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -H 'Accept: application/json' \
            "$PROBE_URL" \
            -o probe-artifact/stationhead-leaderboard-probe-status.json
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'probe-artifact/stationhead-leaderboard-probe-status.json';
          const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!payload || payload.version !== 1) throw new Error('invalid leaderboard probe status payload');
          const summary = process.env.GITHUB_STEP_SUMMARY;
          fs.appendFileSync(summary, [
            '## Stationhead leaderboard probe (R2 pull)',
            '',
            `- **updated_at**: \`${String(payload.updated_at ?? '')}\``,
            `- **stage**: \`${String(payload.stage ?? '')}\``,
            `- **stored**: \`${String(payload.cloud?.stored ?? false)}\``,
            `- **accepted**: \`${String(payload.cloud?.accepted ?? 0)}\``,
            '',
            'GitHub Actions pulled this snapshot on demand from the R2-backed HomePanel diagnostic endpoint; the Worker does not push repository_dispatch events.',
            '',
          ].join('\n'));
          NODE

      - name: Upload probe status artifact
        uses: actions/upload-artifact@v4
        with:
          name: stationhead-leaderboard-probe-status
          path: probe-artifact/stationhead-leaderboard-probe-status.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
