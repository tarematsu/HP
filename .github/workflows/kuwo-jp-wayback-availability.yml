name: Kuwo Japanese chart Wayback availability variants
on:
  push:
    branches: [research/kuwo-jp-chart-probe]
    paths: [.github/workflows/kuwo-jp-wayback-availability.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query Wayback availability for URL variants
        shell: bash
        run: |
          python3 <<'PY'
          import json,urllib.request,urllib.parse,concurrent.futures,itertools
          bases=['https://kuwo.cn/newh5/bang/index','https://m.kuwo.cn/newh5/bang/index','http://kuwo.cn/newh5/bang/index','http://m.kuwo.cn/newh5/bang/index']
          qs=['','?qq-pf-to=pcqq.c2c','?from=singlemessage&isappinstalled=0','?lan=cn','?from=groupmessage','?from=timeline','?from=singlemessage','?isappinstalled=0']
          targets=[b+q for b,q in itertools.product(bases,qs)]
          targets += ['https://m.kuwo.cn/newh5app/ranklist_detail/183','http://m.kuwo.cn/newh5app/ranklist_detail/183','https://www.kuwo.cn/rankList/183','http://www.kuwo.cn/rankList/183']
          dates=['20180101','20200101','20220101','20240101','20250101','20260101','20260901']
          def one(x):
            target,date=x
            u='https://archive.org/wayback/available?'+urllib.parse.urlencode({'url':target,'timestamp':date})
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=6) as r:p=json.loads(r.read().decode())
              c=(p.get('archived_snapshots') or {}).get('closest') or {}
              if c.get('available'):return target,date,c
            except:pass
            return None
          found=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
            for z in ex.map(one,itertools.product(targets,dates)):
              if z:found.append(z)
          # dedupe same snapshot
          seen=set()
          for target,date,c in found:
            key=(c.get('timestamp'),c.get('url'))
            if key in seen:continue
            seen.add(key)
            print('FOUND',date,target,'=>',json.dumps(c,ensure_ascii=False))
          print('FOUND_UNIQUE',len(seen),'QUERIES',len(targets)*len(dates))
          PY
