name: Nogizaka sakuramankai smoke

on:
  push:
    branches:
      - test/nogizaka-sakuramankai-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
    steps:
      - name: Inspect OTHER_DB schema and temporary rows
        run: |
          echo '=== host/materializer tables ==='
          npx --yes wrangler@4.104.0 d1 execute stationhead-other --remote --command \
            "SELECT name FROM sqlite_master WHERE type='table' AND (name LIKE 'sh_host_%' OR name LIKE 'sh_solo_activity_%' OR name LIKE 'sh_ingest_%' OR name='sh_comment_velocity_samples') ORDER BY name;"
          echo '=== test session ==='
          npx --yes wrangler@4.104.0 d1 execute stationhead-other --remote --command \
            "SELECT id,source_scope,handle,station_id,broadcast_id,started_at,status,last_observed_at FROM sh_host_broadcast_sessions WHERE source_scope='nogizaka46smej_solo' AND lower(handle)='sakuramankai';"
          echo '=== isolated test rows ==='
          npx --yes wrangler@4.104.0 d1 execute stationhead-other --remote --command \
            "SELECT COUNT(*) AS main_rows FROM sh_nogizaka46smej_main WHERE observed_at>=1790703900000 AND observed_at<1790708400000; SELECT COUNT(*) AS chat_rows FROM sh_nogizaka46smej_chat WHERE observed_at>=1790703900000 AND observed_at<1790708400000; SELECT COUNT(*) AS announcement_rows FROM sh_nogizaka_official_news_announcements WHERE news_id='manual-test-sakuramankai-20260930';"
