name: Refresh weekly leaderboard read model after import

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Stationhead leaderboard probe report']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: weekly-ranking-read-model
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Refresh weekly leaderboard read model when source changed
        working-directory: worker
        env:
          OTHER_DATABASE_NAME: stationhead-other
        run: node scripts/materialize-weekly-ranking-read-model-if-stale.mjs
