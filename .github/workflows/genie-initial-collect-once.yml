name: Initial Genie full catalog collection
on:
  push:
    branches:
      - ops/genie-collect-trigger-20261003
permissions:
  contents: read
concurrency:
  group: genie-initial-full-catalog-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Collect Genie full catalog into R2 and publish
        working-directory: worker
        run: node scripts/collect-regional-r2-actions.mjs --services=genie
