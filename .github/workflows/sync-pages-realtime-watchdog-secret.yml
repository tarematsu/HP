name: Sync Pages realtime watchdog secret

on:
  push:
    branches: [main]
    paths:
      - 'worker/src/pages-realtime-read-model-watchdog.js'
      - 'worker/src/buddies-collector-entry.js'
      - '.github/workflows/sync-pages-realtime-watchdog-secret.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-pages-realtime-watchdog-secret
  cancel-in-progress: true

jobs:
  sync:
    name: Validate dispatch and sync Worker secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets['CLOUDFLARE_API_TOKEN'] || secrets['CF_API_TOKEN'] || secrets['CLOUDFLARE_BUILDS_API_TOKEN'] }}
      PAGES_READ_MODEL_DISPATCH_TOKEN: ${{ secrets.RADAR_DISPATCH_TOKEN || secrets.GITHUB_RADAR_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: worker
      - name: Validate Pages workflow dispatch credential
        shell: bash
        run: |
          set -euo pipefail
          : "${PAGES_READ_MODEL_DISPATCH_TOKEN:?Pages watchdog dispatch token is not configured}"
          response_file="$(mktemp)"
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${PAGES_READ_MODEL_DISPATCH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data '{"ref":"main"}' \
            https://api.github.com/repos/tarematsu/HP/actions/workflows/refresh-pages-realtime.yml/dispatches)"
          if [[ "$status" != '204' ]]; then
            cat "$response_file" >&2 || true
            echo "Pages workflow dispatch preflight failed with HTTP $status" >&2
            exit 1
          fi
      - name: Sync Pages watchdog dispatch token to collector Worker
        shell: bash
        working-directory: worker
        run: |
          set -euo pipefail
          printf '%s' "$PAGES_READ_MODEL_DISPATCH_TOKEN" \
            | npx wrangler secret put PAGES_READ_MODEL_DISPATCH_TOKEN \
                --config wrangler.buddies-collector.jsonc
