name: Run Amazon Music once

on:
  push:
    branches:
      - ops/run-amazon-music-once-20260930
    paths:
      - '.github/workflows/run-amazon-music-once.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets['CLOUDFLARE_API_TOKEN'] || secrets['CF_API_TOKEN'] || secrets['CLOUDFLARE_BUILDS_API_TOKEN'] }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Prepare one-time remote-binding config
        working-directory: worker
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync('wrangler.amazon-music.jsonc', 'utf8'));
          source.name = 'sh-amazon-music-collector-once';
          source.d1_databases = (source.d1_databases || []).map((binding) => ({ ...binding, remote: true }));
          source.r2_buckets = (source.r2_buckets || []).map((binding) => ({ ...binding, remote: true }));
          fs.writeFileSync('wrangler.amazon-once.jsonc', JSON.stringify(source, null, 2));
          NODE

      - name: Trigger Amazon Music scheduled collection now
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/amazon-music-once.log
          npx wrangler dev \
            --config wrangler.amazon-once.jsonc \
            --test-scheduled \
            --ip 127.0.0.1 \
            --port 8787 \
            --log-level info >"$LOG" 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" >/dev/null 2>&1 || true' EXIT

          ready=false
          for _ in $(seq 1 90); do
            if (echo > /dev/tcp/127.0.0.1/8787) >/dev/null 2>&1; then
              ready=true
              break
            fi
            if ! kill -0 "$WRANGLER_PID" >/dev/null 2>&1; then
              cat "$LOG"
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            cat "$LOG"
            echo 'Wrangler dev server did not become ready' >&2
            exit 1
          fi

          curl --fail --show-error --silent --max-time 900 \
            'http://127.0.0.1:8787/cdn-cgi/local/scheduled?cron=30+1+%2A+%2A+%2A&format=json' \
            | tee /tmp/amazon-music-once-response.json

          for _ in $(seq 1 180); do
            if grep -q 'amazon-music-collection-complete' "$LOG"; then
              cat "$LOG"
              exit 0
            fi
            if grep -q 'amazon-music-collection-failed' "$LOG"; then
              cat "$LOG"
              exit 1
            fi
            if ! kill -0 "$WRANGLER_PID" >/dev/null 2>&1; then
              cat "$LOG"
              exit 1
            fi
            sleep 5
          done

          cat "$LOG"
          echo 'Amazon Music collection did not finish within the workflow timeout window' >&2
          exit 1
