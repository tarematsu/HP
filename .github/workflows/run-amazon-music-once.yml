name: Run Amazon Music once

on:
  push:
    branches:
      - ops/run-amazon-music-once-20260930
    paths:
      - '.github/workflows/run-amazon-music-once.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets['CLOUDFLARE_API_TOKEN'] || secrets['CF_API_TOKEN'] || secrets['CLOUDFLARE_BUILDS_API_TOKEN'] }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Prepare one-time remote-binding config
        working-directory: worker
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync('wrangler.amazon-music.jsonc', 'utf8'));
          const wrapper = [
            "import { collectAmazonMusicSnapshot } from './amazon-music-collector.js';",
            '',
            'export default {',
            '  async fetch(request, env) {',
            '    const url = new URL(request.url);',
            "    if (url.pathname !== '/run-once') return new Response('Not Found', { status: 404 });",
            '    try {',
            '      const result = await collectAmazonMusicSnapshot(env, Date.now());',
            "      console.log(JSON.stringify({ event: 'amazon-music-collection-complete', ...result }));",
            '      return Response.json({ ok: true, result });',
            '    } catch (error) {',
            "      console.error('amazon-music-collection-failed', { error: String(error?.stack || error?.message || error).slice(0, 4000) });",
            "      return Response.json({ ok: false, error: String(error?.message || error) }, { status: 500 });",
            '    }',
            '  },',
            '};',
            '',
          ].join('\n');
          fs.writeFileSync('src/amazon-music-once-wrapper.js', wrapper);
          source.name = 'sh-amazon-music-collector-once';
          source.main = 'src/amazon-music-once-wrapper.js';
          source.d1_databases = (source.d1_databases || []).map((binding) => ({ ...binding, remote: true }));
          source.r2_buckets = (source.r2_buckets || []).map((binding) => ({ ...binding, remote: true }));
          delete source.triggers;
          fs.writeFileSync('wrangler.amazon-once.jsonc', JSON.stringify(source, null, 2));
          NODE

      - name: Run Amazon Music collection against production bindings
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          LOG=/tmp/amazon-music-once.log
          npx wrangler dev \
            --config wrangler.amazon-once.jsonc \
            --ip 127.0.0.1 \
            --port 8787 \
            --log-level info >"$LOG" 2>&1 &
          WRANGLER_PID=$!
          trap 'kill "$WRANGLER_PID" >/dev/null 2>&1 || true' EXIT

          ready=false
          for _ in $(seq 1 90); do
            if grep -q 'Ready on' "$LOG"; then
              ready=true
              break
            fi
            if ! kill -0 "$WRANGLER_PID" >/dev/null 2>&1; then
              cat "$LOG"
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            cat "$LOG"
            echo 'Wrangler dev server did not become ready' >&2
            exit 1
          fi

          set +e
          HTTP_CODE=$(curl --show-error --silent --max-time 900 \
            -o /tmp/amazon-music-once-response.json \
            -w '%{http_code}' \
            'http://127.0.0.1:8787/run-once')
          CURL_STATUS=$?
          set -e

          cat /tmp/amazon-music-once-response.json || true
          echo
          cat "$LOG"

          if [[ "$CURL_STATUS" -ne 0 ]]; then
            exit "$CURL_STATUS"
          fi
          if [[ "$HTTP_CODE" != 200 ]]; then
            echo "Amazon Music one-time run returned HTTP $HTTP_CODE" >&2
            exit 1
          fi
          grep -q 'amazon-music-collection-complete' "$LOG"
