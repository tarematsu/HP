name: Find Kuwo volume 209 in higher ids
on:
  push:
    branches: [research/kuwo-jp-chart-probe]
    paths: [.github/workflows/kuwo-find-vol209-high.yml]
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan higher bangids for volume 209
        shell: bash
        run: |
          python3 <<'PY'
          import concurrent.futures,json,urllib.parse,urllib.request
          BASE='https://kbangserver.kuwo.cn/ksong.s'
          common={'from':'pc','fmt':'json','pn':'0','rn':'1','type':'bang','data':'content','id':'183','show_copyright_off':'0','pcmp4':'1','isbang':'1','userid':'0'}
          H={'User-Agent':'Mozilla/5.0','Referer':'https://m.kuwo.cn/'}
          def probe(bid):
            u=BASE+'?'+urllib.parse.urlencode({**common,'bangid':str(bid)})
            try:
              q=urllib.request.Request(u,headers=H)
              with urllib.request.urlopen(q,timeout=4) as r:j=json.loads(r.read().decode('utf-8','replace'))
              return bid,j.get('currentVolume')
            except:return bid,None
          target='2026|209'; found=[]
          # Older editions can be re-issued with later global IDs. Search above vol210 up to the current range midpoint first.
          ids=range(267862,270501)
          with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
            for bid,cv in ex.map(probe,ids,chunksize=1):
              if cv==target:
                found.append(bid); print('FOUND',bid,cv); break
          print('RESULT',json.dumps(found))
          if found:
            bid=found[0]
            u=BASE+'?'+urllib.parse.urlencode({**common,'rn':'100','bangid':str(bid)})
            q=urllib.request.Request(u,headers=H)
            with urllib.request.urlopen(q,timeout=12) as r:j=json.loads(r.read().decode('utf-8','replace'))
            rows=j.get('musiclist') or j.get('musicList') or []
            print('ROWS',len(rows),'TOP10',json.dumps([{'rank':i+1,'name':x.get('name'),'artist':x.get('artist'),'rid':x.get('rid') or x.get('id')} for i,x in enumerate(rows[:10])],ensure_ascii=False))
            aliases=['櫻坂46','樱坂46','Sakurazaka46','乃木坂46','Nogizaka46','日向坂46','Hinatazaka46','欅坂46','Keyakizaka46']
            for i,x in enumerate(rows,1):
              hay=(str(x.get('artist',''))+' '+str(x.get('name',''))).lower().replace(' ','')
              if any(a.lower().replace(' ','') in hay for a in aliases): print('SAKAMICHI',i,json.dumps(x,ensure_ascii=False))
          PY
