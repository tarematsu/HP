name: Stationhead leaderboard inspect once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/stationhead-leaderboard-inspect-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Read latest Stationhead leaderboard payload from R2
        shell: bash
        env:
          LATEST_KEY: diagnostics/stationhead-leaderboard/latest.json
        run: |
          set -euo pipefail
          mkdir -p inspect-artifact
          raw="$(mktemp)"
          trap 'rm -f "$raw"' EXIT
          api='https://api.cloudflare.com/client/v4'
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          encoded_key="$(jq -rn --arg value "$LATEST_KEY" '$value | split("/") | map(@uri) | join("/")')"

          cursor=''
          found=0
          while true; do
            query=(--get --data-urlencode 'per_page=1000')
            [[ -z "$cursor" ]] || query+=(--data-urlencode "cursor=$cursor")
            response="$(curl --fail-with-body --silent --show-error -H "$auth_header" "${query[@]}" "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets")"
            jq -e '.success == true and (.result.buckets | type == "array")' <<< "$response" >/dev/null
            mapfile -t buckets < <(jq -r '.result.buckets[]?.name' <<< "$response")
            for bucket in "${buckets[@]}"; do
              [[ "$bucket" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || continue
              candidate="$(mktemp)"
              code="$(curl --silent --show-error -H "$auth_header" --output "$candidate" --write-out '%{http_code}' "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${bucket}/objects/${encoded_key}" || true)"
              if [[ "$code" == '200' ]]; then
                found=$((found + 1))
                [[ "$found" -eq 1 ]] || { echo 'latest payload exists in multiple buckets' >&2; exit 1; }
                mv "$candidate" "$raw"
              else
                rm -f "$candidate"
                [[ "$code" == '404' ]] || { echo "R2 lookup failed: HTTP $code" >&2; exit 1; }
              fi
            done
            next="$(jq -r '.result_info.cursor // empty' <<< "$response")"
            [[ -n "$next" ]] || break
            [[ "$next" != "$cursor" ]] || { echo 'repeated R2 bucket cursor' >&2; exit 1; }
            cursor="$next"
          done
          [[ "$found" -eq 1 ]] || { echo 'latest payload not found' >&2; exit 1; }

          RAW="$raw" OUT='inspect-artifact/stationhead-leaderboard-latest.json' node - <<'NODE'
          const fs = require('node:fs');
          const src = JSON.parse(fs.readFileSync(process.env.RAW, 'utf8'));
          if (!src || src.version !== 1 || !Array.isArray(src.records)) throw new Error('invalid latest payload');
          const secretKey = /authorization|token|secret|password|cookie|device.?uid|device_?id|session/i;
          const bearer = /Bearer\s+[A-Za-z0-9._~+\/-]+=*/gi;
          function scrub(value, depth = 0) {
            if (depth > 12) return '[depth-limit]';
            if (Array.isArray(value)) return value.slice(0, 500).map(v => scrub(v, depth + 1));
            if (!value || typeof value !== 'object') return typeof value === 'string' ? value.replace(bearer, 'Bearer [redacted]') : value;
            const out = {};
            for (const [k, v] of Object.entries(value).slice(0, 500)) {
              if (secretKey.test(k)) continue;
              out[k] = scrub(v, depth + 1);
            }
            return out;
          }
          const records = src.records.slice(0, 8).map((r) => {
            const out = scrub(r);
            if (typeof out.body === 'string') {
              try { out.body = JSON.stringify(scrub(JSON.parse(out.body))); }
              catch { out.body = out.body.replace(bearer, 'Bearer [redacted]'); }
            }
            return out;
          });
          const artifact = {
            version: 1,
            received_at: Number.isSafeInteger(src.received_at) ? src.received_at : null,
            digest: typeof src.digest === 'string' ? src.digest.slice(0, 128) : null,
            record_count: records.length,
            records,
          };
          fs.writeFileSync(process.env.OUT, JSON.stringify(artifact, null, 2) + '\n');
          console.log(`record_count=${records.length}`);
          NODE

      - name: Upload sanitized latest artifact
        uses: actions/upload-artifact@v4
        with:
          name: stationhead-leaderboard-inspect-once
          path: inspect-artifact/stationhead-leaderboard-latest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
