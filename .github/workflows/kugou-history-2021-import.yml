name: Kugou history 2021 import

on:
  push:
    branches:
      - feat/kugou-japan-history-2021-final
    paths:
      - .github/workflows/kugou-history-2021-import.yml

permissions:
  contents: write
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kugou-japan-history-2021-final
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download verified backfill
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/kugou
          gh run download 36988590743 -n kugou-web-history-backfill -D /tmp/kugou
      - name: Generate seed and wire latest UI
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/kugou/kugou-web-history-backfill.json','utf8'));
          const rows = data.matches.filter(x => x.date >= '2021-01-01' && x.date <= '2024-10-30');
          for (const year of ['2021','2022','2023','2024']) {
            const items = rows.filter(x => x.date.startsWith(year)).map(x => ({ published_at:x.date, canonical_artist:x.group, rank:Number(x.rank), title:x.title }));
            fs.writeFileSync(`worker/src/kugou-japan-chart-legacy-${year}.js`, `export const KUGOU_JAPAN_CHART_LEGACY_${year} = Object.freeze(${JSON.stringify(items)});\n`);
          }
          const covered = data.issues.filter(x => x.complete && x.date >= '2021-01-01' && x.date <= '2024-10-30').map(x => x.date);
          fs.writeFileSync('worker/src/kugou-japan-chart-legacy-covered-dates.js', `export const KUGOU_JAPAN_CHART_LEGACY_COVERED_DATES = Object.freeze(${JSON.stringify(covered)});\n`);

          fs.writeFileSync('worker/src/kugou-japan-chart-history.js', `import { KUGOU_JAPAN_CHART_LEGACY_2021 } from './kugou-japan-chart-legacy-2021.js';\nimport { KUGOU_JAPAN_CHART_LEGACY_2022 } from './kugou-japan-chart-legacy-2022.js';\nimport { KUGOU_JAPAN_CHART_LEGACY_2023 } from './kugou-japan-chart-legacy-2023.js';\nimport { KUGOU_JAPAN_CHART_LEGACY_2024 } from './kugou-japan-chart-legacy-2024.js';\nimport { KUGOU_JAPAN_CHART_LEGACY_COVERED_DATES } from './kugou-japan-chart-legacy-covered-dates.js';\nimport { KUGOU_JAPAN_CHART_2024 } from './kugou-japan-chart-2024.js';\nimport { KUGOU_JAPAN_CHART_2025 } from './kugou-japan-chart-2025.js';\nimport { KUGOU_JAPAN_CHART_2026 } from './kugou-japan-chart-2026.js';\n\nexport const KUGOU_JAPAN_CHART_HISTORY = Object.freeze([\n  ...KUGOU_JAPAN_CHART_LEGACY_2021,\n  ...KUGOU_JAPAN_CHART_LEGACY_2022,\n  ...KUGOU_JAPAN_CHART_LEGACY_2023,\n  ...KUGOU_JAPAN_CHART_LEGACY_2024,\n  ...KUGOU_JAPAN_CHART_2024,\n  ...KUGOU_JAPAN_CHART_2025,\n  ...KUGOU_JAPAN_CHART_2026,\n]);\n\nexport const KUGOU_JAPAN_CHART_COVERAGE = Object.freeze({\n  chart_id: 'japan_31312',\n  oldest_available: '2021-01-01',\n  legacy_latest_available: '2024-10-30',\n  current_api_oldest_available: '2024-10-31 10:10:01',\n  latest_available: '2026-09-30 10:10:01',\n  latest_checked: '2026-10-01 10:10:00',\n  latest_rank_in: '2026-09-30 10:10:01',\n  legacy_covered_dates: KUGOU_JAPAN_CHART_LEGACY_COVERED_DATES,\n  entries: KUGOU_JAPAN_CHART_HISTORY.length,\n  note: '2021-01-01〜2024-10-30はKugou旧Web日本榜の保存ページからTop 100を復元。2024-10-31以降は現行ランキングAPIを使用。',\n});\n`);

          const uiPath = 'site/public/regional-music.js';
          let ui = fs.readFileSync(uiPath,'utf8');
          const oldLine = `  const coveredDates = providerWeekdays(coverage.oldest_available, coverage.latest_checked || coverage.latest_available);`;
          const newLines = `  const legacyCoveredDates = Array.isArray(coverage.legacy_covered_dates)\n    ? coverage.legacy_covered_dates.map(providerDate).filter(Boolean)\n    : [];\n  const currentCoveredDates = providerWeekdays(\n    coverage.current_api_oldest_available || coverage.oldest_available,\n    coverage.latest_checked || coverage.latest_available,\n  );\n  const coveredDates = [...new Set([...legacyCoveredDates, ...currentCoveredDates])].sort();`;
          if (!ui.includes(oldLine)) throw new Error('latest Kugou coveredDates anchor missing');
          ui = ui.replace(oldLine,newLines);
          fs.writeFileSync(uiPath,ui);

          const testPath='worker/tests/regional-music-read-model.test.js';
          let test=fs.readFileSync(testPath,'utf8');
          test=test.replace(`  assert.equal(history.length, 115);`,`  assert.equal(history.length, 1012);`)
            .replace(`  assert.equal(payload.kugou_japan_chart.coverage.oldest_available, '2024-10-31 10:10:01');`,`  assert.equal(payload.kugou_japan_chart.coverage.oldest_available, '2021-01-01');\n  assert.equal(payload.kugou_japan_chart.coverage.legacy_covered_dates.length, 841);\n  assert.equal(payload.kugou_japan_chart.coverage.current_api_oldest_available, '2024-10-31 10:10:01');`)
            .replace(`  assert.equal(counts.get('sakurazaka46'), 53);`,`  assert.equal(counts.get('sakurazaka46'), 113);`)
            .replace(`  assert.equal(counts.get('nogizaka46'), 56);`,`  assert.equal(counts.get('nogizaka46'), 784);`)
            .replace(`  assert.equal(counts.get('hinatazaka46'), 6);`,`  assert.equal(counts.get('hinatazaka46'), 115);`)
            .replace(`  assert.equal(best('sakurazaka46'), 19);`,`  assert.equal(best('sakurazaka46'), 15);`)
            .replace(`  assert.equal(best('nogizaka46'), 2);`,`  assert.equal(best('nogizaka46'), 1);`)
            .replace(`  assert.equal(best('hinatazaka46'), 8);`,`  assert.equal(best('hinatazaka46'), 4);`)
            .replaceAll(`kugou_japan_chart.history.length, 115`,`kugou_japan_chart.history.length, 1012`)
            .replaceAll(`kugou_japan_chart_entries: 115`,`kugou_japan_chart_entries: 1012`);
          fs.writeFileSync(testPath,test);

          const tabsPath='site/public/dashboard-tabs.js';
          let tabs=fs.readFileSync(tabsPath,'utf8');
          if (!tabs.includes('/regional-music.js?v=20261002.5')) throw new Error('regional music cache anchor missing');
          tabs=tabs.replace('/regional-music.js?v=20261002.5','/regional-music.js?v=20261002.6');
          fs.writeFileSync(tabsPath,tabs);
          console.log({matches:rows.length,covered:covered.length,earliest:covered[0],latest:covered.at(-1)});
          NODE
      - name: Commit generated history
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker/src/kugou-japan-chart-legacy-*.js worker/src/kugou-japan-chart-history.js worker/tests/regional-music-read-model.test.js site/public/regional-music.js site/public/dashboard-tabs.js
          git commit -m "Extend Kugou Japan chart history to 2021"
          git push origin HEAD:feat/kugou-japan-history-2021-final
