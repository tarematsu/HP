name: Apply Stationhead A/B audit fixes

on:
  push:
    branches:
      - agent/fix-stationhead-window-b
    paths:
      - .github/workflows/apply-stationhead-ab-audit.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-stationhead-window-b
          fetch-depth: 0
      - name: Apply audited fixes
        shell: bash
        run: |
          echo '-  ' | base64 -d > /tmp/apply_stationhead_ab.py
          python /tmp/apply_stationhead_ab.py
      - name: Validate focused regression test
        run: node --test hp/video/test/stationhead-window-b-interactive-regression.test.js
      - name: Commit audited fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-stationhead-ab-audit.yml
          git add hp/native/src/app_stationhead_handles.h hp/native/src/sh.cpp hp/native/src/sh_shared.h hp/native/src/sh_webview.cpp hp/video/test/stationhead-window-b-interactive-regression.test.js
          git diff --cached --check
          git commit -m 'Fix Stationhead A/B interactive state and retry races'
          git push origin HEAD:agent/fix-stationhead-window-b
