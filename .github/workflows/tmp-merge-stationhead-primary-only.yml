name: Temporary merge Stationhead primary-only

on:
  push:
    branches:
      - refactor/stationhead-primary-only

permissions:
  contents: write

jobs:
  merge-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stationhead-primary-only
          fetch-depth: 0
      - name: Merge current main
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            git checkout --theirs hp/native/src/sh_layout.cpp
            git checkout --theirs hp/native/src/sh_track_boundary_message_policy.h
            git checkout --ours hp/video/test/stationhead-periodic-refresh-regression.test.js || true
            git checkout --ours hp/video/test/stationhead-playing-settlement-refresh-regression.test.js || true
            git checkout --theirs hp/video/test/stationhead-background-fullsize-until-playback.test.js || true
            git checkout --theirs hp/video/test/stationhead-no-cache-navigation.test.js || true
          fi
          python scripts/tmp-merge-stationhead-primary-only.py
          git add -A
          unresolved=$(git diff --name-only --diff-filter=U)
          if [ -n "$unresolved" ]; then
            echo "Unresolved merge files:"
            echo "$unresolved"
            exit 1
          fi
          if git grep -nE 'StationheadRole::Secondary|IsSecondary\(|secondaryEnabled|secondaryUrl|HomePanelSecondaryStationhead|HomePanelSecondarySpotifyAuthHost|WM_HP_SECONDARY_RELOAD_READY|stationhead-secondary|PollAuthProbe|authProbeInFlight_|authProbeStartedAt_|lastAuthProbeAt_|secondaryAutoClick|secondaryReloadMonotonicAt|StationheadAuthProbeScript' -- hp/native/src hp/native/scripts/ci-native-stationhead-startup-smoke.ps1; then
            echo "Secondary Stationhead implementation references remain"
            exit 1
          fi
          rm -f scripts/tmp-merge-stationhead-primary-only.py
          rm -f .github/workflows/tmp-merge-stationhead-primary-only.yml
          git add -A
          git diff --cached --check
          git commit -m "Merge main into Stationhead primary-only refactor"
          git push origin HEAD:refactor/stationhead-primary-only
