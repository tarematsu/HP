name: One-time verify native update delivery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-verify-native-update-delivery.yml"

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hp/package-lock.json

      - working-directory: hp
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Read update delivery status
        working-directory: hp/cloud
        shell: bash
        run: |
          set -euo pipefail
          sql="SELECT
              'update_state' AS section,
              json_extract(payload, '$.version') AS release_version,
              datetime(observed_at / 1000, 'unixepoch', '+9 hours') AS observed_jst
            FROM current_state WHERE source='update';

            SELECT
              'heartbeat' AS section,
              substr(device_id, 1, 4) || '…' AS device,
              app_version,
              datetime(last_seen_at / 1000, 'unixepoch', '+9 hours') AS last_seen_jst,
              outbox_count
            FROM device_heartbeats
            ORDER BY last_seen_at DESC LIMIT 5;

            SELECT
              'command' AS section,
              id,
              substr(device_id, 1, 4) || '…' AS device,
              datetime(created_at / 1000, 'unixepoch', '+9 hours') AS created_jst,
              datetime(delivered_at / 1000, 'unixepoch', '+9 hours') AS delivered_jst,
              datetime(completed_at / 1000, 'unixepoch', '+9 hours') AS completed_jst,
              success,
              result,
              payload
            FROM device_commands
            WHERE command='check_update' AND id>=185
            ORDER BY id DESC;"
          npm exec -- wrangler d1 execute homepanel-data \
            --remote --config wrangler.jsonc \
            --command "$sql" --json > "$RUNNER_TEMP/native-update-delivery.json"

      - name: Record status
        uses: actions/github-script@v7
        env:
          STATUS_PATH: ${{ runner.temp }}/native-update-delivery.json
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync(process.env.STATUS_PATH, 'utf8').slice(-18000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 480,
              body: `### 端末配信の再確認\n\n\`\`\`json\n${output}\n\`\`\``,
            });
