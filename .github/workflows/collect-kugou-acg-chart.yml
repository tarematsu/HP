name: Collect Kugou ACG chart

on:
  schedule:
    - cron: '40 2 * * 4' # Thursday 11:40 JST, after regular Kugou collection
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kugou-acg-chart-collection
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Collect Kugou ACG新歌榜
        working-directory: worker
        run: node scripts/collect-kugou-acg-chart-actions.mjs
