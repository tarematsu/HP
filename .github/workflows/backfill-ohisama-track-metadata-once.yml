name: Backfill Ohisama track metadata

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/backfill-ohisama-track-metadata-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ohisama-track-metadata-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Backfill and audit Ohisama track metadata
        working-directory: worker
        run: node scripts/backfill-ohisama-track-metadata.mjs --apply
