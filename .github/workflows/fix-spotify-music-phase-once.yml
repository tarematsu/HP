name: Apply Spotify music phase fix once

on:
  push:
    branches:
      - fix/spotify-mode-deadline-fallback

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spotify-mode-deadline-fallback

      - name: Patch Spotify music phase startup
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('hp/native/src/spotify_webviews.cpp')
          source = source_path.read_text(encoding='utf-8')

          old = """  let stalledChecks = 0;\n  let lastReported = null;\n\n  const report = playing => {\n"""
          new = """  let stalledChecks = 0;\n  let lastReported = null;\n  let targetStarted = false;\n\n  const report = playing => {\n"""
          if old not in source:
              raise SystemExit('music state anchor not found')
          source = source.replace(old, new, 1)

          old = """  const playbackButton = () =>\n      document.querySelector('button[data-testid=\"control-button-playpause\"]') ||\n      document.querySelector('button[data-testid=\"play-button\"]');\n  const mediaElement = () => {\n"""
          new = """  const playbackButton = () =>\n      document.querySelector('button[data-testid=\"control-button-playpause\"]') ||\n      document.querySelector('button[data-testid=\"play-button\"]');\n  const targetPlayButton = () =>\n      Array.from(document.querySelectorAll(\n          'button[data-testid=\"play-button\"]')).find(visible) || null;\n  const mediaElement = () => {\n"""
          if old not in source:
              raise SystemExit('music play button anchor not found')
          source = source.replace(old, new, 1)

          old = """    ensureRepeatOne();\n    const mediaPlaying = samplePlayback();\n"""
          new = """    if (!targetStarted) {\n      const target = targetPlayButton();\n      if (target) {\n        target.click();\n        targetStarted = true;\n        lastMedia = null;\n        lastTime = NaN;\n        stalledChecks = 0;\n        report(false);\n        return;\n      }\n    }\n    ensureRepeatOne();\n    const mediaPlaying = samplePlayback();\n"""
          if old not in source:
              raise SystemExit('music ensure anchor not found')
          source = source.replace(old, new, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('hp/video/test/native-spotify-webviews-contract.test.js')
          tests = test_path.read_text(encoding='utf-8')
          old = """  assert.match(spotify, /aria-checked.*mixed/s);\n  assert.match(spotify, /window\\.__homePanelSpotifyEnsure = ensure/);\n});\n"""
          new = """  assert.match(spotify, /aria-checked.*mixed/s);\n  assert.match(spotify, /let targetStarted = false/);\n  assert.match(spotify, /const targetPlayButton = \\(\\) =>/);\n  assert.match(\n    spotify,\n    /if \\(!targetStarted\\)[\\s\\S]*targetPlayButton\\(\\)[\\s\\S]*target\\.click\\(\\)[\\s\\S]*targetStarted = true[\\s\\S]*report\\(false\\)/,\n  );\n  assert.match(spotify, /window\\.__homePanelSpotifyEnsure = ensure/);\n});\n"""
          if old not in tests:
              raise SystemExit('music contract anchor not found')
          tests = tests.replace(old, new, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Run Spotify contract test
        run: node --test hp/video/test/native-spotify-webviews-contract.test.js

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hp/native/src/spotify_webviews.cpp hp/video/test/native-spotify-webviews-contract.test.js
          git commit -m 'Fix Spotify return from podcast to music'
          git push origin HEAD:fix/spotify-mode-deadline-fallback
