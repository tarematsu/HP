name: Recover maintenance workflows

on:
  workflow_run:
    workflows:
      - "Publish GitHub Actions runner health"
      - "Unified Cloudflare Observability"
      - "Rebuild pages read models"
      - "Run runtime offline maintenance"
      - "Run data integrity repair"
      - "Run daily deep repair"
      - "Repair track metadata"
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-maintenance-workflows.yml'
      - '.github/scripts/recover-maintenance-workflows.mjs'
      - '.github/scripts/workflow-health-policy.mjs'
      - '.github/workflows/run-pages-read-model-rebuild.yml'
      - '.github/workflows/run-runtime-offline-maintenance.yml'
      - '.github/workflows/run-data-integrity-repair.yml'
      - '.github/workflows/run-daily-deep-repair.yml'
      - '.github/workflows/run-track-metadata-repair.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: maintenance-workflow-recovery
  cancel-in-progress: true

jobs:
  recover:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Recover missing maintenance schedule delivery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/recover-maintenance-workflows.mjs
