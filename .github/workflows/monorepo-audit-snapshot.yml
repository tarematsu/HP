name: Monorepo audit snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/monorepo-audit-snapshot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Create source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/monorepo-audit-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: monorepo-audit-source-${{ github.run_id }}
          path: /tmp/monorepo-audit-source.tar.gz
          retention-days: 1
          if-no-files-found: error
