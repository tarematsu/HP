name: Android player build

on:
  pull_request:
    paths:
      - 'hp/android-player/**'
      - '.github/workflows/android-player-build.yml'
  push:
    branches: [main]
    paths:
      - 'hp/android-player/**'
      - '.github/workflows/android-player-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hp/android-player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-debug
          path: hp/android-player/app/build/outputs/apk/debug/app-debug.apk
