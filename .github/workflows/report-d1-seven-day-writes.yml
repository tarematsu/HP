name: Report D1 seven-day writes

on:
  pull_request:
    paths:
      - '.github/scripts/audit-cloudflare-d1-history.py'
      - '.github/workflows/report-d1-seven-day-writes.yml'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      D1_CONFIG_GLOBS: worker/wrangler*.jsonc,site/wrangler.jsonc,hp/cloud/wrangler.jsonc
      DAILY_USAGE_OUTPUT_DIR: daily-usage
      D1_HISTORY_DAYS: '7'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - name: Collect D1 writes by UTC day
        run: python3 .github/scripts/audit-cloudflare-d1-history.py
