name: Finalize named window modes

on:
  push:
    branches:
      - feat/window-named-audio-monitor-modes
    paths:
      - .github/workflows/apply-window-named-modes-final.yml

permissions:
  contents: write

jobs:
  finalize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hp/package-lock.json
      - name: Install HomePanel dependencies
        working-directory: hp
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Apply implementation and regression fixes
        run: |
          python .github/scripts/apply_window_named_modes.py
          python .github/scripts/finalize_window_named_modes.py
      - name: Commit implementation and remove temporary automation
        shell: bash
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/apply-window-named-modes.yml \
            .github/workflows/apply-window-named-modes-v2.yml \
            .github/workflows/apply-window-named-modes-v3.yml \
            .github/workflows/apply-window-named-modes-final.yml \
            .github/workflows/capture-window-mode-tests.yml \
            .github/scripts/apply_window_named_modes.py \
            .github/scripts/finalize_window_named_modes.py \
            .github/window-mode-test-output.txt \
            .github/window-mode-test-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use window names for Stationhead audio and monitor modes"
          git push origin HEAD:feat/window-named-audio-monitor-modes
      - name: Check video workspace
        working-directory: hp
        run: npm run check --workspace video
      - name: Test video workspace
        working-directory: hp
        run: npm test --workspace video
