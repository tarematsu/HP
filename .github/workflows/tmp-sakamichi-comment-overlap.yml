name: Temporary Sakamichi Commenter Overlap

on:
  push:
    branches:
      - tmp/sakamichi-comment-overlap-20260919
    paths:
      - .github/workflows/tmp-sakamichi-comment-overlap.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector
        run: pip install --disable-pip-version-check youtube-comment-downloader==0.1.83

      - name: Collect and analyze three videos
        run: python scripts/tmp_sakamichi_comment_overlap.py

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sakamichi-comment-overlap
          path: out/sakamichi_overlap/
          if-no-files-found: error
          retention-days: 1
