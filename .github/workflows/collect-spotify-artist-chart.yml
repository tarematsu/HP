name: Bootstrap Spotify Charts auth

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spotify-charts-auth-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPOTIFY_CHARTS_SP_DC: ${{ secrets.SPOTIFY_CHARTS_SP_DC || secrets.SPOTIFY_SP_DC }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify bootstrap secrets
        shell: bash
        run: |
          if [ -z "$SPOTIFY_CHARTS_SP_DC" ]; then
            echo "::error title=Spotify Charts session missing::Configure SPOTIFY_CHARTS_SP_DC once, run this workflow, then it can be removed."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Cloudflare API token missing::A token with Workers Scripts Write is required."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Spotify auth client
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'curl-cffi==0.16.3'

      - name: Exchange one-time session for refresh token
        run: python worker/scripts/bootstrap-spotify-charts-refresh.py --output .spotify-charts-refresh-token

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Store auth state in Cloudflare Worker secrets
        run: node worker/scripts/store-spotify-charts-worker-secrets.mjs .spotify-charts-refresh-token

      - name: Remove temporary refresh token
        if: always()
        run: rm -f .spotify-charts-refresh-token
