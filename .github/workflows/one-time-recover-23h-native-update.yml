name: One-time apply missed update migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-recover-23h-native-update.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: one-time-recover-23h-native-update
  cancel-in-progress: false

jobs:
  apply-and-retrigger:
    if: github.event.head_commit.message != 'Remove one-time 23h native update recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hp/package-lock.json

      - name: Install HomePanel workspace dependencies
        working-directory: hp
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Apply pending HomePanel D1 migrations
        working-directory: hp/cloud
        shell: bash
        run: |
          set -euo pipefail
          npm exec -- wrangler d1 migrations apply homepanel-data \
            --remote --config wrangler.jsonc \
            2>&1 | tee "$RUNNER_TEMP/d1-migrations.log"

      - name: Resolve deployed HomePanel public URL
        id: homepanel-public-url
        run: node .github/scripts/cloudflare-worker-public-url.mjs homepanel-cloud /api/health

      - name: Trigger immediate update detection
        shell: bash
        env:
          HOMEPANEL_BASE_URL: ${{ steps.homepanel-public-url.outputs.base-url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 \
            -X POST "${HOMEPANEL_BASE_URL%/}/v1/update/ping" \
            > "$RUNNER_TEMP/update-ping.json"
          sleep 25

      - name: Verify migration and rollout state
        working-directory: hp/cloud
        shell: bash
        run: |
          set -euo pipefail
          sql="SELECT
              'update_job' AS section,
              interval_seconds,
              next_run_at,
              last_success_at,
              last_error,
              consecutive_failures
            FROM jobs WHERE name='update_check';

            SELECT
              'update_state' AS section,
              status,
              error,
              json_extract(payload, '$.version') AS release_version,
              substr(json_extract(payload, '$.manifestHash'), 1, 16) AS manifest_hash_prefix,
              datetime(observed_at / 1000, 'unixepoch', '+9 hours') AS observed_jst,
              datetime(fetched_at / 1000, 'unixepoch', '+9 hours') AS fetched_jst
            FROM current_state WHERE source='update';

            SELECT
              'heartbeat' AS section,
              substr(device_id, 1, 4) || '…' AS device,
              app_version,
              datetime(last_seen_at / 1000, 'unixepoch', '+9 hours') AS last_seen_jst
            FROM device_heartbeats
            ORDER BY last_seen_at DESC LIMIT 5;

            SELECT
              'command' AS section,
              id,
              substr(device_id, 1, 4) || '…' AS device,
              datetime(created_at / 1000, 'unixepoch', '+9 hours') AS created_jst,
              datetime(expires_at / 1000, 'unixepoch', '+9 hours') AS expires_jst,
              datetime(delivered_at / 1000, 'unixepoch', '+9 hours') AS delivered_jst,
              datetime(completed_at / 1000, 'unixepoch', '+9 hours') AS completed_jst,
              success,
              result,
              payload
            FROM device_commands
            WHERE command='check_update'
            ORDER BY id DESC LIMIT 8;"
          npm exec -- wrangler d1 execute homepanel-data \
            --remote --config wrangler.jsonc \
            --command "$sql" --json \
            > "$RUNNER_TEMP/update-rollout-verify.json"

      - name: Record migration and rollout result
        if: success()
        uses: actions/github-script@v7
        env:
          MIGRATIONS_PATH: ${{ runner.temp }}/d1-migrations.log
          PING_PATH: ${{ runner.temp }}/update-ping.json
          VERIFY_PATH: ${{ runner.temp }}/update-rollout-verify.json
        with:
          script: |
            const fs = require('fs');
            const read = path => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '(missing)';
            const body = [
              '✅ 未適用だった更新マイグレーションを適用し、即時更新検出を再実行しました。',
              '',
              '### D1 migrations',
              '```text',
              read(process.env.MIGRATIONS_PATH).slice(-6000),
              '```',
              '',
              '### update ping',
              '```json',
              read(process.env.PING_PATH).slice(-2000),
              '```',
              '',
              '### rollout verification',
              '```json',
              read(process.env.VERIFY_PATH).slice(-18000),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 480,
              body,
            });

      - name: Record failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 480,
              body: `❌ D1 migration / update rollout retry failed. Actions run: ${context.runId}`,
            });
