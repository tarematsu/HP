name: One-time recover 23h native update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-recover-23h-native-update.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: one-time-recover-23h-native-update
  cancel-in-progress: false

jobs:
  diagnose-and-recover:
    if: github.event.head_commit.message != 'Remove one-time 23h native update recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hp/package-lock.json

      - name: Install HomePanel workspace dependencies
        working-directory: hp
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Force current update manifest refresh
        shell: bash
        env:
          HOMEPANEL_WORKER_URL: ${{ vars.HOMEPANEL_WORKER_URL }}
          HOMEPANEL_REFRESH_TOKEN: ${{ secrets.HOMEPANEL_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMEPANEL_WORKER_URL:-}" ]]; then
            echo '{"refresh":"skipped","reason":"HOMEPANEL_WORKER_URL unavailable"}' > "$RUNNER_TEMP/update-refresh.json"
            exit 0
          fi
          url="${HOMEPANEL_WORKER_URL%/}"
          if [[ -n "${HOMEPANEL_REFRESH_TOKEN:-}" ]]; then
            curl --fail --silent --show-error --retry 2 \
              -X POST "$url/v1/refresh" \
              -H "Authorization: Bearer $HOMEPANEL_REFRESH_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"sources":["update_check"]}' \
              > "$RUNNER_TEMP/update-refresh.json"
          else
            curl --fail --silent --show-error --retry 2 \
              -X POST "$url/v1/update/ping" \
              > "$RUNNER_TEMP/update-refresh.json"
          fi
          sleep 20

      - name: Inspect latest R2 manifest
        working-directory: hp/cloud
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/update-manifest.json"
          report="$RUNNER_TEMP/r2-manifest-report.json"
          if npm exec -- wrangler r2 object get \
              homepanel-updates/updates/latest/update-manifest.json \
              --remote --config wrangler.jsonc --file "$manifest"; then
            node - "$manifest" "$report" <<'NODE'
          const fs = require('fs');
          const [manifestPath, reportPath] = process.argv.slice(2);
          const value = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          fs.writeFileSync(reportPath, JSON.stringify({
            available: true,
            version: String(value.version ?? ''),
            signed: Boolean(value.signed),
            files: Array.isArray(value.files) ? value.files.map(file => ({
              name: String(file?.name ?? ''),
              size: Number(file?.size ?? 0),
            })) : [],
          }, null, 2));
          NODE
          else
            echo '{"available":false,"error":"latest manifest could not be read from R2"}' > "$report"
          fi

      - name: Inspect delivery state and requeue outdated devices
        working-directory: hp/cloud
        shell: bash
        run: |
          set -euo pipefail
          now_ms="$(date +%s%3N)"
          cutoff_ms="$((now_ms - 30 * 24 * 60 * 60 * 1000))"
          expires_ms="$((now_ms + 24 * 60 * 60 * 1000))"
          sql="SELECT
              'update_state' AS section,
              status,
              error,
              json_extract(payload, '$.version') AS release_version,
              substr(json_extract(payload, '$.manifestHash'), 1, 16) AS manifest_hash_prefix,
              datetime(observed_at / 1000, 'unixepoch', '+9 hours') AS observed_jst,
              datetime(fetched_at / 1000, 'unixepoch', '+9 hours') AS fetched_jst
            FROM current_state
            WHERE source='update';

            SELECT
              'update_job' AS section,
              interval_seconds,
              datetime(next_run_at, 'unixepoch', '+9 hours') AS next_run_jst,
              datetime(last_success_at, 'unixepoch', '+9 hours') AS last_success_jst,
              last_error,
              consecutive_failures
            FROM jobs
            WHERE name='update_check';

            SELECT
              'job_run' AS section,
              id,
              datetime(started_at / 1000, 'unixepoch', '+9 hours') AS started_jst,
              success,
              substr(coalesce(detail, ''), 1, 240) AS detail
            FROM job_runs
            WHERE job_name='update_check'
            ORDER BY id DESC
            LIMIT 8;

            SELECT
              'heartbeat' AS section,
              substr(device_id, 1, 4) || '…' AS device,
              app_version,
              datetime(last_seen_at / 1000, 'unixepoch', '+9 hours') AS last_seen_jst,
              outbox_count
            FROM device_heartbeats
            WHERE last_seen_at >= ${cutoff_ms}
            ORDER BY last_seen_at DESC;

            SELECT
              'command_before' AS section,
              id,
              substr(device_id, 1, 4) || '…' AS device,
              datetime(created_at / 1000, 'unixepoch', '+9 hours') AS created_jst,
              datetime(expires_at / 1000, 'unixepoch', '+9 hours') AS expires_jst,
              datetime(delivered_at / 1000, 'unixepoch', '+9 hours') AS delivered_jst,
              datetime(completed_at / 1000, 'unixepoch', '+9 hours') AS completed_jst,
              success,
              result,
              payload
            FROM device_commands
            WHERE command='check_update'
            ORDER BY id DESC
            LIMIT 12;

            WITH latest AS (
              SELECT
                json_extract(payload, '$.version') AS release_version,
                json_extract(payload, '$.manifestHash') AS manifest_hash
              FROM current_state
              WHERE source='update'
            )
            INSERT INTO device_commands(device_id, command, payload, created_at, expires_at)
            SELECT
              heartbeat.device_id,
              'check_update',
              json_object(
                'reason', 'manual-retry-after-missed-23h-rollout',
                'version', latest.release_version,
                'manifestHash', latest.manifest_hash
              ),
              ${now_ms},
              ${expires_ms}
            FROM device_heartbeats AS heartbeat
            CROSS JOIN latest
            WHERE heartbeat.last_seen_at >= ${cutoff_ms}
              AND latest.release_version IS NOT NULL
              AND latest.release_version <> ''
              AND (heartbeat.app_version IS NULL OR heartbeat.app_version <> latest.release_version)
              AND NOT EXISTS (
                SELECT 1
                FROM device_commands AS existing
                WHERE existing.device_id=heartbeat.device_id
                  AND existing.command='check_update'
                  AND existing.completed_at IS NULL
                  AND (existing.expires_at IS NULL OR existing.expires_at>${now_ms})
              );

            SELECT 'recovery' AS section, changes() AS queued_commands;

            SELECT
              'command_after' AS section,
              id,
              substr(device_id, 1, 4) || '…' AS device,
              datetime(created_at / 1000, 'unixepoch', '+9 hours') AS created_jst,
              datetime(expires_at / 1000, 'unixepoch', '+9 hours') AS expires_jst,
              datetime(delivered_at / 1000, 'unixepoch', '+9 hours') AS delivered_jst,
              datetime(completed_at / 1000, 'unixepoch', '+9 hours') AS completed_jst,
              success,
              result,
              payload
            FROM device_commands
            WHERE command='check_update'
            ORDER BY id DESC
            LIMIT 12;"

          npm exec -- wrangler d1 execute homepanel-data \
            --remote --config wrangler.jsonc \
            --command "$sql" --json \
            > "$RUNNER_TEMP/update-recovery-d1.json"

      - name: Record diagnosis and recovery result
        if: success()
        uses: actions/github-script@v7
        env:
          REFRESH_PATH: ${{ runner.temp }}/update-refresh.json
          MANIFEST_PATH: ${{ runner.temp }}/r2-manifest-report.json
          D1_PATH: ${{ runner.temp }}/update-recovery-d1.json
        with:
          script: |
            const fs = require('fs');
            const read = path => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '(missing)';
            const body = [
              '✅ 23時台ネイティブ更新の診断・復旧処理が完了しました。',
              '',
              '### 更新再検出',
              '```json',
              read(process.env.REFRESH_PATH).slice(-3000),
              '```',
              '',
              '### R2最新マニフェスト',
              '```json',
              read(process.env.MANIFEST_PATH).slice(-5000),
              '```',
              '',
              '### D1状態・コマンド履歴・再投入結果',
              '```json',
              read(process.env.D1_PATH).slice(-18000),
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 480,
              body,
            });

      - name: Record workflow failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 480,
              body: `❌ 診断・復旧ワークフローが失敗しました。Actions run: ${context.runId}`,
            });
