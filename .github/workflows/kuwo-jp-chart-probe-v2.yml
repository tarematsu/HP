name: Probe Kuwo Japanese chart v2

on:
  push:
    branches:
      - research/kuwo-jp-chart-probe
    paths:
      - .github/workflows/kuwo-jp-chart-probe-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch Kuwo Japanese chart
        shell: bash
        run: |
          python3 <<'PY'
          import json, re, urllib.request, urllib.parse, concurrent.futures, pathlib, time

          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          aliases={
            '櫻坂46':['櫻坂46','樱坂46','sakurazaka46','sakurazaka 46'],
            '乃木坂46':['乃木坂46','nogizaka46','nogizaka 46'],
            '日向坂46':['日向坂46','hinatazaka46','hinatazaka 46'],
          }
          def norm(s): return re.sub(r'[\s._・･\-—–/\\()\[\]（）【】「」『』]','',str(s or '').casefold())
          def fetch(url, timeout=15):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json,text/plain,text/html,*/*','Referer':'https://m.kuwo.cn/'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                return r.status,r.geturl(),r.read().decode('utf-8','replace')
            except Exception as e:
              return 0,url,''
          def jload(s):
            try:return json.loads(s)
            except:return None
          def walk(o):
            if isinstance(o,dict):
              yield o
              for v in o.values(): yield from walk(v)
            elif isinstance(o,list):
              for v in o: yield from walk(v)
          def rows(p):
            if not isinstance(p,dict): return []
            for v in [p.get('musiclist'),p.get('musicList'),(p.get('data') or {}).get('musicList') if isinstance(p.get('data'),dict) else None,(p.get('data') or {}).get('musiclist') if isinstance(p.get('data'),dict) else None,p.get('list')]:
              if isinstance(v,list) and v:return v
            return []
          def chart_url(i,rn=300):
            return f'https://kbangserver.kuwo.cn/ksong.s?from=pc&fmt=json&pn=0&rn={rn}&type=bang&data=content&id={i}&show_copyright_off=0&pcmp4=1&isbang=1&userid=0'
          def hit_group(r):
            h=norm(' '.join(str(r.get(k,'')) for k in ('artist','artistName','singer','name','title')))
            for g,aa in aliases.items():
              if any(norm(a) in h for a in aa):return g
          def score(rs):
            hints=['ありがとう','nightdancer','cryforme','myall','planet']
            return sum(any(norm(h) in norm((r.get('name') or r.get('title') or '')) for h in hints) for r in rs)

          report={'observed_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'discovery':[],'chart':None,'matches':[],'history':{'captures':[],'matches':[],'notes':[]}}
          ids=[]
          for u in ('https://wapi.kuwo.cn/api/pc/bang/list','http://wapi.kuwo.cn/api/pc/bang/list'):
            st,fu,txt=fetch(u); p=jload(txt); found=[]
            for o in walk(p):
              name=str(o.get('name') or o.get('title') or o.get('bangName') or '')
              if '日语榜' in name or '日語榜' in name:
                found.append({k:o.get(k) for k in ('name','title','sourceid','sourceId','id','bangId') if o.get(k) is not None})
                for k in ('sourceid','sourceId','id','bangId'):
                  try:
                    x=int(o.get(k));
                    if 0<x<10000:ids.append(x)
                  except:pass
            report['discovery'].append({'method':'menu','url':u,'status':st,'found':found})

          st,fu,h5=fetch('https://m.kuwo.cn/newh5/bang/index')
          report['discovery'].append({'method':'h5','status':st,'contains':('酷我日语榜' in h5),'bytes':len(h5)})

          chosen=None
          for i in dict.fromkeys(ids):
            st,_,txt=fetch(chart_url(i,5),8); rs=rows(jload(txt))
            if rs and score(rs)>=1: chosen=i; break
          if chosen is None:
            def probe(i):
              st,_,txt=fetch(chart_url(i,5),8); rs=rows(jload(txt)); return i,score(rs),rs
            with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
              for i,s,rs in ex.map(probe,range(1,401)):
                if s>=2:
                  chosen=i; break
            report['discovery'].append({'method':'id_scan','range':'1..400','chosen':chosen})

          if chosen is not None:
            st,_,txt=fetch(chart_url(chosen,300),20); p=jload(txt); rs=rows(p)
            report['chart']={'id':chosen,'status':st,'count':len(rs),'top10':[{'rank':n+1,'name':r.get('name') or r.get('title'),'artist':r.get('artist') or r.get('artistName') or r.get('singer'),'rid':r.get('rid') or r.get('id')} for n,r in enumerate(rs[:10])], 'metadata':{k:v for k,v in (p or {}).items() if not isinstance(v,(dict,list))}}
            for n,r in enumerate(rs,1):
              g=hit_group(r)
              if g: report['matches'].append({'group':g,'rank':n,'name':r.get('name') or r.get('title'),'artist':r.get('artist') or r.get('artistName') or r.get('singer'),'rid':r.get('rid') or r.get('id')})

            original=f'http://kbangserver.kuwo.cn/ksong.s?from=pc&fmt=json&pn=0&rn=300&type=bang&data=content&id={chosen}&show_copyright_off=0&pcmp4=1&isbang=1&userid=0'
            cdx='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode({'url':original,'output':'json','fl':'timestamp,original,statuscode,digest','filter':'statuscode:200','collapse':'digest','from':'2018','to':'2026','limit':'100'})
            ast,_,atxt=fetch(cdx,20); aj=jload(atxt)
            if isinstance(aj,list) and len(aj)>1:
              caps=[{'timestamp':r[0],'original':r[1],'status':r[2],'digest':r[3]} for r in aj[1:]]
              report['history']['captures']=caps
              for c in caps[-30:]:
                su=f"https://web.archive.org/web/{c['timestamp']}id_/{c['original']}"
                _,_,s=fetch(su,15); srs=rows(jload(s))
                for n,r in enumerate(srs,1):
                  g=hit_group(r)
                  if g: report['history']['matches'].append({'timestamp':c['timestamp'],'group':g,'rank':n,'name':r.get('name') or r.get('title'),'artist':r.get('artist') or r.get('artistName') or r.get('singer')})
            else: report['history']['notes'].append(f'Wayback exact-endpoint history unavailable or blocked (HTTP {ast}).')
            report['history']['notes'].append('Live Kuwo chart endpoint exposes the current list; no official historical-series endpoint was identified by this probe.')
          else:
            report['chart']={'status':'not_found','candidate_ids':list(dict.fromkeys(ids))}

          pathlib.Path('kuwo-jp-chart-report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          out=['# Kuwo 酷我日语榜 probe',f"Observed: {report['observed_at']}"]
          if report.get('chart',{}).get('id'): out.append(f"Chart ID: {report['chart']['id']}; rows: {report['chart']['count']}")
          else: out.append('Chart ID could not be resolved')
          out+=['','## Current Sakamichi matches']
          out += [f"- #{m['rank']} {m['group']}: {m['name']} — {m['artist']} (RID {m['rid']})" for m in report['matches']] or ['- No 櫻坂46 / 乃木坂46 / 日向坂46 match found.']
          out+=['','## Top 10']+[f"- #{r['rank']} {r['name']} — {r['artist']}" for r in report.get('chart',{}).get('top10',[])]
          out+=['','## History',f"- Archive captures: {len(report['history']['captures'])}"]
          out += [f"- {m['timestamp']}: #{m['rank']} {m['group']} {m['name']} — {m['artist']}" for m in report['history']['matches']] or ['- No historical Sakamichi match recovered.']
          out += [f'- {x}' for x in report['history']['notes']]
          pathlib.Path('kuwo-jp-chart-report.md').write_text('\n'.join(out)+'\n',encoding='utf-8')
          print('\n'.join(out))
          PY
      - name: Publish job summary
        if: always()
        shell: bash
        run: test -f kuwo-jp-chart-report.md && cat kuwo-jp-chart-report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuwo-jp-chart-probe-v2
          path: kuwo-jp-chart-report.*
          if-no-files-found: ignore
          retention-days: 7
