name: Refresh Amazon Music read model

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-amazon-music-read-model.yml'
      - 'worker/scripts/refresh-amazon-music-actions.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amazon-music-read-model-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    name: Publish current Sakamichi Amazon Music model
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets['CLOUDFLARE_API_TOKEN'] || secrets['CF_API_TOKEN'] || secrets['CLOUDFLARE_BUILDS_API_TOKEN'] }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: worker
      - name: Recollect and publish through shared remote adapters
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          node scripts/refresh-amazon-music-actions.mjs 2>&1 | tee amazon-refresh.log
      - name: Preserve Amazon recovery diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-recovery-failure-${{ github.run_id }}
          path: worker/amazon-refresh.log
          if-no-files-found: warn
          retention-days: 7

