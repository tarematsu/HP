name: Apply follower endpoint fix

on:
  push:
    branches:
      - fix/follower-production-profile-endpoint
    paths:
      - .github/workflows/apply-follower-endpoint-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/follower-production-profile-endpoint
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Apply code and regression test
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'worker/src/stationhead-daily-followers.js';
          const before = fs.readFileSync(path, 'utf8');
          const oldLine = "const PROFILE_BASE = 'https://www.stationhead.com/api/account/handle/';";
          const newLine = "const PROFILE_BASE = 'https://production1.stationhead.com/account/handle/';";
          if (!before.includes(oldLine)) throw new Error('expected legacy follower profile endpoint not found');
          fs.writeFileSync(path, before.replace(oldLine, newLine));
          NODE

          cat > worker/tests/stationhead-follower-profile-endpoint.test.js <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';

          import { fetchStationheadFollowerProfile } from '../src/stationhead-daily-followers.js';

          test('follower profiles use the production Stationhead account endpoint', async () => {
            let requestedUrl = '';
            const result = await fetchStationheadFollowerProfile('SakuraMankai', {
              session: {
                auth_token: 'token',
                device_uid: 'device',
              },
              fetchFn: async (url, options) => {
                requestedUrl = String(url);
                assert.equal(options.headers.authorization, 'Bearer token');
                assert.equal(options.headers['sth-device-uid'], 'device');
                return Response.json({
                  id: 3334889,
                  handle: 'sakuramankai',
                  followers: 4283,
                });
              },
            });

            assert.equal(
              requestedUrl,
              'https://production1.stationhead.com/account/handle/sakuramankai',
            );
            assert.deepEqual(result, {
              handle: 'sakuramankai',
              account_id: 3334889,
              followers: 4283,
            });
          });
          EOF

          rm .github/workflows/apply-follower-endpoint-fix.yml

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run focused follower tests
        working-directory: worker
        run: >-
          node --test
          tests/stationhead-follower-profile-endpoint.test.js
          tests/stationhead-daily-followers.test.js
          tests/stationhead-daily-followers-resilient.test.js
          tests/stationhead-daily-followers-partial-recovery.test.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/src/stationhead-daily-followers.js worker/tests/stationhead-follower-profile-endpoint.test.js .github/workflows/apply-follower-endpoint-fix.yml
          git commit -m 'Fix Stationhead follower profile endpoint'
          git push origin HEAD:fix/follower-production-profile-endpoint
