name: Verify Buddies follower auth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-buddies-follower-auth.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm --prefix worker ci --prefer-offline --no-audit --no-fund
      - run: node --test worker/tests/stationhead-daily-followers.test.js worker/tests/buddies-collector-entry-routing.test.js worker/tests/sakurazaka-followers-entry.test.js
