name: Backfill Kugou ACG chart history

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/backfill-kugou-acg-chart-history.yml'
      - 'worker/scripts/backfill-kugou-acg-chart-history-actions.mjs'
      - 'worker/src/kugou-acg-backfill.js'
      - 'worker/src/kugou-acg-chart-history.js'
      - 'worker/src/regional-music-service-entry.js'
      - 'worker/wrangler.regional-music.jsonc'
  workflow_dispatch:
    inputs:
      start_date:
        description: Earliest published date to backfill (YYYY-MM-DD)
        required: false
        default: '2019-01-01'

permissions:
  contents: read

concurrency:
  group: kugou-acg-chart-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      KUGOU_ACG_HISTORY_START: ${{ inputs.start_date || '2019-01-01' }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Deploy regional music worker
        working-directory: worker
        run: npm run deploy:regional-music

      - name: Queue and verify Kugou ACG新歌榜 history backfill
        working-directory: worker
        run: node scripts/backfill-kugou-acg-chart-history-actions.mjs
