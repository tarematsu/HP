name: Research NetEase Japanese chart history

on:
  pull_request:
    paths:
      - '.github/workflows/research-netease-japan-history.yml'
      - 'worker/scripts/research-netease-japan-history.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe archived 网易云日语榜 snapshots
        working-directory: worker
        run: node scripts/research-netease-japan-history.mjs

      - name: Upload research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netease-japan-history-research
          path: worker/netease-japan-history-research.json
          if-no-files-found: warn
