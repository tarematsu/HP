name: Verify Nogizaka 102280 production D1

on:
  push:
    branches:
      - chore/verify-nogizaka-102280-after-merge

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Wrangler
        working-directory: worker
        run: npm ci --no-audit --no-fund
      - name: Query production D1 read-only
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          echo '=== announcement 102280 ==='
          npx wrangler d1 execute stationhead-other --remote --command "SELECT id,news_id,news_url,published_date,title,event_name,scheduled_at,detected_at,updated_at,status FROM sh_nogizaka_official_news_announcements WHERE news_id='102280' ORDER BY id DESC LIMIT 5;"
          echo '=== monitor state ==='
          npx wrangler d1 execute stationhead-other --remote --command "SELECT id,last_check_at,last_success_at,last_error,updated_at FROM sh_official_news_monitor_state WHERE id='official-news:nogizaka46smej' LIMIT 1;"
