name: Rebuild Ohisama Track History

on:
  push:
    branches:
      - codex/pages-design-resource-layout
    paths:
      - '.github/workflows/rebuild-ohisama-track-history.yml'
      - 'worker/scripts/rebuild-ohisama-track-history-actions.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      OHISAMA_DATABASE_NAME: stationhead-ohisama
      PAGES_RESPONSE_BUCKET: sh-pages-responses
      OHISAMA_TRACK_HISTORY_REBUILD_START: '2026-10-01'
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Rebuild Ohisama Track History from October 1
        run: node scripts/rebuild-ohisama-track-history-actions.mjs
