name: Stationhead daily followers

on:
  schedule:
    # GitHub cron is UTC: 15:00 UTC = 00:00 JST on the following calendar day.
    - cron: '0 15 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stationhead-daily-followers.yml'

permissions:
  contents: read

concurrency:
  group: stationhead-daily-followers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install browser client
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.54.0

      - name: Install Worker tooling
        run: npm --prefix worker ci --prefer-offline --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect and persist follower snapshot
        run: node .github/scripts/collect-stationhead-daily-followers.mjs
