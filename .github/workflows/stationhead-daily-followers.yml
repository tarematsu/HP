name: Stationhead daily followers

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stationhead-daily-followers.yml

permissions:
  contents: read

concurrency:
  group: stationhead-daily-followers
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          show-progress: false

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Collect followers and publish read model
        working-directory: worker
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if node scripts/collect-stationhead-followers-actions.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1
