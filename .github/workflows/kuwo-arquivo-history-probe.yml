name: Probe Kuwo history in Arquivo.pt
on:
  push:
    branches: [research/kuwo-jp-chart-probe]
    paths: [.github/workflows/kuwo-arquivo-history-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query Arquivo.pt CDX and text search
        shell: bash
        run: |
          python3 <<'PY'
          import json,urllib.parse,urllib.request
          H={'User-Agent':'Mozilla/5.0'}
          def read(u,t=30):
            q=urllib.request.Request(u,headers=H)
            with urllib.request.urlopen(q,timeout=t) as r:return r.geturl(),r.read().decode('utf-8','replace')
          urls=[
            'http://m.kuwo.cn/newh5/bang/content?bid=183',
            'https://m.kuwo.cn/newh5/bang/content?bid=183',
            'http://kuwo.cn/newh5/bang/content?bid=183',
            'https://kuwo.cn/newh5/bang/content?bid=183',
            'http://m.kuwo.cn/newh5/bang/index',
            'https://kuwo.cn/newh5/bang/index'
          ]
          for target in urls:
            api='https://arquivo.pt/wayback/cdx?'+urllib.parse.urlencode({'url':target,'output':'json'})
            try:
              final,raw=read(api,30); print('CDX_TARGET',target,'FINAL',final,'LEN',len(raw),'HEAD',raw[:500].replace('\n',' '))
            except Exception as e: print('CDX_ERR',target,repr(e))
          # Full-text search API; output varies, print records with Kuwo URLs.
          for qtext in ['"酷我日语榜"','酷我日语榜','kuwo bid 183']:
            api='https://arquivo.pt/textsearch?'+urllib.parse.urlencode({'q':qtext,'maxItems':'50'})
            try:
              final,raw=read(api,30); print('TEXTSEARCH',qtext,'LEN',len(raw))
              try:j=json.loads(raw)
              except Exception as e: print('TEXT_NONJSON',raw[:1000]);continue
              items=j.get('response_items') or j.get('items') or j.get('results') or []
              print('TEXT_ITEMS',len(items))
              for x in items:
                text=json.dumps(x,ensure_ascii=False)
                if 'kuwo' in text.lower() or '酷我' in text:
                  print('ITEM',text[:6000])
            except Exception as e: print('TEXT_ERR',qtext,repr(e))
          PY
