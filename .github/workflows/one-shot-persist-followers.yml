name: One-shot persist Stationhead followers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-persist-followers.yml'

permissions:
  contents: read

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Write and verify snapshot
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          cat > one-shot-persist-entry.js <<'EOF'
          const KEY = 'pages-response/v1/followers.json';
          const OBSERVED_AT = 1790709125180;
          const FOLLOWERS = Object.freeze({
            sakuramankai: 4280,
            sakuramankai2: 492,
            sakurazaka46jp: 6883,
            nogizaka46smej: 397,
          });
          const HANDLES = Object.keys(FOLLOWERS);
          const DATE = new Date(OBSERVED_AT + 9 * 60 * 60_000).toISOString().slice(0, 10);

          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname === '/run') {
                const now = Date.now();
                const payload = {
                  ok: true,
                  updated_at: now,
                  latest_date: DATE,
                  handles: HANDLES,
                  rows: [{ date: DATE, ...FOLLOWERS }],
                  accounts: HANDLES.map((handle) => ({
                    handle,
                    followers: FOLLOWERS[handle],
                    previous_day_delta: null,
                    previous_week_delta: null,
                  })),
                };
                const headers = {
                  'content-type': 'application/json; charset=utf-8',
                  'cache-control': 'public, max-age=30, s-maxage=300, stale-while-revalidate=600',
                };
                await env.PAGES_RESPONSE_R2.put(KEY, JSON.stringify(payload), {
                  httpMetadata: { contentType: headers['content-type'] },
                  customMetadata: {
                    version: '1',
                    status: '200',
                    headers_json: JSON.stringify(headers),
                    updated_at: String(now),
                    cadence_seconds: '86400',
                  },
                });
                const result = await env.OTHER_DB.prepare(`INSERT INTO sh_stationhead_daily_followers (
                    observed_date_jst,scheduled_at,collected_at,
                    sakuramankai,sakuramankai2,sakurazaka46jp,nogizaka46smej
                  ) VALUES (?,?,?,?,?,?,?)
                  ON CONFLICT(observed_date_jst) DO UPDATE SET
                    scheduled_at=excluded.scheduled_at,collected_at=excluded.collected_at,
                    sakuramankai=excluded.sakuramankai,sakuramankai2=excluded.sakuramankai2,
                    sakurazaka46jp=excluded.sakurazaka46jp,nogizaka46smej=excluded.nogizaka46smej`)
                  .bind(DATE, OBSERVED_AT, now,
                    FOLLOWERS.sakuramankai, FOLLOWERS.sakuramankai2,
                    FOLLOWERS.sakurazaka46jp, FOLLOWERS.nogizaka46smej).run();
                return Response.json({ ok: true, date: DATE, followers: FOLLOWERS, d1_changes: Number(result?.meta?.changes || 0) });
              }
              if (url.pathname === '/verify') {
                const row = await env.OTHER_DB.prepare(`SELECT observed_date_jst,sakuramankai,sakuramankai2,sakurazaka46jp,nogizaka46smej
                  FROM sh_stationhead_daily_followers WHERE observed_date_jst=? LIMIT 1`).bind(DATE).first();
                const object = await env.PAGES_RESPONSE_R2.get(KEY);
                const metadata = object?.customMetadata || null;
                const payload = object ? await object.json() : null;
                return Response.json({ row, metadata, latest_date: payload?.latest_date ?? null, accounts: payload?.accounts ?? [] });
              }
              return new Response('ok');
            },
          };
          EOF
          cat > wrangler.one-shot-persist.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "sh-one-shot-persist-followers",
            "main": "one-shot-persist-entry.js",
            "compatibility_date": "2026-09-29",
            "d1_databases": [
              { "binding": "OTHER_DB", "database_name": "stationhead-other", "database_id": "21e70e92-6725-4e62-809e-8aadb088cc11" }
            ],
            "r2_buckets": [
              { "binding": "PAGES_RESPONSE_R2", "bucket_name": "sh-pages-responses" }
            ]
          }
          EOF
          npx wrangler dev --remote --config wrangler.one-shot-persist.jsonc --ip 127.0.0.1 --port 8787 --log-level warn > one-shot-persist.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 60); do
            if curl --max-time 2 -fsS http://127.0.0.1:8787/ >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then cat one-shot-persist.log; exit 1; fi
          curl --max-time 30 -fsS http://127.0.0.1:8787/run | tee one-shot-persist-result.json
          echo
          curl --max-time 20 -fsS http://127.0.0.1:8787/verify | tee one-shot-persist-verify.json
          echo
          node <<'NODE'
          const fs = require('fs');
          const v = JSON.parse(fs.readFileSync('one-shot-persist-verify.json', 'utf8'));
          const expected = { sakuramankai:4280, sakuramankai2:492, sakurazaka46jp:6883, nogizaka46smej:397 };
          if (!v.row || v.latest_date !== '2026-09-30' || v.accounts?.length !== 4 || Number(v.metadata?.version) !== 1) throw new Error('snapshot verification failed');
          for (const [key, value] of Object.entries(expected)) if (Number(v.row[key]) !== value) throw new Error(`${key} mismatch`);
          console.log(JSON.stringify({ ok:true, row:v.row, accounts:v.accounts }));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-shot-persist-followers-${{ github.run_id }}
          path: |
            worker/one-shot-persist-result.json
            worker/one-shot-persist-verify.json
            worker/one-shot-persist.log
          if-no-files-found: ignore
          retention-days: 1
