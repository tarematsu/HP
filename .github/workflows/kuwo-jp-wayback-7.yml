name: Inspect 7 Wayback Kuwo chart captures

on:
  push:
    branches: [research/kuwo-jp-chart-probe]
    paths: [.github/workflows/kuwo-jp-wayback-7.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recover saved ranking pages
        shell: bash
        run: |
          python3 <<'PY'
          import html, json, pathlib, re, urllib.parse, urllib.request
          U='https://www.kuwo.cn/newh5/bang/index'
          aliases=['櫻坂46','樱坂46','Sakurazaka46','乃木坂46','Nogizaka46','日向坂46','Hinatazaka46','欅坂46','Keyakizaka46']
          def get(url,t=15):
            try:
              q=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(q,timeout=t) as r:return r.status,r.geturl(),r.read().decode('utf-8','replace')
            except Exception as e:return 0,url,repr(e)
          q={'url':U,'output':'json','fl':'timestamp,original,statuscode,digest,mimetype','filter':'statuscode:200','collapse':'digest','limit':'100'}
          st,_,txt=get('https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(q),20)
          arr=[]
          try: arr=json.loads(txt)
          except: pass
          caps=[]
          if isinstance(arr,list) and len(arr)>1:
            caps=[{'timestamp':z[0],'original':z[1],'status':z[2],'digest':z[3],'mime':z[4]} for z in arr[1:]]
          print('CDX_STATUS',st,'CAPTURES',len(caps))
          out=[]
          for c in caps:
            urls=[
              f"https://web.archive.org/web/{c['timestamp']}id_/{c['original']}",
              f"https://web.archive.org/web/{c['timestamp']}/{c['original']}",
            ]
            snap=None
            for su in urls:
              sst,final,body=get(su,20)
              if sst==200 and len(body)>1000:
                snap=(sst,final,body);break
            if not snap:
              out.append({**c,'fetch_status':0,'error':'snapshot unavailable'});print('MISS',c['timestamp']);continue
            sst,final,body=snap
            clean=html.unescape(body)
            item={**c,'fetch_status':sst,'final':final,'bytes':len(body),'has_jp':'酷我日语榜' in clean,'aliases':[a for a in aliases if a.lower() in clean.lower()]}
            # Extract a compact text representation around the Japanese chart.
            pos=clean.find('酷我日语榜')
            if pos>=0:
              frag=clean[pos:pos+25000]
              # Strip scripts/styles/tags enough to expose ranking text.
              frag=re.sub(r'<script[\s\S]*?</script>',' ',frag,flags=re.I)
              frag=re.sub(r'<style[\s\S]*?</style>',' ',frag,flags=re.I)
              frag=re.sub(r'<[^>]+>',' ',frag)
              frag=re.sub(r'\s+',' ',frag).strip()
              item['jp_text']=frag[:5000]
            # Look for embedded JSON structures containing the chart name.
            for pat in [r'__NUXT__\s*=\s*(\{[\s\S]+?\});',r'<script[^>]*>\s*window\.__INITIAL_STATE__\s*=\s*(\{[\s\S]+?\})\s*</script>']:
              m=re.search(pat,clean,re.I)
              if m:
                item['embedded_state_head']=m.group(1)[:20000]
                break
            out.append(item)
            print('CAP',c['timestamp'],'bytes',len(body),'JP',item['has_jp'],'aliases',item['aliases'])
            if item.get('jp_text'): print('JP_TEXT',item['jp_text'][:1800])
          pathlib.Path('kuwo-wayback-7.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Upload recovered captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuwo-wayback-7
          path: kuwo-wayback-7.json
          if-no-files-found: ignore
          retention-days: 7
