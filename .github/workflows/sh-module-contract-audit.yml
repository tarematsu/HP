name: Stationhead optional module contract audit

on:
  pull_request:
    paths:
      - 'scripts/audit-stationhead-optional-module-contracts.mjs'
      - '.github/workflows/sh-module-contract-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect live optional module contracts
        run: node scripts/audit-stationhead-optional-module-contracts.mjs
      - name: Publish audit summary
        if: always()
        run: cat .sh-module-contract-audit/contracts.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stationhead-optional-module-contracts-${{ github.run_id }}
          path: .sh-module-contract-audit/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
