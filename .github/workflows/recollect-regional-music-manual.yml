# Manual collection shares the R2 path and lock with scheduled collection.
name: Recollect regional music manually

on:
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated services; empty collects all'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'worker/src/regional-music-youtube-music.js'
      - 'worker/src/regional-music-service-entry.js'
      - 'worker/src/cron-dispatcher-entry.js'
      - 'worker/src/scheduled-crons.js'
      - 'worker/src/regional-music-dispatch-plan.js'
      - 'worker/scripts/resolve-regional-recollection-services.mjs'
      - '.github/workflows/recollect-regional-music-manual.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: regional-music-r2-collection
  cancel-in-progress: false

jobs:
  recollect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve selected regional services
        id: selection
        working-directory: worker
        env:
          INPUT_SERVICES: ${{ inputs.services }}
        run: node scripts/resolve-regional-recollection-services.mjs
      - name: Wait for the official production deployment of this commit
        working-directory: worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-production-deploy.mjs
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Recollect selected services to R2 and publish their results
        working-directory: worker
        env:
          RECOLLECTION_SERVICES: ${{ steps.selection.outputs.services }}
        run: |
          if [ -n "$RECOLLECTION_SERVICES" ]; then
            node scripts/collect-regional-r2-actions.mjs "--services=$RECOLLECTION_SERVICES"
          else
            node scripts/collect-regional-r2-actions.mjs --all
          fi
      - name: Verify current YouTube source observations after repair
        if: always() && steps.selection.outputs.verify_youtube == 'true'
        working-directory: worker
        run: node scripts/verify-youtube-music-actions.mjs
