# Recollect after adding artist page order observations.
name: Recollect regional music manually

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/recollect-regional-music-manual.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: regional-music-manual-recollection
  cancel-in-progress: false

jobs:
  recollect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the official production deployment of this commit
        working-directory: worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-production-deploy.mjs
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Recollect 19 regional services and publish their results
        working-directory: worker
        run: node scripts/recollect-regional-music-actions.mjs
