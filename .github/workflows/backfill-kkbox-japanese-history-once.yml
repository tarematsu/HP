name: Backfill KKBOX Japanese chart history

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/backfill-kkbox-japanese-history-once.yml'
      - 'worker/scripts/backfill-kkbox-japanese-history-actions.mjs'
      - 'worker/src/kkbox-japanese-chart-history.js'
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regional-music-r2-collection
  cancel-in-progress: false

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Backfill KKBOX Japanese weekly chart history
        working-directory: worker
        shell: bash
        run: |
          for territory in tw hk; do
            for type in song newrelease; do
              node scripts/backfill-kkbox-japanese-history-actions.mjs \
                --start=2012-01-01 \
                --territories="$territory" \
                --periods=weekly \
                --types="$type" \
                --delay-ms=900 \
                --max-requests=300 \
                --persist
            done
          done
      - name: Backfill KKBOX Japanese daily chart history
        working-directory: worker
        shell: bash
        run: |
          for territory in tw hk; do
            for type in song newrelease; do
              node scripts/backfill-kkbox-japanese-history-actions.mjs \
                --start=2012-01-01 \
                --territories="$territory" \
                --periods=daily \
                --types="$type" \
                --delay-ms=900 \
                --max-requests=300 \
                --persist
            done
          done
      - name: Refresh KKBOX snapshot and publish regional read model
        working-directory: worker
        run: node scripts/collect-regional-r2-actions.mjs --services=kkbox
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kkbox-japanese-history
          path: worker/artifacts/kkbox-japanese-history.json
          if-no-files-found: warn
