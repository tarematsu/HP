name: Verify Ohisama owner follower registration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-ohisama-owner-fix.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run Ohisama tests
        working-directory: worker
        run: node --test tests/ohisama-collector.test.js tests/ohisama-collector-optimized.test.js tests/stationhead-daily-followers.test.js
      - name: Deploy Ohisama collector
        working-directory: worker
        run: node scripts/deploy-ohisama-collector.mjs
      - name: Trigger Ohisama collection once
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          worker_name="sh-ohisama-trigger-${GITHUB_RUN_ID}"
          run_token="$(openssl rand -hex 24)"
          mkdir -p .ohisama-trigger
          cat > .ohisama-trigger/index.js <<'JS'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname !== '/run' || request.method !== 'POST') return new Response('not found', { status: 404 });
              if (request.headers.get('authorization') !== `Bearer ${env.RUN_TOKEN}`) return new Response('unauthorized', { status: 401 });
              const response = await env.OHISAMA.fetch('https://scheduler.internal/__internal/scheduled', {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ cron: '*/5 * * * *', scheduled_time: Date.now() }),
              });
              return new Response(await response.text(), { status: response.status, headers: { 'content-type': 'application/json' } });
            },
          };
          JS
          cat > .ohisama-trigger/wrangler.jsonc <<EOF
          {
            "name": "$worker_name",
            "main": "index.js",
            "compatibility_date": "2026-06-24",
            "workers_dev": true,
            "vars": { "RUN_TOKEN": "$run_token" },
            "services": [{ "binding": "OHISAMA", "service": "sh-ohisama-collector" }]
          }
          EOF
          cleanup() { npx wrangler delete "$worker_name" --force >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          npx wrangler deploy --config .ohisama-trigger/wrangler.jsonc
          subdomain_json="$(curl --silent --show-error --fail "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          subdomain="$(printf '%s' "$subdomain_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j?.success||!j?.result?.subdomain)process.exit(1);process.stdout.write(j.result.subdomain)})')"
          curl --silent --show-error --fail --retry 10 --retry-delay 1 --retry-all-errors \
            -X POST "https://${worker_name}.${subdomain}.workers.dev/run" \
            -H "Authorization: Bearer $run_token" | tee "$RUNNER_TEMP/ohisama-trigger-result.json"
          echo
          node - "$RUNNER_TEMP/ohisama-trigger-result.json" <<'NODE'
          const fs = require('node:fs');
          const v = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const r = v.result || {};
          if (r.host_handle !== 'hinatapr0211') throw new Error(`unexpected host_handle: ${r.host_handle}`);
          if (!r.follower_target_added && r.host_handle !== 'hinatapr0211') throw new Error('follower target was not added');
          console.log(`OHISAMA_COLLECTION_HOST_OK handle=${r.host_handle} account=${r.host_account_id}`);
          NODE
      - name: Verify follower target in OTHER_DB
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute OTHER_DB --config wrangler.ohisama-collector.jsonc --remote --json \
            --command "SELECT handle,source_mask,first_seen_at FROM sh_stationhead_follower_targets WHERE handle='hinatapr0211' LIMIT 1" \
            > "$RUNNER_TEMP/ohisama-target.json"
          cat "$RUNNER_TEMP/ohisama-target.json"
          node - "$RUNNER_TEMP/ohisama-target.json" <<'NODE'
          const fs = require('node:fs');
          const row = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))?.[0]?.results?.[0];
          if (!row) throw new Error('hinatapr0211 is not registered');
          if ((Number(row.source_mask) & 4) === 0) throw new Error(`Ohisama source bit missing: ${row.source_mask}`);
          console.log(`OHISAMA_FOLLOWER_TARGET_OK handle=${row.handle} source_mask=${row.source_mask}`);
          NODE
      - name: Remove one-off diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/verify-ohisama-owner-fix.yml .github/workflows/diagnose-ohisama-host.yml
          git commit -m "chore: remove Ohisama diagnostic workflows"
          git push origin HEAD:main
