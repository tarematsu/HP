name: Probe historical Kuwo Japanese chart archives

on:
  push:
    branches: [research/kuwo-jp-chart-probe]
    paths: [.github/workflows/kuwo-jp-chart-backfill-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Search Common Crawl and Wayback
        shell: bash
        run: |
          python3 <<'PY'
          import json, urllib.request, urllib.parse, gzip, io, pathlib, re, time

          UA='kuwo-chart-research/1.0'
          TARGETS=[
            'm.kuwo.cn/newh5app/ranklist_detail/183',
            'm.kuwo.cn/newh5app/ranklist_detail/183*',
            'm.kuwo.cn/newh5/bang/index*',
          ]
          API_HINTS=['kbangserver.kuwo.cn/ksong.s']
          YEARS=range(2022,2027)
          def get(url, timeout=20, headers=None):
            h={'User-Agent':UA}
            if headers: h.update(headers)
            try:
              q=urllib.request.Request(url,headers=h)
              with urllib.request.urlopen(q,timeout=timeout) as r:
                return r.status, dict(r.headers), r.read()
            except Exception as e:
              return 0, {}, repr(e).encode()
          st,_,b=get('https://index.commoncrawl.org/collinfo.json',30)
          colls=json.loads(b) if st==200 else []
          ids=[x['id'] for x in colls if any(x['id'].startswith(f'CC-MAIN-{y}-') for y in YEARS)]
          report={'observed_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'cc_indices':ids,'commoncrawl':[],'wayback':[],'recovered':[]}

          # Common Crawl: exact/prefix page URLs first.
          for idx in ids:
            for target in TARGETS:
              q=urllib.parse.urlencode({'url':target,'output':'json','filter':'status:200','limit':'100'})
              url=f'https://index.commoncrawl.org/{idx}-index?{q}'
              st,_,raw=get(url,20)
              text=raw.decode('utf-8','replace')
              rows=[]
              if st==200:
                for line in text.splitlines():
                  try: rows.append(json.loads(line))
                  except: pass
              if rows:
                report['commoncrawl'].append({'index':idx,'target':target,'count':len(rows),'rows':rows})

          # Common Crawl: API path wildcard. Keep only URLs containing id=183.
          for idx in ids:
            q=urllib.parse.urlencode({'url':'kbangserver.kuwo.cn/ksong.s*','output':'json','filter':'status:200','limit':'2000'})
            st,_,raw=get(f'https://index.commoncrawl.org/{idx}-index?{q}',30)
            if st!=200: continue
            keep=[]
            for line in raw.decode('utf-8','replace').splitlines():
              try:r=json.loads(line)
              except:continue
              u=r.get('url','')
              if re.search(r'(?:[?&](?:id|sourceid)=183(?:&|$))',u,re.I): keep.append(r)
            if keep:
              report['commoncrawl'].append({'index':idx,'target':'kbangserver id=183','count':len(keep),'rows':keep})

          # Wayback wildcard searches, including all query variants.
          wb_queries=[
            'https://m.kuwo.cn/newh5app/ranklist_detail/183*',
            'https://kbangserver.kuwo.cn/ksong.s*',
            'http://kbangserver.kuwo.cn/ksong.s*',
          ]
          for target in wb_queries:
            q={'url':target,'output':'json','fl':'timestamp,original,statuscode,digest,mimetype','filter':'statuscode:200','collapse':'digest','limit':'5000'}
            st,_,raw=get('https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(q),30)
            arr=[]
            try:arr=json.loads(raw)
            except:pass
            if isinstance(arr,list) and len(arr)>1:
              rows=[]
              for z in arr[1:]:
                if 'ksong.s' in target and not re.search(r'(?:[?&](?:id|sourceid)=183(?:&|$))',z[1],re.I): continue
                rows.append({'timestamp':z[0],'url':z[1],'status':z[2],'digest':z[3],'mime':z[4]})
              if rows: report['wayback'].append({'target':target,'count':len(rows),'rows':rows})

          # Recover a bounded number of Common Crawl WARC payloads.
          candidates=[]
          for block in report['commoncrawl']:
            for r in block['rows']:
              key=(r.get('timestamp'),r.get('digest'))
              if key not in {(x.get('timestamp'),x.get('digest')) for x in candidates}: candidates.append(r)
          candidates=sorted(candidates,key=lambda r:r.get('timestamp',''))[-40:]
          for r in candidates:
            try:
              off=int(r['offset']); ln=int(r['length']); fn=r['filename']
            except: continue
            st,h,raw=get('https://data.commoncrawl.org/'+fn,30,{'Range':f'bytes={off}-{off+ln-1}'})
            if st not in (200,206): continue
            try:
              data=gzip.GzipFile(fileobj=io.BytesIO(raw)).read()
            except:
              data=raw
            # Pull HTTP payload out of WARC response.
            sep=data.find(b'\r\n\r\n')
            payload=data[sep+4:] if sep>=0 else data
            sep2=payload.find(b'\r\n\r\n')
            if payload.startswith(b'HTTP/') and sep2>=0: payload=payload[sep2+4:]
            text=payload.decode('utf-8','replace')
            # Preserve only likely ranking captures to keep artifact small.
            if ('酷我日语榜' in text) or ('musiclist' in text and ('KOKIA' in text or '浜崎' in text or 'Michita' in text)) or ('ranklist_detail/183' in r.get('url','')):
              report['recovered'].append({'timestamp':r.get('timestamp'),'url':r.get('url'),'digest':r.get('digest'),'bytes':len(payload),'text_head':text[:200000]})

          pathlib.Path('kuwo-jp-backfill-probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print('Common Crawl blocks:',len(report['commoncrawl']))
          for x in report['commoncrawl']:
            print('CC',x['index'],x['target'],'count',x['count'])
            for r in x['rows'][:5]:print(' ',r.get('timestamp'),r.get('url'))
          print('Wayback blocks:',len(report['wayback']))
          for x in report['wayback']:
            print('WB',x['target'],'count',x['count'])
            for r in x['rows'][:5]:print(' ',r['timestamp'],r['url'])
          print('Recovered payloads:',len(report['recovered']))
          for x in report['recovered']:
            print('RECOVERED',x['timestamp'],x['url'],'bytes',x['bytes'])
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kuwo-jp-backfill-probe
          path: kuwo-jp-backfill-probe.json
          if-no-files-found: ignore
          retention-days: 7
