name: Inspect Kuwo Japanese chart response metadata
on:
  push:
    branches: [research/kuwo-jp-chart-probe]
    paths: [.github/workflows/kuwo-jp-volume-head.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fetch metadata
        run: |
          python3 <<'PY'
          import json,urllib.request
          u='https://kbangserver.kuwo.cn/ksong.s?from=pc&fmt=json&pn=0&rn=1&type=bang&data=content&id=183&show_copyright_off=0&pcmp4=1&isbang=1&userid=0'
          q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://m.kuwo.cn/'})
          with urllib.request.urlopen(q,timeout=12) as r:j=json.loads(r.read().decode('utf-8','replace'))
          print('KEYS',sorted(j.keys()))
          for k,v in j.items():
            if k.lower() not in ('musiclist','musiclist'):
              print('FIELD',k,json.dumps(v,ensure_ascii=False)[:50000])
          PY
