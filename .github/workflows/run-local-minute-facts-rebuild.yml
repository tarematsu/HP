name: Run local minute facts rebuild

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'database/minute-facts-local-rebuild.trigger'
  workflow_dispatch:

permissions:
  contents: read

# A delayed scheduled run is stale by definition. Cancel it in favor of the newest
# window; uploads are idempotent and the next run overlaps the cursor by 10 minutes.
concurrency:
  group: minute-facts-local-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    uses: ./.github/workflows/database.yml
    with:
      operation: minute-facts-local-rebuild
    secrets: inherit
