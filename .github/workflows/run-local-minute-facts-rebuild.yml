name: Run local minute facts rebuild

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'database/minute-facts-local-rebuild.trigger'
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an upload that may already have committed part of its window.
# Concurrency keeps one active run and coalesces later schedules behind it.
concurrency:
  group: minute-facts-local-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    uses: ./.github/workflows/database.yml
    with:
      operation: minute-facts-local-rebuild
    secrets: inherit
