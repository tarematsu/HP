name: Report HomePanel CI failures

on:
  workflow_run:
    workflows: ["HomePanel unified Worker CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: homepanel-ci-failure-report-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  report:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish failure diagnostics to the pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- homepanel-ci-failure-diagnostics -->';
            const run = context.payload.workflow_run;
            const pulls = run.pull_requests || [];

            if (pulls.length === 0) {
              core.notice('No pull request is associated with the failed workflow run.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            const failedJobs = jobs.filter((job) => job.conclusion === 'failure');

            function toText(data) {
              if (typeof data === 'string') return data;
              if (Buffer.isBuffer(data)) return data.toString('utf8');
              if (data instanceof ArrayBuffer) return Buffer.from(data).toString('utf8');
              if (ArrayBuffer.isView(data)) {
                return Buffer.from(data.buffer, data.byteOffset, data.byteLength).toString('utf8');
              }
              return String(data ?? '');
            }

            function sanitize(text) {
              return text
                .replace(/\u001b\[[0-9;]*m/g, '')
                .replace(/(authorization:\s*(?:bearer|token)\s+)\S+/gi, '$1[REDACTED]')
                .replace(/\b(token|secret|password|api[_-]?key)\s*[=:]\s*\S+/gi, '$1=[REDACTED]')
                .replace(/(https?:\/\/[^\s?#]+)\?[^\s]*/g, '$1?[REDACTED_QUERY]')
                .replace(/```/g, '`\u200b``');
            }

            const sections = [];
            for (const job of failedJobs) {
              try {
                const response = await github.request(
                  'GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',
                  { owner, repo, job_id: job.id },
                );
                const lines = sanitize(toText(response.data)).split(/\r?\n/);
                const excerpt = lines.slice(-160).join('\n').slice(-14000);
                sections.push(`#### ${job.name}\n\n\`\`\`text\n${excerpt}\n\`\`\``);
              } catch (error) {
                sections.push(
                  `#### ${job.name}\n\nLog download failed in the reporter: ${sanitize(String(error.message || error))}`,
                );
              }
            }

            const diagnostics = sections.length > 0
              ? sections.join('\n\n')
              : 'The workflow failed, but no failed job was returned by the Actions jobs API.';
            let body = `${marker}\n### HomePanel CI failure diagnostics\n\n` +
              `Workflow run: ${run.html_url}\n\n${diagnostics}`;
            if (body.length > 58000) {
              body = body.slice(0, 57500) + '\n\n…diagnostics truncated…';
            }

            for (const pull of pulls) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pull.number,
                per_page: 100,
              });
              const existing = comments.find((comment) => comment.body?.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pull.number,
                  body,
                });
              }
            }
