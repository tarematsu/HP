name: Apply Ohisama host follower fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-ohisama-follower-hotfix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch Ohisama host discovery
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path('worker/src/ohisama-collector-entry.js')
          source = source_path.read_text()
          old = '''  const hostSources = [
            station.host,
            channel.host,
            station.current_host,
            channel.current_host,
            station.broadcaster,
            station.dj,
            station.account,
            station.host_account,
          ].filter((value) => value && typeof value === 'object' && !Array.isArray(value));'''
          new = '''  const broadcastHosts = Array.isArray(station.broadcast?.broadcasters)
            ? station.broadcast.broadcasters.filter((value) => (
              value && typeof value === 'object' && !Array.isArray(value) && value.is_host !== false
            ))
            : [];
          const hostSources = [
            station.host,
            channel.host,
            station.current_host,
            channel.current_host,
            station.broadcaster,
            station.dj,
            station.account,
            station.host_account,
            station.owner,
            channel.owner,
            ...broadcastHosts,
          ].filter((value) => value && typeof value === 'object' && !Array.isArray(value));'''
          if old not in source:
              raise SystemExit('host source block not found')
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path('worker/tests/ohisama-collector.test.js')
          test = test_path.read_text()
          marker = "test('ohisama active host is permanently added to the follower target registry', async () => {"
          addition = '''test('ohisama normalization reads syndicated station owner and host broadcaster', () => {
            const value = normalizeOhisamaSnapshot({
              id: 322,
              alias: 'ohisama',
              current_station_id: 5290918,
              current_station: {
                id: 5290918,
                is_broadcasting: true,
                owner_id: 5298487,
                owner: { id: 5298487, handle: 'HinataPR0211' },
                broadcast: {
                  broadcasters: [
                    {
                      account_id: 5298487,
                      is_host: true,
                      account: { id: 5298487, handle: 'HinataPR0211' },
                    },
                  ],
                },
              },
            });
            assert.equal(value.host_account_id, 5298487);
            assert.equal(value.host_handle, 'hinatapr0211');
          });

          '''
          if marker not in test:
              raise SystemExit('test insertion marker not found')
          test_path.write_text(test.replace(marker, addition + marker, 1))
          PY

      - name: Test Ohisama follower discovery
        run: |
          npm --prefix worker ci --prefer-offline --no-audit --no-fund
          cd worker
          node --test tests/ohisama-collector.test.js tests/ohisama-collector-optimized.test.js tests/stationhead-daily-followers.test.js

      - name: Deploy Ohisama collector
        working-directory: worker
        run: node scripts/deploy-ohisama-collector.mjs

      - name: Load current follower model
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          if ! npx wrangler r2 object get "sh-pages-responses/pages-response/v1/followers.json" \
            --remote --file "$RUNNER_TEMP/followers-existing.json" >/dev/null 2>&1; then
            printf '%s' '{"handles":[],"rows":[]}' > "$RUNNER_TEMP/followers-existing.json"
          fi

      - name: Trigger Ohisama collection and provide R2 writer
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          worker_name="sh-ohisama-fix-${GITHUB_RUN_ID}"
          run_token="$(openssl rand -hex 24)"
          mkdir -p .ohisama-fix
          cat > .ohisama-fix/index.js <<'JS'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (request.headers.get('authorization') !== `Bearer ${env.RUN_TOKEN}`) {
                return new Response('unauthorized', { status: 401 });
              }
              if (url.pathname === '/run' && request.method === 'POST') {
                return env.OHISAMA.fetch('https://scheduler.internal/__internal/scheduled', {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({ cron: '*/5 * * * *', scheduled_time: Date.now() }),
                });
              }
              if (url.pathname === '/write-followers' && request.method === 'POST') {
                const body = await request.text();
                JSON.parse(body);
                const updatedAt = Number(request.headers.get('x-updated-at')) || Date.now();
                await env.PAGES_RESPONSE_R2.put('pages-response/v1/followers.json', body, {
                  httpMetadata: { contentType: 'application/json; charset=utf-8' },
                  customMetadata: {
                    version: '1',
                    status: '200',
                    headers_json: JSON.stringify({
                      'content-type': 'application/json; charset=utf-8',
                      'cache-control': 'public, max-age=30, s-maxage=300, stale-while-revalidate=600',
                    }),
                    updated_at: String(updatedAt),
                    cadence_seconds: '86400',
                  },
                });
                return Response.json({ ok: true, updated_at: updatedAt });
              }
              return new Response('not found', { status: 404 });
            },
          };
          JS
          cat > .ohisama-fix/wrangler.jsonc <<EOF
          {
            "name": "$worker_name",
            "main": "index.js",
            "compatibility_date": "2026-06-24",
            "workers_dev": true,
            "vars": { "RUN_TOKEN": "$run_token" },
            "services": [{ "binding": "OHISAMA", "service": "sh-ohisama-collector" }],
            "r2_buckets": [{ "binding": "PAGES_RESPONSE_R2", "bucket_name": "sh-pages-responses" }]
          }
          EOF
          npx wrangler deploy --config .ohisama-fix/wrangler.jsonc
          subdomain_json="$(curl --silent --show-error --fail \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          subdomain="$(printf '%s' "$subdomain_json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);if(!j?.success||!j?.result?.subdomain)process.exit(1);process.stdout.write(j.result.subdomain)})')"
          printf '%s' "$worker_name" > "$RUNNER_TEMP/fix-worker-name"
          printf '%s' "$run_token" > "$RUNNER_TEMP/fix-run-token"
          printf '%s' "$subdomain" > "$RUNNER_TEMP/fix-subdomain"
          curl --silent --show-error --fail --retry 10 --retry-delay 1 --retry-all-errors \
            -X POST "https://${worker_name}.${subdomain}.workers.dev/run" \
            -H "Authorization: Bearer $run_token" | tee "$RUNNER_TEMP/ohisama-trigger-result.json"
          echo

      - name: Resolve live Ohisama host and follower count
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { API_BASE, DEFAULT_USER_AGENT, STATIONHEAD_AUTH_PAGE_URL } from './src/collector-config.js';
          import { normalizeBearer } from './src/shared.js';

          const deviceUid = crypto.randomUUID();
          const headers = (token = '', guest = false) => ({
            accept: 'application/json, text/plain, */*',
            authorization: token ? `Bearer ${token}` : '',
            'app-platform': 'web',
            'app-version': '1.0.0',
            'content-type': 'application/json',
            origin: 'https://www.stationhead.com',
            referer: guest ? STATIONHEAD_AUTH_PAGE_URL : 'https://www.stationhead.com/',
            'sth-device-uid': deviceUid,
            'user-agent': DEFAULT_USER_AGENT,
          });
          const tokenRes = await fetch(`${API_BASE}/web/token`, { method: 'POST', headers: headers('', true), body: '' });
          const token = normalizeBearer(tokenRes.headers.get('authorization'));
          if (!tokenRes.ok || !token) throw new Error(`token ${tokenRes.status}`);
          const loginRes = await fetch(`${API_BASE}/web/guest/login`, { method: 'POST', headers: headers(token, true), body: '' });
          if (!loginRes.ok) throw new Error(`login ${loginRes.status}`);
          const verifyRes = await fetch(`${API_BASE}/station/handle/ilys/guest`, { method: 'POST', headers: headers(token, true), body: '' });
          if (!verifyRes.ok) throw new Error(`verify ${verifyRes.status}`);
          await verifyRes.arrayBuffer();
          const channelRes = await fetch(`${API_BASE}/channels/alias/ohisama`, { headers: headers(token) });
          if (!channelRes.ok) throw new Error(`channel ${channelRes.status}`);
          const payload = await channelRes.json();
          const station = payload?.current_station || {};
          const broadcaster = Array.isArray(station?.broadcast?.broadcasters)
            ? station.broadcast.broadcasters.find((item) => item?.is_host)?.account
            : null;
          const account = broadcaster || station.owner;
          const handle = String(account?.handle || '').trim().toLowerCase();
          const followers = Number(account?.followers);
          if (!handle || !Number.isInteger(followers) || followers < 0) throw new Error('live Ohisama host/followers missing');
          const out = { handle, followers, account_id: Number(account?.id || account?.account_id || 0) || null, observed_at: Date.now() };
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/ohisama-host.json`, JSON.stringify(out));
          console.log(`OHISAMA_HOST handle=${handle} followers=${followers}`);
          NODE

      - name: Refresh today's follower snapshot
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/ohisama-host.json" "$RUNNER_TEMP/followers-existing.json" <<'NODE'
          const fs = require('node:fs');
          const host = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          let model = { handles: [], rows: [] };
          try { model = JSON.parse(fs.readFileSync(process.argv[3], 'utf8')); } catch {}
          const date = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
          const offset = (days) => new Date(Date.parse(`${date}T00:00:00Z`) + days * 86400000).toISOString().slice(0, 10);
          const handles = [...new Set([...(Array.isArray(model.handles) ? model.handles : []), host.handle])];
          const rowsByDate = new Map((Array.isArray(model.rows) ? model.rows : []).filter((r) => /^\d{4}-\d{2}-\d{2}$/.test(String(r?.date || ''))).map((r) => [r.date, { ...r }]));
          rowsByDate.set(date, { ...(rowsByDate.get(date) || { date }), [host.handle]: host.followers, date });
          const rows = [...rowsByDate.values()].sort((a, b) => a.date.localeCompare(b.date));
          const rowMap = new Map(rows.map((r) => [r.date, r]));
          const current = rowMap.get(date) || {};
          const previous = rowMap.get(offset(-1)) || {};
          const previousWeek = rowMap.get(offset(-7)) || {};
          const integer = (v) => Number.isInteger(Number(v)) && Number(v) >= 0 ? Number(v) : null;
          const accounts = handles.map((handle) => {
            const followers = integer(current[handle]);
            const day = integer(previous[handle]);
            const week = integer(previousWeek[handle]);
            return {
              handle,
              followers,
              previous_day_delta: followers != null && day != null ? followers - day : null,
              previous_week_delta: followers != null && week != null ? followers - week : null,
            };
          });
          const now = Date.now();
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/followers-next.json`, JSON.stringify({
            ...model,
            ok: true,
            updated_at: now,
            latest_date: date,
            handles,
            rows,
            accounts,
            failures: Array.isArray(model.failures) ? model.failures : [],
          }));
          const q = (v) => `'${String(v).replaceAll("'", "''")}'`;
          const path = `$."${host.handle.replaceAll('"', '\\"')}"`;
          const sql = `INSERT INTO sh_stationhead_daily_followers_v2(observed_date_jst,scheduled_at,collected_at,followers_json,failures_json) VALUES(${q(date)},${now},${now},${q(JSON.stringify({[host.handle]:host.followers}))},'[]') ON CONFLICT(observed_date_jst) DO UPDATE SET collected_at=excluded.collected_at,followers_json=json_set(COALESCE(sh_stationhead_daily_followers_v2.followers_json,'{}'),${q(path)},${host.followers});\n`;
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/ohisama-follower-upsert.sql`, sql);
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/followers-updated-at`, String(now));
          NODE
          npx wrangler d1 execute OTHER_DB --config wrangler.ohisama-collector.jsonc --remote --yes \
            --file "$RUNNER_TEMP/ohisama-follower-upsert.sql"
          worker_name="$(cat "$RUNNER_TEMP/fix-worker-name")"
          run_token="$(cat "$RUNNER_TEMP/fix-run-token")"
          subdomain="$(cat "$RUNNER_TEMP/fix-subdomain")"
          updated_at="$(cat "$RUNNER_TEMP/followers-updated-at")"
          curl --silent --show-error --fail \
            -X POST "https://${worker_name}.${subdomain}.workers.dev/write-followers" \
            -H "Authorization: Bearer $run_token" \
            -H "X-Updated-At: $updated_at" \
            -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/followers-next.json"
          echo

      - name: Verify target and follower snapshot
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          handle="$(node -e 'const fs=require("node:fs");process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1],"utf8")).handle)' "$RUNNER_TEMP/ohisama-host.json")"
          npx wrangler d1 execute OTHER_DB --config wrangler.ohisama-collector.jsonc --remote --json \
            --command "SELECT handle,source_mask FROM sh_stationhead_follower_targets WHERE handle='${handle}' AND (source_mask & 4)<>0 LIMIT 1" \
            > "$RUNNER_TEMP/ohisama-target-verify.json"
          npx wrangler d1 execute OTHER_DB --config wrangler.ohisama-collector.jsonc --remote --json \
            --command "SELECT observed_date_jst,followers_json FROM sh_stationhead_daily_followers_v2 ORDER BY observed_date_jst DESC LIMIT 1" \
            > "$RUNNER_TEMP/ohisama-follower-verify.json"
          npx wrangler r2 object get "sh-pages-responses/pages-response/v1/followers.json" \
            --remote --file "$RUNNER_TEMP/followers-r2-verify.json" >/dev/null
          node - "$RUNNER_TEMP/ohisama-host.json" "$RUNNER_TEMP/ohisama-target-verify.json" "$RUNNER_TEMP/ohisama-follower-verify.json" "$RUNNER_TEMP/followers-r2-verify.json" <<'NODE'
          const fs = require('node:fs');
          const host = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const target = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'))?.[0]?.results?.[0];
          const d1 = JSON.parse(fs.readFileSync(process.argv[4], 'utf8'))?.[0]?.results?.[0];
          const r2 = JSON.parse(fs.readFileSync(process.argv[5], 'utf8'));
          const today = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
          if (target?.handle !== host.handle || (Number(target?.source_mask || 0) & 4) === 0) throw new Error('Ohisama follower target missing');
          const d1Followers = JSON.parse(d1?.followers_json || '{}');
          if (d1?.observed_date_jst !== today || Number(d1Followers[host.handle]) !== host.followers) throw new Error('D1 follower snapshot missing Ohisama host');
          const todayRow = (r2?.rows || []).find((row) => row?.date === today);
          if (r2?.latest_date !== today || Number(todayRow?.[host.handle]) !== host.followers) throw new Error('R2 follower model missing Ohisama host');
          console.log(`OHISAMA_FOLLOWER_FIX_OK handle=${host.handle} followers=${host.followers} source_mask=${target.source_mask}`);
          NODE

      - name: Cleanup temporary Worker
        if: always()
        working-directory: worker
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/fix-worker-name" ]]; then
            npx wrangler delete "$(cat "$RUNNER_TEMP/fix-worker-name")" --force >/dev/null 2>&1 || true
          fi

      - name: Commit permanent fix and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/ohisama-collector-entry.js worker/tests/ohisama-collector.test.js
          git rm -f .github/workflows/apply-ohisama-follower-hotfix.yml .github/workflows/probe-ohisama-follower-target.yml
          git commit -m "Fix Ohisama host follower discovery"
          git push origin HEAD:main
