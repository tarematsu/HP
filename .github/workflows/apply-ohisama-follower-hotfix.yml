name: Diagnose Ohisama host payload

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-ohisama-follower-hotfix.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect public channel payload structure
        working-directory: worker
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import { API_BASE, DEFAULT_USER_AGENT, STATIONHEAD_AUTH_PAGE_URL } from './src/collector-config.js';
          import { normalizeBearer } from './src/shared.js';

          const deviceUid = crypto.randomUUID();
          const headers = (token = '', guest = false) => ({
            accept: 'application/json, text/plain, */*',
            'accept-language': 'ja,en-US;q=0.9,en;q=0.8',
            authorization: token ? `Bearer ${token}` : '',
            'app-platform': 'web',
            'app-version': '1.0.0',
            'content-type': 'application/json',
            origin: 'https://www.stationhead.com',
            referer: guest ? STATIONHEAD_AUTH_PAGE_URL : 'https://www.stationhead.com/',
            'sth-device-uid': deviceUid,
            'user-agent': DEFAULT_USER_AGENT,
          });
          const tokenRes = await fetch(`${API_BASE}/web/token`, { method: 'POST', headers: headers('', true), body: '' });
          const token = normalizeBearer(tokenRes.headers.get('authorization'));
          if (!tokenRes.ok || !token) throw new Error(`token ${tokenRes.status}`);
          const loginRes = await fetch(`${API_BASE}/web/guest/login`, { method: 'POST', headers: headers(token, true), body: '' });
          if (!loginRes.ok) throw new Error(`login ${loginRes.status}`);
          const verifyRes = await fetch(`${API_BASE}/station/handle/ilys/guest`, { method: 'POST', headers: headers(token, true), body: '' });
          if (!verifyRes.ok) throw new Error(`verify ${verifyRes.status}`);
          await verifyRes.arrayBuffer();
          const channelRes = await fetch(`${API_BASE}/channels/alias/ohisama`, { headers: headers(token, false) });
          if (!channelRes.ok) throw new Error(`channel ${channelRes.status}`);
          const payload = await channelRes.json();

          const structural = [];
          const hints = [];
          const interesting = /host|handle|broad|dj|station|account|owner|user|syndicat|creator|source/i;
          function walk(value, path = '$', depth = 0) {
            if (!value || typeof value !== 'object' || depth > 6) return;
            if (Array.isArray(value)) {
              structural.push({ path, type: 'array', length: value.length });
              for (let i = 0; i < Math.min(value.length, 3); i += 1) walk(value[i], `${path}[${i}]`, depth + 1);
              return;
            }
            const keys = Object.keys(value);
            if (depth <= 4 || interesting.test(path) || keys.some((key) => interesting.test(key))) {
              structural.push({ path, keys });
            }
            for (const [key, child] of Object.entries(value)) {
              const childPath = `${path}.${key}`;
              if (child == null || ['string', 'number', 'boolean'].includes(typeof child)) {
                if (interesting.test(key) || interesting.test(path)) hints.push({ path: childPath, value: child });
              } else {
                walk(child, childPath, depth + 1);
              }
            }
          }
          walk(payload);
          console.log('OHISAMA_STRUCTURE', JSON.stringify(structural));
          console.log('OHISAMA_IDENTITY_HINTS', JSON.stringify(hints));
          NODE
