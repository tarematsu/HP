name: Pages visual audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-visual-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compare Nogizaka official list URL variants
        shell: bash
        run: |
          set -euo pipefail
          ua='stationhead-monitor/1.0'
          for suffix in '' '?dy=20' '?dy=44' '?ima=0000' '?dy=20&ima=0000'; do
            file="/tmp/list$(printf '%s' "$suffix" | tr '?&=' '___').html"
            curl --fail --silent --show-error -A "$ua" -H 'Accept: text/html,application/xhtml+xml' "https://www.nogizaka46.com/s/n46/news/list${suffix}" -o "$file"
            echo "=== ${suffix:-default} bytes=$(wc -c <"$file") details=$(grep -Eo '/s/n46/news/detail/[0-9]+' "$file" | wc -l) ==="
            grep -Eo '/s/n46/news/detail/[0-9]+' "$file" | head -10 || true
            grep -q '102280' "$file" && echo 'HAS_102280=yes' || echo 'HAS_102280=no'
            grep -Eiq 'stationhead' "$file" && echo 'HAS_STATIONHEAD=yes' || echo 'HAS_STATIONHEAD=no'
          done
          exit 1
