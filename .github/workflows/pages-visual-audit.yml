name: Pages visual audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-pages-visual-audit.mjs'
      - 'scripts/pages-data-audit.mjs'
      - 'tests/pages-data-audit.test.mjs'
      - 'tests/pages-visual-audit-navigation.test.mjs'
      - '.github/workflows/pages-visual-audit.yml'
  pull_request:
    paths:
      - 'scripts/capture-pages-visual-audit.mjs'
      - 'scripts/pages-data-audit.mjs'
      - 'tests/pages-data-audit.test.mjs'
      - '.github/workflows/pages-visual-audit.yml'
  workflow_run:
    workflows: [Deploy production, Refresh Amazon Music read model, Rebuild Ohisama Track History, Recollect regional music manually]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: pages-visual-audit-${{ github.ref }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.run_id || 'production' }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.54.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture production Pages screenshots
        run: >-
          node scripts/capture-pages-visual-audit.mjs
          --url=https://skrzk.pages.dev
          --out=.pages-visual-audit

      # Keep the report at the canonical artifact name, and split full-page
      # screenshots by viewport so each artifact remains practical to download
      # and inspect even when service tables become very tall.
      - name: Upload visual audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-visual-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .pages-visual-audit/report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-visual-audit-${{ github.run_id }}-${{ github.run_attempt }}-desktop
          path: .pages-visual-audit/desktop-*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tablet screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-visual-audit-${{ github.run_id }}-${{ github.run_attempt }}-tablet
          path: .pages-visual-audit/tablet-*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-visual-audit-${{ github.run_id }}-${{ github.run_attempt }}-mobile
          path: |
            .pages-visual-audit/mobile-*.png
            !.pages-visual-audit/mobile-compact-*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Upload compact-mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-visual-audit-${{ github.run_id }}-${{ github.run_attempt }}-mobile-compact
          path: .pages-visual-audit/mobile-compact-*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  browser-regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: site
      - run: npm run assets:build
        working-directory: site
      - run: npx playwright install --with-deps chromium
      - name: Check responsive navigation with isolated API fixtures
        run: node site/scripts/check-pages-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-visual-audit-browser-regression
          path: site/artifacts/browser/
          if-no-files-found: error
          retention-days: 14

