name: Pages visual audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-visual-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Query production Nogizaka announcement rows
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute stationhead-other --remote --yes --json --command "SELECT id,news_id,published_date,title,event_name,scheduled_at,detected_at,updated_at,status FROM sh_nogizaka_official_news_announcements WHERE news_id='102280' OR title LIKE '%STATIONHEAD%' ORDER BY id DESC LIMIT 20"
          echo '--- monitor state ---'
          npx wrangler d1 execute stationhead-other --remote --yes --json --command "SELECT id,last_check_at,last_success_at,last_error,updated_at FROM sh_official_news_monitor_state WHERE id='official-news:nogizaka46smej'"
          exit 1
