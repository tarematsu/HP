name: Pages visual audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-visual-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Cloudflare account context
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Install Pages dependencies
        if: github.event_name == 'pull_request'
        working-directory: site
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Deploy visual-audit preview
        if: github.event_name == 'pull_request'
        id: preview
        shell: bash
        working-directory: site
        env:
          PREVIEW_BRANCH: visual-audit-pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          npx wrangler pages deploy public \
            --project-name skrzk \
            --branch "$PREVIEW_BRANCH" \
            2>&1 | tee pages-visual-audit-deploy.log
          preview_url="$(grep -Eo 'https://[[:alnum:]-]+\.skrzk\.pages\.dev' pages-visual-audit-deploy.log | head -n 1 || true)"
          if [[ -z "$preview_url" ]]; then
            echo 'Could not resolve Pages preview URL.' >&2
            exit 1
          fi
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Install Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.54.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture every tab at four viewport sizes
        env:
          TARGET_URL: ${{ github.event_name == 'pull_request' && steps.preview.outputs.url || 'https://skrzk.pages.dev' }}
        run: >-
          node scripts/capture-pages-visual-audit.mjs
          --url="$TARGET_URL"
          --out=.pages-visual-audit

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-visual-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .pages-visual-audit/
            site/pages-visual-audit-deploy.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
