name: Pages visual audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-visual-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Nogizaka official news JSON API
        shell: bash
        run: |
          set -euo pipefail
          ua='stationhead-monitor/1.0'
          curl --fail --silent --show-error -A "$ua" -H 'Accept: application/json' 'https://www.nogizaka46.com/s/n46/api/list/news_v2?rw=400' -o /tmp/news.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/news.json',encoding='utf-8'))
          print(type(data).__name__)
          if isinstance(data, dict):
              print('keys=', sorted(data.keys()))
              for key, value in data.items():
                  if isinstance(value, list):
                      print('list_key=', key, 'count=', len(value))
                      for item in value[:3]: print(json.dumps(item, ensure_ascii=False)[:1500])
                      for item in value:
                          if '102280' in json.dumps(item, ensure_ascii=False):
                              print('MATCH_102280=', json.dumps(item, ensure_ascii=False)[:3000])
                              break
          elif isinstance(data, list):
              print('count=', len(data))
              for item in data[:3]: print(json.dumps(item, ensure_ascii=False)[:1500])
              for item in data:
                  if '102280' in json.dumps(item, ensure_ascii=False):
                      print('MATCH_102280=', json.dumps(item, ensure_ascii=False)[:3000])
                      break
          PY
          exit 1
