name: Pages visual audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-visual-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Nogizaka news page internals
        shell: bash
        run: |
          set -euo pipefail
          ua='stationhead-monitor/1.0'
          curl --fail --silent --show-error -A "$ua" -H 'Accept: text/html,application/xhtml+xml' 'https://www.nogizaka46.com/s/n46/news/list' -o /tmp/list.html
          echo '--- relevant html ---'
          grep -Ei 'news|ajax|api|json|script' /tmp/list.html | head -120 || true
          echo '--- script srcs ---'
          python3 - <<'PY'
          import re
          html=open('/tmp/list.html',encoding='utf-8').read()
          for src in sorted(set(re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+)["\']', html, re.I))):
              print(src)
          PY
          exit 1
