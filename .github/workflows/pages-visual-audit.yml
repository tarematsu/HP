name: Pages visual audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-visual-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets['CLOUDFLARE_API_TOKEN'] || secrets['CF_API_TOKEN'] || secrets['CLOUDFLARE_BUILDS_API_TOKEN'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Cloudflare account context
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Install Pages deployment dependencies
        if: github.event_name == 'pull_request'
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: site

      - name: Build optimized Pages assets
        if: github.event_name == 'pull_request'
        run: npm run assets:build
        working-directory: site

      - name: Deploy pull request Pages preview
        if: github.event_name == 'pull_request'
        id: preview
        shell: bash
        working-directory: site
        env:
          PREVIEW_BRANCH: visual-pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          npx wrangler pages deploy public \
            --project-name skrzk \
            --branch "$PREVIEW_BRANCH" \
            2>&1 | tee pages-visual-preview-deploy.log
          preview_url="$(grep -Eo 'https://[[:alnum:]-]+\.skrzk\.pages\.dev' pages-visual-preview-deploy.log | head -n 1 || true)"
          if [[ -z "$preview_url" ]]; then
            echo 'Could not find the deployed Pages preview URL in Wrangler output.' >&2
            exit 1
          fi
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Install Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.54.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture Pages at every tab and viewport size
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          target_url="https://skrzk.pages.dev"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            target_url="${PREVIEW_URL}"
          fi
          node scripts/capture-pages-visual-audit.mjs \
            --url="$target_url" \
            --out=.pages-visual-audit

      - name: Upload visual audit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-visual-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: .pages-visual-audit/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
