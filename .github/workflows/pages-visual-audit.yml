name: Pages visual audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-visual-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect Nogizaka official HTML with production headers
        shell: bash
        run: |
          set -euo pipefail
          ua='stationhead-monitor/1.0'
          curl --fail --silent --show-error -A "$ua" -H 'Accept: text/html,application/xhtml+xml' 'https://www.nogizaka46.com/s/n46/news/list' -o /tmp/list.html
          curl --fail --silent --show-error -A "$ua" -H 'Accept: text/html,application/xhtml+xml' 'https://www.nogizaka46.com/s/n46/news/detail/102280' -o /tmp/detail.html
          echo "list_bytes=$(wc -c </tmp/list.html) detail_bytes=$(wc -c </tmp/detail.html)"
          echo '--- list matches ---'
          grep -Eio '.{0,120}(102280|STATIONHEAD).{0,180}' /tmp/list.html | head -20 || true
          echo '--- detail matches ---'
          grep -Eio '.{0,120}(2026年9月30日|21:30|STATIONHEAD).{0,180}' /tmp/detail.html | head -30 || true
          echo '--- href forms ---'
          grep -Eo 'href=["'"'][^"'"']*102280[^"'"']*["'"']' /tmp/list.html | head -10 || true
          exit 1
