name: Pages visual audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Inspect Nogizaka production D1
        working-directory: worker
        run: |
          set -euo pipefail
          npx wrangler d1 execute stationhead-other --remote \
            --config wrangler.nogizaka46smej.jsonc \
            --command "SELECT news_id,scheduled_at,status,detected_at,updated_at FROM sh_nogizaka_official_news_announcements WHERE news_id='102280'; SELECT last_check_at,last_success_at,last_error,updated_at FROM sh_official_news_monitor_state WHERE id='official-news:nogizaka46smej';" \
            --json
