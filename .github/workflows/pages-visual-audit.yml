    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Nogizaka production status
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H 'Accept: application/json' \
            'https://skrzk.pages.dev/api/nogizaka46smej-status'
