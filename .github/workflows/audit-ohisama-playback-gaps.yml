name: Audit Ohisama playback gaps

on:
  push:
    branches:
      - codex/pages-design-resource-layout
    paths:
      - '.github/workflows/audit-ohisama-playback-gaps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      OHISAMA_DATABASE_NAME: stationhead-ohisama
      OHISAMA_PLAYBACK_AUDIT_START: '2026-10-01'
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Audit stored Ohisama playback sequence
        run: node scripts/audit-ohisama-playback-actions.mjs
