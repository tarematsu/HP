name: Collect regional music to R2
on:
  schedule:
    - cron: '0 15 * * *' # 00:00 JST; QQ/NetEase daily, others Mondays
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regional-music-r2-collection
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Collect due services into R2 snapshots
        working-directory: worker
        run: node scripts/collect-regional-r2-actions.mjs
