name: Locate Kuwo Japanese chart volume 215
on:
  push:
    branches: [research/kuwo-jp-chart-probe]
    paths: [.github/workflows/kuwo-jp-find-volume-215.yml]
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Scan nearby bangid values
        shell: bash
        run: |
          python3 <<'PY'
          import concurrent.futures,json,urllib.parse,urllib.request
          base='https://kbangserver.kuwo.cn/ksong.s'
          common={'from':'pc','fmt':'json','pn':'0','rn':'1','type':'bang','data':'content','id':'183','show_copyright_off':'0','pcmp4':'1','isbang':'1','userid':'0'}
          def probe(bid):
            u=base+'?'+urllib.parse.urlencode({**common,'bangid':str(bid)})
            try:
              q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://m.kuwo.cn/'})
              with urllib.request.urlopen(q,timeout=4) as r:j=json.loads(r.read().decode('utf-8','replace'))
              cv=j.get('currentVolume'); rows=j.get('musiclist') or j.get('musicList') or []
              return bid,cv,j.get('pub'),[(x.get('name'),x.get('artist')) for x in rows[:1]]
            except Exception as e:return bid,None,None,[]
          found=[]
          # Previous entries usually differ by ~70-80 global IDs; use a bounded 200-ID window.
          ids=list(range(268168,268368))
          with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
            for bid,cv,pub,top in ex.map(probe,ids):
              if cv and cv!='2026|275':
                found.append((bid,cv,pub,top));print('MATCH',bid,cv,pub,json.dumps(top,ensure_ascii=False))
          print('FOUND',len(found),json.dumps(found,ensure_ascii=False))
          PY
