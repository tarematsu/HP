name: Audit sakuramankai v3

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/audit-sakuramankai-v3.yml'
      - 'worker/scripts/audit-sakuramankai-v3.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      OTHER_DATABASE_NAME: stationhead-other
      TEST_ID: sakuramankai-20260921-5m-v3
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Audit five-minute sakuramankai collection
        run: node scripts/audit-sakuramankai-v3.mjs
