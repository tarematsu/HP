name: Repair Spotify historical delta outliers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/scripts/repair-spotify-delta-history-actions.mjs'
      - '.github/workflows/repair-spotify-delta-history.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: spotify-delta-history-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[repair-spotify-history]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for production pipeline
        working-directory: worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-production-deploy.mjs
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Re-finalize only anomalous Spotify history dates
        id: repair
        working-directory: worker
        run: node scripts/repair-spotify-delta-history-actions.mjs
      - name: Republish Spotify Pages read model
        if: steps.repair.outputs.repaired == 'true'
        working-directory: worker
        run: node scripts/bootstrap-spotify-read-model.mjs
      - name: Wait for public API cache to expire
        if: steps.repair.outputs.repaired == 'true'
        run: sleep 360
      - name: Capture post-repair production screenshots
        if: steps.repair.outputs.repaired == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-visual-audit.yml --ref main
