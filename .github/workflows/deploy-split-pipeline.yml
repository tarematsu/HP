name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - 'database/facts-db.json'
      - 'database/facts-migrations/**'
      - 'worker/src/**'
      - 'worker/scripts/**'
      - 'worker/wrangler*.jsonc'
      - 'worker/package.json'
      - 'worker/package-lock.json'
      - 'site/functions/**'
      - 'site/public/**'
      - 'site/wrangler.jsonc'
      - 'site/package.json'
      - 'site/package-lock.json'
      - 'packages/sh-shared/**'
      - '.github/workflows/database.yml'
      - '.github/workflows/deploy-split-pipeline.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        default: all
        options:
          - all
          - pages
          - workers
          - sakurazaka46jp
          - buddies-collector
          - runtime

permissions:
  contents: read

concurrency:
  group: deploy-production-minute-db-v2-generation-3
  cancel-in-progress: false

jobs:
  select:
    name: Select deployment targets
    runs-on: ubuntu-latest
    outputs:
      minute_db: ${{ steps.targets.outputs.minute_db }}
      pages: ${{ steps.targets.outputs.pages }}
      workers: ${{ steps.targets.outputs.workers }}
      commands: ${{ steps.targets.outputs.commands }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select migrations, Pages, and Worker deployments
        id: targets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target || 'all' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          minute_db=false
          pages=false

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            case "$TARGET" in
              all)
                minute_db=true
                pages=true
                selection="$(node worker/scripts/select-worker-deploys.mjs --all)"
                ;;
              pages)
                pages=true
                selection='{"workers":[],"commands":[]}'
                ;;
              workers)
                minute_db=true
                selection="$(node worker/scripts/select-worker-deploys.mjs --all)"
                ;;
              sakurazaka46jp)
                selection='{"workers":["sh-sakurazaka46jp"],"commands":["deploy:sakurazaka46jp"]}'
                ;;
              buddies-collector)
                selection='{"workers":["sh-buddies-recovery","sh-buddies-collector"],"commands":["deploy:buddies-recovery","deploy:buddies-collector"]}'
                ;;
              runtime)
                minute_db=true
                selection='{"workers":["sh-runtime-orchestrator"],"commands":["deploy:runtime"]}'
                ;;
              *)
                echo "Unsupported deployment target: $TARGET" >&2
                exit 1
                ;;
            esac
          else
            if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              changed_files="$(git ls-files)"
            else
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
            fi
            printf '%s\n' "$changed_files" | tee changed-files.txt
            if grep -Eq '^(database/facts-db\.json$|database/facts-migrations/|worker/scripts/(provision-facts-db|provision-current-facts-db|apply-facts-pr-schema)\.mjs$|\.github/workflows/database\.yml$)' changed-files.txt; then
              minute_db=true
            fi
            if grep -Eq '^(site/(functions|public)/|site/wrangler\.jsonc$|site/package(-lock)?\.json$|packages/sh-shared/|\.github/scripts/resolve-pages-production-branch\.mjs$|\.github/workflows/deploy-split-pipeline\.yml$)' changed-files.txt; then
              pages=true
            fi
            selection="$(node worker/scripts/select-worker-deploys.mjs < changed-files.txt)"
          fi

          if jq -e '.workers | index("sh-runtime-orchestrator") != null' <<<"$selection" >/dev/null; then
            pages=true
          fi

          echo "$selection" | jq .
          workers_json="$(jq -c '.workers' <<<"$selection")"
          commands_json="$(jq -c '.commands' <<<"$selection")"
          echo "minute_db=$minute_db" >> "$GITHUB_OUTPUT"
          echo "pages=$pages" >> "$GITHUB_OUTPUT"
          echo "workers=$workers_json" >> "$GITHUB_OUTPUT"
          echo "commands=$commands_json" >> "$GITHUB_OUTPUT"
          deployment_targets="$(jq -cn \
            --argjson minute_db "$minute_db" \
            --argjson pages "$pages" \
            --argjson workers "$workers_json" \
            --argjson commands "$commands_json" \
            '{minute_db:$minute_db,pages:$pages,workers:$workers,commands:$commands}')"
          echo "DEPLOYMENT_TARGETS_JSON=$deployment_targets"

  minute_db:
    name: Apply MINUTE_DB migrations before deployment
    needs: select
    if: needs.select.outputs.minute_db == 'true'
    uses: ./.github/workflows/database.yml
    with:
      operation: minute-db
      base_sha: ${{ github.event.before || '' }}
      head_sha: ${{ github.sha }}
    secrets: inherit

  workers:
    name: Deploy affected Workers
    needs: [select, minute_db]
    if: >-
      always()
      && needs.select.result == 'success'
      && (needs.minute_db.result == 'success' || needs.minute_db.result == 'skipped')
      && needs.select.outputs.workers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets['CLOUDFLARE_API_TOKEN'] || secrets['CF_API_TOKEN'] || secrets['CLOUDFLARE_BUILDS_API_TOKEN'] }}
      DEPLOY_COMMANDS: ${{ needs.select.outputs.commands }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Restore Worker deployment dependencies
        id: worker-modules
        uses: actions/cache@v4
        with:
          path: worker/node_modules
          key: ${{ runner.os }}-node22-worker-deploy-${{ hashFiles('worker/package-lock.json', 'packages/sh-shared/**') }}
      - name: Install Worker dependencies
        if: steps.worker-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: worker
      - name: Ensure queues
        working-directory: worker
        shell: bash
        run: |
          for queue in \
            stationhead-raw-collection stationhead-raw-collection-dlq \
            stationhead-buddies-persist stationhead-buddies-persist-dlq \
            stationhead-ingest-finalize stationhead-ingest-finalize-dlq \
            stationhead-comments stationhead-comments-dlq \
            stationhead-read-model stationhead-read-model-dlq \
            stationhead-track-metadata stationhead-track-metadata-dlq \
            stationhead-buddies-facts stationhead-buddies-facts-dlq \
            stationhead-minute-derive stationhead-minute-derive-dlq \
            stationhead-minute-live-derive stationhead-minute-live-derive-dlq \
            stationhead-minute-enrichment stationhead-minute-enrichment-dlq \
            stationhead-host-monitor stationhead-host-monitor-dlq \
            stationhead-sakurazaka46jp stationhead-sakurazaka46jp-dlq \
            stationhead-pages-read-model-publication stationhead-pages-read-model-publication-dlq
          do
            npx wrangler queues create "$queue" >/dev/null 2>&1 || true
          done
      - name: Deploy selected Workers in dependency order
        shell: bash
        working-directory: worker
        run: |
          set -euo pipefail
          : > worker-deployment.log
          while IFS= read -r command; do
            echo "Deploying $command" | tee -a worker-deployment.log
            npm run "$command" 2>&1 | tee -a worker-deployment.log
          done < <(jq -r '.[]' <<<"$DEPLOY_COMMANDS")
      - name: Upload Worker deployment failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: worker-deployment-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker/worker-deployment.log
          if-no-files-found: error
          retention-days: 7

  pages:
    name: Build and deploy Pages
    needs: [select, minute_db, workers]
    if: >-
      always()
      && needs.select.result == 'success'
      && (needs.minute_db.result == 'success' || needs.minute_db.result == 'skipped')
      && needs.select.outputs.pages == 'true'
      && (needs.workers.result == 'success' || needs.workers.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets['CLOUDFLARE_API_TOKEN'] || secrets['CF_API_TOKEN'] || secrets['CLOUDFLARE_BUILDS_API_TOKEN'] }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Restore Pages deployment dependencies
        id: pages-modules
        uses: actions/cache@v4
        with:
          path: site/node_modules
          key: ${{ runner.os }}-node22-pages-deploy-${{ hashFiles('site/package-lock.json') }}
      - name: Install Pages dependencies
        if: steps.pages-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: site
      - name: Check Pages source
        run: npm run check
        working-directory: site
      - name: Resolve Pages production branch
        id: pages-project
        run: node .github/scripts/resolve-pages-production-branch.mjs skrzk
      - name: Deploy Pages from GitHub Actions
        run: >-
          npx wrangler pages deploy public
          --project-name skrzk
          --branch "${{ steps.pages-project.outputs.production_branch }}"
        working-directory: site
      - name: Retire legacy Pages-bound Worker after binding cutover
        run: >-
          node --input-type=module -e
          "const { pruneRetiredWorkers } = await import('./worker/scripts/cloudflare-workers.mjs');
          await pruneRetiredWorkers(['sh-minute-enrichment']);"
