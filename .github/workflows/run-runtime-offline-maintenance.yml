name: Run runtime offline maintenance

on:
  workflow_run:
    # Legacy cycle intentionally removed: workflows: ["Deploy production", "Rebuild pages read models"]
    workflows: ["Deploy production"]
    types: [completed]
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-runtime-offline-maintenance.yml'
      - 'scripts/cloudflare-d1-write-guard.mjs'
      - 'worker/scripts/publish-recent-daily-summaries-actions.mjs'
      - 'worker/scripts/run-minute-facts-gap-scan-actions.mjs'
      - 'worker/scripts/run-runtime-offline-maintenance-actions.mjs'
      - 'worker/scripts/remote-d1-adapter.mjs'
      - 'worker/src/recent-daily-summary-publication.js'
      - 'worker/src/runtime-**'
      - 'worker/src/minute-**'
      - 'worker/src/rollup-**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: runtime-offline-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      BUDDIES_DATABASE_NAME: stationhead-buddies
      FACTS_DATABASE_NAME: stationhead-minute
      OTHER_DATABASE_NAME: stationhead-other
      RUNTIME_MAINTENANCE_DEADLINE_MS: '720000'
      D1_ACTIONS_WRITE_ROWS_PER_HOUR_LIMIT: '4000'
      # Reserve 750k daily rows for higher-priority read-model publication.
      D1_ACTIONS_READ_ROWS_PER_DAY_LIMIT: '2750000'
      D1_ACTIONS_READ_PROJECTION_MINUTES: '60'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Check D1 Actions read and write budgets
        id: d1-budget
        run: node ../scripts/cloudflare-d1-write-guard.mjs
      - name: Summarize D1 budget decision
        if: always()
        shell: bash
        run: |
          {
            echo "### D1 Actions budget"
            echo "- Decision: ${{ steps.d1-budget.outputs.reason }}"
            echo "- UTC-day reads: ${{ steps.d1-budget.outputs.rows_read }} / ${{ steps.d1-budget.outputs.read_limit }}"
            echo "- Projected UTC-day reads: ${{ steps.d1-budget.outputs.projected_rows_read }} / ${{ steps.d1-budget.outputs.read_limit }}"
            echo "- Hourly writes: ${{ steps.d1-budget.outputs.rows_written }} / ${{ steps.d1-budget.outputs.limit }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Capture Pages source revisions before maintenance
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$OTHER_DATABASE_NAME" --remote --json --command \
            "SELECT model_key,revision FROM sh_read_model_revision WHERE model_key IN ('history:daily','history:weekly','history:monthly','history:broadcasts','host-history:summary') ORDER BY model_key" \
            > pages-revisions-before.json
      - name: Scan minute-fact gaps, publish summaries, then run budget-aware maintenance
        shell: bash
        env:
          RUNTIME_MAINTENANCE_D1_ALLOWED: ${{ steps.d1-budget.outputs.allowed }}
          RUNTIME_MAINTENANCE_D1_SKIP_REASON: ${{ steps.d1-budget.outputs.reason }}
          RUNTIME_MAINTENANCE_D1_ROWS_READ: ${{ steps.d1-budget.outputs.rows_read }}
          RUNTIME_MAINTENANCE_D1_PROJECTED_ROWS_READ: ${{ steps.d1-budget.outputs.projected_rows_read }}
          RUNTIME_MAINTENANCE_D1_READ_LIMIT: ${{ steps.d1-budget.outputs.read_limit }}
          RUNTIME_MAINTENANCE_D1_ROWS_WRITTEN: ${{ steps.d1-budget.outputs.rows_written }}
          RUNTIME_MAINTENANCE_D1_WRITE_LIMIT: ${{ steps.d1-budget.outputs.limit }}
        run: |
          set -o pipefail
          if [[ "$RUNTIME_MAINTENANCE_D1_ALLOWED" == 'true' ]]; then
            node scripts/run-minute-facts-gap-scan-actions.mjs 2>&1 | tee runtime-offline-maintenance.log
          else
            echo "Minute-fact gap scan deferred by D1 budget guard." | tee runtime-offline-maintenance.log
          fi
          node scripts/publish-recent-daily-summaries-actions.mjs 2>&1 | tee -a runtime-offline-maintenance.log
          node scripts/run-runtime-offline-maintenance-actions.mjs 2>&1 | tee -a runtime-offline-maintenance.log
      - name: Detect changed Pages source revisions
        id: pages-revision-diff
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute "$OTHER_DATABASE_NAME" --remote --json --command \
            "SELECT model_key,revision FROM sh_read_model_revision WHERE model_key IN ('history:daily','history:weekly','history:monthly','history:broadcasts','host-history:summary') ORDER BY model_key" \
            > pages-revisions-after.json
          due_keys="$(node - <<'NODE'
          const fs = require('node:fs');
          function rows(path) {
            const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
            const blocks = Array.isArray(payload) ? payload : [payload];
            return blocks.flatMap((block) => Array.isArray(block?.results) ? block.results : []);
          }
          const before = new Map(rows('pages-revisions-before.json')
            .map((row) => [String(row.model_key || ''), Number(row.revision) || 0]));
          const after = new Map(rows('pages-revisions-after.json')
            .map((row) => [String(row.model_key || ''), Number(row.revision) || 0]));
          const changed = [...after.keys()]
            .filter((key) => after.get(key) !== before.get(key))
            .sort();
          process.stdout.write(changed.join(','));
          NODE
          )"
          echo "due_keys=$due_keys" >> "$GITHUB_OUTPUT"
          echo "Pages read-model revision changes: ${due_keys:-none}"
      - name: Trigger changed Pages read models
        if: steps.pages-revision-diff.outputs.due_keys != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DUE_KEYS: ${{ steps.pages-revision-diff.outputs.due_keys }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg keys "$DUE_KEYS" '{ref:"main",inputs:{force_all:"false",due_keys:$keys}}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/run-pages-read-model-rebuild.yml/dispatches" \
            -d "$payload"
      - name: Upload runtime maintenance failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-maintenance-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker/runtime-offline-maintenance.log
          if-no-files-found: error
          retention-days: 7
