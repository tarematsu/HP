name: Run runtime offline maintenance

on:
  # Lightweight live repair only. Aggregate/read-model reconciliation lives in
  # the separate daily deep-repair workflow so its failures cannot be hidden by
  # a later 30-minute success.
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-offline-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      BUDDIES_DATABASE_NAME: stationhead-buddies
      FACTS_DATABASE_NAME: stationhead-minute
      OTHER_DATABASE_NAME: stationhead-other
      RUNTIME_MAINTENANCE_DEADLINE_MS: '720000'
      RUNTIME_MAINTENANCE_COLLECTOR_ID: other-cron
      RUNTIME_MAINTENANCE_LIGHT_ONLY: 'true'
      RUNTIME_MAINTENANCE_SKIP_REBUILD: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Recover stalled minute jobs and run lightweight prediction
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-runtime-offline-maintenance-actions.mjs 2>&1 | tee runtime-offline-maintenance.log
      - name: Upload runtime maintenance failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-maintenance-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker/runtime-offline-maintenance.log
          if-no-files-found: error
          retention-days: 7
