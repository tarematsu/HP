name: Run runtime offline maintenance

on:
  # Keep the 30-minute cadence as the normal execution path. The recovery
  # watchdog dispatches this workflow when a scheduled delivery is missed.
  # Production deploys must not fan out into Runtime -> metadata -> Pages D1 work.
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-runtime-offline-maintenance.yml'
      - 'worker/scripts/detect-pages-read-model-revision-drift-actions.mjs'
      - 'worker/scripts/publish-recent-daily-summaries-actions.mjs'
      - 'worker/scripts/run-minute-facts-gap-scan-actions.mjs'
      - 'worker/scripts/run-runtime-offline-maintenance-actions.mjs'
      - 'worker/scripts/remote-d1-adapter.mjs'
      - 'worker/src/recent-daily-summary-publication.js'
      - 'worker/src/runtime-**'
      - 'worker/src/minute-**'
      - 'worker/src/rollup-**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: runtime-offline-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      BUDDIES_DATABASE_NAME: stationhead-buddies
      FACTS_DATABASE_NAME: stationhead-minute
      OTHER_DATABASE_NAME: stationhead-other
      PAGES_RESPONSE_BUCKET: sh-pages-responses
      RUNTIME_MAINTENANCE_DEADLINE_MS: '720000'
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Scan minute-fact gaps, publish summaries, then run maintenance
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-minute-facts-gap-scan-actions.mjs 2>&1 | tee runtime-offline-maintenance.log
          node scripts/publish-recent-daily-summaries-actions.mjs 2>&1 | tee -a runtime-offline-maintenance.log
          node scripts/run-runtime-offline-maintenance-actions.mjs 2>&1 | tee -a runtime-offline-maintenance.log
      - name: Detect unpublished Pages source revisions
        id: pages-revision-drift
        shell: bash
        run: |
          set -euo pipefail
          due_keys="$(node scripts/detect-pages-read-model-revision-drift-actions.mjs)"
          echo "due_keys=$due_keys" >> "$GITHUB_OUTPUT"
          echo "Pages read-model revision drift: ${due_keys:-none}"
      - name: Trigger changed Pages read models
        if: steps.pages-revision-drift.outputs.due_keys != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DUE_KEYS: ${{ steps.pages-revision-drift.outputs.due_keys }}
        run: |
          set -euo pipefail
          payload="$(jq -nc --arg keys "$DUE_KEYS" '{ref:"main",inputs:{force_all:"false",due_keys:$keys}}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/run-pages-read-model-rebuild.yml/dispatches" \
            -d "$payload"
      - name: Upload runtime maintenance failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-maintenance-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker/runtime-offline-maintenance.log
          if-no-files-found: error
          retention-days: 7
