name: Apply Stationhead stats follow-up

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-stationhead-stats-followup
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/rebuild-stationhead-play-stats'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-stationhead-play-stats
          fetch-depth: 0

      - name: Harden request ordering and native validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              return text.replace(old, new, 1)

          path = Path('hp/native/src/sh_stats_session_policy_fix.h')
          source = path.read_text()
          source = replace_one(
              source,
              "  window.__homepanelStationheadPlayStatsNextRequestId = requestId;\n  window.__homepanelStationheadPlayStatsLatestRequestId = requestId;\n  window.__homepanelStationheadStatsDocumentActive = true;\n",
              "  window.__homepanelStationheadPlayStatsNextRequestId = requestId;\n  window.__homepanelStationheadStatsDocumentActive = true;\n",
              'defer latest request assignment')
          source = replace_one(
              source,
              "  const authGeneration = Number(\n    window.__homepanelStationheadStatsAuthGeneration || 0);\n\n  const lastSuccessAt = Number(\n",
              "  const authGeneration = Number(\n    window.__homepanelStationheadStatsAuthGeneration || 0);\n  if (!Number.isSafeInteger(authGeneration) || authGeneration <= 0) {\n    scheduleRetry('no-validated-auth');\n    return false;\n  }\n\n  const lastSuccessAt = Number(\n",
              'require validated auth generation')
          source = replace_one(
              source,
              "  if (window.__homepanelStationheadPlayStatsInFlight) return false;\n  window.__homepanelStationheadPlayStatsInFlight = true;\n",
              "  if (window.__homepanelStationheadPlayStatsInFlight) return false;\n  window.__homepanelStationheadPlayStatsLatestRequestId = requestId;\n  window.__homepanelStationheadPlayStatsInFlight = true;\n",
              'claim request after in-flight guard')
          source = replace_one(
              source,
              "      post({ type: 'stationhead-auth-ready', reason: 'stats-retry' });\n",
              "      post({\n        type: 'stationhead-auth-ready',\n        reason: 'stats-retry',\n        auth_generation: Number(\n          window.__homepanelStationheadStatsAuthGeneration || 0),\n      });\n",
              'retry auth generation')
          path.write_text(source)

          path = Path('hp/native/src/sh_webview.cpp')
          source = path.read_text()
          source = replace_one(
              source,
              "                if (!std::isfinite(rawGeneration) || rawGeneration <= 0 ||\n                    rawGeneration > static_cast<double>(std::numeric_limits<uint64_t>::max())) {\n",
              "                constexpr double kMaximumSafeJsonInteger =\n                    9'007'199'254'740'991.0;\n                if (!std::isfinite(rawGeneration) || rawGeneration <= 0 ||\n                    rawGeneration > kMaximumSafeJsonInteger) {\n",
              'document safe integer')
          source = replace_one(
              source,
              "                const auto unsignedField = [&message](const wchar_t* name) {\n                  const double value = json::Number(message, name, 0);\n                  if (!std::isfinite(value) || value <= 0 ||\n                      value > static_cast<double>(std::numeric_limits<uint64_t>::max())) {\n",
              "                const auto unsignedField = [&message](const wchar_t* name) {\n                  constexpr double kMaximumSafeJsonInteger =\n                      9'007'199'254'740'991.0;\n                  const double value = json::Number(message, name, 0);\n                  if (!std::isfinite(value) || value <= 0 ||\n                      value > kMaximumSafeJsonInteger) {\n",
              'message safe integer')
          source = replace_one(
              source,
              "                if (requestId == 0 || documentGeneration == 0 ||\n                    documentGeneration != statsDocumentGeneration_ ||\n",
              "                if (requestId == 0 || documentGeneration == 0 ||\n                    authGeneration == 0 ||\n                    documentGeneration != statsDocumentGeneration_ ||\n",
              'require auth identity')
          source = replace_one(
              source,
              "                const int64_t receivedAt = UnixMillis();\n                int64_t serverDateAt = static_cast<int64_t>(\n                    json::Number(message, L\"server_date_ms\", 0));\n",
              "                const int64_t receivedAt = UnixMillis();\n                const double rawServerDateAt =\n                    json::Number(message, L\"server_date_ms\", 0);\n                int64_t serverDateAt = 0;\n                if (std::isfinite(rawServerDateAt) && rawServerDateAt > 0 &&\n                    rawServerDateAt <= static_cast<double>(\n                        std::numeric_limits<int64_t>::max())) {\n                  serverDateAt = static_cast<int64_t>(rawServerDateAt);\n                }\n",
              'bounded server date')
          source = replace_one(
              source,
              "                const auto data = json::Object(message, L\"data\");\n                const auto chart = json::Array(data, L\"chart_data\");\n",
              "                const std::wstring timezone =\n                    message.GetNamedString(L\"timezone\", L\"\").c_str();\n                if (timezone != L\"Etc/UTC\" && timezone != L\"UTC\") {\n                  log_.Warn(\n                      L\"Stationhead authenticated stats used an unsupported timezone\");\n                  return S_OK;\n                }\n                const auto data = json::Object(message, L\"data\");\n                const auto chart = json::Array(data, L\"chart_data\");\n",
              'timezone validation')
          source = replace_one(
              source,
              "                  if (!std::isfinite(rawTimestamp) ||\n                      !std::isfinite(rawValue) || rawTimestamp <= 0 ||\n                      rawValue < 0 ||\n",
              "                  if (!std::isfinite(rawTimestamp) ||\n                      !std::isfinite(rawValue) || rawTimestamp <= 0 ||\n                      rawTimestamp > static_cast<double>(\n                          std::numeric_limits<int64_t>::max()) ||\n                      rawValue < 0 ||\n",
              'timestamp integer range')
          source = replace_one(
              source,
              "                  const int64_t timestamp =\n                      static_cast<int64_t>(rawTimestamp);\n                  if (timestamp < referenceAt - kMaximumPastPointMs ||\n",
              "                  const int64_t timestamp =\n                      static_cast<int64_t>(rawTimestamp);\n                  constexpr int64_t kUtcDayMs = 24LL * 60 * 60 * 1000;\n                  if (timestamp % kUtcDayMs != 0 ||\n                      timestamp < referenceAt - kMaximumPastPointMs ||\n",
              'UTC day alignment')
          source = replace_one(
              source,
              "                  if (std::isfinite(rawAuthGeneration) &&\n                      rawAuthGeneration > 0 &&\n                      rawAuthGeneration <= static_cast<double>(std::numeric_limits<uint64_t>::max())) {\n",
              "                  constexpr double kMaximumSafeJsonInteger =\n                      9'007'199'254'740'991.0;\n                  if (std::isfinite(rawAuthGeneration) &&\n                      rawAuthGeneration > 0 &&\n                      rawAuthGeneration <= kMaximumSafeJsonInteger) {\n",
              'auth ready safe integer')
          path.write_text(source)

          path = Path('hp/video/test/stationhead-play-stats-rebuild-regression.test.js')
          source = path.read_text()
          source = replace_one(
              source,
              "    clearTimeout() {},\n",
              "    clearTimeout(id) {\n      const timer = timers.find(candidate => candidate.id === id);\n      if (timer) timer.cleared = true;\n    },\n",
              'timer clearing')
          source = replace_one(
              source,
              "      timers.push({ callback, delay });\n      return timers.length;\n",
              "      const id = timers.length + 1;\n      timers.push({ id, callback, delay, cleared: false });\n      return id;\n",
              'timer identity')
          source = replace_one(
              source,
              "  assert.equal(timers.length, 0);\n",
              "  assert.equal(timers.filter(timer => !timer.cleared).length, 0);\n",
              'successful timeout cleared')
          source = replace_one(
              source,
              "    __homepanelStationheadAccountAuthHeaders: { authorization: 'Bearer fixture' },\n    chrome: { webview: { postMessage: message => messages.push(message) } },\n",
              "    __homepanelStationheadAccountAuthHeaders: { authorization: 'Bearer fixture' },\n    __homepanelStationheadStatsAuthGeneration: 7,\n    chrome: { webview: { postMessage: message => messages.push(message) } },\n",
              'pagehide auth generation')
          insertion = r'''

test('a duplicate poll cannot supersede the active request identity', async () => {
  let resolveResponse;
  const pendingResponse = new Promise(resolve => { resolveResponse = resolve; });
  const messages = [];
  const timers = [];
  const window = {
    __homepanelStationheadAccountAuthHeaders: { authorization: 'Bearer fixture' },
    __homepanelStationheadStatsAuthGeneration: 7,
    chrome: { webview: { postMessage: message => messages.push(message) } },
    setTimeout(callback, delay) {
      const id = timers.length + 1;
      timers.push({ id, callback, delay, cleared: false });
      return id;
    },
    clearTimeout(id) {
      const timer = timers.find(candidate => candidate.id === id);
      if (timer) timer.cleared = true;
    },
    addEventListener() {},
  };
  class AbortControllerFixture {
    constructor() { this.signal = {}; }
    abort() {}
  }
  const context = {
    window,
    fetch: () => pendingResponse,
    AbortController: AbortControllerFixture,
    Date, Math, Map, JSON, Number, String, Array, Object, Event, console,
  };
  vm.runInNewContext(generatedStatsScript(), context);
  const activeRequestId = window.__homepanelStationheadPlayStatsLatestRequestId;
  vm.runInNewContext(generatedStatsScript(), context);
  assert.equal(window.__homepanelStationheadPlayStatsLatestRequestId, activeRequestId);
  resolveResponse({
    status: 200,
    ok: true,
    headers: makeHeaders({ date: fixture.source.serverDate }),
    async json() { return fixture.payload; },
  });
  for (let count = 0; count < 8; count += 1) {
    await new Promise(resolve => setImmediate(resolve));
  }
  assert.ok(messages.some(message => message.type === 'stationhead-play-stats'));
  assert.equal(window.__homepanelStationheadPlayStatsInFlight, false);
});
'''
          marker = "\ntest('the generated policy uses native identity and bounded timeout without persistence', () => {"
          if source.count(marker) != 1:
              raise SystemExit('duplicate poll test marker missing')
          source = source.replace(marker, insertion + marker, 1)
          source = replace_one(
              source,
              "  assert.match(policy, /auth_generation: authGeneration/);\n",
              "  assert.match(policy, /auth_generation: authGeneration/);\n  assert.match(policy, /Number\\.isSafeInteger\\(authGeneration\\)/);\n",
              'validated auth assertion')
          path.write_text(source)

          path = Path('hp/video/test/stationhead-play-stats-native-state-regression.test.js')
          source = path.read_text()
          source += """

test('native validation requires safe identities, UTC timezone, and day boundaries', () => {
  assert.match(webview, /kMaximumSafeJsonInteger/);
  assert.match(webview, /authGeneration == 0/);
  assert.match(webview, /timezone != L\"Etc\/UTC\"/);
  assert.match(webview, /timestamp % kUtcDayMs != 0/);
  assert.match(webview, /std::numeric_limits<int64_t>::max/);
});
"""
          path.write_text(source)
          PY
          rm -f .github/workflows/apply-stationhead-stats-followup.yml
          node --check hp/native/scripts/capture-stationhead-play-stats-safe.mjs
          node --test \
            hp/video/test/stationhead-play-stats-*.test.js \
            hp/video/test/stationhead-stats-*.test.js \
            hp/video/test/stationhead-safe-capture-regression.test.js
          git diff --check

      - name: Commit follow-up fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden Stationhead stats request ordering"
          git push origin HEAD:agent/rebuild-stationhead-play-stats
