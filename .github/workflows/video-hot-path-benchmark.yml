name: Video · Hot path benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/video-hot-path-benchmark.yml'
      - 'hp/package.json'
      - 'hp/package-lock.json'
      - 'hp/video/package.json'
      - 'hp/video/scripts/benchmark-hot-path.mjs'
      - 'hp/video/test/hot-path-benchmark.test.js'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hp/package-lock.json
      - name: Install HomePanel workspace dependencies
        working-directory: hp
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Measure warm Worker hot path
        working-directory: hp
        shell: bash
        run: |
          set -e -o pipefail
          npm run --silent benchmark:hot-path --workspace video -- --warmup=1000 --samples=25 --iterations=500 | tee video/hot-path-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: video-hot-path-benchmark-${{ github.event.pull_request.head.sha || github.sha }}
          path: hp/video/hot-path-benchmark.json
          if-no-files-found: error
          retention-days: 14
