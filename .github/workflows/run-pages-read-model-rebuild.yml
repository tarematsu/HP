name: Rebuild pages read models

on:
  workflow_run:
    workflows: ["Run runtime offline maintenance"]
    types: [completed]
  schedule:
    - cron: '26,56 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-pages-read-model-rebuild.yml'
      - 'scripts/cloudflare-d1-write-guard.mjs'
      - 'worker/scripts/run-pages-read-model-actions.mjs'
      - 'worker/scripts/refresh-pages-dashboard-actions.mjs'
      - 'worker/scripts/remote-d1-adapter.mjs'
      - 'worker/src/pages-**'
      - 'site/functions/api/dashboard.js'
      - 'site/functions/api/history.js'
      - 'site/functions/lib/materialized-history.js'
      - 'site/functions/api/host-history.js'
      - 'site/functions/api/track-history.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-read-model-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    name: Rebuild and publish due pages read models
    # A Runtime push completion is an ignored-chain because the same SHA already
    # enters through the direct push trigger. Scheduled and manual completions
    # remain independent operational inputs.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
        && (github.event.workflow_run.event == 'schedule'
          || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      FACTS_DATABASE_NAME: stationhead-minute
      BUDDIES_DATABASE_NAME: stationhead-buddies
      OTHER_DATABASE_NAME: stationhead-other
      PAGES_RESPONSE_BUCKET: sh-pages-responses
      PAGES_READ_MODEL_MAX_STEPS: '4'
      PAGES_READ_MODEL_DEADLINE_MS: '720000'
      D1_ACTIONS_WRITE_ROWS_PER_HOUR_LIMIT: '4000'
      D1_ACTIONS_READ_ROWS_PER_DAY_LIMIT: '3500000'
      D1_ACTIONS_READ_PROJECTION_MINUTES: '60'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Check D1 Actions read and write budgets
        id: d1-write-budget
        run: node ../scripts/cloudflare-d1-write-guard.mjs
      - name: Summarize D1 budget decision
        if: always()
        shell: bash
        run: |
          {
            echo "### D1 Actions budget"
            echo "- Decision: ${{ steps.d1-write-budget.outputs.reason }}"
            echo "- UTC-day reads: ${{ steps.d1-write-budget.outputs.rows_read }} / ${{ steps.d1-write-budget.outputs.read_limit }}"
            echo "- Projected UTC-day reads: ${{ steps.d1-write-budget.outputs.projected_rows_read }} / ${{ steps.d1-write-budget.outputs.read_limit }}"
            echo "- Hourly writes: ${{ steps.d1-write-budget.outputs.rows_written }} / ${{ steps.d1-write-budget.outputs.limit }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record D1 budget deferral
        if: steps.d1-write-budget.outputs.allowed != 'true'
        shell: bash
        run: |
          if [[ "${{ steps.d1-write-budget.outputs.reason }}" == 'telemetry-unavailable' ]]; then
            echo "Deferring D1-heavy read-model and track-history generation because usage telemetry is unavailable. Existing KV/R2 responses remain active, and bounded dashboard and summary refresh will still run." | tee pages-read-model-actions.log
          else
            echo "Deferring D1-heavy read-model and track-history generation because usage is above the Actions budget (${{ steps.d1-write-budget.outputs.rows_read }} actual / ${{ steps.d1-write-budget.outputs.projected_rows_read }} projected UTC-day reads, limit ${{ steps.d1-write-budget.outputs.read_limit }}; ${{ steps.d1-write-budget.outputs.rows_written }}/${{ steps.d1-write-budget.outputs.limit }} hourly writes). Existing KV/R2 responses remain active, and bounded dashboard and summary refresh will still run." | tee pages-read-model-actions.log
          fi
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Refresh budget-safe read models during D1 budget deferral
        if: steps.d1-write-budget.outputs.allowed != 'true'
        shell: bash
        run: |
          set -o pipefail
          node scripts/refresh-pages-dashboard-actions.mjs 2>&1 | tee -a pages-read-model-actions.log
      - name: Rebuild track history and publish due variants
        if: steps.d1-write-budget.outputs.allowed == 'true'
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-pages-read-model-actions.mjs 2>&1 | tee pages-read-model-actions.log
      - name: Upload pages read-model failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-read-model-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker/pages-read-model-actions.log
          if-no-files-found: error
          retention-days: 7
      - name: Verify serving database
        if: steps.d1-write-budget.outputs.allowed == 'true'
        run: node scripts/verify-facts-live.mjs
