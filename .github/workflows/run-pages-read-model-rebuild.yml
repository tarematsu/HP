name: Rebuild pages read models

on:
  workflow_run:
    workflows: ["Run runtime offline maintenance"]
    types: [completed]
  schedule:
    - cron: '19,49 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-pages-read-model-rebuild.yml'
      - 'worker/scripts/run-pages-read-model-actions.mjs'
      - 'worker/scripts/remote-d1-adapter.mjs'
      - 'worker/src/pages-**'
      - 'site/functions/api/dashboard.js'
      - 'site/functions/api/history.js'
      - 'site/functions/api/host-history.js'
      - 'site/functions/api/track-history.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-read-model-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    name: Rebuild and publish due pages read models
    # Deploy-triggered runtime maintenance also emits workflow_run. Those runs are
    # intentionally skipped here and ignored by the runner-health evaluator.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      FACTS_DATABASE_NAME: stationhead-minute
      BUDDIES_DATABASE_NAME: stationhead-buddies
      OTHER_DATABASE_NAME: stationhead-other
      PAGES_RESPONSE_BUCKET: sh-pages-responses
      PAGES_READ_MODEL_MAX_STEPS: '1800'
      PAGES_READ_MODEL_DEADLINE_MS: '720000'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Rebuild track history and publish due variants
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-pages-read-model-actions.mjs 2>&1 | tee pages-read-model-actions.log
      - name: Upload pages read-model failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-read-model-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker/pages-read-model-actions.log
          if-no-files-found: error
          retention-days: 7
      - name: Verify serving database
        run: node scripts/verify-facts-live.mjs
