name: Rebuild pages read models

on:
  workflow_dispatch:
    inputs:
      due_keys:
        description: Comma-separated read-model keys; empty rebuilds all history models
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: pages-read-model-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    name: Request Worker read-model rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      OTHER_DATABASE_NAME: stationhead-other
      PAGES_READ_MODEL_DUE_KEYS: ${{ inputs.due_keys }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Request canonical Worker rebuild
        run: node scripts/request-pages-read-model-rebuild-actions.mjs
