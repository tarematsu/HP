name: Kugou public probe

on:
  pull_request:
    paths:
      - 'worker/scripts/probe-kugou-public.mjs'
      - 'worker/scripts/probe-kugou-japan-rank.mjs'
      - 'worker/scripts/probe-kugou-current-rank.mjs'
      - 'worker/scripts/probe-kugou-japan-history.mjs'
      - '.github/workflows/kugou-public-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe Kugou public artist/search surfaces
        working-directory: worker
        run: node scripts/probe-kugou-public.mjs | tee kugou-public-probe.json
      - name: Probe Kugou legacy Japan ranking
        working-directory: worker
        run: node scripts/probe-kugou-japan-rank.mjs | tee kugou-japan-rank-probe.json
      - name: Probe Kugou current signed Japan ranking API
        working-directory: worker
        run: node scripts/probe-kugou-current-rank.mjs | tee kugou-current-rank-probe.json
      - name: Crawl Kugou Japan ranking history
        working-directory: worker
        run: node scripts/probe-kugou-japan-history.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: kugou-public-probe
          path: |
            worker/kugou-public-probe.json
            worker/kugou-japan-rank-probe.json
            worker/kugou-current-rank-probe.json
            worker/kugou-japan-history.json
            worker/kugou-japan-history.csv
          retention-days: 7
