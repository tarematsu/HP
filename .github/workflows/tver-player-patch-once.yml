name: Apply TVer fullscreen and low quality once

on:
  push:
    branches:
      - fix/spotify-90m-music-30m-talkabout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spotify-90m-music-30m-talkabout
      - name: Apply patch
        run: python scripts/patch-tver-fullscreen-low-once.py
      - name: Run media contract tests
        run: |
          node --test hp/video/test/native-mv-panel-contract.test.js
          node --test hp/video/test/native-spotify-webviews-contract.test.js
          node --test hp/video/test/native-spotify-load-reduction-contract.test.js
      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hp/native/src/renderer_panels/media_section.inc hp/native/src/spotify_webviews.cpp hp/video/test/native-mv-panel-contract.test.js
          git commit -m 'Set TVer low quality and fullscreen automatically'
          git push origin HEAD:fix/spotify-90m-music-30m-talkabout
