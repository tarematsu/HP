name: Harden observability contained-status fix

on:
  push:
    branches: [agent/fix-observability-contained-status]

permissions:
  contents: write

concurrency:
  group: agent-harden-observability-contained-status
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-observability-contained-status
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restrict containment to the sole historical D1 read violation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          function replaceExactly(source, before, after, label) {
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: expected one match, found ${count}`);
            return source.replace(before, after);
          }

          const triagePath = '.github/scripts/observability-issue-triage.mjs';
          let triage = readFileSync(triagePath, 'utf8');
          triage = replaceExactly(
            triage,
            `function outcomeEvidence(key, outcome, summaries) {\n  if (normalizeOutcome(outcome) === 'success') return 'No failure reported.';\n  const summary = summaries?.[key] || '';\n  if (key === 'daily' || key === 'freeTier') {\n    const violations = extractViolationEvidence(summary);\n    if (violations.length) return violations.join('; ');\n  }\n  return firstDiagnosticLine(summary);\n}\n`,
            `function outcomeEvidence(key, outcome, summaries) {\n  if (normalizeOutcome(outcome) === 'success') return 'No failure reported.';\n  const summary = summaries?.[key] || '';\n  if (key === 'daily' || key === 'freeTier') {\n    const violations = extractViolationEvidence(summary);\n    if (violations.length) return violations.join('; ');\n  }\n  return firstDiagnosticLine(summary);\n}\n\nfunction containedHistoricalDailyFailure({\n  outcome,\n  summary,\n  previousIssueBody,\n  generatedAt,\n}) {\n  if (normalizeOutcome(outcome) === 'success') return false;\n  const trend = classifyDailyRowsReadTrend({\n    currentSummary: summary,\n    previousIssueBody,\n    generatedAt,\n  });\n  const violations = extractViolationEvidence(summary, { limit: 20 });\n  return Boolean(\n    trend?.contained\n      && violations.length === 1\n      && /^D1 rows read\\b/i.test(violations[0]),\n  );\n}\n`,
            'contained daily helper',
          );
          triage = replaceExactly(
            triage,
            `  const dailyTrend = classifyDailyRowsReadTrend({\n    currentSummary: summaries.daily,\n    previousIssueBody,\n    generatedAt,\n  });\n  const gatesHealthy = Object.keys(OBSERVABILITY_GATE_INFO)\n    .every((key) => (\n      normalizeOutcome(outcomes[key]) === 'success'\n      || (key === 'daily' && dailyTrend?.contained)\n    ));`,
            `  const dailyFailureContained = containedHistoricalDailyFailure({\n    outcome: outcomes.daily,\n    summary: summaries.daily,\n    previousIssueBody,\n    generatedAt,\n  });\n  const gatesHealthy = Object.keys(OBSERVABILITY_GATE_INFO)\n    .every((key) => (\n      normalizeOutcome(outcomes[key]) === 'success'\n      || (key === 'daily' && dailyFailureContained)\n    ));`,
            'overall contained gate',
          );
          triage = replaceExactly(
            triage,
            `  const dailyTrend = classifyDailyRowsReadTrend({\n    currentSummary: summaries.daily,\n    previousIssueBody,\n    generatedAt,\n  });`,
            `  const dailyFailureContained = containedHistoricalDailyFailure({\n    outcome: outcomes.daily,\n    summary: summaries.daily,\n    previousIssueBody,\n    generatedAt,\n  });`,
            'triage contained gate',
          );
          triage = replaceExactly(
            triage,
            `    if (key === 'daily' && dailyTrend?.contained) {`,
            `    if (key === 'daily' && dailyFailureContained) {`,
            'triage containment condition',
          );
          writeFileSync(triagePath, triage);

          const testPath = 'tests/observability-daily-containment.test.mjs';
          let test = readFileSync(testPath, 'utf8');
          const anchor = `  assert.match(body, /\\*\\*Cloudflare status:\\*\\* success/);\n});`;
          const regression = `${anchor}\n\ntest('another daily-budget violation remains active beside a contained D1 read breach', () => {\n  const queueViolation = summaries.daily.replace(\n    '| Queue billable operations | 10 | 20 | 10,000 | 9,980 | OK |',\n    '| Queue billable operations | 11,000 | 12,000 | 10,000 | 0 | VIOLATION (actual) |',\n  );\n  const body = buildIssueBody({\n    generatedAt,\n    targetSha: 'abc',\n    mainSha: 'abc',\n    runUrl: 'https://github.com/tarematsu/HP/actions/runs/1',\n    trigger: 'workflow_run',\n    outcomes,\n    summaries: { ...summaries, daily: queueViolation },\n    activeDeployments: deployments,\n    previousIssueBody: previousIssue(),\n  });\n  assert.match(body, /\\*\\*Cloudflare status:\\*\\* failure/);\n  assert.match(body, /ACTION REQUIRED — 1 active signal/);\n  assert.match(body, /Queue billable operations/);\n  assert.doesNotMatch(body, /CONTAINED — 1 historical signal remains/);\n});`;
          test = replaceExactly(test, anchor, regression, 'non-D1 daily violation regression');
          writeFileSync(testPath, test);
          NODE

          rm .github/workflows/agent-harden-observability-contained-status-fix.yml
          git diff --check
      - name: Run observability regression tests
        run: node --test tests/observability-daily-containment.test.mjs tests/observability-issue-triage.test.mjs
      - name: Commit tested hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/scripts/observability-issue-triage.mjs tests/observability-daily-containment.test.mjs .github/workflows/agent-harden-observability-contained-status-fix.yml
          git commit -m "Harden contained daily budget detection"
          git push origin HEAD:agent/fix-observability-contained-status
