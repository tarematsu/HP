name: Backfill played tracks 2026

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-played-tracks-2026.yml'
  workflow_dispatch:
    inputs:
      start:
        description: First UTC day to rebuild (YYYY-MM-DD)
        required: false
        default: '2026-06-01'
      end:
        description: Last UTC day to rebuild (YYYY-MM-DD)
        required: false
        default: '2026-09-22'

permissions:
  contents: read

concurrency:
  group: backfill-played-tracks-2026
  cancel-in-progress: false

jobs:
  backfill-default:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: september
            start: '2026-09-01'
            end: '2026-09-22'
          - label: august
            start: '2026-08-01'
            end: '2026-08-31'
          - label: july
            start: '2026-07-01'
            end: '2026-07-31'
          - label: june
            start: '2026-06-01'
            end: '2026-06-30'
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      FACTS_DATABASE_NAME: stationhead-minute
      TRACK_HISTORY_BACKFILL_START: ${{ matrix.start }}
      TRACK_HISTORY_BACKFILL_END: ${{ matrix.end }}
      TRACK_HISTORY_BACKFILL_DELAY_MS: '750'
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Backfill Track History month
        shell: bash
        run: |
          set -o pipefail
          node scripts/backfill-track-history-range-actions.mjs 2>&1 | tee "backfill-track-history-${{ matrix.label }}.log"
      - name: Upload backfill failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-track-history-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker/backfill-track-history-${{ matrix.label }}.log
          if-no-files-found: error
          retention-days: 7

  backfill-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      FACTS_DATABASE_NAME: stationhead-minute
      TRACK_HISTORY_BACKFILL_START: ${{ inputs.start || '2026-06-01' }}
      TRACK_HISTORY_BACKFILL_END: ${{ inputs.end || '2026-09-22' }}
      TRACK_HISTORY_BACKFILL_DELAY_MS: '750'
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Backfill requested Track History range
        shell: bash
        run: |
          set -o pipefail
          node scripts/backfill-track-history-range-actions.mjs 2>&1 | tee backfill-track-history-range.log
      - name: Upload backfill failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-track-history-range-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker/backfill-track-history-range.log
          if-no-files-found: error
          retention-days: 7
