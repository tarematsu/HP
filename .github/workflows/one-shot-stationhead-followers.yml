name: One-shot Stationhead followers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-stationhead-followers.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm --prefix worker ci --prefer-offline --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Fetch four follower counts through a browser session
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fetch-followers.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const handles = ['sakuramankai', 'sakuramankai2', 'sakurazaka46jp', 'nogizaka46smej'];

          function findAccount(value, handle, depth = 0) {
            if (!value || typeof value !== 'object' || depth > 12) return null;
            if (!Array.isArray(value)) {
              const followers = Number(value.followers);
              if (String(value.handle || '').trim().toLowerCase() === handle
                  && Number.isInteger(followers) && followers >= 0) return value;
            }
            for (const child of Object.values(value)) {
              const found = findAccount(child, handle, depth + 1);
              if (found) return found;
            }
            return null;
          }

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ locale: 'ja-JP', timezoneId: 'Asia/Tokyo' });
          const result = { observed_at: Date.now(), followers: {}, accounts: {} };
          try {
            const page = await context.newPage();
            for (const handle of handles) {
              await page.goto(`https://www.stationhead.com/${handle}`, {
                waitUntil: 'domcontentloaded',
                timeout: 45_000,
              });
              await page.waitForTimeout(1500);
              const response = await context.request.get(
                `https://www.stationhead.com/api/account/handle/${encodeURIComponent(handle)}`,
                { timeout: 30_000, failOnStatusCode: false },
              );
              const status = response.status();
              if (status !== 200) throw new Error(`${handle} profile API status=${status}`);
              const payload = await response.json();
              const account = findAccount(payload, handle);
              if (!account) throw new Error(`${handle} follower count missing`);
              result.followers[handle] = Number(account.followers);
              result.accounts[handle] = Number(account.id ?? account.account_id) || null;
            }
          } finally {
            await browser.close();
          }
          await writeFile('/tmp/followers.json', JSON.stringify(result));
          console.log(JSON.stringify(result));
          EOF
          node /tmp/fetch-followers.mjs
      - name: Persist once to production D1 and R2
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/followers.json ./one-shot-input.json
          cat > one-shot-followers-entry.js <<'EOF'
          const KEY = 'pages-response/v1/followers.json';
          const HANDLES = ['sakuramankai', 'sakuramankai2', 'sakurazaka46jp', 'nogizaka46smej'];
          const JST_OFFSET_MS = 9 * 60 * 60_000;
          const JSON_HEADERS = {
            'content-type': 'application/json; charset=utf-8',
            'cache-control': 'public, max-age=30, s-maxage=300, stale-while-revalidate=600',
          };

          function dateKey(timestamp) {
            return new Date(Number(timestamp) + JST_OFFSET_MS).toISOString().slice(0, 10);
          }
          function offsetDateKey(date, days) {
            return new Date(Date.parse(`${date}T00:00:00Z`) + days * 86_400_000).toISOString().slice(0, 10);
          }
          function normalizeFollowers(value) {
            const out = {};
            for (const handle of HANDLES) {
              const count = Number(value?.[handle]);
              if (!Number.isInteger(count) || count < 0) throw new Error(`invalid followers for ${handle}`);
              out[handle] = count;
            }
            return out;
          }
          function normalizeRows(rows) {
            const byDate = new Map();
            for (const row of Array.isArray(rows) ? rows : []) {
              const date = String(row?.date || '');
              if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
              try {
                byDate.set(date, { date, ...normalizeFollowers(row) });
              } catch {}
            }
            return [...byDate.values()].sort((a, b) => a.date.localeCompare(b.date));
          }
          function accountSummary(rows) {
            const latest = rows.at(-1);
            if (!latest) return [];
            const byDate = new Map(rows.map((row) => [row.date, row]));
            const previous = byDate.get(offsetDateKey(latest.date, -1));
            const previousWeek = byDate.get(offsetDateKey(latest.date, -7));
            return HANDLES.map((handle) => ({
              handle,
              followers: latest[handle],
              previous_day_delta: previous ? latest[handle] - previous[handle] : null,
              previous_week_delta: previousWeek ? latest[handle] - previousWeek[handle] : null,
            }));
          }

          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname === '/run' && request.method === 'POST') {
                const input = await request.json();
                const observedAt = Number(input?.observed_at) || Date.now();
                const followers = normalizeFollowers(input?.followers);
                const date = dateKey(observedAt);
                const collectedAt = Date.now();

                const existing = await env.PAGES_RESPONSE_R2.get(KEY);
                let oldRows = [];
                if (existing) {
                  try { oldRows = normalizeRows((await existing.json())?.rows); } catch {}
                }
                const rows = normalizeRows([...oldRows, { date, ...followers }]);
                const body = JSON.stringify({
                  ok: true,
                  updated_at: collectedAt,
                  latest_date: rows.at(-1)?.date || null,
                  handles: HANDLES,
                  rows,
                  accounts: accountSummary(rows),
                });
                await env.PAGES_RESPONSE_R2.put(KEY, body, {
                  httpMetadata: { contentType: 'application/json; charset=utf-8' },
                  customMetadata: {
                    version: '1',
                    status: '200',
                    headers_json: JSON.stringify(JSON_HEADERS),
                    updated_at: String(collectedAt),
                    cadence_seconds: '86400',
                  },
                });

                const result = await env.OTHER_DB.prepare(`INSERT INTO sh_stationhead_daily_followers (
                    observed_date_jst,scheduled_at,collected_at,
                    sakuramankai,sakuramankai2,sakurazaka46jp,nogizaka46smej
                  ) VALUES (?,?,?,?,?,?,?)
                  ON CONFLICT(observed_date_jst) DO UPDATE SET
                    scheduled_at=excluded.scheduled_at,
                    collected_at=excluded.collected_at,
                    sakuramankai=excluded.sakuramankai,
                    sakuramankai2=excluded.sakuramankai2,
                    sakurazaka46jp=excluded.sakurazaka46jp,
                    nogizaka46smej=excluded.nogizaka46smej`)
                  .bind(date, observedAt, collectedAt,
                    followers.sakuramankai, followers.sakuramankai2,
                    followers.sakurazaka46jp, followers.nogizaka46smej)
                  .run();
                return Response.json({ ok: true, observed_date_jst: date, followers, d1_changes: Number(result?.meta?.changes || 0), history_rows: rows.length });
              }
              if (url.pathname === '/verify') {
                const date = dateKey(Date.now());
                const row = await env.OTHER_DB.prepare(`SELECT observed_date_jst,scheduled_at,collected_at,
                    sakuramankai,sakuramankai2,sakurazaka46jp,nogizaka46smej
                  FROM sh_stationhead_daily_followers WHERE observed_date_jst=? LIMIT 1`).bind(date).first();
                const object = await env.PAGES_RESPONSE_R2.get(KEY);
                const payload = object ? await object.json() : null;
                return Response.json({ date, row, r2_latest_date: payload?.latest_date ?? null, r2_accounts: payload?.accounts ?? [] });
              }
              return new Response('ok');
            },
          };
          EOF

          cat > wrangler.one-shot-followers.jsonc <<'EOF'
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "sh-one-shot-followers",
            "main": "one-shot-followers-entry.js",
            "compatibility_date": "2026-09-29",
            "d1_databases": [
              { "binding": "OTHER_DB", "database_name": "stationhead-other", "database_id": "21e70e92-6725-4e62-809e-8aadb088cc11" }
            ],
            "r2_buckets": [
              { "binding": "PAGES_RESPONSE_R2", "bucket_name": "sh-pages-responses" }
            ]
          }
          EOF

          npx wrangler dev --remote --config wrangler.one-shot-followers.jsonc --ip 127.0.0.1 --port 8787 --log-level warn > one-shot-wrangler.log 2>&1 &
          wrangler_pid=$!
          trap 'kill "$wrangler_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl --max-time 2 -fsS http://127.0.0.1:8787/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl --max-time 30 -fsS -X POST -H 'content-type: application/json' --data-binary @one-shot-input.json http://127.0.0.1:8787/run | tee one-shot-result.json
          echo
          curl --max-time 20 -fsS http://127.0.0.1:8787/verify | tee one-shot-verify.json
          echo
          node <<'NODE'
          const fs = require('fs');
          const run = JSON.parse(fs.readFileSync('one-shot-result.json', 'utf8'));
          const verify = JSON.parse(fs.readFileSync('one-shot-verify.json', 'utf8'));
          if (!run?.ok || Object.keys(run.followers || {}).length !== 4) throw new Error('four-count persistence failed');
          if (!verify?.row || verify.row.observed_date_jst !== verify.date) throw new Error('D1 verification failed');
          if (verify.r2_latest_date !== verify.date || verify.r2_accounts?.length !== 4) throw new Error('R2 verification failed');
          console.log(JSON.stringify({ ok: true, run, verify }));
          NODE
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-shot-stationhead-followers-${{ github.run_id }}
          path: |
            worker/one-shot-input.json
            worker/one-shot-result.json
            worker/one-shot-verify.json
            worker/one-shot-wrangler.log
          if-no-files-found: ignore
          retention-days: 1
