name: Publish GitHub Actions runner health

on:
  workflow_run:
    workflows: ["Unified Cloudflare Observability"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-github-actions-runner-health.yml'
      - '.github/scripts/github-actions-runner-health.mjs'
      - '.github/scripts/publish-github-actions-runner-health.mjs'
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: github-actions-runner-health
  cancel-in-progress: true

jobs:
  publish:
    name: Update observability issue with runner health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cloudflare-observability-status-issue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish scheduled runner health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIONS_HEALTH_ISSUE_NUMBER: '259'
        run: node .github/scripts/publish-github-actions-runner-health.mjs
