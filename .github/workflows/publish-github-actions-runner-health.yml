name: Publish GitHub Actions runner health

on:
  workflow_run:
    # Refresh after every monitored operational workflow that can complete independently.
    workflows: ["Unified Cloudflare Observability", "Rebuild pages read models", "Run runtime offline maintenance", "Repair track metadata", "Run local minute facts rebuild", "Publish GitHub deployment health"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-github-actions-runner-health.yml'
      - '.github/workflows/publish-github-deployment-health.yml'
      - '.github/workflows/refresh-cloudflare-observability.yml'
      - '.github/workflows/run-runtime-offline-maintenance.yml'
      - '.github/workflows/run-pages-read-model-rebuild.yml'
      - '.github/workflows/run-track-metadata-repair.yml'
      - '.github/workflows/run-local-minute-facts-rebuild.yml'
      - '.github/workflows/sh-observability.yml'
      - '.github/scripts/github-actions-runner-health.mjs'
      - '.github/scripts/github-actions-runner-health-current.mjs'
      - '.github/scripts/publish-github-actions-runner-health.mjs'
      - '.github/scripts/observability-system-status.mjs'
  schedule:
    - cron: '2,17,32,47 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: github-actions-runner-health
  cancel-in-progress: true

jobs:
  publish:
    name: Update observability issue with runner health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cloudflare-observability-status-issue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Publish scheduled runner health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIONS_HEALTH_ISSUE_NUMBER: '259'
        run: node .github/scripts/publish-github-actions-runner-health.mjs
      - name: Synchronize unified system status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OBSERVABILITY_STATUS_ISSUE_NUMBER: '259'
        run: node .github/scripts/observability-system-status.mjs
