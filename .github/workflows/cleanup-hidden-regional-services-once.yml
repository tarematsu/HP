name: Cleanup hidden regional music services once

on:
  push:
    branches:
      - cleanup/remove-hidden-regional-services-20261003

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-hidden-regional-services-20261003
          fetch-depth: 0
      - name: Remove hidden regional services
        shell: bash
        run: |
          echo ' ' | base64 -d > /tmp/cleanup.py
          python3 /tmp/cleanup.py
          git status --short
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove hidden regional music services"
          git push origin HEAD:cleanup/remove-hidden-regional-services-20261003
