name: Apply follower Actions collection wiring

on:
  push:
    branches:
      - fix/follower-actions-collector
    paths:
      - .github/workflows/apply-follower-actions-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/follower-actions-collector
          fetch-depth: 0
          show-progress: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Wire Actions-owned follower collection
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const responsePath = 'worker/src/pages-response-r2.js';
          let response = fs.readFileSync(responsePath, 'utf8');
          response = response.replace(
            `  // Actions owns the general materialized API variants. Track history and the\n  // daily follower comparison are Worker-owned and use the direct Worker key.`,
            `  // Actions owns the general materialized API variants. Track history stays\n  // Worker-owned; followers prefer Actions because Stationhead blocks Worker egress.`,
          );
          const oldFollowerBlock = `  if (modelKey === FOLLOWERS_MODEL_KEY) {\n    return sanitizeFollowersResponse(\n      (await loadWorkerR2Response(r2, modelKey, now, maximumAgeMs))\n        || emptyFollowersResponse(now),\n    );\n  }`;
          const newFollowerBlock = `  if (modelKey === FOLLOWERS_MODEL_KEY) {\n    return sanitizeFollowersResponse(\n      (await loadActionsEnvelope(r2, modelKey, now, maximumAgeMs))\n        || (await loadWorkerR2Response(r2, modelKey, now, maximumAgeMs))\n        || emptyFollowersResponse(now),\n    );\n  }`;
          if (!response.includes(oldFollowerBlock)) throw new Error('followers loader block not found');
          fs.writeFileSync(responsePath, response.replace(oldFollowerBlock, newFollowerBlock));

          fs.writeFileSync('worker/src/buddies-collector-entry.js', `import collectorApp, {\n  BUDDIES_COLLECTOR_CRON,\n  runBuddiesCollectorScheduled,\n} from './buddies-collector-core.js';\nimport {\n  runAlarmCoordinatedBuddiesCollectorScheduled,\n} from './buddies-collector-do-entry.js';\nimport { BuddiesCollectorCoordinator } from './buddies-collector-coordinator-combined.js';\n\nexport {\n  BUDDIES_COLLECTOR_CRON,\n  BuddiesCollectorCoordinator,\n  runAlarmCoordinatedBuddiesCollectorScheduled,\n  runBuddiesCollectorScheduled,\n};\n\n// Stationhead rejects profile requests made from Cloudflare Worker egress.\n// Daily follower collection therefore belongs to GitHub Actions; this wrapper\n// remains as a compatibility seam for the collector entry point.\nexport function runBuddiesCollectorScheduledWithFollowers(\n  controller,\n  env,\n  ctx,\n  dependencies = {},\n) {\n  const coordinatedScheduled = dependencies.coordinatedScheduled\n    || runAlarmCoordinatedBuddiesCollectorScheduled;\n  return coordinatedScheduled(controller, env, ctx, dependencies.coordinator);\n}\n\nexport default {\n  ...collectorApp,\n  scheduled: runBuddiesCollectorScheduledWithFollowers,\n};\n`);

          fs.writeFileSync('worker/tests/buddies-collector-entry-routing.test.js', `import assert from 'node:assert/strict';\nimport test from 'node:test';\n\nimport collector, {\n  runAlarmCoordinatedBuddiesCollectorScheduled,\n  runBuddiesCollectorScheduled,\n  runBuddiesCollectorScheduledWithFollowers,\n} from '../src/buddies-collector-entry.js';\n\ntest('production collector keeps the compatibility scheduling wrapper', () => {\n  assert.equal(collector.scheduled, runBuddiesCollectorScheduledWithFollowers);\n  assert.notEqual(collector.scheduled, runAlarmCoordinatedBuddiesCollectorScheduled);\n  assert.notEqual(collector.scheduled, runBuddiesCollectorScheduled);\n});\n\ntest('collector schedule delegates only to the Durable Object collector', async () => {\n  const waitUntil = [];\n  const calls = [];\n  const controller = { cron: '*/5 * * * *', scheduledTime: Date.UTC(2026, 9, 2, 15, 0) };\n  const result = await runBuddiesCollectorScheduledWithFollowers(\n    controller,\n    {},\n    { waitUntil: (promise) => waitUntil.push(promise) },\n    {\n      collectFollowers: async () => calls.push('followers'),\n      coordinatedScheduled: async (received) => {\n        calls.push(['collector', received.scheduledTime]);\n        return { ok: true };\n      },\n    },\n  );\n\n  assert.deepEqual(result, { ok: true });\n  assert.equal(waitUntil.length, 0);\n  assert.deepEqual(calls, [['collector', controller.scheduledTime]]);\n});\n`);

          const testPath = 'worker/tests/pages-response-actions-r2-keys.test.js';
          let tests = fs.readFileSync(testPath, 'utf8');
          const oldModelTest = `test('followers read model reads its Worker-owned key directly with one R2 get', async () => {\n  const expected = pagesR2ResponseKey('followers');\n  const calls = [];\n  const response = await loadMaterializedR2Response({\n    async get(key) {\n      calls.push(key);\n      return key === expected ? workerObject({ source: 'followers-worker' }) : null;\n    },\n  }, 'followers', NOW, Number.MAX_SAFE_INTEGER);\n\n  assert.deepEqual(calls, [expected]);\n  assert.equal(response.headers.get('x-api-source'), 'worker-r2');\n  assert.deepEqual(await response.json(), { source: 'followers-worker' });\n});`;
          const newModelTest = `test('followers read model prefers the Actions-owned key', async () => {\n  const expected = pagesActionsR2ResponseKey('followers');\n  const calls = [];\n  const response = await loadMaterializedR2Response({\n    async get(key) {\n      calls.push(key);\n      return key === expected ? actionsObject({ source: 'followers-actions' }) : null;\n    },\n  }, 'followers', NOW, Number.MAX_SAFE_INTEGER);\n\n  assert.deepEqual(calls, [expected]);\n  assert.equal(response.headers.get('x-api-source'), 'actions-r2');\n  assert.deepEqual(await response.json(), { source: 'followers-actions' });\n});\n\ntest('followers read model falls back to the legacy Worker key', async () => {\n  const actionsKey = pagesActionsR2ResponseKey('followers');\n  const workerKey = pagesR2ResponseKey('followers');\n  const calls = [];\n  const response = await loadMaterializedR2Response({\n    async get(key) {\n      calls.push(key);\n      return key === workerKey ? workerObject({ source: 'followers-worker' }) : null;\n    },\n  }, 'followers', NOW, Number.MAX_SAFE_INTEGER);\n\n  assert.deepEqual(calls, [actionsKey, workerKey]);\n  assert.equal(response.headers.get('x-api-source'), 'worker-r2');\n  assert.deepEqual(await response.json(), { source: 'followers-worker' });\n});`;
          if (!tests.includes(oldModelTest)) throw new Error('followers model test block not found');
          tests = tests.replace(oldModelTest, newModelTest);
          tests = tests.replace(
            `  const expected = pagesR2ResponseKey('followers');\n  const calls = [];\n  const response = await loadMaterializedR2Response({\n    async get(key) {\n      calls.push(key);\n      return null;\n    },\n  }, 'followers', NOW, Number.MAX_SAFE_INTEGER);\n\n  assert.deepEqual(calls, [expected]);`,
            `  const actionsKey = pagesActionsR2ResponseKey('followers');\n  const workerKey = pagesR2ResponseKey('followers');\n  const calls = [];\n  const response = await loadMaterializedR2Response({\n    async get(key) {\n      calls.push(key);\n      return null;\n    },\n  }, 'followers', NOW, Number.MAX_SAFE_INTEGER);\n\n  assert.deepEqual(calls, [actionsKey, workerKey]);`,
          );
          fs.writeFileSync(testPath, tests);
          NODE

          cat > worker/tests/stationhead-followers-actions.test.js <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';

          import {
            FIXED_FOLLOWER_HANDLES,
            buildFollowerReadModel,
            createStationheadGuestSession,
            normalizeFollowerHandle,
            normalizeFollowerTargets,
          } from '../scripts/collect-stationhead-followers-actions.mjs';

          test('Actions follower collector rejects polluted Stationhead handles', () => {
            assert.equal(normalizeFollowerHandle(' SakuraMankai '), 'sakuramankai');
            assert.equal(normalizeFollowerHandle('<html lang='), '');
            assert.equal(normalizeFollowerHandle('計算上の再生数'), '');
            assert.equal(normalizeFollowerHandle('buddy46'), '');
          });

          test('Actions follower targets always include fixed handles and merge valid source masks', () => {
            const result = normalizeFollowerTargets([
              { handle: 'sakuramankai', source_mask: 2 },
              { handle: 'hinatapr0211', source_mask: 4 },
              { handle: 'HINATAPR0211', source_mask: 2 },
              { handle: '<html lang=', source_mask: 2 },
              { handle: 'buddy46', source_mask: 4 },
            ]);
            assert.deepEqual(result.targets.slice(0, 4).map((row) => row.handle), FIXED_FOLLOWER_HANDLES);
            assert.equal(result.targets.find((row) => row.handle === 'sakuramankai').source_mask, 3);
            assert.equal(result.targets.find((row) => row.handle === 'hinatapr0211').source_mask, 6);
            assert.equal(result.ignored, 2);
          });

          test('Actions follower read model calculates deltas and affiliations from daily D1 rows', () => {
            const model = buildFollowerReadModel({
              historyRows: [
                { observed_date_jst: '2026-10-02', followers_json: JSON.stringify({ sakuramankai: 4282, hinatapr0211: 100 }) },
                { observed_date_jst: '2026-10-03', followers_json: JSON.stringify({ sakuramankai: 4283, hinatapr0211: 103 }) },
              ],
              targets: [
                { handle: 'sakuramankai', source_mask: 1 },
                { handle: 'hinatapr0211', source_mask: 4 },
              ],
              latestDate: '2026-10-03',
              updatedAt: 12345,
            });
            assert.equal(model.latest_date, '2026-10-03');
            assert.equal(model.accounts.find((row) => row.handle === 'sakuramankai').previous_day_delta, 1);
            assert.equal(model.accounts.find((row) => row.handle === 'hinatapr0211').previous_day_delta, 3);
            assert.deepEqual(model.memberships.hinatapr0211, { affiliation: 'Ohisama', group: 'hinatazaka46' });
          });

          test('Actions follower auth uses production Stationhead guest endpoints', async () => {
            const calls = [];
            const session = await createStationheadGuestSession({
              fetchFn: async (url, options) => {
                calls.push([String(url), options.method]);
                if (String(url).endsWith('/web/token')) {
                  return new Response(null, { status: 204, headers: { authorization: 'Bearer test-token' } });
                }
                return new Response(null, { status: 204 });
              },
            });
            assert.equal(session.token, 'test-token');
            assert.equal(typeof session.deviceUid, 'string');
            assert.deepEqual(calls.map(([url]) => url), [
              'https://production1.stationhead.com/web/token',
              'https://production1.stationhead.com/web/guest/login',
            ]);
          });
          EOF

          cat > .github/workflows/stationhead-daily-followers.yml <<'EOF'
          name: Stationhead daily followers

          on:
            schedule:
              - cron: '0 15 * * *'
            workflow_dispatch:
            push:
              branches:
                - main
              paths:
                - .github/workflows/stationhead-daily-followers.yml

          permissions:
            contents: read

          concurrency:
            group: stationhead-daily-followers
            cancel-in-progress: false

          jobs:
            collect:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              environment: production
              steps:
                - uses: actions/checkout@v7
                  with:
                    show-progress: false

                - name: Resolve Cloudflare account context
                  uses: ./.github/actions/cloudflare-context
                  with:
                    api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

                - uses: actions/setup-node@v7
                  with:
                    node-version: '22'
                    cache: npm
                    cache-dependency-path: worker/package-lock.json

                - name: Install Worker dependencies
                  working-directory: worker
                  run: npm ci --no-audit --no-fund --ignore-scripts

                - name: Collect followers and publish read model
                  working-directory: worker
                  shell: bash
                  run: |
                    for attempt in 1 2 3; do
                      if node scripts/collect-stationhead-followers-actions.mjs; then
                        exit 0
                      fi
                      if [ "$attempt" -lt 3 ]; then
                        sleep $((attempt * 30))
                      fi
                    done
                    exit 1
          EOF

          rm .github/workflows/apply-follower-actions-fix.yml

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Run focused tests
        working-directory: worker
        run: >-
          node --test
          tests/stationhead-followers-actions.test.js
          tests/pages-response-actions-r2-keys.test.js
          tests/buddies-collector-entry-routing.test.js
          tests/stationhead-daily-followers.test.js
          tests/stationhead-daily-followers-resilient.test.js

      - name: Check syntax
        working-directory: worker
        run: npm run check:syntax

      - name: Commit wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Move Stationhead follower collection to Actions'
          git push origin HEAD:fix/follower-actions-collector
