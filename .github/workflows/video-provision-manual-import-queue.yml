name: Video · Provision manual import queues

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-cloudflare-manual-import-queues
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hp/video
    env:
      MANUAL_IMPORT_QUEUE: videoscraper-manual-imports
      MANUAL_IMPORT_DLQ: videoscraper-manual-imports-dlq
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-video-${{ hashFiles('hp/video/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-video-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure queues exist
        shell: bash
        run: |
          set -euo pipefail
          ensure_queue() {
            local name="$1"
            if npx --no-install wrangler queues info "$name" >/dev/null 2>&1; then
              echo "Queue already exists: $name"
            else
              npx --no-install wrangler queues create "$name"
            fi
            npx --no-install wrangler queues info "$name"
          }
          ensure_queue "$MANUAL_IMPORT_QUEUE"
          ensure_queue "$MANUAL_IMPORT_DLQ"
      - name: Seed recoverable D1 jobs
        run: node scripts/push-manual-import-recovery.mjs
