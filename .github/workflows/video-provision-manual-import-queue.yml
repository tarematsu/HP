name: Video · Provision manual import queues

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-cloudflare-manual-import-queues
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MANUAL_IMPORT_QUEUE: videoscraper-manual-imports
      MANUAL_IMPORT_DLQ: videoscraper-manual-imports-dlq
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hp/package-lock.json
      - name: Install HomePanel workspace dependencies
        working-directory: hp
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Ensure queues exist
        working-directory: hp
        shell: bash
        run: |
          set -euo pipefail
          ensure_queue() {
            local name="$1"
            if npm exec --workspace video -- wrangler queues info "$name" >/dev/null 2>&1; then
              echo "Queue already exists: $name"
            else
              npm exec --workspace video -- wrangler queues create "$name"
            fi
            npm exec --workspace video -- wrangler queues info "$name"
          }
          ensure_queue "$MANUAL_IMPORT_QUEUE"
          ensure_queue "$MANUAL_IMPORT_DLQ"
      - name: Seed recoverable D1 jobs
        working-directory: hp
        run: npm exec --workspace video -- node scripts/push-manual-import-recovery.mjs
