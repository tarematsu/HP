name: Prune HomePanel update releases

on:
  workflow_run:
    workflows:
      - Native Windows Build
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prune-homepanel-updates
  cancel-in-progress: false

jobs:
  prune:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPDATE_BUCKET: ${{ vars.HOMEPANEL_UPDATE_BUCKET || 'homepanel-updates' }}

    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Keep only the current release
        id: prune
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UPDATE_BUCKET" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || {
            echo "Invalid HomePanel update bucket name" >&2
            exit 1
          }

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${UPDATE_BUCKET}/objects"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          object_url() {
            local key="$1" encoded="" segment
            local -a segments
            IFS='/' read -r -a segments <<< "$key"
            for segment in "${segments[@]}"; do
              segment="$(jq -rn --arg value "$segment" '$value | @uri')"
              encoded="${encoded:+${encoded}/}${segment}"
            done
            printf '%s/%s' "$api" "$encoded"
          }

          list_keys() {
            local prefix="$1" output="$2" cursor="" response
            : > "$output"
            while true; do
              local -a query=(--get --data-urlencode "prefix=$prefix")
              [[ -z "$cursor" ]] || query+=(--data-urlencode "cursor=$cursor")
              response="$(curl --fail-with-body --silent --show-error \
                -H "$auth_header" "${query[@]}" "$api")"
              jq -e \
                '.success == true and (.result | type == "array") and all(.result[]?; .key | type == "string")' \
                <<< "$response" >/dev/null
              jq -c '.result[]?.key' <<< "$response" >> "$output"
              [[ "$(jq -r '.result_info.is_truncated // false' <<< "$response")" == true ]] || break
              cursor="$(jq -er '.result_info.cursor | select(length > 0)' <<< "$response")"
            done
          }

          manifest_file="$(mktemp)"
          curl --fail-with-body --silent --show-error \
            -H "$auth_header" \
            "$(object_url 'updates/latest/update-manifest.json')" \
            --output "$manifest_file"
          current_version="$(jq -er '.version | select(test("^[0-9]{10}$"))' "$manifest_file")"
          current_prefix="updates/releases/${current_version}/"

          list_keys 'updates/releases/' objects-before.jsonl
          jq -Rrc --arg prefix "$current_prefix" \
            'fromjson | select(startswith($prefix) | not)' \
            objects-before.jsonl > obsolete-keys.jsonl

          deleted=0
          while IFS= read -r encoded_key; do
            [[ -n "$encoded_key" ]] || continue
            key="$(jq -r '.' <<< "$encoded_key")"
            response="$(curl --fail-with-body --silent --show-error \
              -X DELETE -H "$auth_header" "$(object_url "$key")")"
            jq -e '.success == true' <<< "$response" >/dev/null
            deleted=$((deleted + 1))
          done < obsolete-keys.jsonl

          list_keys 'updates/releases/' objects-after.jsonl
          remaining="$(grep -c . objects-after.jsonl || true)"
          unexpected_remaining="$(jq -Rr --arg prefix "$current_prefix" \
            'fromjson | select(startswith($prefix) | not)' \
            objects-after.jsonl | grep -c . || true)"
          [[ "$unexpected_remaining" -eq 0 ]] || {
            echo "Obsolete HomePanel release objects remain after cleanup: $unexpected_remaining" >&2
            exit 1
          }

          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "deleted=$deleted" >> "$GITHUB_OUTPUT"
          {
            echo "## HomePanel R2 update cleanup"
            echo
            echo "- Current version: \`$current_version\`"
            echo "- Deleted obsolete objects: **$deleted**"
            echo "- Remaining release objects: **$remaining**"
          } >> "$GITHUB_STEP_SUMMARY"
