name: Import legacy spreadsheet track history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-legacy-sheet-track-history.yml'
      - 'database/facts-migrations/053_pages_track_history_daily_read_model.sql'
      - 'database/facts-migrations/054_legacy_spreadsheet_track_history.sql'
      - 'database/facts-migrations/055_legacy_spreadsheet_track_history_counts.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-legacy-sheet-track-history
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      FACTS_DATABASE_NAME: stationhead-minute
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Ensure Track History daily projection
        run: >-
          node node_modules/wrangler/bin/wrangler.js d1 execute "$FACTS_DATABASE_NAME"
          --remote --yes
          --file ../database/facts-migrations/053_pages_track_history_daily_read_model.sql
      - name: Import legacy spreadsheet Track History
        run: >-
          node node_modules/wrangler/bin/wrangler.js d1 execute "$FACTS_DATABASE_NAME"
          --remote --yes
          --file ../database/facts-migrations/054_legacy_spreadsheet_track_history.sql
      - name: Reconcile legacy spreadsheet play counts
        run: >-
          node node_modules/wrangler/bin/wrangler.js d1 execute "$FACTS_DATABASE_NAME"
          --remote --yes
          --file ../database/facts-migrations/055_legacy_spreadsheet_track_history_counts.sql
      - name: Verify imported Track History
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_JSON="$(node node_modules/wrangler/bin/wrangler.js d1 execute "$FACTS_DATABASE_NAME" \
            --remote --yes --json \
            --command "SELECT COUNT(DISTINCT play_date) AS day_count, COUNT(*) AS row_count, COALESCE(SUM(CAST(json_extract(row_json,'$.play_count') AS INTEGER)),0) AS total_plays FROM sh_pages_track_history_read_model WHERE row_key LIKE 'legacy-sheet|%'")"
          printf '%s\n' "$VERIFY_JSON"
          VERIFY_JSON="$VERIFY_JSON" node - <<'NODE'
          const payload = JSON.parse(process.env.VERIFY_JSON || '[]');
          const containers = Array.isArray(payload) ? payload : [payload];
          const rows = containers.flatMap((container) => container?.results || container?.result?.results || []);
          const row = rows[0] || {};
          const actual = {
            day_count: Number(row.day_count || 0),
            row_count: Number(row.row_count || 0),
            total_plays: Number(row.total_plays || 0),
          };
          const expected = { day_count: 33, row_count: 1822, total_plays: 14119 };
          if (Object.keys(expected).some((key) => actual[key] !== expected[key])) {
            throw new Error(`legacy Track History verification failed: ${JSON.stringify({ actual, expected })}`);
          }
          console.log(JSON.stringify({ ok: true, ...actual }));
          NODE
