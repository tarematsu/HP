name: Inspect Kuwo mobile rank menu
on:
  push:
    branches: [research/kuwo-jp-chart-probe]
    paths: [.github/workflows/kuwo-mobile-rank-menu-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect mobile rank API
        run: |
          python3 <<'PY'
          import json,urllib.request
          urls=['https://m.kuwo.cn/newh5app/api/mobile/v1/typelist/rank','http://m.kuwo.cn/newh5app/api/mobile/v1/typelist/rank']
          for u in urls:
            try:
              q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://m.kuwo.cn/'})
              with urllib.request.urlopen(q,timeout=12) as r:s=r.read().decode('utf-8','replace'); print('URL',u,'HTTP',r.status,'bytes',len(s))
              j=json.loads(s)
              print('TOP_KEYS',list(j.keys()) if isinstance(j,dict) else type(j))
              def walk(x,path=''):
                if isinstance(x,dict):
                  blob=json.dumps(x,ensure_ascii=False)
                  if '酷我日语榜' in blob or any(str(x.get(k,''))=='183' for k in ['id','sourceid','sourceId','bangId','bangid']):
                    print('MATCH',path,blob[:30000])
                  for k,v in x.items():walk(v,path+'/'+str(k))
                elif isinstance(x,list):
                  for i,v in enumerate(x):walk(v,path+f'/{i}')
              walk(j)
            except Exception as e:print('ERR',u,repr(e))
          PY
