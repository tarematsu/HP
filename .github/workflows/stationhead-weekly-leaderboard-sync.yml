name: Stationhead weekly leaderboard sync

on:
  workflow_dispatch:
    inputs:
      ranking_date:
        description: Monday YYYY-MM-DD to import; empty uses the current JST week
        required: false
        type: string
  schedule:
    # Tuesday 15:15 UTC = Wednesday 00:15 JST. By then the Monday-night-through-
    # Tuesday capture window is closed, so the database changes at most once/week.
    - cron: '15 15 * * 2'

permissions:
  contents: read

concurrency:
  group: stationhead-weekly-leaderboard-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OTHER_DATABASE_NAME: stationhead-other
      REQUESTED_RANKING_DATE: ${{ inputs.ranking_date || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Stationhead worker dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund

      - name: Resolve Monday ranking date
        id: week
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_RANKING_DATE" ]]; then
            ranking_date="$REQUESTED_RANKING_DATE"
          else
            ranking_date="$(node - <<'NODE'
          const JST = 9 * 60 * 60 * 1000;
          const local = new Date(Date.now() + JST);
          const monday = new Date(Date.UTC(local.getUTCFullYear(), local.getUTCMonth(), local.getUTCDate()));
          monday.setUTCDate(monday.getUTCDate() - ((monday.getUTCDay() + 6) % 7));
          process.stdout.write(monday.toISOString().slice(0, 10));
          NODE
          )"
          fi
          node - "$ranking_date" <<'NODE'
          const value = process.argv[2];
          if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) throw new Error('ranking_date must be YYYY-MM-DD');
          const date = new Date(`${value}T00:00:00Z`);
          if (Number.isNaN(date.getTime()) || date.getUTCDay() !== 1 || date.toISOString().slice(0, 10) !== value) {
            throw new Error('ranking_date must be a real Monday date');
          }
          NODE
          echo "ranking_date=$ranking_date" >> "$GITHUB_OUTPUT"

      - name: Pull sanitized weekly candidate directly from R2
        shell: bash
        env:
          RANKING_DATE: ${{ steps.week.outputs.ranking_date }}
        run: |
          set -euo pipefail
          mkdir -p leaderboard-artifact
          output='leaderboard-artifact/stationhead-weekly-leaderboard.json'
          key="diagnostics/stationhead-leaderboard/weekly/${RANKING_DATE}.json"
          encoded_key="$(jq -rn --arg value "$key" '$value | split("/") | map(@uri) | join("/")')"
          api='https://api.cloudflare.com/client/v4'
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          cursor=''
          found=0
          while true; do
            query=(--get --data-urlencode 'per_page=1000')
            [[ -z "$cursor" ]] || query+=(--data-urlencode "cursor=$cursor")
            buckets_response="$(curl --fail-with-body --silent --show-error \
              -H "$auth_header" "${query[@]}" \
              "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets")"
            jq -e '.success == true and (.result.buckets | type == "array")' \
              <<< "$buckets_response" >/dev/null

            mapfile -t bucket_names < <(jq -r '.result.buckets[]?.name' <<< "$buckets_response")
            for bucket in "${bucket_names[@]}"; do
              [[ "$bucket" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || continue
              candidate="$(mktemp)"
              code="$(curl --silent --show-error \
                -H "$auth_header" \
                --output "$candidate" \
                --write-out '%{http_code}' \
                "$api/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${bucket}/objects/${encoded_key}" || true)"
              if [[ "$code" == '200' ]]; then
                found=$((found + 1))
                [[ "$found" -eq 1 ]] || {
                  echo 'Weekly leaderboard candidate exists in more than one R2 bucket.' >&2
                  exit 1
                }
                mv "$candidate" "$output"
              else
                rm -f "$candidate"
                [[ "$code" == '404' ]] || {
                  echo "R2 weekly candidate lookup failed with HTTP ${code}." >&2
                  exit 1
                }
              fi
            done

            next_cursor="$(jq -r '.result_info.cursor // empty' <<< "$buckets_response")"
            [[ -n "$next_cursor" ]] || break
            [[ "$next_cursor" != "$cursor" ]] || {
              echo 'Cloudflare R2 bucket listing returned a repeated cursor.' >&2
              exit 1
            }
            cursor="$next_cursor"
          done

          [[ "$found" -eq 1 ]] || {
            echo "No complete weekly leaderboard candidate exists for ${RANKING_DATE}. Database left unchanged." >&2
            exit 1
          }

          node - "$output" "$RANKING_DATE" <<'NODE'
          const fs = require('node:fs');
          const [path, expectedDate] = process.argv.slice(2);
          const candidate = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (candidate?.version !== 1 || candidate?.ranking_date !== expectedDate || !Array.isArray(candidate?.rows)) {
            throw new Error('R2 weekly leaderboard candidate has an invalid envelope');
          }
          const forbidden = /authorization|cookie|token|secret|password|device.?id|device.?uid|session/i;
          const visit = (value, trail = []) => {
            if (Array.isArray(value)) return value.forEach((item, index) => visit(item, trail.concat(String(index))));
            if (!value || typeof value !== 'object') return;
            for (const [key, item] of Object.entries(value)) {
              if (forbidden.test(key)) throw new Error(`forbidden candidate field: ${trail.concat(key).join('.')}`);
              visit(item, trail.concat(key));
            }
          };
          visit(candidate);
          NODE

      - name: Upsert authoritative weekly snapshot into stationhead-other
        env:
          STATIONHEAD_WEEKLY_LEADERBOARD_FILE: ${{ github.workspace }}/leaderboard-artifact/stationhead-weekly-leaderboard.json
        working-directory: worker
        run: node scripts/import-stationhead-weekly-leaderboard.mjs

      - name: Upload sanitized weekly candidate audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stationhead-weekly-leaderboard-${{ steps.week.outputs.ranking_date }}
          path: leaderboard-artifact/stationhead-weekly-leaderboard.json
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 9
