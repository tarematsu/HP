name: Collect Spotify Japan artist chart now

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-spotify-chart-now.yml'

permissions:
  contents: read

concurrency:
  group: spotify-chart-manual-collection
  cancel-in-progress: false

jobs:
  enqueue:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - name: Install Worker diagnostic tooling
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Inspect Spotify Queue consumers and D1 sync state
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const cfg = JSON.parse(readFileSync('worker/wrangler.spotify-playcount.jsonc', 'utf8'));
          const queueName = cfg.queues.producers.find(row => row.binding === 'SPOTIFY_PLAYCOUNT_QUEUE')?.queue;
          const dbId = cfg.d1_databases.find(row => row.binding === 'OTHER_DB')?.database_id;
          const base = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers = { authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN, 'content-type': 'application/json' };
          const api = async (path, body) => {
            const res = await fetch(base + path, { method: body ? 'POST' : 'GET', headers,
              ...(body ? { body: JSON.stringify(body) } : {}) });
            const parsed = await res.json().catch(() => ({}));
            if (!res.ok || parsed.success === false) throw new Error('Cloudflare preflight HTTP ' + res.status + ': ' + path);
            return parsed.result;
          };
          const list = await api('/queues');
          const queue = list.find(row => row.queue_name === queueName);
          if (!queue?.queue_id) throw new Error('Spotify Queue does not exist');
          const detail = await api('/queues/' + queue.queue_id);
          const consumers = (detail.consumers || []).map(row => ({
            script_name: row.script || row.script_name || null,
            type: row.type || 'worker',
          }));
          const d1 = await api('/d1/database/' + dbId + '/query', {
            sql: 'SELECT latest_chart_date,latest_observed_at FROM sh_spotify_artist_chart_sync_state WHERE id=1',
          });
          console.log(JSON.stringify({
            event: 'spotify_artist_chart_queue_preflight',
            queue: queueName,
            delivery_paused: detail.settings?.delivery_paused ?? null,
            delivery_delay: detail.settings?.delivery_delay ?? null,
            consumer_keys: (detail.consumers || []).map(row => Object.keys(row)),
            consumers,
            expected_consumer: 'sh-spotify-playcount-collector',
            current_chart_state: d1?.[0]?.results?.[0] || null,
          }));
          if (detail.settings?.delivery_paused === true) {
            throw new Error('Spotify Queue delivery is paused');
          }
          if (!consumers.some(row => row.type === 'worker' && row.script_name === 'sh-spotify-playcount-collector')) {
            throw new Error('Spotify Queue has no Worker consumer');
          }
          NODE
      - name: Enqueue Spotify artist chart and inspect Worker errors
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          (timeout 25s npx wrangler tail sh-spotify-playcount-collector --format json \
            > "$RUNNER_TEMP/spotify-artist-chart-tail.jsonl" \
            2> "$RUNNER_TEMP/spotify-artist-chart-tail.err" || true) &
          tail_pid=$!
          sleep 6
          node scripts/diagnose-spotify-artist-chart-actions.mjs
          wait "$tail_pid"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const path = process.env.RUNNER_TEMP + '/spotify-artist-chart-tail.jsonl';
          const lines = readFileSync(path, 'utf8').split(/\r?\n/);
          const matches = [];
          const invocations = [];
          for (const line of lines) {
            try {
              const record = JSON.parse(line);
              invocations.push({
                outcome: record.outcome || null,
                event_type: record.event?.type || null,
                exception_count: (record.exceptions || []).length,
              });
              for (const exception of record.exceptions || []) {
                matches.push(String(exception?.message || exception?.name || 'Worker exception').slice(0, 900));
              }
              for (const item of record.logs || []) {
                const detail = Array.isArray(item?.message) ? item.message.join(' ') : String(item?.message || '');
                if (/spotify_scheduled_queue_dispatch_failed|spotify_artist_chart_source_not_published|Spotify Charts|Spotify artist chart|source-not-published/i.test(detail)) {
                  matches.push(detail.slice(0, 900));
                }
              }
            } catch {}
          }
          const diagnosticStderr = readFileSync(process.env.RUNNER_TEMP + '/spotify-artist-chart-tail.err', 'utf8').trim();
          console.log(JSON.stringify({
            event: 'spotify_chart_worker_tail_diagnostic',
            observed_tail_events: invocations.length,
            invocations: invocations.slice(-5),
            matching_error_count: matches.length,
            errors: matches.slice(-5),
            tail_status: diagnosticStderr ? diagnosticStderr.slice(-350) : 'no diagnostic errors',
          }));
          NODE
      - name: Confirm chart persisted in Cloudflare D1
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const config = JSON.parse(readFileSync('worker/wrangler.spotify-playcount.jsonc', 'utf8'));
          const dbId = config.d1_databases.find(row => row.binding === 'OTHER_DB')?.database_id;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          if (!dbId || !account || !token) throw new Error('Cloudflare D1 verification configuration missing');

          const expectedDate = new Date(Date.now() + 9 * 3600_000 - 86400_000).toISOString().slice(0, 10);
          const endpoint = 'https://api.cloudflare.com/client/v4/accounts/'
            + encodeURIComponent(account) + '/d1/database/' + encodeURIComponent(dbId) + '/query';
          const sql = 'SELECT latest_chart_date, latest_observed_at, '
            + '(SELECT COUNT(*) FROM sh_spotify_artist_chart_daily '
            + 'WHERE chart_date = s.latest_chart_date) AS matched_artists '
            + 'FROM sh_spotify_artist_chart_sync_state AS s WHERE id = 1';

          for (let attempt = 1; attempt <= 6; attempt++) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                authorization: 'Bearer ' + token,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ sql }),
              signal: AbortSignal.timeout(15000),
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload.success === false) {
              throw new Error('Cloudflare D1 verification request failed: HTTP ' + response.status);
            }
            const row = payload.result?.[0]?.results?.[0];
            const chartDate = String(row?.latest_chart_date || '');
            if (chartDate >= expectedDate) {
              console.log(JSON.stringify({
                ok: true,
                event: 'spotify_artist_chart_d1_verified',
                chart_date: chartDate,
                expected_date: expectedDate,
                matched_artists: Number(row?.matched_artists || 0),
                observed_at: row?.latest_observed_at,
              }));
              process.exit(0);
            }
            if (attempt < 6) await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error('Spotify Japan artist chart has not reached ' + expectedDate + ' in D1 after waiting');
          NODE
