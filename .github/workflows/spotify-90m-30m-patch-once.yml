name: Apply Spotify 90m music 30m TALKABOUT schedule once

on:
  push:
    branches:
      - fix/spotify-90m-music-30m-talkabout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spotify-90m-music-30m-talkabout

      - name: Apply Spotify schedule and alternating-track loop
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('hp/native/src/spotify_webviews.cpp')
          source = source_path.read_text(encoding='utf-8')

          if 'kSpotifyMusicPhaseMs' not in source:
              source = source.replace(
                  'constexpr wchar_t kSpotifyPodcastUrl[] =\n'
                  '    L"https://open.spotify.com/show/2ZQy2mlwQodabAILwZ02Ed";\n',
                  'constexpr wchar_t kSpotifyPodcastUrl[] =\n'
                  '    L"https://open.spotify.com/show/2ZQy2mlwQodabAILwZ02Ed";\n'
                  'constexpr wchar_t kSpotifyTokyoSnowUrl[] =\n'
                  '    L"https://open.spotify.com/track/307SI8AgVvBbNTkNrETKHW";\n',
                  1,
              )
              source = source.replace(
                  'constexpr UINT kSpotifyModePhaseMs = 60U * 60U * 1000U;\n',
                  'constexpr UINT kSpotifyMusicPhaseMs = 90U * 60U * 1000U;\n'
                  'constexpr UINT kSpotifyPodcastPhaseMs = 30U * 60U * 1000U;\n',
                  1,
              )

          if '__homePanelSakuraAlternatingLoop' not in source:
              start = source.index('constexpr wchar_t kSpotifyPlaybackScript[] = LR"JS(')
              end = source.index('constexpr wchar_t kSpotifyPodcastPlaybackScript[] = LR"JS(', start)
              music_script = r'''constexpr wchar_t kSpotifyPlaybackScript[] = LR"JS(
(() => {
  if (window.__homePanelSakuraAlternatingLoop) return;
  window.__homePanelSakuraAlternatingLoop = true;
  const lonesomeUrl = 'https://open.spotify.com/album/2f2Ik9JeinFVWZuFb3i35b';
  const lonesomePath = '/album/2f2Ik9JeinFVWZuFb3i35b';
  const tokyoSnowUrl = 'https://open.spotify.com/track/307SI8AgVvBbNTkNrETKHW';
  const tokyoSnowPath = '/track/307SI8AgVvBbNTkNrETKHW';
  const stallLimit = 2;
  let lastMedia = null;
  let lastTime = NaN;
  let stalledChecks = 0;
  let lastReported = null;
  let targetStarted = false;
  let lastTargetTime = NaN;
  let completionMedia = null;

  const report = playing => {
    if (lastReported === playing) return;
    lastReported = playing;
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(
          playing ? 'spotify:playing' : 'spotify:not-playing');
    }
  };
  const visible = element => {
    if (!element || element.disabled) return false;
    const style = window.getComputedStyle(element);
    const rect = element.getBoundingClientRect();
    return style.display !== 'none' && style.visibility !== 'hidden' &&
           rect.width > 0 && rect.height > 0;
  };
  const buttonShowsPlaying = button => {
    if (!button) return false;
    const label = (button.getAttribute('aria-label') || '').toLowerCase();
    return label.includes('pause') || label.includes('一時停止');
  };
  const playbackButton = () =>
      document.querySelector('button[data-testid="control-button-playpause"]') ||
      document.querySelector('button[data-testid="play-button"]');
  const targetPlayButton = () =>
      Array.from(document.querySelectorAll(
          'button[data-testid="play-button"]')).find(visible) || null;
  const mediaElement = () => {
    const items = Array.from(document.querySelectorAll('audio, video'));
    return items.find(item => !item.paused && !item.ended) || items[0] || null;
  };
  const currentTarget = () => {
    if (location.pathname.endsWith(lonesomePath)) {
      return { nextUrl: tokyoSnowUrl };
    }
    if (location.pathname.endsWith(tokyoSnowPath)) {
      return { nextUrl: lonesomeUrl };
    }
    return null;
  };
  const ensureRepeatOne = () => {
    const repeat = document.querySelector(
        'button[data-testid="control-button-repeat"]');
    if (!repeat || repeat.getAttribute('aria-checked') === 'mixed') return;
    repeat.click();
    window.setTimeout(() => {
      const current = document.querySelector(
          'button[data-testid="control-button-repeat"]');
      if (current && current.getAttribute('aria-checked') !== 'mixed') {
        current.click();
      }
    }, 300);
  };
  const samplePlayback = () => {
    const media = mediaElement();
    if (!media) {
      lastMedia = null;
      lastTime = NaN;
      stalledChecks = 0;
      return null;
    }
    const currentTime = Number.isFinite(media.currentTime) ? media.currentTime : NaN;
    const ready = !media.paused && !media.ended && media.readyState >= 2;
    if (!ready) {
      lastMedia = media;
      lastTime = currentTime;
      stalledChecks = stallLimit;
      return false;
    }
    if (media !== lastMedia || !Number.isFinite(lastTime) ||
        !Number.isFinite(currentTime)) {
      lastMedia = media;
      lastTime = currentTime;
      stalledChecks = 0;
      return true;
    }
    if (Math.abs(currentTime - lastTime) >= 0.5) {
      stalledChecks = 0;
    } else {
      ++stalledChecks;
    }
    lastMedia = media;
    lastTime = currentTime;
    return stalledChecks < stallLimit;
  };
  const recoverPlayback = () => {
    const media = mediaElement();
    if (media && !media.ended) {
      try {
        const promise = media.play();
        if (promise && typeof promise.catch === 'function') promise.catch(() => {});
      } catch (_) {
      }
    }
    const button = playbackButton();
    if (!visible(button) || buttonShowsPlaying(button)) return;
    button.click();
  };
  const armCompletion = (media, nextUrl) => {
    if (!media || media === completionMedia) return;
    completionMedia = media;
    media.addEventListener('ended', () => {
      report(false);
      location.replace(nextUrl);
    }, { once: true });
  };
  const targetWrapped = media => {
    if (!media || !Number.isFinite(media.currentTime)) return false;
    const currentTime = media.currentTime;
    const wrapped = Number.isFinite(lastTargetTime) &&
        lastTargetTime >= 30 && currentTime + 30 < lastTargetTime;
    lastTargetTime = currentTime;
    return wrapped;
  };
  const ensure = () => {
    if (location.hostname !== 'open.spotify.com') {
      report(false);
      return;
    }
    const targetInfo = currentTarget();
    if (!targetInfo) {
      report(false);
      location.replace(lonesomeUrl);
      return;
    }
    if (!targetStarted) {
      const target = targetPlayButton();
      if (!target) {
        report(false);
        return;
      }
      if (!buttonShowsPlaying(target)) {
        target.click();
        lastMedia = null;
        lastTime = NaN;
        stalledChecks = 0;
        lastTargetTime = NaN;
        report(false);
        return;
      }
      targetStarted = true;
      lastTargetTime = NaN;
    }
    ensureRepeatOne();
    const media = mediaElement();
    armCompletion(media, targetInfo.nextUrl);
    if (targetWrapped(media)) {
      report(false);
      location.replace(targetInfo.nextUrl);
      return;
    }
    const mediaPlaying = samplePlayback();
    const button = playbackButton();
    const playing = mediaPlaying === null ? buttonShowsPlaying(button) : mediaPlaying;
    if (!playing) recoverPlayback();
    report(playing);
  };

  window.__homePanelSpotifyEnsure = ensure;
  ensure();
})();
)JS";
'''
              source = source[:start] + music_script + '\n' + source[end:]

          old_timer = '''  SetTimer(host, kSpotifyModeTimer, kSpotifyModePhaseMs, nullptr);'''
          new_timer = '''  const UINT duration =
      podcastMode_ ? kSpotifyPodcastPhaseMs : kSpotifyMusicPhaseMs;
  SetTimer(host, kSpotifyModeTimer, duration, nullptr);'''
          if old_timer in source:
              source = source.replace(old_timer, new_timer, 1)

          source_path.write_text(source, encoding='utf-8')

          test_path = Path('hp/video/test/native-spotify-webviews-contract.test.js')
          tests = test_path.read_text(encoding='utf-8')

          old_name = "test('all six accounts alternate Lonesome rabbit and Sakura TALKABOUT every hour with staggered switches', () => {"
          if old_name in tests:
              start = tests.index(old_name)
              end = tests.index("\ntest('music phase keeps the requested track release on repeat one'", start)
              replacement = r'''test('all six accounts run 90 minutes of alternating music then 30 minutes of Sakura TALKABOUT', () => {
  assert.match(spotify, /kSpotifyModeTimer = 2/);
  assert.match(spotify, /kSpotifyModeSwitchTimer = 3/);
  assert.match(spotify, /kSpotifyMusicPhaseMs = 90U \* 60U \* 1000U/);
  assert.match(spotify, /kSpotifyPodcastPhaseMs = 30U \* 60U \* 1000U/);
  assert.match(spotify, /podcastMode_ \? kSpotifyPodcastPhaseMs : kSpotifyMusicPhaseMs/);
  assert.match(spotify, /kSpotifyModeStaggerMs = 10U \* 1000U/);
  assert.match(spotifyHeader, /bool podcastMode_ = false/);
  assert.match(
    spotify,
    /void SpotifyWebViews::ToggleMode\(\) noexcept[\s\S]*podcastMode_ = !podcastMode_;[\s\S]*for \(Slot& slot : slots_\)[\s\S]*slot\.index == 0[\s\S]*NavigateSlotToCurrentMode\(slot\)[\s\S]*slot\.index\) \* kSpotifyModeStaggerMs[\s\S]*SetTimer\(slot\.hostWindow, kSpotifyModeSwitchTimer, delay, nullptr\)[\s\S]*ArmModeTimer\(\)/,
  );
  assert.match(
    spotify,
    /wparam == kSpotifyModeSwitchTimer[\s\S]*KillTimer\(hwnd, kSpotifyModeSwitchTimer\)[\s\S]*NavigateSlotToCurrentMode\(\*slot\)/,
  );
  assert.match(
    spotify,
    /NavigateSlotToCurrentMode\(Slot& slot\)[\s\S]*Navigate\(podcastMode_ \? kSpotifyPodcastUrl : kSpotifyAlbumUrl\)/,
  );
  assert.match(spotify, /KillTimer\(slot\.hostWindow, kSpotifyModeSwitchTimer\)/);
  assert.doesNotMatch(spotifyHeader, /SetAmazonPodcastMode/);
  assert.doesNotMatch(spotify, /SetSpotifyAmazonPodcastMode/);
});
'''
              tests = tests[:start] + replacement + tests[end:]

          old_music_name = "test('music phase keeps the requested track release on repeat one', () => {"
          if old_music_name in tests:
              start = tests.index(old_music_name)
              end = tests.index("\ntest('podcast phase starts Sakura TALKABOUT", start)
              replacement = r'''test('music phase alternates Lonesome rabbit and TOKYO SNOW after full-track completion', () => {
  assert.match(spotify, /2f2Ik9JeinFVWZuFb3i35b/);
  assert.match(spotify, /307SI8AgVvBbNTkNrETKHW/);
  assert.match(spotify, /__homePanelSakuraAlternatingLoop/);
  assert.match(spotify, /currentTarget/);
  assert.match(spotify, /return \{ nextUrl: tokyoSnowUrl \}/);
  assert.match(spotify, /return \{ nextUrl: lonesomeUrl \}/);
  assert.match(spotify, /control-button-repeat/);
  assert.match(spotify, /aria-checked.*mixed/s);
  assert.match(spotify, /media\.addEventListener\('ended'/);
  assert.match(spotify, /lastTargetTime >= 30 && currentTime \+ 30 < lastTargetTime/);
  assert.match(spotify, /location\.replace\(targetInfo\.nextUrl\)/);
  assert.match(spotify, /let targetStarted = false/);
  assert.match(
    spotify,
    /if \(!targetStarted\)[\s\S]*if \(!target\)[\s\S]*report\(false\)[\s\S]*if \(!buttonShowsPlaying\(target\)\)[\s\S]*target\.click\(\)[\s\S]*report\(false\)[\s\S]*targetStarted = true/,
  );
  assert.match(spotify, /window\.__homePanelSpotifyEnsure = ensure/);
});
'''
              tests = tests[:start] + replacement + tests[end:]

          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Run Spotify contract tests
        run: |
          node --test hp/video/test/native-spotify-webviews-contract.test.js
          node --test hp/video/test/native-spotify-load-reduction-contract.test.js

      - name: Commit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hp/native/src/spotify_webviews.cpp hp/video/test/native-spotify-webviews-contract.test.js
          git commit -m 'Run Spotify 90m alternating music then 30m TALKABOUT'
          git push origin HEAD:fix/spotify-90m-music-30m-talkabout
