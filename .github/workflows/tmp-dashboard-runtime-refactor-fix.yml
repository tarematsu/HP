name: Temporary dashboard runtime refactor fix

on:
  push:
    branches:
      - refactor/dashboard-chart-runtime-common-20261001

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/dashboard-chart-runtime-common-20261001
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fixes
        run: node scripts/tmp-dashboard-runtime-refactor-fix.mjs
      - name: Verify Pages tests
        working-directory: site
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run check
          node --test tests/*.test.js
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/public site/tests
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finish dashboard chart runtime commonization"
          git push origin HEAD:refactor/dashboard-chart-runtime-common-20261001
