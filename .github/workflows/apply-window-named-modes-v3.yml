name: Apply window-named monitor/audio modes v3

on:
  push:
    branches:
      - feat/window-named-audio-monitor-modes
    paths:
      - .github/workflows/apply-window-named-modes-v3.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: python .github/scripts/apply_window_named_modes.py
      - name: Run video tests
        run: npm test --prefix hp/video
      - name: Commit implementation
        shell: bash
        run: |
          git rm .github/workflows/apply-window-named-modes.yml
          git rm .github/workflows/apply-window-named-modes-v2.yml
          git rm .github/workflows/apply-window-named-modes-v3.yml
          git rm .github/scripts/apply_window_named_modes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hp/native/src hp/video/test
          git commit -m "Use window names for Stationhead audio and monitor modes"
          git push origin HEAD:feat/window-named-audio-monitor-modes
