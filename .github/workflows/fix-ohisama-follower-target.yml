name: Apply Ohisama follower target fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-ohisama-follower-target.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch source and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          source_path = Path('worker/src/ohisama-collector-entry.js')
          source = source_path.read_text()
          replacement = '''  const station = channel.current_station || {};
            const party = station.streaming_party || channel.streaming_party || {};
            const hostSources = [
              station.host,
              channel.host,
              station.current_host,
              channel.current_host,
              station.broadcaster,
              station.dj,
              station.account,
              station.host_account,
            ].filter((value) => value && typeof value === 'object' && !Array.isArray(value));
            const hostIdentities = hostSources.flatMap((value) => {
              const account = value.account;
              return account && typeof account === 'object' && !Array.isArray(account)
                ? [account, value]
                : [value];
            });
            const hostAccountId = nullableNumber(firstDefined(
              ...hostIdentities.flatMap((value) => [value.account_id, value.id]),
            ));
            const hostHandle = normalizedHandle(firstDefined(
              ...hostIdentities.flatMap((value) => [value.handle, value.username]),
              station.host_handle,
              station.host_username,
              channel.host_handle,
            ));
            return {
              channel_id: channelId,
              station_id: nullableNumber(firstDefined(channel.current_station_id, station.id)),
              is_broadcasting: nullableBooleanCode(station.is_broadcasting),
              listener_count: nullableNumber(firstDefined(station.listener_count, channel.listener_count)),
              online_member_count: nullableNumber(channel.online_member_count),
              total_member_count: nullableNumber(channel.total_member_count),
              guest_count: nullableNumber(firstDefined(station.guest_count, channel.guest_count)),
              reported_total_listens: nullableNumber(station.total_listens),
              stream_goal: nullableNumber(party.stream_goal),
              reported_current_stream_count: nullableNumber(party.current_stream_count),
              host_account_id: hostAccountId,
              host_handle: hostHandle,
            };
          }

          function collectorHeaders'''
          source, count = re.subn(
              r"  const station = channel\.current_station \|\| \{\};.*?\n  \};\n\}\n\nfunction collectorHeaders",
              replacement,
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'normalization replacement count={count}')
          old_guard = "if (snapshot?.is_broadcasting !== 1 || !snapshot?.host_handle) return false;"
          if old_guard not in source:
              raise SystemExit('registration guard not found')
          source = source.replace(old_guard, "if (!snapshot?.host_handle) return false;", 1)
          source_path.write_text(source)

          test_path = Path('worker/tests/ohisama-collector.test.js')
          test = test_path.read_text()
          old_idle = '''  assert.equal(await registerOhisamaFollowerTarget(env, {
            is_broadcasting: 0,
            host_handle: 'idlehost',
          }, 123457), false);
            assert.equal(runs, 1);'''
          new_idle = '''  assert.equal(await registerOhisamaFollowerTarget(env, {
            is_broadcasting: 0,
            host_handle: 'idlehost',
          }, 123457), true);
            assert.deepEqual(bound, ['idlehost', 4, 123457]);
            assert.equal(runs, 2);

            assert.equal(await registerOhisamaFollowerTarget(env, {
              is_broadcasting: 1,
              host_handle: null,
            }, 123458), false);
            assert.equal(runs, 2);'''
          if old_idle not in test:
              test, n = re.subn(
                  r"  assert\.equal\(await registerOhisamaFollowerTarget\(env, \{\n\s+is_broadcasting: 0,\n\s+host_handle: 'idlehost',\n\s+\}, 123457\), false\);\n\s+assert\.equal\(runs, 1\);",
                  new_idle,
                  test,
                  count=1,
              )
              if n != 1:
                  raise SystemExit(f'idle test replacement count={n}')
          else:
              test = test.replace(old_idle, new_idle, 1)

          marker = "test('ohisama active host is permanently added to the follower target registry', async () => {"
          if marker not in test:
              raise SystemExit('registration test marker not found')
          addition = '''test('ohisama normalization accepts alternate broadcaster account shapes', () => {
            const value = normalizeOhisamaSnapshot({
              id: 46,
              alias: 'ohisama',
              current_station_id: 101,
              current_station: {
                id: 101,
                is_broadcasting: null,
                broadcaster: { id: 88, handle: 'AlternateHost' },
              },
            });
            assert.equal(value.host_account_id, 88);
            assert.equal(value.host_handle, 'alternatehost');
          });

          '''
          test = test.replace(marker, addition + marker, 1)
          test_path.write_text(test)
          PY
      - name: Run Ohisama collector tests
        run: |
          npm --prefix worker ci --prefer-offline --no-audit --no-fund
          cd worker
          node --test tests/ohisama-collector.test.js tests/ohisama-collector-optimized.test.js tests/stationhead-daily-followers.test.js
      - name: Commit fix and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-ohisama-follower-target.yml
          git add worker/src/ohisama-collector-entry.js worker/tests/ohisama-collector.test.js
          git commit -m "Fix Ohisama follower target registration"
          git push origin HEAD:main
