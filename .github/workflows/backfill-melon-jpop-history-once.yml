name: Backfill Melon J-pop chart history

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/backfill-melon-jpop-history-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regional-music-r2-collection
  cancel-in-progress: false

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Backfill Melon J-pop weekly and monthly history
        working-directory: worker
        run: node scripts/backfill-melon-jpop-history-actions.mjs --start=2012-01-01 --types=week,month --concurrency=4 --persist
      - name: Refresh Melon snapshot and publish regional read model
        working-directory: worker
        run: node scripts/collect-regional-r2-actions.mjs --services=melon
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melon-jpop-history
          path: worker/artifacts/melon-jpop-history.json
          if-no-files-found: warn
