name: Import SH snapshot

on:
  push:
    branches:
      - agent/import-sh-snapshot
    paths:
      - .github/workflows/import-sh-snapshot.yml

permissions:
  contents: write

jobs:
  import:
    name: Import current SH main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-sh-snapshot
          fetch-depth: 0

      - name: Clone SH without history
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/tarematsu/SH.git "$RUNNER_TEMP/SH-source"
          git -C "$RUNNER_TEMP/SH-source" rev-parse HEAD > "$RUNNER_TEMP/sh-source-sha"

      - name: Copy SH snapshot
        run: |
          set -euo pipefail
          rm -rf SH
          mkdir -p SH
          rsync -a --delete --exclude=.git/ "$RUNNER_TEMP/SH-source/" SH/
          source_sha="$(cat "$RUNNER_TEMP/sh-source-sha")"
          cat > SH/MIGRATION.md <<EOF
          # SH repository migration

          This directory is a history-free snapshot imported from \`tarematsu/SH\`.

          - Source branch: \`main\`
          - Source commit: \`${source_sha}\`
          - Imported by: \`.github/workflows/import-sh-snapshot.yml\`

          The original workflows are retained under \`SH/.github/workflows\` as migration source material. GitHub does not execute nested workflow files. Active HP-repository workflows must live under the repository-level \`.github/workflows\` directory.
          EOF

      - name: Commit imported snapshot
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add SH
          if git diff --cached --quiet; then
            echo "SH snapshot already matches the source"
            exit 0
          fi
          source_sha="$(cat "$RUNNER_TEMP/sh-source-sha")"
          git commit -m "Import SH repository snapshot (${source_sha:0:12})"
          git push origin HEAD:agent/import-sh-snapshot
