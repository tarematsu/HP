name: One-time prepare native update rollout fix

on:
  push:
    branches:
      - agent/fix-native-update-rollout
    paths:
      - ".github/workflows/one-time-prepare-native-update-fix.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-native-update-rollout
          fetch-depth: 0

      - name: Apply permanent update rollout fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          scheduler = Path('hp/cloud/src/scheduler_runtime.ts')
          text = scheduler.read_text()
          old = 'const RUNTIME_VERSION = 5;'
          new = 'const RUNTIME_VERSION = 6;'
          if old not in text:
              raise SystemExit(f'missing expected scheduler token: {old}')
          scheduler.write_text(text.replace(old, new, 1))

          budget = Path('hp/video/test/cloud-usage-budget.test.js')
          text = budget.read_text()
          old = 'RUNTIME_VERSION = 5'
          new = 'RUNTIME_VERSION = 6'
          if old not in text:
              raise SystemExit(f'missing expected budget token: {old}')
          budget.write_text(text.replace(old, new, 1))

          native = Path('.github/workflows/native-windows-build.yml')
          text = native.read_text()
          text = text.replace(
              'devices will pick the release up via the 5-minute update_check poll.',
              'the dedicated post-build rollout workflow will resolve the Worker URL and retry; the 30-minute update_check poll remains the fallback.',
          )
          text = text.replace(
              'the 5-minute update_check poll will still roll the release out.',
              'the dedicated post-build rollout workflow will retry; the 30-minute update_check poll remains the fallback.',
          )
          native.write_text(text)
          PY

          cat > .github/workflows/native-update-rollout.yml <<'YAML'
          name: Trigger native update rollout

          on:
            workflow_run:
              workflows:
                - Native Windows Build
              types:
                - completed

          permissions:
            contents: read

          concurrency:
            group: native-update-rollout-${{ github.event.workflow_run.id }}
            cancel-in-progress: false

          jobs:
            rollout:
              if: >-
                github.event.workflow_run.conclusion == 'success' &&
                github.event.workflow_run.head_branch == 'main'
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - name: Check out released commit
                  uses: actions/checkout@v4
                  with:
                    ref: ${{ github.event.workflow_run.head_sha }}

                - name: Resolve Cloudflare account context
                  uses: ./.github/actions/cloudflare-context
                  with:
                    api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

                - name: Resolve deployed HomePanel public URL
                  id: homepanel-public-url
                  run: node .github/scripts/cloudflare-worker-public-url.mjs homepanel-cloud /api/health

                - name: Trigger immediate update detection
                  shell: bash
                  env:
                    HOMEPANEL_BASE_URL: ${{ steps.homepanel-public-url.outputs.base-url }}
                  run: |
                    set -euo pipefail
                    response="$RUNNER_TEMP/update-ping.json"
                    status="$(curl --silent --show-error \
                      --retry 4 --retry-delay 5 --retry-all-errors \
                      --output "$response" --write-out '%{http_code}' \
                      -X POST "${HOMEPANEL_BASE_URL%/}/v1/update/ping")"
                    cat "$response"
                    node -e '
                      const fs = require("node:fs");
                      const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                      const status = Number(process.argv[2]);
                      if (status !== 202 || payload?.queued !== true) {
                        throw new Error(`Unexpected update ping response (HTTP ${status}): ${JSON.stringify(payload)}`);
                      }
                    ' "$response" "$status"
          YAML

          cat > tests/native-update-rollout-contract.test.mjs <<'TEST'
          import assert from 'node:assert/strict';
          import { existsSync, readFileSync } from 'node:fs';
          import test from 'node:test';

          const rollout = readFileSync(
            new URL('../.github/workflows/native-update-rollout.yml', import.meta.url),
            'utf8',
          );
          const nativeBuild = readFileSync(
            new URL('../.github/workflows/native-windows-build.yml', import.meta.url),
            'utf8',
          );
          const scheduler = readFileSync(
            new URL('../hp/cloud/src/scheduler_runtime.ts', import.meta.url),
            'utf8',
          );
          const migration = readFileSync(
            new URL('../hp/cloud/migrations/202607291600_update_check_30m.sql', import.meta.url),
            'utf8',
          );

          test('successful main native builds always trigger an update ping without a configured Worker URL', () => {
            assert.match(rollout, /workflow_run:/);
            assert.match(rollout, /Native Windows Build/);
            assert.match(rollout, /workflow_run\.conclusion == 'success'/);
            assert.match(rollout, /workflow_run\.head_branch == 'main'/);
            assert.match(rollout, /cloudflare-worker-public-url\.mjs homepanel-cloud/);
            assert.match(rollout, /\/v1\/update\/ping/);
            assert.match(rollout, /status !== 202/);
            assert.match(rollout, /payload\?\.queued !== true/);
            assert.doesNotMatch(rollout, /HOMEPANEL_WORKER_URL/);
          });

          test('thirty-minute update cadence is applied to D1 and reloaded by the scheduler runtime', () => {
            assert.match(migration, /interval_seconds = 1800/);
            assert.match(migration, /unixepoch\(\) \+ 1800/);
            assert.match(scheduler, /RUNTIME_VERSION = 6/);
            assert.match(scheduler, /return migrateRuntime\(state, env, stored, nowSeconds\)/);
          });

          test('native build fallback text reflects the actual thirty-minute cadence', () => {
            assert.match(nativeBuild, /30-minute update_check poll remains the fallback/);
            assert.doesNotMatch(nativeBuild, /5-minute update_check poll/);
          });

          test('one-time production recovery workflow is removed', () => {
            assert.equal(
              existsSync(new URL('../.github/workflows/one-time-recover-23h-native-update.yml', import.meta.url)),
              false,
            );
          });
          TEST

          rm -f .github/workflows/one-time-recover-23h-native-update.yml
          rm -f .github/workflows/one-time-prepare-native-update-fix.yml

      - name: Commit prepared fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            hp/cloud/src/scheduler_runtime.ts \
            hp/video/test/cloud-usage-budget.test.js \
            .github/workflows/native-windows-build.yml \
            .github/workflows/native-update-rollout.yml \
            tests/native-update-rollout-contract.test.mjs
          git add -u -- \
            .github/workflows/one-time-recover-23h-native-update.yml \
            .github/workflows/one-time-prepare-native-update-fix.yml
          git diff --cached --check
          git commit -m "Fix native update rollout recovery"
          git push origin HEAD:agent/fix-native-update-rollout
