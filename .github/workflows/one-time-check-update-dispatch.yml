name: One-time check_update dispatch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-check-update-dispatch.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: one-time-check-update-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.head_commit.message != 'Remove one-time check_update dispatcher'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hp/package-lock.json

      - name: Install HomePanel workspace dependencies
        working-directory: hp
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Queue check_update for active devices
        id: dispatch
        working-directory: hp/cloud
        shell: bash
        run: |
          set -euo pipefail
          now_ms="$(date +%s%3N)"
          cutoff_ms="$((now_ms - 30 * 24 * 60 * 60 * 1000))"
          expires_ms="$((now_ms + 60 * 60 * 1000))"
          sql="INSERT INTO device_commands(device_id,command,payload,created_at,expires_at)
          SELECT targets.device_id,'check_update',NULL,${now_ms},${expires_ms}
            FROM (
              SELECT device_id FROM device_heartbeats WHERE last_seen_at >= ${cutoff_ms}
              UNION
              SELECT device_id FROM device_configs
            ) AS targets
           WHERE targets.device_id <> ''
             AND NOT EXISTS (
               SELECT 1 FROM device_commands existing
                WHERE existing.device_id=targets.device_id
                  AND existing.command='check_update'
                  AND existing.completed_at IS NULL
                  AND (existing.expires_at IS NULL OR existing.expires_at>${now_ms})
             );
          SELECT changes() AS queued_commands;"
          npm exec -- wrangler d1 execute homepanel-data \
            --remote \
            --config wrangler.jsonc \
            --command "$sql" \
            --json | tee "$RUNNER_TEMP/check-update-dispatch.json"

      - name: Record dispatch result
        if: success()
        uses: actions/github-script@v7
        env:
          RESULT_PATH: ${{ runner.temp }}/check-update-dispatch.json
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync(process.env.RESULT_PATH, 'utf8').slice(-6000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 476,
              body: `✅ \`check_update\` dispatch completed.\n\n\`\`\`json\n${output}\n\`\`\``,
            });

      - name: Record dispatch failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 476,
              body: `❌ \`check_update\` dispatch workflow failed. See Actions run ${context.runId}.`,
            });
