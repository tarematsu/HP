name: Pages design browser checks
on:
  pull_request:
    paths: ['site/**', '.github/workflows/pages-design-browser-check.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.54.0
      - run: npm ci --no-audit --no-fund
        working-directory: site
      - run: npm run assets:build
        working-directory: site
      - run: npx playwright install --with-deps chromium
      - run: node site/scripts/check-pages-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-design-browser
          path: site/artifacts/
