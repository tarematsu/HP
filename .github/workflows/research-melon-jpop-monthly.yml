name: Research Melon J-pop monthly history

on:
  push:
    branches:
      - research/melon-jpop-history-backfill
    paths:
      - '.github/workflows/research-melon-jpop-monthly.yml'
      - 'worker/src/melon-jpop-history.js'
      - 'worker/scripts/backfill-melon-jpop-history-actions.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan all Melon J-pop monthly history
        working-directory: worker
        run: node scripts/backfill-melon-jpop-history-actions.mjs --start=2012-01-01 --types=month --concurrency=4 --output=artifacts/melon-jpop-monthly-history.json
      - name: Upload monthly result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melon-jpop-monthly-history
          path: worker/artifacts/melon-jpop-monthly-history.json
          if-no-files-found: warn
