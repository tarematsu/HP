name: Temporary Stationhead primary-only refactor

on:
  push:
    branches:
      - refactor/stationhead-primary-only

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stationhead-primary-only
          fetch-depth: 0
      - name: Apply refactor
        run: python scripts/stationhead-primary-only-refactor.py
      - name: Commit refactor
        shell: bash
        run: |
          rm -f scripts/stationhead-primary-only-refactor.py
          rm -f .github/workflows/tmp-stationhead-primary-only-refactor.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Refactor Stationhead to primary-only playback"
          git push origin HEAD:refactor/stationhead-primary-only
