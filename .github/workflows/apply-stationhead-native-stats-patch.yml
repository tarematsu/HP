name: Apply Stationhead stats follow-up

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-stationhead-native-stats-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/rebuild-stationhead-play-stats'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-stationhead-play-stats
          fetch-depth: 0

      - name: Apply reviewed follow-up patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON_EXTRACT'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-stationhead-stats-followup.yml')
          source = workflow.read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          ) + '\n'
          exec(compile(script, str(workflow), 'exec'), {'__name__': '__main__'})
          PYTHON_EXTRACT
          rm -f .github/workflows/apply-stationhead-stats-followup.yml
          rm -f .github/workflows/apply-stationhead-native-stats-patch.yml
          node --check hp/native/scripts/capture-stationhead-play-stats-safe.mjs
          node --test \
            hp/video/test/stationhead-play-stats-*.test.js \
            hp/video/test/stationhead-stats-*.test.js \
            hp/video/test/stationhead-safe-capture-regression.test.js
          git diff --check

      - name: Commit follow-up fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden Stationhead stats request ordering"
          git push origin HEAD:agent/rebuild-stationhead-play-stats
