name: Apply native Stationhead stats patch

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-stationhead-native-stats-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/rebuild-stationhead-play-stats'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-stationhead-play-stats
          fetch-depth: 0

      - name: Check payload readiness
        id: ready
        shell: bash
        run: |
          if [[ -f .github/patches/stationhead-native-stats-ready ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Chunked payload is not complete yet; skipping."
          fi

      - name: Apply native lifecycle patch
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          encoded=/tmp/stationhead-native-stats-patch.tar.gz.b64
          archive=/tmp/stationhead-native-stats-patch.tar.gz
          cat .github/patches/stationhead-native-stats-part-* > "$encoded"
          echo "0b35e95b43aa1df89e0cc4e78c7494200518794202e4b6d4d31cef16db8bba96  $encoded" | sha256sum -c -
          base64 --decode "$encoded" > "$archive"
          echo "704a688fe43b20459dd1331980573ed45047d0412323af90a3aad55415baab4f  $archive" | sha256sum -c -
          gzip -t "$archive"
          tar -tzf "$archive" >/dev/null
          tar -xzf "$archive" -C /tmp
          python3 - <<'PY'
          from pathlib import Path
          path = Path('/tmp/apply_native_stats.py')
          source = path.read_text()
          needle = "\n'''test('the generated policy uses native identity and bounded timeout without persistence'"
          replacement = "\nlambda _: '''test('the generated policy uses native identity and bounded timeout without persistence'"
          if source.count(needle) != 1:
              raise SystemExit(f'expected one replacement target, got {source.count(needle)}')
          path.write_text(source.replace(needle, replacement, 1))
          PY
          python3 /tmp/apply_native_stats.py
          rm -f .github/patches/stationhead-native-stats-patch.tar.gz.b64
          rm -f .github/patches/stationhead-native-stats-part-*
          rm -f .github/patches/stationhead-native-stats-ready
          rm -f .github/workflows/apply-stationhead-native-stats-patch.yml
          node --check hp/native/scripts/capture-stationhead-play-stats-safe.mjs
          git diff --check

      - name: Commit native lifecycle rebuild
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Move Stationhead stats lifecycle into native state"
          git push origin HEAD:agent/rebuild-stationhead-play-stats
