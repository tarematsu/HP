name: Temporary - collect Ai MUST BE YouTube comments

on:
  push:
    branches:
      - tmp/ai-must-be-comment-collector
    paths:
      - .github/workflows/tmp-ai-must-be-comments.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-comments:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install collector
        run: python -m pip install --disable-pip-version-check youtube-comment-downloader==0.1.83

      - name: Collect comments
        id: collect
        shell: bash
        run: |
          mkdir -p comment-data
          set +e
          youtube-comment-downloader \
            --youtubeid Sp4xl7wtqtc \
            --output comment-data/raw_comments.jsonl \
            --format jsonl \
            --sort 1 \
            2>&1 | tee comment-data/collector.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          echo "collector exit code: ${code}"
          exit 0

      - name: Extract timestamp comments and counts
        shell: bash
        env:
          COLLECTOR_EXIT_CODE: ${{ steps.collect.outputs.exit_code }}
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          import re
          from collections import Counter
          from pathlib import Path

          out = Path('comment-data')
          raw_path = out / 'raw_comments.jsonl'
          timestamp_csv = out / 'timestamp_comments.csv'
          timestamp_jsonl = out / 'timestamp_comments.jsonl'
          counts_csv = out / 'timestamp_counts.csv'
          meta_path = out / 'collection_meta.json'

          # Supports m:ss / mm:ss / h:mm:ss.  The target is an MV, so discard
          # timestamps beyond 15 minutes to avoid ordinary clock-time mentions.
          pattern = re.compile(r'(?<![\d:])(?:(?P<h>\d{1,2}):)?(?P<m>\d{1,2}):(?P<s>\d{2})(?!\d)')
          max_seconds = 15 * 60

          rows = []
          counts = Counter()
          raw_count = 0
          malformed_count = 0
          seen = set()

          if raw_path.exists():
              with raw_path.open('r', encoding='utf-8', errors='replace') as fh:
                  for line_no, line in enumerate(fh, 1):
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          obj = json.loads(line)
                      except json.JSONDecodeError:
                          malformed_count += 1
                          continue

                      raw_count += 1
                      text = str(obj.get('text') or '')
                      comment_id = str(obj.get('cid') or obj.get('id') or f'line-{line_no}')

                      for match in pattern.finditer(text):
                          hour_s = match.group('h')
                          minute = int(match.group('m'))
                          second = int(match.group('s'))
                          if second >= 60:
                              continue
                          if hour_s is not None and minute >= 60:
                              continue

                          total = (int(hour_s) * 3600 if hour_s is not None else 0) + minute * 60 + second
                          if total > max_seconds:
                              continue

                          dedupe_key = (comment_id, total)
                          if dedupe_key in seen:
                              continue
                          seen.add(dedupe_key)

                          timestamp = f'{total // 60}:{total % 60:02d}'
                          row = {
                              'timestamp': timestamp,
                              'seconds': total,
                              'matched_text': match.group(0),
                              'comment_id': comment_id,
                              'author': obj.get('author', ''),
                              'votes': obj.get('votes', obj.get('likes', '')),
                              'published': obj.get('time', obj.get('published', '')),
                              'is_reply': bool(obj.get('reply') or obj.get('parent')),
                              'text': text,
                          }
                          rows.append(row)
                          counts[total] += 1

          fields = ['timestamp', 'seconds', 'matched_text', 'comment_id', 'author', 'votes', 'published', 'is_reply', 'text']
          with timestamp_csv.open('w', encoding='utf-8-sig', newline='') as fh:
              writer = csv.DictWriter(fh, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)

          with timestamp_jsonl.open('w', encoding='utf-8') as fh:
              for row in rows:
                  fh.write(json.dumps(row, ensure_ascii=False) + '\n')

          with counts_csv.open('w', encoding='utf-8-sig', newline='') as fh:
              writer = csv.writer(fh)
              writer.writerow(['rank', 'timestamp', 'seconds', 'mentions'])
              for rank, (seconds, mentions) in enumerate(sorted(counts.items(), key=lambda x: (-x[1], x[0])), 1):
                  writer.writerow([rank, f'{seconds // 60}:{seconds % 60:02d}', seconds, mentions])

          meta = {
              'video_id': 'Sp4xl7wtqtc',
              'video_url': 'https://www.youtube.com/watch?v=Sp4xl7wtqtc',
              'collector': 'youtube-comment-downloader==0.1.83',
              'collector_sort': 'recent',
              'collector_exit_code': os.environ.get('COLLECTOR_EXIT_CODE', ''),
              'raw_comment_records': raw_count,
              'malformed_json_lines': malformed_count,
              'timestamp_comment_rows': len(rows),
              'unique_timestamp_seconds': len(counts),
              'timestamp_max_seconds_filter': max_seconds,
          }
          meta_path.write_text(json.dumps(meta, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(meta, ensure_ascii=False, indent=2))
          PY

      - name: Upload collected data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-must-be-youtube-comments
          path: comment-data/
          if-no-files-found: warn
          retention-days: 1
