name: Refresh Cloudflare observability

# This helper is dispatched by the maintenance recovery watchdog when unified
# observability becomes stale. Unified observability also runs after runtime/deploy
# workflows, so an independent hourly cron here would duplicate those triggers.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-cloudflare-observability.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: refresh-cloudflare-observability
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch full observability refresh
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch unified Cloudflare observability
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'sh-observability.yml',
              ref: context.payload.repository?.default_branch || 'main',
              inputs: {
                lookback_minutes: '60',
              },
            });
