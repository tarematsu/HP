name: Read-only DO storage schema probe
on:
  push:
    branches: [fix/observability-do-storage]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - name: Read SQLite storage samples
        run: |
          python3 - <<'PY'
          import sys, datetime as dt
          sys.path.insert(0,'.github/scripts')
          import cloudflare_free_tier_audit as audit
          day=dt.datetime.now(dt.timezone.utc).date().isoformat()
          query='query SqlStorageProbe($account: string, $day: Date!) { viewer { accounts(filter: {accountTag: $account}) { durableObjectsSqlStorageGroups(limit: 10000, filter: {date_geq: $day, date_leq: $day}, orderBy: [datetime_DESC]) { dimensions { namespaceId datetime } max { storedBytes } } } } }'
          result=audit.api({'query':query,'variables':{'account':audit.ACCOUNT,'day':day}})
          rows=result['data']['viewer']['accounts'][0]['durableObjectsSqlStorageGroups']
          latest={}
          for row in rows:
              key=row['dimensions']['namespaceId']
              if key not in latest: latest[key]=row
          print('SQL_STORAGE', {'rows':len(rows),'namespaces':len(latest),'latest':[{'at':x['dimensions']['datetime'],'bytes':x['max']['storedBytes']} for x in latest.values()]})
          PY
