name: Temporary fix Stationhead primary CI

on:
  push:
    branches:
      - refactor/stationhead-primary-only

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/stationhead-primary-only
          fetch-depth: 0
      - name: Apply and verify repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python scripts/tmp-fix-stationhead-primary-ci.py
          node --test \
            hp/video/test/native-stationhead-audio-routing-regression.test.js \
            hp/video/test/stationhead-audio-control-crash-regression.test.js \
            hp/video/test/stationhead-auto-click-clock-regression.test.js \
            hp/video/test/stationhead-native-stats-static-regression.test.js \
            hp/video/test/stationhead-operational-clock-regression.test.js \
            hp/video/test/stationhead-start-listening-timing-regression.test.js \
            hp/video/test/stationhead-startup-resource-reduction-regression.test.js
          git grep -nE 'StationheadRole::Secondary|IsSecondary\(|secondaryEnabled|secondaryUrl|HomePanelSecondaryStationhead|HomePanelSecondarySpotifyAuthHost|WM_HP_SECONDARY_RELOAD_READY|stationhead-secondary|PollAuthProbe|authProbeInFlight_|authProbeStartedAt_|lastAuthProbeAt_|secondaryAutoClick|secondaryReloadMonotonicAt|StationheadAuthProbeScript' -- hp/native || true
          if git grep -nE 'StationheadRole::Secondary|IsSecondary\(|secondaryEnabled|secondaryUrl|HomePanelSecondaryStationhead|HomePanelSecondarySpotifyAuthHost|WM_HP_SECONDARY_RELOAD_READY|stationhead-secondary|PollAuthProbe|authProbeInFlight_|authProbeStartedAt_|lastAuthProbeAt_|secondaryAutoClick|secondaryReloadMonotonicAt|StationheadAuthProbeScript' -- hp/native; then
            echo 'Secondary Stationhead implementation references remain'
            exit 1
          fi
          grep -q "return 50 \* 60'000;" hp/native/src/sh_track_boundary_message_policy.h
          grep -q "kStationheadMeasuredPostPlaybackStopClickDelayMs" hp/native/src/sh_track_boundary_message_policy.h
          grep -q "3'500;" hp/native/src/sh_track_boundary_message_policy.h
          rm -f scripts/tmp-fix-stationhead-primary-ci.py
          rm -f .github/workflows/tmp-fix-stationhead-primary-ci.yml
          git add -A
          git diff --cached --check
          git commit -m "Fix Stationhead primary-only regressions"
          git push origin HEAD:refactor/stationhead-primary-only
