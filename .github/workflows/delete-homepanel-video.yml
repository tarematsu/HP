name: Delete retired HomePanel Video Worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/delete-homepanel-video.yml'
      - '.github/scripts/delete-cloudflare-worker.mjs'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: homepanel-cloud-production
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Delete homepanel-video
        run: node .github/scripts/delete-cloudflare-worker.mjs homepanel-video

      - name: Publish deletion status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node <<'NODE'
          const response = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.TARGET_SHA}`,
            {
              method: 'POST',
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'Content-Type': 'application/json',
                'User-Agent': 'homepanel-video-deletion',
                'X-GitHub-Api-Version': '2022-11-28'
              },
              body: JSON.stringify({
                state: 'success',
                context: 'homepanel-video/deleted',
                description: 'The retired homepanel-video Worker is absent.',
                target_url: process.env.RUN_URL
              })
            }
          );
          if (!response.ok) throw new Error(`status publication failed: HTTP ${response.status}`);
          NODE
