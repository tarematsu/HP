name: Collect Genie full catalog to R2
on:
  schedule:
    - cron: '0 22 * * *' # 07:00 JST, after regional service collection
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/collect-genie-r2.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: genie-r2-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Wait for official production deployment on push
        if: github.event_name == 'push'
        working-directory: worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/wait-for-production-deploy.mjs
      - name: Collect daily metrics with persistent checkpoints
        working-directory: worker
        run: node scripts/collect-genie-r2-actions.mjs
