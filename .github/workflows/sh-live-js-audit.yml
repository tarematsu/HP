name: Stationhead live JavaScript audit

on:
  pull_request:
    paths:
      - 'scripts/measure-stationhead-start-listening.mjs'
      - 'scripts/audit-stationhead-login.mjs'
      - 'hp/native/src/sh_runtime_script_resource_policy_fix.h'
      - 'hp/native/src/sh_runtime_resource_boundary_policy_fix.h'
      - 'hp/native/src/sh_data_acquisition_resource_policy_fix.h'
      - 'hp/native/src/sh_startup_resource_reduction_policy_fix.h'
      - 'hp/native/src/sh_playback_resource_policy_fix.h'
      - 'hp/native/src/sh_track_boundary_message_policy.h'
      - 'hp/native/src/sh_track_boundary_script.h'
      - 'hp/video/test/stationhead-live-ui-audit-regression.test.js'
      - 'hp/video/test/stationhead-startup-resource-reduction-regression.test.js'
      - 'hp/video/test/stationhead-playback-resource-fail-open-regression.test.js'
      - '.github/workflows/sh-live-js-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sh-live-js-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STATIONHEAD_EMAIL: ${{ secrets.STATIONHEAD_AUDIT_EMAIL || secrets.STATIONHEAD_EMAIL || secrets.STATIONHEAD_TEST_EMAIL || secrets.SH_EMAIL }}
      STATIONHEAD_PASSWORD: ${{ secrets.STATIONHEAD_AUDIT_PASSWORD || secrets.STATIONHEAD_PASSWORD || secrets.STATIONHEAD_TEST_PASSWORD || secrets.SH_PASSWORD }}
    steps:
      - name: Checkout audit revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Measure Start Listening visibility
        run: >-
          node scripts/measure-stationhead-start-listening.mjs
          --attempts=3
          --out=.sh-start-listening-timing/report.json

      - name: Attempt Stationhead credential login
        continue-on-error: true
        run: >-
          node scripts/audit-stationhead-login.mjs
          --url=https://www.stationhead.com/sakuramankai
          --out=.sh-start-listening-timing/login-report.json

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          if [ -f .sh-start-listening-timing/report.json ]; then
            printf '## Start Listening visibility timing\n' >> "$GITHUB_STEP_SUMMARY"
            node -e "const r=require('./.sh-start-listening-timing/report.json'); for (const k of ['sampleCount','visibleCount','medianVisibleAfterMs','p95VisibleAfterMs','maxVisibleAfterMs']) console.log('- '+k+': '+r[k])" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .sh-start-listening-timing/login-report.json ]; then
            printf '\n## Stationhead credential login attempt\n' >> "$GITHUB_STEP_SUMMARY"
            node -e "const r=require('./.sh-start-listening-timing/login-report.json'); for (const [k,v] of Object.entries(r)) console.log('- '+k+': '+v)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stationhead-live-js-audit-${{ github.run_id }}
          path: .sh-start-listening-timing/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Stationhead UI audit
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const failures = [];
          try {
            const timing = JSON.parse(await readFile('.sh-start-listening-timing/report.json', 'utf8'));
            if (!Number.isInteger(timing.sampleCount) || timing.sampleCount < 2) {
              failures.push('timing: insufficient samples');
            }
            if (timing.visibleCount !== timing.sampleCount) {
              failures.push('timing: Start Listening was not visible in every sample');
            }
            if (!Number.isFinite(Number(timing.p95VisibleAfterMs)) ||
                Number(timing.p95VisibleAfterMs) > 5000) {
              failures.push('timing: Start Listening p95 exceeded 5000ms');
            }
          } catch {
            failures.push('timing: report missing or invalid');
          }
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log('Stationhead UI remained reachable within the startup budget. Audio playback was not evaluated.');
          NODE
