name: Stationhead live JavaScript audit

on:
  pull_request:
    paths:
      - 'scripts/audit-stationhead-js-live.mjs'
      - 'scripts/audit-stationhead-dom-reduction-live.mjs'
      - 'scripts/audit-stationhead-login.mjs'
      - 'scripts/inspect-stationhead-module-graph.mjs'
      - 'scripts/measure-stationhead-start-listening.mjs'
      - 'hp/native/src/sh_runtime_script_resource_policy_fix.h'
      - 'hp/native/src/sh_runtime_resource_boundary_policy_fix.h'
      - 'hp/native/src/sh_data_acquisition_resource_policy_fix.h'
      - 'hp/native/src/sh_startup_resource_reduction_policy_fix.h'
      - 'hp/native/src/sh_track_boundary_script.h'
      - 'hp/video/test/stationhead-live-ui-audit-regression.test.js'
      - 'hp/video/test/stationhead-startup-resource-reduction-regression.test.js'
      - '.github/workflows/sh-live-js-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sh-live-js-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STATIONHEAD_EMAIL: ${{ secrets.STATIONHEAD_AUDIT_EMAIL || secrets.STATIONHEAD_EMAIL || secrets.STATIONHEAD_TEST_EMAIL || secrets.SH_EMAIL }}
      STATIONHEAD_PASSWORD: ${{ secrets.STATIONHEAD_AUDIT_PASSWORD || secrets.STATIONHEAD_PASSWORD || secrets.STATIONHEAD_TEST_PASSWORD || secrets.SH_PASSWORD }}
    steps:
      - name: Checkout audit revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Measure Start Listening visibility
        continue-on-error: true
        run: >-
          node scripts/measure-stationhead-start-listening.mjs
          --attempts=3
          --out=.sh-start-listening-timing/report.json

      - name: Audit primary Stationhead page
        continue-on-error: true
        run: >-
          node scripts/audit-stationhead-js-live.mjs
          --url=https://www.stationhead.com/sakuramankai
          --duration-ms=5000
          --auto-click
          --out=.sh-js-audit/primary

      - name: Inspect primary blocked module contracts
        if: always()
        continue-on-error: true
        run: >-
          node scripts/inspect-stationhead-module-graph.mjs
          --report=.sh-js-audit/primary/report.json
          --out=.sh-js-audit/primary/module-graph.json

      - name: Audit fallback Stationhead page
        if: always()
        continue-on-error: true
        run: >-
          node scripts/audit-stationhead-js-live.mjs
          --url=https://www.stationhead.com/buddy46
          --duration-ms=5000
          --auto-click
          --out=.sh-js-audit/fallback

      - name: Inspect fallback blocked module contracts
        if: always()
        continue-on-error: true
        run: >-
          node scripts/inspect-stationhead-module-graph.mjs
          --report=.sh-js-audit/fallback/report.json
          --out=.sh-js-audit/fallback/module-graph.json

      - name: Audit primary DOM reduction
        if: always()
        continue-on-error: true
        run: >-
          node scripts/audit-stationhead-dom-reduction-live.mjs
          --url=https://www.stationhead.com/sakuramankai
          --out=.sh-js-audit/dom-primary.json

      - name: Audit fallback DOM reduction
        if: always()
        continue-on-error: true
        run: >-
          node scripts/audit-stationhead-dom-reduction-live.mjs
          --url=https://www.stationhead.com/buddy46
          --out=.sh-js-audit/dom-fallback.json

      - name: Attempt Stationhead credential login
        if: always()
        continue-on-error: true
        run: >-
          node scripts/audit-stationhead-login.mjs
          --url=https://www.stationhead.com/sakuramankai
          --out=.sh-js-audit/login-report.json

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          for summary in .sh-js-audit/*/summary.md .sh-js-audit/*/module-graph.md; do
            if [ -f "$summary" ]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
              printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          for report in .sh-js-audit/dom-primary.json .sh-js-audit/dom-fallback.json; do
            if [ -f "$report" ]; then
              printf '## %s\n' "$(basename "$report" .json)" >> "$GITHUB_STEP_SUMMARY"
              node -e "const r=require('./$report'); for (const [k,v] of Object.entries(r)) console.log('- '+k+': '+(Array.isArray(v)?v.join(', '):v))" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ -f .sh-js-audit/login-report.json ]; then
            printf '## Stationhead credential login attempt\n' >> "$GITHUB_STEP_SUMMARY"
            node -e "const r=require('./.sh-js-audit/login-report.json'); for (const [k,v] of Object.entries(r)) console.log('- '+k+': '+v)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .sh-start-listening-timing/report.json ]; then
            printf '\n## Start Listening visibility timing\n' >> "$GITHUB_STEP_SUMMARY"
            node -e "const r=require('./.sh-start-listening-timing/report.json'); for (const k of ['sampleCount','visibleCount','minVisibleAfterMs','medianVisibleAfterMs','p95VisibleAfterMs','maxVisibleAfterMs']) console.log('- '+k+': '+r[k])" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stationhead-live-js-audit-${{ github.run_id }}
          path: |
            .sh-js-audit/
            .sh-start-listening-timing/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Enforce Stationhead UI audit
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const failures = [];
          for (const name of ['primary', 'fallback']) {
            let report;
            try {
              report = JSON.parse(await readFile(`.sh-js-audit/${name}/report.json`, 'utf8'));
            } catch (error) {
              failures.push(`${name}: report missing or invalid`);
              continue;
            }
            const ui = report.blocked?.ui || {};
            if (!ui.startListeningVisible) failures.push(`${name}: Start Listening was not visible`);
            if (!ui.clicked) failures.push(`${name}: Start Listening click failed`);
            if (!ui.afterClickScreenVisible) failures.push(`${name}: post-click screen was not visible`);
            if (report.missedInterceptions?.length) failures.push(`${name}: interception miss`);
            if ((report.blocked?.pageErrors?.length || 0) > (report.baseline?.pageErrors?.length || 0)) {
              failures.push(`${name}: replacement added a page error`);
            }
            if (report.passed !== true) failures.push(`${name}: report did not pass`);
          }
          for (const name of ['dom-primary', 'dom-fallback']) {
            try {
              const report = JSON.parse(await readFile(`.sh-js-audit/${name}.json`, 'utf8'));
              if (report.passed !== true) failures.push(`${name}: DOM reduction did not pass`);
              if (report.reductionInstalled !== true) failures.push(`${name}: DOM reduction was not installed`);
              if (report.pageErrors?.length) failures.push(`${name}: DOM reduction added a page error`);
            } catch (error) {
              failures.push(`${name}: report missing or invalid`);
            }
          }
          try {
            const timing = JSON.parse(await readFile('.sh-start-listening-timing/report.json', 'utf8'));
            if (timing.visibleCount !== timing.sampleCount) failures.push('timing: Start Listening was not visible in every sample');
          } catch {
            failures.push('timing: report missing or invalid');
          }
          if (failures.length) {
            console.error(failures.join('\n'));
            process.exit(1);
          }
          console.log('Stationhead resource, timing and DOM audits passed. Audio playback was not evaluated.');
          NODE
