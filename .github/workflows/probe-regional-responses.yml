name: Probe regional public responses
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-regional-responses.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture public provider responses without database writes
        working-directory: worker
        run: node scripts/probe-regional-responses.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regional-response-evidence
          path: regional-response-evidence
          retention-days: 3
