name: SH CI

on:
  pull_request:
    paths:
      - '.github/workflows/sh-ci.yml'
      - '.github/scripts/generate-monorepo-workflows.py'
      - '.github/scripts/trigger-monorepo.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sh-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate final monorepo workflows
    if: github.head_ref == 'agent/import-sh-snapshot' || github.ref_name == 'agent/import-sh-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-sh-snapshot
          fetch-depth: 0

      - name: Fetch pinned SH workflow source
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/tarematsu/SH.git "$RUNNER_TEMP/SH-source"
          expected="741ccc82c94a17cbe3f3b57f8b6f180105ee1922"
          current="$(git -C "$RUNNER_TEMP/SH-source" rev-parse HEAD)"
          if [[ "$current" != "$expected" ]]; then
            git -C "$RUNNER_TEMP/SH-source" fetch --depth 1 origin "$expected"
            git -C "$RUNNER_TEMP/SH-source" checkout --detach "$expected"
          fi

      - name: Generate workflow bundle
        env:
          SH_SOURCE: ${{ runner.temp }}/SH-source
        run: python3 .github/scripts/generate-monorepo-workflows.py

      - name: Commit generated bundle
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add generated-workflows
          git commit -m "Generate unified workflow bundle"
          git push origin HEAD:agent/import-sh-snapshot
