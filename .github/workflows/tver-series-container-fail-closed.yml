name: TVer series container fail closed
on:
  push:
    branches:
      - fix/tver-series-container-fail-closed
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/tver-series-container-fail-closed.py
      - name: Run TVer tests
        run: node --test hp/video/test/native-media-30-90-tver-alternation-contract.test.js hp/video/test/native-mv-panel-contract.test.js hp/video/test/native-tver-all-episodes-contract.test.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hp/native/src/renderer_panels.cpp hp/video/test/native-media-30-90-tver-alternation-contract.test.js hp/video/test/native-tver-all-episodes-contract.test.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: fail closed on TVer series episode container"
          git push
