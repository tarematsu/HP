name: Kugou pages backfill import

on:
  push:
    branches:
      - feat/kugou-japan-history-pages-backfill
    paths:
      - .github/workflows/kugou-pages-backfill-import.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kugou-japan-history-pages-backfill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire generated history into the read model and UI
        run: |
          node <<'NODE'
          const fs = require('fs');

          const history = `import { KUGOU_JAPAN_CHART_LEGACY_2021 } from './kugou-japan-chart-legacy-2021.js';
          import { KUGOU_JAPAN_CHART_LEGACY_2022 } from './kugou-japan-chart-legacy-2022.js';
          import { KUGOU_JAPAN_CHART_LEGACY_2023 } from './kugou-japan-chart-legacy-2023.js';
          import { KUGOU_JAPAN_CHART_LEGACY_2024 } from './kugou-japan-chart-legacy-2024.js';
          import { KUGOU_JAPAN_CHART_LEGACY_COVERED_DATES } from './kugou-japan-chart-legacy-covered-dates.js';
          import { KUGOU_JAPAN_CHART_2024 } from './kugou-japan-chart-2024.js';
          import { KUGOU_JAPAN_CHART_2025 } from './kugou-japan-chart-2025.js';
          import { KUGOU_JAPAN_CHART_2026 } from './kugou-japan-chart-2026.js';

          export const KUGOU_JAPAN_CHART_HISTORY = Object.freeze([
            ...KUGOU_JAPAN_CHART_LEGACY_2021,
            ...KUGOU_JAPAN_CHART_LEGACY_2022,
            ...KUGOU_JAPAN_CHART_LEGACY_2023,
            ...KUGOU_JAPAN_CHART_LEGACY_2024,
            ...KUGOU_JAPAN_CHART_2024,
            ...KUGOU_JAPAN_CHART_2025,
            ...KUGOU_JAPAN_CHART_2026,
          ]);

          export const KUGOU_JAPAN_CHART_COVERAGE = Object.freeze({
            chart_id: 'japan_31312',
            oldest_available: '2021-01-01',
            legacy_latest_available: '2024-10-30',
            current_api_oldest_available: '2024-10-31 10:10:01',
            latest_available: '2026-09-30 10:10:01',
            latest_checked: '2026-10-01 10:10:00',
            latest_rank_in: '2026-09-30 10:10:01',
            legacy_covered_dates: KUGOU_JAPAN_CHART_LEGACY_COVERED_DATES,
            entries: KUGOU_JAPAN_CHART_HISTORY.length,
            note: '2021-01-01〜2024-10-30はKugou旧Web日本榜の保存ページからTop 100を復元。2024-10-31以降は現行ランキングAPIを使用。',
          });
          `.replace(/^          /gm, '');
          fs.writeFileSync('worker/src/kugou-japan-chart-history.js', history);

          const uiPath = 'site/public/regional-music.js';
          let ui = fs.readFileSync(uiPath, 'utf8');
          const oldCoverage = `  const coveredDates = providerWeekdays(coverage.oldest_available, coverage.latest_checked || coverage.latest_available);`;
          const newCoverage = `  const legacyCoveredDates = Array.isArray(coverage.legacy_covered_dates)\n    ? coverage.legacy_covered_dates.map(providerDate).filter(Boolean)\n    : [];\n  const currentCoveredDates = providerWeekdays(\n    coverage.current_api_oldest_available || coverage.oldest_available,\n    coverage.latest_checked || coverage.latest_available,\n  );\n  const coveredDates = [...new Set([...legacyCoveredDates, ...currentCoveredDates])].sort();`;
          if (!ui.includes(oldCoverage)) throw new Error('Kugou coveredDates anchor not found');
          ui = ui.replace(oldCoverage, newCoverage);
          const oldText = `  setText('kugouJapanCoverage', \`最古取得可能: \${oldest} / 最終確認号: \${latestChecked} / 最終ランクイン: \${latestRankIn}（\${count}件）。2024/10/31より前は現行APIでは正しい過去Top 100を復元できないため未収録。\`);`;
          const newText = `  const coverageNote = String(coverage.note || '').trim();\n  setText('kugouJapanCoverage', \`最古取得可能: \${oldest} / 最終確認号: \${latestChecked} / 最終ランクイン: \${latestRankIn}（\${count}件）\${coverageNote ? \`。\${coverageNote}\` : ''}\`);`;
          if (!ui.includes(oldText)) throw new Error('Kugou coverage text anchor not found');
          ui = ui.replace(oldText, newText);
          fs.writeFileSync(uiPath, ui);

          const testPath = 'worker/tests/regional-music-read-model.test.js';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace(`  assert.equal(history.length, 115);`, `  assert.equal(history.length, 1012);`);
          test = test.replace(`  assert.equal(payload.kugou_japan_chart.coverage.oldest_available, '2024-10-31 10:10:01');`, `  assert.equal(payload.kugou_japan_chart.coverage.oldest_available, '2021-01-01');\n  assert.equal(payload.kugou_japan_chart.coverage.legacy_covered_dates.length, 841);\n  assert.equal(payload.kugou_japan_chart.coverage.current_api_oldest_available, '2024-10-31 10:10:01');`);
          test = test.replace(`  assert.equal(counts.get('sakurazaka46'), 53);`, `  assert.equal(counts.get('sakurazaka46'), 113);`);
          test = test.replace(`  assert.equal(counts.get('nogizaka46'), 56);`, `  assert.equal(counts.get('nogizaka46'), 784);`);
          test = test.replace(`  assert.equal(counts.get('hinatazaka46'), 6);`, `  assert.equal(counts.get('hinatazaka46'), 115);`);
          test = test.replace(`  assert.equal(best('sakurazaka46'), 19);`, `  assert.equal(best('sakurazaka46'), 15);`);
          test = test.replace(`  assert.equal(best('nogizaka46'), 2);`, `  assert.equal(best('nogizaka46'), 1);`);
          test = test.replace(`  assert.equal(best('hinatazaka46'), 8);`, `  assert.equal(best('hinatazaka46'), 4);`);
          test = test.replaceAll(`kugou_japan_chart.history.length, 115`, `kugou_japan_chart.history.length, 1012`);
          test = test.replaceAll(`kugou_japan_chart_entries: 115`, `kugou_japan_chart_entries: 1012`);
          fs.writeFileSync(testPath, test);

          const tabsPath = 'site/public/dashboard-tabs.js';
          let tabs = fs.readFileSync(tabsPath, 'utf8');
          if (!tabs.includes(`/regional-music.js?v=20261002.5`)) throw new Error('regional music cache version anchor not found');
          tabs = tabs.replace(`/regional-music.js?v=20261002.5`, `/regional-music.js?v=20261002.6`);
          fs.writeFileSync(tabsPath, tabs);
          NODE
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker/src/kugou-japan-chart-history.js site/public/regional-music.js site/public/dashboard-tabs.js worker/tests/regional-music-read-model.test.js
          git commit -m "Extend Kugou Japan chart history to 2021"
          git push origin HEAD:feat/kugou-japan-history-pages-backfill
