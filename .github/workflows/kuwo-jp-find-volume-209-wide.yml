name: Locate Kuwo Japanese chart volume 209 wide
on:
  push:
    branches: [research/kuwo-jp-chart-probe]
    paths: [.github/workflows/kuwo-jp-find-volume-209-wide.yml]
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan broad bangid range for volume 209
        shell: bash
        run: |
          python3 <<'PY'
          import concurrent.futures,json,urllib.parse,urllib.request
          BASE='https://kbangserver.kuwo.cn/ksong.s'
          common={'from':'pc','fmt':'json','pn':'0','rn':'1','type':'bang','data':'content','id':'183','show_copyright_off':'0','pcmp4':'1','isbang':'1','userid':'0'}
          def probe(bid):
            u=BASE+'?'+urllib.parse.urlencode({**common,'bangid':str(bid)})
            try:
              q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://m.kuwo.cn/'})
              with urllib.request.urlopen(q,timeout=4) as r:j=json.loads(r.read().decode('utf-8','replace'))
              return bid,j.get('currentVolume')
            except:return bid,None
          target='2026|209'; found=[]
          ids=list(range(266500,267861))
          with concurrent.futures.ThreadPoolExecutor(max_workers=28) as ex:
            for bid,cv in ex.map(probe,ids):
              if cv==target:
                found.append(bid); print('FOUND',bid,cv)
          print('RESULT',json.dumps(found))
          if found:
            bid=found[0]
            u=BASE+'?'+urllib.parse.urlencode({**common,'rn':'100','bangid':str(bid)})
            q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://m.kuwo.cn/'})
            with urllib.request.urlopen(q,timeout=10) as r:j=json.loads(r.read().decode('utf-8','replace'))
            rows=j.get('musiclist') or j.get('musicList') or []
            print('ROWS',len(rows),'TOP10',json.dumps([{'rank':i+1,'name':x.get('name'),'artist':x.get('artist'),'rid':x.get('rid')} for i,x in enumerate(rows[:10])],ensure_ascii=False))
          PY
