name: One-shot fetch Stationhead followers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fetch-followers-browser.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.54.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Fetch followers
        shell: bash
        run: |
          set -euo pipefail
          cat > one-shot-fetch-followers.mjs <<'EOF'
          import { chromium } from 'playwright';
          import { writeFile } from 'node:fs/promises';

          const handles = ['sakuramankai', 'sakuramankai2', 'sakurazaka46jp', 'nogizaka46smej'];
          function findAccount(value, handle, depth = 0) {
            if (!value || typeof value !== 'object' || depth > 12) return null;
            if (!Array.isArray(value)) {
              const followers = Number(value.followers);
              if (String(value.handle || '').trim().toLowerCase() === handle
                  && Number.isInteger(followers) && followers >= 0) return value;
            }
            for (const child of Object.values(value)) {
              const found = findAccount(child, handle, depth + 1);
              if (found) return found;
            }
            return null;
          }

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ locale: 'ja-JP', timezoneId: 'Asia/Tokyo' });
          const result = { observed_at: Date.now(), followers: {}, account_ids: {} };
          try {
            const page = await context.newPage();
            for (const handle of handles) {
              await page.goto(`https://www.stationhead.com/${handle}`, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForTimeout(1500);
              const response = await context.request.get(
                `https://www.stationhead.com/api/account/handle/${encodeURIComponent(handle)}`,
                { timeout: 30000, failOnStatusCode: false },
              );
              if (response.status() !== 200) throw new Error(`${handle} profile API status=${response.status()}`);
              const account = findAccount(await response.json(), handle);
              if (!account) throw new Error(`${handle} follower count missing`);
              result.followers[handle] = Number(account.followers);
              result.account_ids[handle] = Number(account.id ?? account.account_id) || null;
            }
          } finally {
            await browser.close();
          }
          await writeFile('one-shot-followers.json', `${JSON.stringify(result, null, 2)}\n`);
          console.log(JSON.stringify(result));
          EOF
          node one-shot-fetch-followers.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: one-shot-followers-${{ github.run_id }}
          path: one-shot-followers.json
          if-no-files-found: ignore
          retention-days: 1
