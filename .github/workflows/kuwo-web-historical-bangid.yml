name: Test Kuwo web historical bangId
on:
  push:
    branches: [research/kuwo-jp-chart-probe]
    paths: [.github/workflows/kuwo-web-historical-bangid.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare current and historical IDs
        run: |
          python3 <<'PY'
          import json,uuid,urllib.parse,urllib.request
          base='https://www.kuwo.cn/api/www/bang/bang/musicList'
          for label,bid in [('current','183'),('vol274','272685'),('vol273','272610'),('vol216','268368'),('vol215','268291')]:
            q={'bangId':bid,'pn':'1','rn':'10','httpsStatus':'1','reqId':str(uuid.uuid4())}
            u=base+'?'+urllib.parse.urlencode(q)
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.kuwo.cn/rankList','Accept':'application/json,text/plain,*/*'})
              with urllib.request.urlopen(req,timeout=10) as r:s=r.read().decode('utf-8','replace')
              j=json.loads(s);d=j.get('data') or {};rows=d.get('musicList') or []
              print(label,'HTTP',r.status,'CODE',j.get('code'),'PUB',d.get('pub'),'NUM',d.get('num'),'ROWS',len(rows),'TOP',json.dumps([(x.get('name'),x.get('artist')) for x in rows[:5]],ensure_ascii=False),'KEYS',list(d.keys()) if isinstance(d,dict) else None)
            except Exception as e:print(label,'ERR',repr(e))
          PY
