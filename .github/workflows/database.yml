name: Database operations

on:
  push:
    branches:
      - main
    paths:
      - 'database/other-migrations/**'
      - 'worker/scripts/provision-other-db.mjs'
      - 'worker/scripts/consolidate-track-metadata.mjs'
      - 'worker/scripts/other-db-tables.mjs'
      - 'worker/scripts/track-metadata-consolidation-lib.mjs'
      - 'database/buddies-migrations/**'
      - 'worker/scripts/provision-buddies-db.mjs'
      - 'worker/scripts/buddies-db-tables.mjs'
      - 'worker/scripts/buddies-db-export.mjs'
      - 'worker/scripts/sync-buddies-db.mjs'
  workflow_call:
    inputs:
      operation:
        description: Database operation
        required: true
        type: string
      base_sha:
        description: Base commit used to select deployment migrations
        required: false
        default: ''
        type: string
      head_sha:
        description: Head commit used to select deployment migrations
        required: false
        default: ''
        type: string
      drop_source_metadata:
        description: Delete the legacy OTHER_DB metadata table after verification
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      operation:
        description: Database operation
        required: true
        type: choice
        options:
          - minute-db
          - minute-facts-local-rebuild
          - payload-purge
          - other-db
          - buddies-db
          - metadata-consolidation
      drop_source_metadata:
        description: Delete the legacy OTHER_DB metadata table after verification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sh-database-operations-v2-${{ inputs.operation || github.event_name }}
  cancel-in-progress: false

jobs:
  minute-db:
    name: Apply MINUTE_DB schema
    if: inputs.operation == 'minute-db'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      FACTS_DATABASE_NAME: stationhead-minute
      FACTS_DEPLOY_CHANGED_ONLY: 'true'
      DEPLOY_BASE_SHA: ${{ inputs.base_sha || '' }}
      DEPLOY_HEAD_SHA: ${{ inputs.head_sha || github.sha }}
      FACTS_VERIFY_ATTEMPTS: '5'
      FACTS_VERIFY_DELAY_MS: '20000'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Apply changed MINUTE_DB migrations
        run: node scripts/apply-facts-pr-schema.mjs
      - name: Verify live data and deployment-critical schema
        run: node scripts/verify-facts-live.mjs

  minute-facts-local-rebuild:
    name: Rebuild MINUTE_DB facts from local buddies SQLite
    if: inputs.operation == 'minute-facts-local-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      BUDDIES_DATABASE_NAME: stationhead-buddies
      FACTS_DATABASE_NAME: stationhead-minute
      FACTS_VERIFY_ATTEMPTS: '5'
      FACTS_VERIFY_DELAY_MS: '20000'
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - name: Export incremental generation window
        id: window
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../.local-minute-facts
          node scripts/minute-facts-actions-window.mjs export
      - name: Generate minute facts in local SQLite
        run: >-
          python ../scripts/rebuild-minute-facts-from-buddies.py
          --snapshots-json ../.local-minute-facts/snapshots.json
          --comments-json ../.local-minute-facts/comments.json
          --out-dir ../.local-minute-facts/generated
          --now-ms ${{ steps.window.outputs.cutoff_ms }}
          --recent-guard-ms 0
      - name: Upload generated facts to MINUTE_DB
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          chunks=(../.local-minute-facts/generated/minute-facts-*.sql)
          for chunk in "${chunks[@]}"; do
            echo "Uploading $(basename "$chunk")"
            uploaded=false
            for attempt in 1 2 3 4 5 6; do
              if npx wrangler d1 execute "$FACTS_DATABASE_NAME" \
                --remote \
                --yes \
                --file "$chunk"; then
                uploaded=true
                break
              fi
              delay=$((attempt * 10))
              echo "D1 import still busy; retrying in ${delay}s (attempt ${attempt}/6)"
              sleep "$delay"
            done
            if [[ "$uploaded" != true ]]; then
              echo "Failed to upload $(basename "$chunk") after 6 attempts" >&2
              exit 1
            fi
          done
      - name: Checkpoint Actions maintenance in MINUTE_DB
        run: node scripts/minute-facts-actions-window.mjs complete
      - name: Verify live data and deployment-critical schema
        run: node scripts/verify-facts-live.mjs
      - name: Remove local buddies data
        if: always()
        shell: bash
        run: rm -rf ../.local-minute-facts

  payload-purge:
    name: Drain existing stationhead-minute payload backlog
    if: inputs.operation == 'payload-purge'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      FACTS_DATABASE_NAME: stationhead-minute
      MINUTE_FACT_PAYLOAD_PURGE_BATCH_SIZE: '1000'
      MINUTE_FACT_PAYLOAD_PURGE_STATEMENTS_PER_REQUEST: '20'
      MINUTE_FACT_PAYLOAD_PURGE_MAX_BATCHES: '10000'
      MINUTE_FACT_PAYLOAD_PURGE_MAX_ATTEMPTS: '6'
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Drain all eligible payload backlog
        run: node scripts/purge-completed-minute-fact-payloads.mjs

  other-db:
    name: Provision or update stationhead-other
    needs: buddies-db
    if: >-
      always() && (
        (github.event_name == 'push' && needs.buddies-db.result == 'success') ||
        inputs.operation == 'other-db'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      OTHER_DATABASE_NAME: stationhead-other
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Create or update database
        run: node scripts/provision-other-db.mjs

  metadata-consolidation:
    name: Consolidate shared track metadata
    if: inputs.operation == 'metadata-consolidation'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      TRACK_METADATA_APPLY: 'true'
      TRACK_METADATA_DROP_SOURCE: ${{ inputs.drop_source_metadata }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Copy and verify shared metadata
        run: node scripts/consolidate-track-metadata.mjs

  buddies-db:
    name: Provision or update stationhead-buddies
    if: (github.event_name == 'push' && inputs.operation == '') || inputs.operation == 'buddies-db'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      BUDDIES_DATABASE_NAME: stationhead-buddies
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Create or update database
        run: node scripts/provision-buddies-db.mjs
