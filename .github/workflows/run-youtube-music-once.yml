name: Verify YouTube Music one-off collection

on:
  push:
    branches:
      - feature/youtube-music-midnight-aobazaka-20261002
    paths:
      - ".github/workflows/run-youtube-music-once.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Show YouTube Music collector state
        working-directory: worker
        run: >-
          npm exec -- wrangler d1 execute stationhead-other --remote --json
          --command "SELECT service,status,last_attempt_at,last_success_at,last_error_class,last_error_message,entity_counts_json,updated_at FROM regional_music_collector_state WHERE service='youtube_music'"

      - name: Show four YouTube Music targets
        working-directory: worker
        run: >-
          npm exec -- wrangler d1 execute stationhead-other --remote --json
          --command "SELECT p.canonical_artist,p.service_artist_id,p.display_name,p.profile_url,p.last_seen_at,d.snapshot_date,d.observed_at,d.followers,d.monthly_audience,d.total_views FROM regional_music_artist_profiles p LEFT JOIN regional_music_artist_daily d ON d.rowid=(SELECT d2.rowid FROM regional_music_artist_daily d2 WHERE d2.service=p.service AND d2.canonical_artist=p.canonical_artist ORDER BY d2.observed_at DESC LIMIT 1) WHERE p.service='youtube_music' ORDER BY p.canonical_artist"
