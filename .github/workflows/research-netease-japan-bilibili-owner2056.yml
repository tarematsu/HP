name: Inspect NetEase Japanese chart annual uploader

on:
  pull_request:
    paths:
      - '.github/workflows/research-netease-japan-bilibili-owner2056.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve saved uploader videos through lightweight APIs
        shell: bash
        run: |
          set +e
          mkdir -p research-owner2056
          python - <<'PY'
          import json, pathlib, time, urllib.request

          ids='''
          BV1F2RyBwE7w BV1yMRrB8EkP BV13F9xBoEPY BV1fpogBiEih BV1ceoTBYETK
          BV1F7P9zLE69 BV1HUPKzUEiA BV1wQPMzsE67 BV1aHAXzfEPr BV1HYfHBjEQz
          BV1gyfLByESE BV1g2fLBVEXn BV1dLfjBpE5T BV16VZxBQE6P BV1TaFCznE7o
          BV1s2FLzTEJN BV1Y26sBbEGS BV1Rbr3B4ET8 BV1MXSxB2ERr BV1KNC5BbEvL
          BV1QbsmzNEsy BV1uehrzFENp BV19RvNzCEPB BV1kpefz3ECK BV1TiexzWEFh
          BV1tKbWzBEqg BV1h7ukz5EwF BV1p5uuzTETK BV1oFG4znE8t BV1MTGnzpEqr
          BV1HR3yzCE18 BV1NW3rzMEu4 BV1p438ziE4z BV13rgQzkE8h BV1emg2zAEML
          BV1Q8gozsEnr BV1zQNdzXEuS BV1eLTRzjEQP BV1h3jbzxEgV BV1aGE1z2Eoz
          BV1XGdfYNErJ BV1TsASeDEsE BV1YVAKeuEoJ BV12BPDe9E5J BV1XMwEeTEzA
          BV1NrcCeZEyY BV1DZcAe9ETr
          '''.split()

          # Current 51-bit BV/AV algorithm. Sanity check against the known 2024-09-17 chart video.
          ALPHABET='FcwAPNKTMug3GV5Lj7EJnHpWsx4tb8haYeviqBz6rkCy12mUSDQX9RdoZf'
          XOR_CODE=23442827791579
          MASK_CODE=2251799813685247
          def bv_to_av(bvid):
              b=list(bvid)
              b[3],b[9]=b[9],b[3]
              b[4],b[7]=b[7],b[4]
              n=0
              for ch in b[3:]: n=n*58+ALPHABET.index(ch)
              return (n & MASK_CODE) ^ XOR_CODE
          assert bv_to_av('BV12st4eUEXh') == 113148027798915

          headers={
            'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130 Safari/537.36',
            'Referer':'https://www.bilibili.com/'
          }
          def getj(url, aid):
              last=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={**headers,'Referer':f'https://www.bilibili.com/video/av{aid}'})
                      with urllib.request.urlopen(req,timeout=15) as r:
                          return {'status':r.status,'json':json.loads(r.read().decode('utf-8','replace'))}
                  except Exception as e:
                      last=repr(e)
                      time.sleep(1.5*(attempt+1))
              return {'status':None,'error':last,'json':{}}

          chart_terms=['网易云日语榜','云音乐日语榜','日语榜','日语歌周榜','日语周榜','周榜','年榜','网易云']
          groups=['乃木坂46','櫻坂46','桜坂46','日向坂46','欅坂46','けやき坂46','Nogizaka46','Sakurazaka46','Hinatazaka46']
          rows=[]
          for i,bvid in enumerate(ids):
              aid=bv_to_av(bvid)
              pages=getj(f'https://api.bilibili.com/x/player/pagelist?aid={aid}',aid)
              tags=getj(f'https://api.bilibili.com/x/tag/archive/tags?aid={aid}',aid)
              desc=getj(f'https://api.bilibili.com/x/web-interface/archive/desc?aid={aid}',aid)

              pj=pages.get('json') or {}; tj=tags.get('json') or {}; dj=desc.get('json') or {}
              pdata=pj.get('data') if isinstance(pj,dict) else None
              tdata=tj.get('data') if isinstance(tj,dict) else None
              ddata=dj.get('data') if isinstance(dj,dict) else None
              parts=[]
              if isinstance(pdata,list):
                  parts=[{'cid':x.get('cid'),'page':x.get('page'),'part':x.get('part'),'duration':x.get('duration')} for x in pdata if isinstance(x,dict)]
              tnames=[]
              if isinstance(tdata,list): tnames=[x.get('tag_name') for x in tdata if isinstance(x,dict)]
              row={
                'bvid':bvid,'aid':aid,'parts':parts,'tags':tnames,'desc':ddata,
                'status':{'pages':pages.get('status'),'tags':tags.get('status'),'desc':desc.get('status')},
                'api_codes':{'pages':pj.get('code') if isinstance(pj,dict) else None,'tags':tj.get('code') if isinstance(tj,dict) else None,'desc':dj.get('code') if isinstance(dj,dict) else None}
              }
              hay=json.dumps(row,ensure_ascii=False)
              row['chart_terms']=[x for x in chart_terms if x.lower() in hay.lower()]
              row['sakamichi']=[x for x in groups if x.lower() in hay.lower()]
              rows.append(row)
              marker='MATCH' if row['chart_terms'] or row['sakamichi'] else 'VIDEO'
              print(marker,i+1,'/',len(ids),json.dumps(row,ensure_ascii=False)[:30000])
              time.sleep(.25)

          pathlib.Path('research-owner2056/videos.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          matches=[r for r in rows if r['chart_terms'] or r['sakamichi']]
          pathlib.Path('research-owner2056/matches.json').write_text(json.dumps(matches,ensure_ascii=False,indent=2))
          print('SUMMARY',json.dumps({
             'entries':len(rows),
             'with_parts':sum(bool(r['parts']) for r in rows),
             'with_desc':sum(r['desc'] is not None for r in rows),
             'matches':len(matches),
             'sakamichi_matches':sum(bool(r['sakamichi']) for r in rows)
          },ensure_ascii=False))
          for r in matches: print('FINAL_MATCH',json.dumps(r,ensure_ascii=False)[:30000])
          PY
      - name: Upload resolved metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netease-japan-owner2056-metadata
          path: research-owner2056
          if-no-files-found: warn
          retention-days: 7
