name: Manual follower collection (one-off)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-follower-collection.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Verify latest follower snapshot
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute OTHER_DB \
            --config wrangler.buddies-collector.jsonc \
            --remote \
            --json \
            --command "SELECT observed_date_jst,scheduled_at,collected_at,followers_json,failures_json FROM sh_stationhead_daily_followers_v2 ORDER BY observed_date_jst DESC LIMIT 1" \
            > "$RUNNER_TEMP/follower-row.json"
          cat "$RUNNER_TEMP/follower-row.json"
          node <<'NODE' "$RUNNER_TEMP/follower-row.json"
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const row = payload?.[0]?.results?.[0];
          if (!row) throw new Error('No follower snapshot row found');
          const jst = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
          if (row.observed_date_jst !== jst) throw new Error(`Latest follower snapshot is ${row.observed_date_jst}, expected ${jst}`);
          const age = Date.now() - Number(row.collected_at || 0);
          if (!Number.isFinite(age) || age < 0 || age > 15 * 60 * 1000) {
            throw new Error(`Follower snapshot is not fresh; age_ms=${age}`);
          }
          const followers = JSON.parse(row.followers_json || '{}');
          const failures = JSON.parse(row.failures_json || '[]');
          console.log(JSON.stringify({ ok: true, observed_date_jst: row.observed_date_jst, scheduled_at: row.scheduled_at, collected_at: row.collected_at, followers, failures }));
          NODE
