name: Manual follower collection (one-off)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/manual-follower-collection.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Load session, follower targets, and existing read model
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute BUDDIES_DB \
            --config wrangler.buddies-collector.jsonc \
            --remote --json \
            --command "SELECT auth_token,device_uid,token_expires_at FROM sh_worker_collector_state WHERE id='stationhead' LIMIT 1" \
            > "$RUNNER_TEMP/follower-auth.json"

          if ! npx wrangler d1 execute OTHER_DB \
            --config wrangler.buddies-collector.jsonc \
            --remote --json \
            --command "SELECT LOWER(TRIM(handle)) AS handle FROM sh_stationhead_follower_targets WHERE handle IS NOT NULL AND TRIM(handle)<>'' ORDER BY handle" \
            > "$RUNNER_TEMP/follower-handles.json"; then
            printf '%s' '[{"results":[]}]' > "$RUNNER_TEMP/follower-handles.json"
          fi

          if ! npx wrangler r2 object get "sh-pages-responses/pages-response/v1/followers.json" \
            --remote --file "$RUNNER_TEMP/followers-existing.json" >/dev/null 2>&1; then
            printf '%s' '{"handles":[],"rows":[]}' > "$RUNNER_TEMP/followers-existing.json"
          fi

      - name: Fetch Stationhead follower counts
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          cat > manual-followers-once.mjs <<'NODE'
          import fs from 'node:fs';
          import {
            fetchStationheadFollowerProfile,
            STATIONHEAD_DAILY_FOLLOWER_HANDLES,
          } from './src/stationhead-daily-followers.js';

          const temp = process.env.RUNNER_TEMP;
          const parseWranglerRows = (path) => {
            const payload = JSON.parse(fs.readFileSync(path, 'utf8'));
            return Array.isArray(payload?.[0]?.results) ? payload[0].results : [];
          };
          const normalizeHandle = (value) => String(value || '').trim().toLowerCase();
          const sqlString = (value) => `'${String(value).replaceAll("'", "''")}'`;
          const validDate = (value) => /^\d{4}-\d{2}-\d{2}$/.test(String(value || ''));
          const dateKey = (timestamp) => new Date(timestamp + 9 * 3600000).toISOString().slice(0, 10);
          const offsetDate = (date, days) => new Date(Date.parse(`${date}T00:00:00Z`) + days * 86400000).toISOString().slice(0, 10);

          const auth = parseWranglerRows(`${temp}/follower-auth.json`)[0];
          if (!auth?.auth_token || !auth?.device_uid) throw new Error('Persisted Stationhead session is unavailable');
          const session = { auth_token: auth.auth_token, device_uid: auth.device_uid };

          const discovered = parseWranglerRows(`${temp}/follower-handles.json`)
            .map((row) => normalizeHandle(row?.handle))
            .filter(Boolean);
          const fixed = [...STATIONHEAD_DAILY_FOLLOWER_HANDLES];
          const handles = [...new Set([...fixed, ...discovered])];

          const settled = await Promise.allSettled(handles.map((handle) =>
            fetchStationheadFollowerProfile(handle, { session, timeoutMs: 8000, appVersion: '1.0.0' })
          ));
          const profiles = [];
          const failures = [];
          settled.forEach((result, index) => {
            if (result.status === 'fulfilled') profiles.push(result.value);
            else failures.push({ handle: handles[index], error: String(result.reason?.message || result.reason).slice(0, 300) });
          });
          const criticalFailures = failures.filter(({ handle }) => fixed.includes(handle));
          if (criticalFailures.length) {
            throw new Error(`Fixed follower targets failed: ${criticalFailures.map((item) => `${item.handle}:${item.error}`).join('; ')}`);
          }

          const now = Date.now();
          const date = dateKey(now);
          const followers = Object.fromEntries(profiles.map((profile) => [profile.handle, profile.followers]));
          let existing = { handles: [], rows: [] };
          try { existing = JSON.parse(fs.readFileSync(`${temp}/followers-existing.json`, 'utf8')); } catch {}
          const allHandles = [...new Set([...(Array.isArray(existing?.handles) ? existing.handles : []), ...handles])]
            .map(normalizeHandle).filter(Boolean);
          const rowsByDate = new Map();
          for (const row of Array.isArray(existing?.rows) ? existing.rows : []) {
            if (!validDate(row?.date)) continue;
            rowsByDate.set(row.date, { ...(rowsByDate.get(row.date) || { date: row.date }), ...row, date: row.date });
          }
          rowsByDate.set(date, { ...(rowsByDate.get(date) || { date }), ...followers, date });
          const rows = [...rowsByDate.values()].sort((a, b) => a.date.localeCompare(b.date));
          const rowMap = new Map(rows.map((row) => [row.date, row]));
          const latest = rowMap.get(date) || {};
          const previous = rowMap.get(offsetDate(date, -1)) || {};
          const previousWeek = rowMap.get(offsetDate(date, -7)) || {};
          const accounts = allHandles.map((handle) => {
            const value = Number.isInteger(latest?.[handle]) ? latest[handle] : null;
            const day = Number.isInteger(previous?.[handle]) ? previous[handle] : null;
            const week = Number.isInteger(previousWeek?.[handle]) ? previousWeek[handle] : null;
            return {
              handle,
              followers: value,
              previous_day_delta: value != null && day != null ? value - day : null,
              previous_week_delta: value != null && week != null ? value - week : null,
            };
          });
          fs.writeFileSync(`${temp}/followers-next.json`, JSON.stringify({
            ok: true, updated_at: now, latest_date: date, handles: allHandles, rows, accounts, failures,
          }));

          const sql = [];
          for (const handle of handles) {
            const sourceMask = fixed.includes(handle) ? 1 : 2;
            sql.push(`INSERT INTO sh_stationhead_follower_targets(handle,source_mask,first_seen_at) VALUES(${sqlString(handle)},${sourceMask},${now}) ON CONFLICT(handle) DO UPDATE SET source_mask=(sh_stationhead_follower_targets.source_mask | excluded.source_mask);`);
          }
          sql.push(`INSERT INTO sh_stationhead_daily_followers_v2(observed_date_jst,scheduled_at,collected_at,followers_json,failures_json) VALUES(${sqlString(date)},${now},${now},${sqlString(JSON.stringify(followers))},${sqlString(JSON.stringify(failures))}) ON CONFLICT(observed_date_jst) DO UPDATE SET scheduled_at=excluded.scheduled_at,collected_at=excluded.collected_at,followers_json=excluded.followers_json,failures_json=excluded.failures_json;`);
          fs.writeFileSync(`${temp}/followers-upsert.sql`, `${sql.join('\n')}\n`);
          fs.writeFileSync(`${temp}/followers-meta.json`, JSON.stringify({ date, now, followers, failures, successes: profiles.length, requests: handles.length }));
          console.log(`FETCH_OK date=${date} successes=${profiles.length}/${handles.length} failures=${failures.length}`);
          console.log(`FOLLOWERS ${JSON.stringify(followers)}`);
          NODE

          node manual-followers-once.mjs
          rm -f manual-followers-once.mjs

      - name: Persist follower snapshot to D1 and R2
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute OTHER_DB \
            --config wrangler.buddies-collector.jsonc \
            --remote --file "$RUNNER_TEMP/followers-upsert.sql" --yes

          updated_at="$(node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(p.now))' "$RUNNER_TEMP/followers-meta.json")"
          headers_json='{"content-type":"application/json; charset=utf-8","cache-control":"public, max-age=30, s-maxage=300, stale-while-revalidate=600"}'
          npx wrangler r2 object put "sh-pages-responses/pages-response/v1/followers.json" \
            --remote --file "$RUNNER_TEMP/followers-next.json" --force \
            --content-type "application/json; charset=utf-8" \
            --cache-control "public, max-age=30, s-maxage=300, stale-while-revalidate=600" \
            --header "x-amz-meta-version:1" \
            --header "x-amz-meta-status:200" \
            --header "x-amz-meta-headers_json:$headers_json" \
            --header "x-amz-meta-updated_at:$updated_at" \
            --header "x-amz-meta-cadence_seconds:86400"

      - name: Verify persisted follower snapshot
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute OTHER_DB \
            --config wrangler.buddies-collector.jsonc \
            --remote --json \
            --command "SELECT observed_date_jst,scheduled_at,collected_at,followers_json,failures_json FROM sh_stationhead_daily_followers_v2 ORDER BY observed_date_jst DESC LIMIT 1" \
            > "$RUNNER_TEMP/follower-verify-d1.json"
          npx wrangler r2 object get "sh-pages-responses/pages-response/v1/followers.json" \
            --remote --file "$RUNNER_TEMP/follower-verify-r2.json" >/dev/null
          node - "$RUNNER_TEMP/follower-verify-d1.json" "$RUNNER_TEMP/follower-verify-r2.json" <<'NODE'
          const fs = require('node:fs');
          const d1 = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))?.[0]?.results?.[0];
          const r2 = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const today = new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10);
          if (!d1 || d1.observed_date_jst !== today) throw new Error(`D1 follower row missing for ${today}`);
          if (r2?.latest_date !== today || r2?.ok !== true) throw new Error(`R2 follower model missing for ${today}`);
          const followers = JSON.parse(d1.followers_json || '{}');
          const failures = JSON.parse(d1.failures_json || '[]');
          console.log(`FOLLOWER_COLLECTION_OK date=${today} collected_at=${d1.collected_at} accounts=${Object.keys(followers).length} failures=${failures.length}`);
          console.log(`FOLLOWERS ${JSON.stringify(followers)}`);
          NODE
