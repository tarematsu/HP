name: Pages visual diagnostic temp

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.54.0
      - run: npx playwright install --with-deps chromium
      - run: node scripts/inspect-pages-visual-state.mjs
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: worker
      - name: Inspect unresolved playback track
        shell: bash
        working-directory: worker
        run: |
          set -euo pipefail
          mkdir -p ../.pages-visual-diagnostic
          node_modules/.bin/wrangler d1 execute stationhead-buddies --remote --yes --json --command "SELECT q.spotify_id,q.isrc,q.duration_ms,q.observed_at,m.title,m.artist,m.display_title,m.thumbnail_url,m.source,m.fetched_at,m.raw_json FROM sh_queue_items q LEFT JOIN sh_track_metadata m ON m.spotify_id=q.spotify_id WHERE q.spotify_id='0excsYy4LOVEcQTN4OPeJE' ORDER BY q.observed_at DESC LIMIT 5" > ../.pages-visual-diagnostic/buddies-track.json
          node_modules/.bin/wrangler d1 execute stationhead-minute --remote --yes --json --command "SELECT spotify_id,isrc,title,artist,display_title,thumbnail_url,spotify_url,source,fetched_at,raw_json FROM sh_track_metadata WHERE spotify_id='0excsYy4LOVEcQTN4OPeJE'" > ../.pages-visual-diagnostic/facts-track.json
          node_modules/.bin/wrangler d1 execute stationhead-minute --remote --yes --json --command "SELECT isrc,spotify_id,title,artist,thumbnail_url,metadata_source,metadata_fetched_at,updated_at FROM sh_track_dictionary WHERE spotify_id='0excsYy4LOVEcQTN4OPeJE'" > ../.pages-visual-diagnostic/dictionary-track.json
          node_modules/.bin/wrangler d1 execute stationhead-minute --remote --yes --json --command "SELECT spotify_id,isrc,title,artist,last_seen_at FROM sh_tracks WHERE spotify_id='0excsYy4LOVEcQTN4OPeJE' ORDER BY last_seen_at DESC LIMIT 5" > ../.pages-visual-diagnostic/tracks-track.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-visual-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: .pages-visual-diagnostic/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
