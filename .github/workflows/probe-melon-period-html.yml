name: Probe Melon historical period markup

on:
  push:
    branches:
      - research/melon-jpop-history-backfill
    paths:
      - '.github/workflows/probe-melon-period-html.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect representative Melon period markup
        shell: bash
        run: |
          node <<'NODE'
          const urls = [
            'https://www.melon.com/chart/month/index.htm?classCd=GN1900&moved=Y&rankMonth=202401',
            'https://www.melon.com/chart/week/index.htm?classCd=GN1900&moved=Y&startDay=20240101&endDay=20240107',
          ];
          for (const url of urls) {
            const response = await fetch(url, { headers: { 'user-agent':'Mozilla/5.0', 'accept-language':'ko-KR,ko;q=0.9' } });
            const html = await response.text();
            console.log('URL', url, 'HTTP', response.status, 'LENGTH', html.length);
            for (const pattern of [/rankMonth.{0,200}/gi,/202401.{0,200}/gi,/2024[^<]{0,80}/gi,/startDay.{0,200}/gi,/20240101.{0,200}/gi,/2024\.01\.[^<]{0,100}/gi]) {
              const values = [...html.matchAll(pattern)].slice(0, 8).map(x=>x[0].replace(/\s+/g,' '));
              console.log(pattern.toString(), JSON.stringify(values));
            }
          }
          NODE
