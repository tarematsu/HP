name: Backfill played tracks transition days

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backfill-played-tracks-transition.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backfill-played-tracks-transition-days
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      FACTS_DATABASE_NAME: stationhead-minute
      BUDDIES_DATABASE_NAME: stationhead-buddies
      PAGES_RESPONSE_BUCKET: sh-pages-responses
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Rebuild affected completed UTC days from exact playback events
        shell: bash
        run: |
          set -euo pipefail
          for day in 2026-10-01 2026-10-02; do
            echo "Rebuilding ${day}"
            TRACK_HISTORY_REPAIR_DAY="${day}" node scripts/repair-track-history-day-actions.mjs
          done
