name: Enqueue initial regional music run

on:
  push:
    branches:
      - ops/regional-music-initial-queue-20261002
    paths:
      - ".github/workflows/run-regional-music-initial-queue.yml"

permissions:
  contents: read

jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Enqueue 19 collectors one minute apart
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/regional-music-initial-queue.log"
          npm exec -- wrangler dev --remote --config wrangler.regional-music-initial.jsonc --port 8787 --log-level info >"$log" 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8787/; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; exit 1; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat "$log"; echo "Wrangler remote dev did not become ready" >&2; exit 1; fi

          response="$(curl -fsS http://127.0.0.1:8787/)"
          echo "$response" | jq .
          test "$(jq -r '.ok' <<<"$response")" = "true"
          test "$(jq -r '.queued' <<<"$response")" = "19"

          consumers="$(npm exec -- wrangler queues consumer worker list regional-music-daily --json)"
          echo "$consumers" | jq .
          grep -q 'sh-regional-music-collector' <<<"$consumers"
