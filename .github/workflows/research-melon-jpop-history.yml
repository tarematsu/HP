name: Research Melon J-pop history

on:
  push:
    branches:
      - research/melon-jpop-history-backfill
    paths:
      - '.github/workflows/research-melon-jpop-history.yml'
      - 'worker/src/melon-jpop-history.js'
      - 'worker/scripts/backfill-melon-jpop-history-actions.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan Melon J-pop weekly and monthly history
        working-directory: worker
        run: node scripts/backfill-melon-jpop-history-actions.mjs --start=2012-01-01 --types=week,month --concurrency=2
      - name: Upload Melon history result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: melon-jpop-history
          path: worker/artifacts/melon-jpop-history.json
          if-no-files-found: warn
