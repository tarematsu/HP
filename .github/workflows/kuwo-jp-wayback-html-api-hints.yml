name: Inspect archived Kuwo HTML API hints
on:
  push:
    branches: [research/kuwo-jp-chart-probe]
    paths: [.github/workflows/kuwo-jp-wayback-html-api-hints.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect archived HTML
        shell: bash
        run: |
          python3 <<'PY'
          import re,urllib.request
          base='https://www.kuwo.cn/newh5/bang/index'
          for ts in ['20220904135022','20220930182234','20250123175218','20250123182654']:
            u=f'https://web.archive.org/web/{ts}id_/{base}'
            try:
              q=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(q,timeout=20) as r:s=r.read().decode('utf-8','replace')
            except Exception as e:
              print('ERR',ts,repr(e));continue
            print('\n===',ts,'bytes',len(s),'===')
            for needle in ['kbangserver','ksong.s','musicList','musiclist','bangId','bangid','sourceid','/api/www/bang','183']:
              positions=[m.start() for m in re.finditer(re.escape(needle),s,re.I)]
              print('NEEDLE',needle,'COUNT',len(positions))
              for p in positions[:8]:
                frag=s[max(0,p-350):p+700].replace('\n',' ')
                print('HINT',frag)
          PY
