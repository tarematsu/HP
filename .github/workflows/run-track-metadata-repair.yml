name: Repair track metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-track-metadata-repair.yml'
      - 'worker/scripts/repair-track-metadata-actions.mjs'
      - 'worker/scripts/repair-playback-read-model-actions.mjs'
      - 'worker/scripts/repair-legacy-ranking-isrc-actions.mjs'
      - 'worker/scripts/repair-legacy-ranking-all-actions.mjs'
      - 'worker/scripts/repair-legacy-ranking-metadata-actions.mjs'
      - 'worker/scripts/report-unresolved-ranking-metadata-actions.mjs'
      - 'worker/src/isrc-metadata.js'
  workflow_run:
    workflows: ["Run runtime offline maintenance"]
    types: [completed]
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-metadata-repair
  cancel-in-progress: true

jobs:
  repair:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Consolidate and repair track metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      BUDDIES_DATABASE_NAME: stationhead-buddies
      FACTS_DATABASE_NAME: stationhead-minute
      TRACK_METADATA_ACTIONS_LIMIT: '150'
      TRACK_METADATA_LEGACY_LIMIT: '500'
      TRACK_METADATA_LOOKBACK_MS: '604800000'
      TRACK_METADATA_REFRESH_MS: '86400000'
      TRACK_METADATA_FETCH_CONCURRENCY: '4'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Repair metadata backlog and playback read models
        run: node scripts/repair-track-metadata-actions.mjs
      - name: Repair current playback read models from queue identity
        run: node scripts/repair-playback-read-model-actions.mjs
      - name: Repair all unresolved legacy like-ranking metadata by ISRC
        run: node scripts/repair-legacy-ranking-all-actions.mjs
      - name: Repair legacy like-ranking metadata
        run: node scripts/repair-legacy-ranking-metadata-actions.mjs
      - name: Report remaining unresolved ranking metadata
        run: node scripts/report-unresolved-ranking-metadata-actions.mjs
