name: PR256 Cloudflare free-tier 100 percent fix

on:
  push:
    branches:
      - agent/import-sh-snapshot
    paths:
      - .github/workflows/pr256-cloudflare-free-tier-100.yml

permissions:
  contents: write

concurrency:
  group: pr256-cloudflare-free-tier-100
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-sh-snapshot
          fetch-depth: 0
          show-progress: false

      - name: Apply Cloudflare free-tier 100 percent policy
        shell: bash
        run: |
          set -euo pipefail
          git mv scripts/enforce-d1-half-budget.mjs scripts/enforce-d1-free-tier-budget.mjs
          git mv scripts/enforce-d1-hourly-half-budget.mjs scripts/enforce-d1-hourly-free-tier-budget.mjs
          git mv tests/d1-half-budget-enforcement.test.mjs tests/d1-free-tier-budget-enforcement.test.mjs

          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s) of {old!r}, found {found}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          free_tier = '.github/scripts/cloudflare_free_tier_audit.py'
          replacements = {
              '"queueOperations": 8_000': '"queueOperations": 10_000',
              '"doRequests": 80_000': '"doRequests": 100_000',
              '"doActiveGbSeconds": 10_400.0': '"doActiveGbSeconds": 13_000.0',
              '"doRowsRead": 4_000_000': '"doRowsRead": 5_000_000',
              '"doRowsWritten": 80_000': '"doRowsWritten": 100_000',
              '"doStoredBytes": 4 * GB': '"doStoredBytes": 5 * GB',
              '"r2ClassAOperations": 800_000': '"r2ClassAOperations": 1_000_000',
              '"r2ClassBOperations": 8_000_000': '"r2ClassBOperations": 10_000_000',
              '"r2StoredBytes": 8 * GB': '"r2StoredBytes": 10 * GB',
              '"kvReads": 80_000': '"kvReads": 100_000',
              '"kvWrites": 800': '"kvWrites": 1_000',
              '"kvDeletes": 800': '"kvDeletes": 1_000',
              '"kvLists": 800': '"kvLists": 1_000',
              '"kvStoredBytes": 800_000_000': '"kvStoredBytes": 1_000_000_000',
              'Account-wide usage capped at 80% of Cloudflare free/no-charge allowances': 'Account-wide usage capped at 100% of Cloudflare free/no-charge allowances',
              '## Account-wide Cloudflare free-tier 80% budgets': '## Account-wide Cloudflare free-tier 100% budgets',
          }
          for old, new in replacements.items():
              replace(free_tier, old, new)

          workflow_limits = {
              '.github/workflows/sh-observability.yml': (
                  ('DAILY_REQUEST_BUDGET: "70000"', 'DAILY_REQUEST_BUDGET: "100000"'),
                  ('DAILY_D1_READ_BUDGET: "3000000"', 'DAILY_D1_READ_BUDGET: "5000000"'),
                  ('DAILY_D1_WRITE_BUDGET: "70000"', 'DAILY_D1_WRITE_BUDGET: "100000"'),
              ),
              '.github/workflows/hp-observability.yml': (
                  ('DAILY_REQUEST_BUDGET: "3000"', 'DAILY_REQUEST_BUDGET: "100000"'),
                  ('DAILY_D1_READ_BUDGET: "50000"', 'DAILY_D1_READ_BUDGET: "5000000"'),
                  ('DAILY_D1_WRITE_BUDGET: "3000"', 'DAILY_D1_WRITE_BUDGET: "100000"'),
                  ('DAILY_QUEUE_BUDGET: "1000"', 'DAILY_QUEUE_BUDGET: "10000"'),
              ),
          }
          for path, pairs in workflow_limits.items():
              for old, new in pairs:
                  replace(path, old, new)
          replace(
              '.github/workflows/sh-observability.yml',
              '      DAILY_D1_WRITE_BUDGET: "100000"\n      DAILY_USAGE_OUTPUT_DIR:',
              '      DAILY_D1_WRITE_BUDGET: "100000"\n      DAILY_QUEUE_BUDGET: "10000"\n      DAILY_USAGE_OUTPUT_DIR:',
          )

          for path in ('scripts/cloudflare-d1-usage.mjs', 'scripts/cloudflare-d1-hourly-usage.mjs'):
              replace(path, 'const TARGET_RATIO = 0.5;', 'const TARGET_RATIO = 1;')
          replace('scripts/cloudflare-d1-usage.mjs', '50% target', '100% target')
          replace('scripts/cloudflare-d1-hourly-usage.mjs', '50% free-tier window target', '100% free-tier window target')

          replace('scripts/enforce-d1-free-tier-budget.mjs', 'const ratio = 0.5;', 'const ratio = 1;')
          replace('scripts/enforce-d1-free-tier-budget.mjs', 'D1 50% free-tier budget exceeded', 'D1 100% free-tier budget exceeded')
          replace('scripts/enforce-d1-hourly-free-tier-budget.mjs', "numeric(input?.limits?.targetRatio) || 0.5", "numeric(input?.limits?.targetRatio) || 1")
          replace('scripts/enforce-d1-hourly-free-tier-budget.mjs', 'D1 rolling-window 50% budget exceeded', 'D1 rolling-window 100% free-tier budget exceeded')
          replace('scripts/enforce-d1-hourly-free-tier-budget.mjs', 'D1 rolling-window 50% budget passed', 'D1 rolling-window 100% free-tier budget passed')

          hourly_test = 'scripts/cloudflare-d1-hourly-usage.test.mjs'
          replace(hourly_test, 'const TARGET_RATIO = 0.5;', 'const TARGET_RATIO = 1;')
          replace(hourly_test, "test('50 percent free-tier budget is converted to an hourly rate'", "test('100 percent free-tier budget is converted to an hourly rate'")
          replace(hourly_test, '104_166.66666666667', '208_333.33333333334')
          replace(hourly_test, '2_083.3333333333335', '4_166.666666666667')

          enforcement_test = 'tests/d1-free-tier-budget-enforcement.test.mjs'
          replace(enforcement_test, "../scripts/enforce-d1-half-budget.mjs", "../scripts/enforce-d1-free-tier-budget.mjs")
          replace(enforcement_test, "../scripts/enforce-d1-hourly-half-budget.mjs", "../scripts/enforce-d1-hourly-free-tier-budget.mjs")
          replace(enforcement_test, 'daily D1 planning usage must stay strictly below 50 percent', 'daily D1 planning usage must stay strictly below the 100 percent free-tier ceiling')
          replace(enforcement_test, 'planningEstimate: { rowsRead: 500, rowsWritten: 49 }', 'planningEstimate: { rowsRead: 1_000, rowsWritten: 99 }')
          replace(enforcement_test, '/rows read 500 >= 500/', '/rows read 1000 >= 1000/')
          replace(enforcement_test, 'daily D1 planning usage below 50 percent passes', 'daily D1 planning usage below the 100 percent free-tier ceiling passes')
          replace(enforcement_test, 'planningEstimate: { rowsRead: 499, rowsWritten: 49 }', 'planningEstimate: { rowsRead: 999, rowsWritten: 99 }')
          replace(enforcement_test, 'reported rolling-window D1 usage at 50 percent fails', 'reported rolling-window D1 usage at the 100 percent free-tier ceiling fails')
          replace(enforcement_test, 'observed: { rowsRead: 500, rowsWritten: 49 }', 'observed: { rowsRead: 1_000, rowsWritten: 99 }')
          replace(enforcement_test, 'limits: { targetPerWindow: { rowsRead: 500, rowsWritten: 50 } }', 'limits: { targetPerWindow: { rowsRead: 1_000, rowsWritten: 100 } }')
          replace(enforcement_test, '/rows read 500 >= 500/', '/rows read 1000 >= 1000/')
          replace(enforcement_test, 'reported rolling-window D1 usage below 50 percent passes', 'reported rolling-window D1 usage below the 100 percent free-tier ceiling passes')
          replace(enforcement_test, 'observed: { rowsRead: 499, rowsWritten: 49 }', 'observed: { rowsRead: 999, rowsWritten: 99 }')
          replace(enforcement_test, 'limits: { targetPerWindow: { rowsRead: 500, rowsWritten: 50 } }', 'limits: { targetPerWindow: { rowsRead: 1_000, rowsWritten: 100 } }')
          replace(enforcement_test, 'targetRatio: 0.5', 'targetRatio: 1', expected=3)
          replace(enforcement_test, 'targetPerHour: { rowsRead: 104_166.67, rowsWritten: 2_083.33 }', 'targetPerHour: { rowsRead: 208_333.34, rowsWritten: 4_166.67 }')
          replace(enforcement_test, '8_680', '17_361')
          replace(enforcement_test, '2_083', '4_166')
          replace(enforcement_test, '/rows read 2300000 >= 8680/', '/rows read 2300000 >= 17361/')
          replace(enforcement_test, 'rowsWritten: 2_084', 'rowsWritten: 4_167')
          replace(enforcement_test, '/rows written 2084 >= 2083/', '/rows written 4167 >= 4166/')

          free_tier_test = 'tests/cloudflare-free-tier-budgets.test.mjs'
          replace(free_tier_test, 'fixed at 80 percent of included usage', 'fixed at 100 percent of included usage')
          for old, new in (
              ('Account-wide Cloudflare free-tier 80% budgets', 'Account-wide Cloudflare free-tier 100% budgets'),
              ('"queueOperations": 8_000', '"queueOperations": 10_000'),
              ('"doRequests": 80_000', '"doRequests": 100_000'),
              ('"doActiveGbSeconds": 10_400.0', '"doActiveGbSeconds": 13_000.0'),
              ('"doRowsRead": 4_000_000', '"doRowsRead": 5_000_000'),
              ('"doRowsWritten": 80_000', '"doRowsWritten": 100_000'),
              ('"doStoredBytes": 4 * GB', '"doStoredBytes": 5 * GB'),
              ('"r2ClassAOperations": 800_000', '"r2ClassAOperations": 1_000_000'),
              ('"r2ClassBOperations": 8_000_000', '"r2ClassBOperations": 10_000_000'),
              ('"r2StoredBytes": 8 * GB', '"r2StoredBytes": 10 * GB'),
              ('"kvReads": 80_000', '"kvReads": 100_000'),
              ('"kvWrites": 800', '"kvWrites": 1_000'),
              ('"kvDeletes": 800', '"kvDeletes": 1_000'),
              ('"kvLists": 800', '"kvLists": 1_000'),
              ('"kvStoredBytes": 800_000_000', '"kvStoredBytes": 1_000_000_000'),
              ('maximumCoordinatorRequests < 80_000', 'maximumCoordinatorRequests < 100_000'),
              ('maximumCoordinatorDuration < 10_400', 'maximumCoordinatorDuration < 13_000'),
              ('maximumCoordinatorRowsRead < 4_000_000', 'maximumCoordinatorRowsRead < 5_000_000'),
              ('maximumCoordinatorRowsWritten < 80_000', 'maximumCoordinatorRowsWritten < 100_000'),
              ('maximumQueueOperations < 8_000', 'maximumQueueOperations < 10_000'),
              ('maximumDailyKvWrites < 800', 'maximumDailyKvWrites < 1_000'),
              ('maximumMonthlyR2Mirrors + maximumMonthlyQueuePlanClassA < 800_000', 'maximumMonthlyR2Mirrors + maximumMonthlyQueuePlanClassA < 1_000_000'),
              ('maximumMonthlyQueuePlanReads < 8_000_000', 'maximumMonthlyQueuePlanReads < 10_000_000'),
          ):
              replace(free_tier_test, old, new)

          observability_test = 'tests/cloudflare-observability-budgets.test.mjs'
          for old, new in (
              ('DAILY_REQUEST_BUDGET: "70000"', 'DAILY_REQUEST_BUDGET: "100000"'),
              ('DAILY_D1_READ_BUDGET: "3000000"', 'DAILY_D1_READ_BUDGET: "5000000"'),
              ('DAILY_D1_WRITE_BUDGET: "70000"', 'DAILY_D1_WRITE_BUDGET: "100000"'),
          ):
              replace(observability_test, old, new)
          replace(observability_test, 'DAILY_D1_WRITE_BUDGET: "100000",\n', 'DAILY_D1_WRITE_BUDGET: "100000",\n    \'DAILY_QUEUE_BUDGET: "10000"\',\n')

          homepanel_test = 'tests/homepanel-observability-contract.test.mjs'
          for old, new in (
              ('DAILY_REQUEST_BUDGET: "3000"', 'DAILY_REQUEST_BUDGET: "100000"'),
              ('DAILY_D1_READ_BUDGET: "50000"', 'DAILY_D1_READ_BUDGET: "5000000"'),
              ('DAILY_D1_WRITE_BUDGET: "3000"', 'DAILY_D1_WRITE_BUDGET: "100000"'),
              ('DAILY_QUEUE_BUDGET: "1000"', 'DAILY_QUEUE_BUDGET: "10000"'),
          ):
              replace(homepanel_test, old, new)

          ci_test = 'tests/ci-workflow-efficiency.test.mjs'
          for old, new in (
              ('DAILY_REQUEST_BUDGET: "70000"', 'DAILY_REQUEST_BUDGET: "100000"'),
              ('DAILY_D1_READ_BUDGET: "3000000"', 'DAILY_D1_READ_BUDGET: "5000000"'),
              ('DAILY_D1_WRITE_BUDGET: "70000"', 'DAILY_D1_WRITE_BUDGET: "100000"'),
          ):
              replace(ci_test, old, new)
          replace(ci_test, 'assert.match(observability, /DAILY_D1_WRITE_BUDGET: "100000"/);', 'assert.match(observability, /DAILY_D1_WRITE_BUDGET: "100000"/);\n  assert.match(observability, /DAILY_QUEUE_BUDGET: "10000"/);')

          regression_test = 'tests/d1-budget-regressions.test.mjs'
          replace(regression_test, "test('measured daily budgets target the required reductions from the current estimate'", "test('measured daily budgets use the full Cloudflare free-tier ceilings'")
          replace(regression_test, '  const currentEstimate = { reads: 8_000_000, writes: 250_000 };\n  const budget = { reads: 3_000_000, writes: 70_000 };\n\n  assert.equal(1 - budget.reads / currentEstimate.reads, 0.625);\n  assert.equal(1 - budget.writes / currentEstimate.writes, 0.72);', '  const budget = { requests: 100_000, reads: 5_000_000, writes: 100_000, queueOperations: 10_000 };\n\n  assert.deepEqual(budget, { requests: 100_000, reads: 5_000_000, writes: 100_000, queueOperations: 10_000 });')
          for old, new in (
              ('DAILY_REQUEST_BUDGET: "70000"', 'DAILY_REQUEST_BUDGET: "100000"'),
              ('DAILY_D1_READ_BUDGET: "3000000"', 'DAILY_D1_READ_BUDGET: "5000000"'),
              ('DAILY_D1_WRITE_BUDGET: "70000"', 'DAILY_D1_WRITE_BUDGET: "100000"'),
          ):
              replace(regression_test, old, new)
          replace(regression_test, 'assert.match(workflow, /DAILY_D1_WRITE_BUDGET: "100000"/);', 'assert.match(workflow, /DAILY_D1_WRITE_BUDGET: "100000"/);\n  assert.match(workflow, /DAILY_QUEUE_BUDGET: "10000"/);')

          storage = 'scripts/cloudflare-d1-storage-audit.mjs'
          replace(storage, "const wranglerScript = path.resolve('worker/node_modules/wrangler/bin/wrangler.js');", "const wranglerScript = path.resolve('worker/node_modules/wrangler/bin/wrangler.js');\nconst D1_DATABASE_LIMIT_BYTES = 500_000_000;")
          replace(storage, "if (!database) throw new Error(`Wrangler did not list ${databaseName} (${databaseId})`);", "if (!database) throw new Error(`Wrangler did not list ${databaseName} (${databaseId})`);\nconst databaseFileSize = Number(database.file_size);\nif (!Number.isFinite(databaseFileSize) || databaseFileSize < 0) {\n  throw new Error(`Wrangler did not report a valid file_size for ${databaseName}`);\n}\nconst capacityExceeded = databaseFileSize >= D1_DATABASE_LIMIT_BYTES;")
          replace(storage, '  queryRowsRead,\n  probes,', '  queryRowsRead,\n  capacity: {\n    limitBytes: D1_DATABASE_LIMIT_BYTES,\n    fileSizeBytes: databaseFileSize,\n    utilizationPercent: (databaseFileSize / D1_DATABASE_LIMIT_BYTES) * 100,\n    exceeded: capacityExceeded,\n  },\n  probes,')
          replace(storage, '  `- Cloudflare file size: ${formatBytes(database.file_size)}`,', '  `- Cloudflare file size: ${formatBytes(databaseFileSize)}`,\n  `- Per-database capacity limit: ${formatBytes(D1_DATABASE_LIMIT_BYTES)}`,\n  `- Capacity utilization: ${report.capacity.utilizationPercent.toFixed(2)}%`,\n  `- Capacity result: ${capacityExceeded ? \'FAIL\' : \'PASS\'}`,')
          replace(storage, '  fileSize: database.file_size,', '  fileSize: databaseFileSize,\n  capacityLimitBytes: D1_DATABASE_LIMIT_BYTES,\n  capacityExceeded,')
          replace(storage, '  sqliteStat1Available: statRows.length > 0,\n}));', '  sqliteStat1Available: statRows.length > 0,\n}));\nif (capacityExceeded) {\n  console.error(`D1 database capacity exceeded: ${databaseName} ${databaseFileSize} >= ${D1_DATABASE_LIMIT_BYTES} bytes`);\n  process.exitCode = 1;\n}')

          storage_test = 'tests/d1-storage-audit.test.mjs'
          replace(storage_test, '  assert.match(script, /wrangler\\(\\[\'d1\', \'list\', \'--json\'\\]\\)/);', '  assert.match(script, /wrangler\\(\\[\'d1\', \'list\', \'--json\'\\]\\)/);\n  assert.match(script, /D1_DATABASE_LIMIT_BYTES = 500_000_000/);\n  assert.match(script, /databaseFileSize >= D1_DATABASE_LIMIT_BYTES/);\n  assert.match(script, /Per-database capacity limit/);\n  assert.match(script, /process\\.exitCode = 1/);')
          PY

      - name: Validate policy and regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit-cloudflare-daily-usage.py --self-test
          python3 .github/scripts/audit-cloudflare-free-tier.py --self-test
          node --test \
            scripts/cloudflare-d1-hourly-usage.test.mjs \
            tests/cloudflare-free-tier-budgets.test.mjs \
            tests/cloudflare-observability-budgets.test.mjs \
            tests/homepanel-observability-contract.test.mjs \
            tests/d1-budget-regressions.test.mjs \
            tests/ci-workflow-efficiency.test.mjs \
            tests/d1-free-tier-budget-enforcement.test.mjs \
            tests/d1-storage-audit.test.mjs
          if grep -RInE 'free-tier (50|80)%|50 percent free-tier|80 percent of included usage|TARGET_RATIO = 0\.5|targetRatio: 0\.5|rolling-window 50%' .github scripts tests --exclude='pr256-cloudflare-free-tier-100.yml'; then
            echo 'Legacy Cloudflare budget policy remains.' >&2
            exit 1
          fi
          git diff --check

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr256-cloudflare-free-tier-100.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: enforce full Cloudflare free-tier budgets'
          git push origin HEAD:agent/import-sh-snapshot
