name: Patch Stationhead follower discovery

on:
  push:
    branches: [fix/follower-metadata-and-collection]
    paths:
      - '.github/workflows/diagnose-stationhead-followers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/follower-metadata-and-collection
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch discovery and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('worker/src/stationhead-daily-followers.js')
          source = source_path.read_text()
          old = '''export async function discoverStationheadFollowerTargets(env, discoveredAt = Date.now()) {
            if (typeof env?.OTHER_DB?.prepare !== 'function') throw new Error('OTHER_DB binding is unavailable');
            if (typeof env?.BUDDIES_DB?.prepare !== 'function') throw new Error('BUDDIES_DB binding is unavailable');

            const [existingResult, buddiesResult] = await Promise.all([
              env.OTHER_DB.prepare(`SELECT handle,source_mask
                FROM sh_stationhead_follower_targets ORDER BY handle`).all(),
              env.BUDDIES_DB.prepare(`SELECT DISTINCT LOWER(TRIM(h.current_handle)) AS handle
                FROM sh_broadcast_sessions AS s
                JOIN sh_hosts AS h ON h.id=s.host_id
                WHERE s.host_id IS NOT NULL
                  AND h.current_handle IS NOT NULL
                  AND TRIM(h.current_handle)<>''`).all(),
            ]);

            const existing = new Map();
            for (const row of resultRows(existingResult)) {
              const handle = normalizedHandle(row?.handle);
              if (handle) existing.set(handle, Number(row?.source_mask || 0));
            }

            const desired = new Map(existing);
            for (const handle of STATIONHEAD_DAILY_FOLLOWER_HANDLES) addSource(desired, handle, FOLLOWER_SOURCE_FIXED);
            for (const row of resultRows(buddiesResult)) addSource(desired, row?.handle, FOLLOWER_SOURCE_BUDDIES);

            const mutations = [];
            for (const [handle, sourceMask] of desired) {
              const previousMask = Number(existing.get(handle) || 0);
              if ((previousMask & sourceMask) === sourceMask) continue;
              mutations.push(env.OTHER_DB.prepare(`INSERT INTO sh_stationhead_follower_targets(
                  handle,source_mask,first_seen_at
                ) VALUES(?,?,?)
                ON CONFLICT(handle) DO UPDATE SET
                  source_mask=(sh_stationhead_follower_targets.source_mask | excluded.source_mask)
                WHERE (sh_stationhead_follower_targets.source_mask & excluded.source_mask)<>excluded.source_mask`)
                .bind(handle, sourceMask, discoveredAt));
            }

            const targetWrites = await runStatements(env.OTHER_DB, mutations);
            return {
              handles: orderedHandles([...desired.keys()]),
              source_masks: Object.fromEntries(desired),
              target_writes: targetWrites,
              buddies_discovered: resultRows(buddiesResult).length,
              other_d1_reads: 1,
              buddies_d1_reads: 1,
            };
          }'''
          new = '''export async function discoverStationheadFollowerTargets(env, discoveredAt = Date.now()) {
            if (typeof env?.OTHER_DB?.prepare !== 'function') throw new Error('OTHER_DB binding is unavailable');

            const existingPromise = env.OTHER_DB.prepare(`SELECT handle,source_mask
              FROM sh_stationhead_follower_targets ORDER BY handle`).all();
            const discoverBuddiesHosts = async () => {
              if (typeof env?.MINUTE_DB?.prepare !== 'function') {
                return { result: { results: [] }, error: 'MINUTE_DB binding is unavailable', reads: 0 };
              }
              try {
                const result = await env.MINUTE_DB.prepare(`SELECT DISTINCT LOWER(TRIM(h.current_handle)) AS handle
                  FROM sh_broadcast_sessions AS s
                  JOIN sh_hosts AS h ON h.id=s.host_id
                  WHERE s.host_id IS NOT NULL
                    AND h.current_handle IS NOT NULL
                    AND TRIM(h.current_handle)<>''`).all();
                return { result, error: '', reads: 1 };
              } catch (error) {
                const message = String(error?.message || error).slice(0, 500);
                console.warn(JSON.stringify({
                  event: 'stationhead_follower_target_discovery_degraded',
                  error: message,
                }));
                return { result: { results: [] }, error: message, reads: 1 };
              }
            };

            const [existingResult, buddiesState] = await Promise.all([
              existingPromise,
              discoverBuddiesHosts(),
            ]);
            const buddiesResult = buddiesState.result;

            const existing = new Map();
            for (const row of resultRows(existingResult)) {
              const handle = normalizedHandle(row?.handle);
              if (handle) existing.set(handle, Number(row?.source_mask || 0));
            }

            const desired = new Map(existing);
            for (const handle of STATIONHEAD_DAILY_FOLLOWER_HANDLES) addSource(desired, handle, FOLLOWER_SOURCE_FIXED);
            for (const row of resultRows(buddiesResult)) addSource(desired, row?.handle, FOLLOWER_SOURCE_BUDDIES);

            const mutations = [];
            for (const [handle, sourceMask] of desired) {
              const previousMask = Number(existing.get(handle) || 0);
              if ((previousMask & sourceMask) === sourceMask) continue;
              mutations.push(env.OTHER_DB.prepare(`INSERT INTO sh_stationhead_follower_targets(
                  handle,source_mask,first_seen_at
                ) VALUES(?,?,?)
                ON CONFLICT(handle) DO UPDATE SET
                  source_mask=(sh_stationhead_follower_targets.source_mask | excluded.source_mask)
                WHERE (sh_stationhead_follower_targets.source_mask & excluded.source_mask)<>excluded.source_mask`)
                .bind(handle, sourceMask, discoveredAt));
            }

            const targetWrites = await runStatements(env.OTHER_DB, mutations);
            return {
              handles: orderedHandles([...desired.keys()]),
              source_masks: Object.fromEntries(desired),
              target_writes: targetWrites,
              buddies_discovered: resultRows(buddiesResult).length,
              buddies_discovery_error: buddiesState.error || null,
              other_d1_reads: 1,
              buddies_d1_reads: buddiesState.reads,
            };
          }'''
          if old not in source:
              raise SystemExit('target discovery block not found')
          source_path.write_text(source.replace(old, new))

          test_path = Path('worker/tests/stationhead-daily-followers.test.js')
          tests = test_path.read_text()
          old_test = '''    BUDDIES_DB: {
              prepare(sql) {
                assert.match(sql, /FROM sh_broadcast_sessions AS s/);
                assert.match(sql, /JOIN sh_hosts AS h/);
                return { async all() { return { results: [{ handle: 'BuddyHost' }] }; } };
              },
            },'''
          new_test = '''    MINUTE_DB: {
              prepare(sql) {
                assert.match(sql, /FROM sh_broadcast_sessions AS s/);
                assert.match(sql, /JOIN sh_hosts AS h/);
                return { async all() { return { results: [{ handle: 'BuddyHost' }] }; } };
              },
            },'''
          if old_test not in tests:
              raise SystemExit('discovery test binding block not found')
          tests = tests.replace(old_test, new_test, 1)
          marker = "test('collector fetches fixed and auto-added targets while keeping one compact daily D1 row', async () => {"
          regression = '''test('target discovery keeps fixed and registered handles when minute-facts discovery fails', async () => {
            const existingRows = STATIONHEAD_DAILY_FOLLOWER_HANDLES.map((handle) => ({ handle, source_mask: 1 }));
            existingRows.push({ handle: 'ohisamahost', source_mask: 4 });
            const env = {
              MINUTE_DB: {
                prepare() {
                  return { async all() { throw new Error('D1_ERROR: no such table: sh_broadcast_sessions'); } };
                },
              },
              OTHER_DB: {
                prepare(sql) {
                  if (/SELECT handle,source_mask/.test(sql)) {
                    return { async all() { return { results: existingRows }; } };
                  }
                  return { bind() { return { async run() { return { meta: { changes: 0 } }; } }; } };
                },
              },
            };

            const result = await discoverStationheadFollowerTargets(env, MIDNIGHT_JST);
            assert.deepEqual(result.handles, [...STATIONHEAD_DAILY_FOLLOWER_HANDLES, 'ohisamahost']);
            assert.equal(result.buddies_discovered, 0);
            assert.match(result.buddies_discovery_error, /no such table/);
            assert.equal(result.buddies_d1_reads, 1);
          });

          '''
          if marker not in tests:
              raise SystemExit('test insertion marker not found')
          tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests)
          PY
      - name: Run follower tests
        working-directory: worker
        run: node --test tests/stationhead-daily-followers.test.js tests/stationhead-daily-followers-resilient.test.js tests/stationhead-daily-followers-partial-recovery.test.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker/src/stationhead-daily-followers.js worker/tests/stationhead-daily-followers.test.js
          git commit -m 'Fix follower target discovery database' || exit 0
          git push origin HEAD:fix/follower-metadata-and-collection
