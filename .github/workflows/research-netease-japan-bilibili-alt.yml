name: Probe alternate Bilibili metadata endpoints

on:
  pull_request:
    paths:
      - '.github/workflows/research-netease-japan-bilibili-alt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe alternate endpoints
        shell: bash
        run: |
          mkdir -p research-bilibili-alt
          python - <<'PY'
          import json, pathlib, urllib.request, urllib.error
          aids=['254120575','115683098626622','116014163497529','117041147218209']
          templates=[
            'https://api.bilibili.com/x/web-interface/view/detail?aid={}',
            'http://api.bilibili.com/x/web-interface/view?aid={}',
            'https://www.bilibili.com/widget/getPageList?aid={}',
            'http://www.bilibili.com/widget/getPageList?aid={}',
            'https://api.bilibili.com/x/web-interface/archive/stat?aid={}',
            'https://api.bilibili.com/x/tag/archive/tags?aid={}',
          ]
          uas=[
            'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36',
            'Mozilla/5.0 BiliDroid/7.76.0 (bbcallen@gmail.com)',
          ]
          rows=[]
          for aid in aids:
            for tmpl in templates:
              url=tmpl.format(aid)
              for ua in uas:
                req=urllib.request.Request(url,headers={'User-Agent':ua,'Referer':'https://www.bilibili.com/video/av'+aid,'Accept':'application/json,text/plain,*/*'})
                row={'aid':aid,'url':url,'ua':ua[:24]}
                try:
                  with urllib.request.urlopen(req,timeout=15) as r:
                    body=r.read(500000).decode('utf-8','replace')
                    row.update(status=r.status,headers=dict(r.headers),body=body[:20000])
                except urllib.error.HTTPError as e:
                  try: body=e.read(500000).decode('utf-8','replace')
                  except Exception: body=''
                  row.update(status=e.code,headers=dict(e.headers),body=body[:20000],error=repr(e))
                except Exception as e:
                  row.update(status=None,error=repr(e))
                rows.append(row)
                print('\n###',aid,row.get('status'),url,ua[:20])
                print(row.get('body','')[:2500])
          pathlib.Path('research-bilibili-alt/probe.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          useful=[r for r in rows if r.get('status')==200 and r.get('body') and not r['body'].lstrip().lower().startswith('<!doctype html')]
          pathlib.Path('research-bilibili-alt/useful.json').write_text(json.dumps(useful,ensure_ascii=False,indent=2))
          print('\nUSEFUL',len(useful))
          PY
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netease-japan-bilibili-alt-probe
          path: research-bilibili-alt
          if-no-files-found: warn
