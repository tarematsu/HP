name: Apply daily summary rebuild

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/adjust-daily-summary-rebuild-order.mjs
      - .github/scripts/apply-daily-summary-rebuild.mjs
      - .github/workflows/apply-daily-summary-rebuild.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-daily-summary-after-minute-facts
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Adjust rebuild order
        run: node .github/scripts/adjust-daily-summary-rebuild-order.mjs
      - name: Apply patch
        run: node .github/scripts/apply-daily-summary-rebuild.mjs
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Rebuild daily summaries after minute facts repair completes"
          git push origin HEAD:agent/rebuild-daily-summary-after-minute-facts
      - name: Run focused tests
        run: |
          node --test tests/immutable-summary-rollups.test.mjs
          node --test tests/history-minute-summary.test.mjs
          node --test worker/tests/rollup-maintenance.test.js
