name: Publish GitHub deployment health

on:
  workflow_run:
    workflows: ["Deploy production", "Deploy HomePanel Cloud services", "Unified Cloudflare Observability"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-github-deployment-health.yml'
      - '.github/scripts/github-deployment-health.mjs'
      - '.github/scripts/publish-github-deployment-health.mjs'
      - '.github/scripts/publish-cloudflare-observability-status.mjs'
      - '.github/workflows/deploy-split-pipeline.yml'
      - '.github/workflows/cloud-deploy.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: github-deployment-health
  cancel-in-progress: true

jobs:
  publish:
    name: Update observability issue with deployment health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cloudflare-observability-status-issue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish Pages and Worker deployment health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_HEALTH_ISSUE_NUMBER: '259'
        run: node .github/scripts/publish-github-deployment-health.mjs
