name: Publish GitHub deployment health

on:
  workflow_run:
    workflows: ["Deploy production", "Deploy HomePanel Cloud services", "Native Windows Build", "Unified Cloudflare Observability"]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: github-deployment-health
  cancel-in-progress: true

jobs:
  publish:
    name: Update observability issue with deployment and release health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: cloudflare-observability-status-issue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish Pages, Worker, and native release health
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOYMENT_HEALTH_ISSUE_NUMBER: '259'
        run: node .github/scripts/publish-github-deployment-health.mjs
      - name: Synchronize unified system status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OBSERVABILITY_STATUS_ISSUE_NUMBER: '259'
        run: node .github/scripts/observability-system-status.mjs
