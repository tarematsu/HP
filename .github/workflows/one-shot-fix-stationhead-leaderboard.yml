name: One-shot fix Stationhead leaderboard

on:
  push:
    branches:
      - fix/stationhead-leaderboard-artifact-on-failure
    paths:
      - '.github/workflows/one-shot-fix-stationhead-leaderboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stationhead-leaderboard-artifact-on-failure
          fetch-depth: 0

      - name: Patch collector and importer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'expected block not found in {path}')
              s2 = s.replace(old, new, 1)
              p.write_text(s2)

          importer = 'worker/scripts/import-stationhead-weekly-leaderboard-actions.mjs'
          replace_once(importer, '''function normalizeCandidateRow(rank, nameValue, streamsValue, daysValue = null) {
            const name = displayAndCanonicalName(nameValue);
            const streams = parseMetric(streamsValue);
            const days = daysValue == null ? null : parseMetric(daysValue);
            if (!rank || !name || streams == null || streams < 0) return null;
            return {
              rank,
              channel_name: name.canonical,
              channel_alias: name.display,
              streams,
              days: days != null && days >= 0 && days <= 366 ? days : null,
            };
          }
          ''', '''function normalizeCandidateRow(rank, nameValue, streamsValue, daysValue = null) {
            const name = displayAndCanonicalName(nameValue);
            const streams = streamsValue == null ? null : parseMetric(streamsValue);
            const days = daysValue == null ? null : parseMetric(daysValue);
            if (!rank || !name || (streams != null && streams < 0)) return null;
            return {
              rank,
              channel_name: name.canonical,
              channel_alias: name.display,
              streams,
              days: days != null && days >= 0 && days <= 366 ? days : null,
            };
          }
          ''')

          collector = 'hp/native/src/stationhead_leaderboard_collector.cpp'
          replace_once(collector, '''  const rows = Array.from(document.querySelectorAll('tr,[role="row"]'))
            .slice(0, 15)
            .map(row => Array.from(row.querySelectorAll('th,td,[role="cell"],[role="gridcell"]'))
              .slice(0, 8)
              .map(cell => bounded(cell.innerText || cell.textContent, 80))
              .filter(Boolean))
            .filter(cells => cells.length > 0);
          const root = document.querySelector('main') || document.body;
          const lines = String(root?.innerText || '')
            .split(/\\n+/)
            .map(line => bounded(line, 120))
            .filter(Boolean)
            .slice(0, 80);
          const links = Array.from(root?.querySelectorAll?.('a[href]') || [])
            .slice(0, 15)
          ''', '''  const root = document.querySelector('main') || document.body;
          const all_lines = String(root?.innerText || '')
            .split(/\\n+/)
            .map(line => bounded(line, 120))
            .filter(Boolean)
            .slice(0, 800);
          const ranking = [];
          let expectedRank = 1;
          for (let index = 0; index < all_lines.length && expectedRank <= 100; index += 1) {
            if (Number(all_lines[index]) !== expectedRank) continue;
            let handle = '';
            for (let cursor = index + 1; cursor < Math.min(all_lines.length, index + 7); cursor += 1) {
              const match = all_lines[cursor].match(/^@([A-Za-z0-9_.-]{1,80})$/);
              if (match) {
                handle = match[1];
                break;
              }
            }
            if (!handle) continue;
            ranking.push({ rank: expectedRank, handle });
            expectedRank += 1;
          }
          const rows = Array.from(document.querySelectorAll('tr,[role="row"]'))
            .slice(0, 25)
            .map(row => Array.from(row.querySelectorAll('th,td,[role="cell"],[role="gridcell"]'))
              .slice(0, 8)
              .map(cell => bounded(cell.innerText || cell.textContent, 80))
              .filter(Boolean))
            .filter(cells => cells.length > 0);
          const lines = all_lines.slice(0, 120);
          const links = Array.from(root?.querySelectorAll?.('a[href]') || [])
            .slice(0, 25)
          ''')

          replace_once(collector, '''  const leaderboard_ready = !signed_in || (
            /^\\/leaderboard\\/?$/i.test(path) && lines.length >= 10 && links.length >= 5
          );
          return {
          ''', '''  const leaderboard_ready = signed_in && (
            /^\\/leaderboard\\/?$/i.test(path) && ranking.length >= 10
          );
          return {
          ''')

          replace_once(collector, '''    heading: bounded(root?.querySelector?.('h1,h2')?.innerText, 240),
            rows,
            lines,
          ''', '''    heading: bounded(root?.querySelector?.('h1,h2')?.innerText, 240),
            ranking,
            rows,
            lines,
          ''')

          workflow = '.github/workflows/stationhead-leaderboard-probe-report.yml'
          replace_once(workflow, '''      - name: Upload probe status artifact
                uses: actions/upload-artifact@v4
          ''', '''      - name: Upload probe status artifact
                if: always()
                uses: actions/upload-artifact@v4
          ''')
          replace_once(workflow, '''      - name: Upload latest leaderboard records artifact
                uses: actions/upload-artifact@v4
          ''', '''      - name: Upload latest leaderboard records artifact
                if: always()
                uses: actions/upload-artifact@v4
          ''')

          test_file = Path('worker/tests/stationhead-weekly-leaderboard-import.test.js')
          test_text = test_file.read_text()
          marker = "test('imports direct Stationhead rank+handle data without synthetic stream metrics'"
          if marker not in test_text:
              test_text += r'''

test('imports direct Stationhead rank+handle data without synthetic stream metrics', async () => {
  const db = createFakeDb();
  const artifact = artifactWith({
    schema: 2,
    captured_at: Date.parse('2026-09-22T18:00:00Z'),
    path: '/leaderboard',
    signed_in: true,
    leaderboard_ready: true,
    ranking: [
      { rank: 1, handle: 'sakanactionjp' },
      { rank: 31, handle: 'sakurazaka46jp' },
      { rank: 52, handle: 'sakuramankai' },
    ],
  }, { digest: 'rank-only-digest' });

  const result = await importLeaderboardArtifact(artifact, db, 333);
  assert.equal(result.status, 'imported');
  assert.equal(result.row_count, 3);
  assert.equal(db.state.rows.length, 3);
  assert.equal(db.state.rows[1].channel_name, 'sakurazaka46jp');
  assert.equal(db.state.rows[1].rank, 31);
  assert.equal(db.state.rows[1].total_listens, null);
  assert.equal(db.state.rows[2].channel_name, 'sakuramankai');
  assert.equal(db.state.rows[2].rank, 52);
});
'''
              test_file.write_text(test_text)

          regression = Path('hp/video/test/stationhead-leaderboard-cloud-upload-regression.test.js')
          regression_text = regression.read_text()
          marker = "collector captures a structured top-100 weekly ranking"
          if marker not in regression_text:
              regression_text += r'''

test('collector captures a structured top-100 weekly ranking', () => {
  assert.match(collector, /const ranking = \[\]/);
  assert.match(collector, /expectedRank <= 100/);
  assert.match(collector, /ranking\.push\(\{ rank: expectedRank, handle \}\)/);
  assert.match(collector, /ranking\.length >= 10/);
});
'''
              regression.write_text(regression_text)
          PY

          rm .github/workflows/one-shot-fix-stationhead-leaderboard.yml

          node --test worker/tests/stationhead-weekly-leaderboard-import.test.js
          node --test hp/video/test/stationhead-leaderboard-cloud-upload-regression.test.js

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker/scripts/import-stationhead-weekly-leaderboard-actions.mjs \
            worker/tests/stationhead-weekly-leaderboard-import.test.js \
            hp/native/src/stationhead_leaderboard_collector.cpp \
            hp/video/test/stationhead-leaderboard-cloud-upload-regression.test.js \
            .github/workflows/stationhead-leaderboard-probe-report.yml \
            .github/workflows/one-shot-fix-stationhead-leaderboard.yml
          git commit -m 'Capture and import rank-only Stationhead weekly leaderboard'
          git push origin HEAD:fix/stationhead-leaderboard-artifact-on-failure
