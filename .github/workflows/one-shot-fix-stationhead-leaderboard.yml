name: One-shot fix Stationhead leaderboard

on:
  push:
    branches:
      - fix/stationhead-leaderboard-artifact-on-failure
    paths:
      - '.github/workflows/one-shot-fix-stationhead-leaderboard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/stationhead-leaderboard-artifact-on-failure
          fetch-depth: 0

      - name: Patch collector and importer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'expected block not found in {path}')
              p.write_text(s.replace(old, new, 1))

          importer = 'worker/scripts/import-stationhead-weekly-leaderboard-actions.mjs'
          replace_once(importer, """function normalizeCandidateRow(rank, nameValue, streamsValue, daysValue = null) {
            const name = displayAndCanonicalName(nameValue);
            const streams = parseMetric(streamsValue);
            const days = daysValue == null ? null : parseMetric(daysValue);
            if (!rank || !name || streams == null || streams < 0) return null;
            return {
              rank,
              channel_name: name.canonical,
              channel_alias: name.display,
              streams,
              days: days != null && days >= 0 && days <= 366 ? days : null,
            };
          }
          """, """function normalizeCandidateRow(rank, nameValue, streamsValue, daysValue = null) {
            const name = displayAndCanonicalName(nameValue);
            const streams = streamsValue == null ? null : parseMetric(streamsValue);
            const days = daysValue == null ? null : parseMetric(daysValue);
            if (!rank || !name || (streams != null && streams < 0)) return null;
            return {
              rank,
              channel_name: name.canonical,
              channel_alias: name.display,
              streams,
              days: days != null && days >= 0 && days <= 366 ? days : null,
            };
          }
          """)

          collector = 'hp/native/src/stationhead_leaderboard_collector.cpp'
          replace_once(collector, """  const rows = Array.from(document.querySelectorAll('tr,[role=\"row\"]'))
            .slice(0, 15)
            .map(row => Array.from(row.querySelectorAll('th,td,[role=\"cell\"],[role=\"gridcell\"]'))
              .slice(0, 8)
              .map(cell => bounded(cell.innerText || cell.textContent, 80))
              .filter(Boolean))
            .filter(cells => cells.length > 0);
          const root = document.querySelector('main') || document.body;
          const lines = String(root?.innerText || '')
            .split(/\\n+/)
            .map(line => bounded(line, 120))
            .filter(Boolean)
            .slice(0, 80);
          const links = Array.from(root?.querySelectorAll?.('a[href]') || [])
            .slice(0, 15)
          """, """  const root = document.querySelector('main') || document.body;
          const all_lines = String(root?.innerText || '')
            .split(/\\n+/)
            .map(line => bounded(line, 120))
            .filter(Boolean)
            .slice(0, 800);
          const ranking = [];
          let expectedRank = 1;
          for (let index = 0; index < all_lines.length && expectedRank <= 100; index += 1) {
            if (Number(all_lines[index]) !== expectedRank) continue;
            let handle = '';
            for (let cursor = index + 1; cursor < Math.min(all_lines.length, index + 7); cursor += 1) {
              const match = all_lines[cursor].match(/^@([A-Za-z0-9_.-]{1,80})$/);
              if (match) {
                handle = match[1];
                break;
              }
            }
            if (!handle) continue;
            ranking.push({ rank: expectedRank, handle });
            expectedRank += 1;
          }
          const rows = Array.from(document.querySelectorAll('tr,[role=\"row\"]'))
            .slice(0, 25)
            .map(row => Array.from(row.querySelectorAll('th,td,[role=\"cell\"],[role=\"gridcell\"]'))
              .slice(0, 8)
              .map(cell => bounded(cell.innerText || cell.textContent, 80))
              .filter(Boolean))
            .filter(cells => cells.length > 0);
          const lines = all_lines.slice(0, 120);
          const links = Array.from(root?.querySelectorAll?.('a[href]') || [])
            .slice(0, 25)
          """)

          replace_once(collector, """  const leaderboard_ready = !signed_in || (
            /^\\/leaderboard\\/?$/i.test(path) && lines.length >= 10 && links.length >= 5
          );
          return {
          """, """  const leaderboard_ready = signed_in && (
            /^\\/leaderboard\\/?$/i.test(path) && ranking.length >= 10
          );
          return {
          """)

          replace_once(collector, """    heading: bounded(root?.querySelector?.('h1,h2')?.innerText, 240),
            rows,
            lines,
          """, """    heading: bounded(root?.querySelector?.('h1,h2')?.innerText, 240),
            ranking,
            rows,
            lines,
          """)

          workflow = '.github/workflows/stationhead-leaderboard-probe-report.yml'
          replace_once(workflow, "      - name: Upload probe status artifact\n        uses: actions/upload-artifact@v4\n", "      - name: Upload probe status artifact\n        if: always()\n        uses: actions/upload-artifact@v4\n")
          replace_once(workflow, "      - name: Upload latest leaderboard records artifact\n        uses: actions/upload-artifact@v4\n", "      - name: Upload latest leaderboard records artifact\n        if: always()\n        uses: actions/upload-artifact@v4\n")
          PY

          node --test worker/tests/stationhead-weekly-leaderboard-import.test.js
          node --test hp/video/test/stationhead-leaderboard-cloud-upload-regression.test.js

          rm .github/workflows/one-shot-fix-stationhead-leaderboard.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Capture and import rank-only Stationhead weekly leaderboard'
          git push origin HEAD:fix/stationhead-leaderboard-artifact-on-failure
