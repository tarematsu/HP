name: HomePanel unified Worker CI

on:
  pull_request:
    paths:
      - 'hp/cloud/src/**'
      - 'hp/cloud/test/**'
      - 'hp/cloud/migrations/**'
      - 'hp/cloud/scripts/**'
      - 'hp/cloud/package.json'
      - 'hp/cloud/package-lock.json'
      - 'hp/cloud/tsconfig.json'
      - 'hp/cloud/vitest.config.ts'
      - 'hp/cloud/wrangler.jsonc'
      - 'hp/cloud/wrangler.test.jsonc'
      - 'hp/cloud/.ci-full-trigger'
      - 'hp/video/src/**'
      - 'hp/video/public/**'
      - 'hp/video/package.json'
      - '.github/actions/cloudflare-context/action.yml'
      - '.github/actions/cloudflare-observability-diagnostics/action.yml'
      - '.github/scripts/audit-cloudflare-daily-usage.py'
      - '.github/scripts/audit-cloudflare-free-tier.py'
      - '.github/scripts/audit-observability-budget-gates.py'
      - '.github/scripts/audit-cloudflare-telemetry.py'
      - '.github/scripts/audit-deployed-cloudflare-telemetry.py'
      - '.github/scripts/query-cloudflare-d1-costs.py'
      - '.github/scripts/resolve-cloudflare-account.mjs'
      - '.github/scripts/resolve-cloudflare-config.mjs'
      - '.github/scripts/observability-status-publisher.mjs'
      - '.github/scripts/publish-cloudflare-observability-status.mjs'
      - '.github/workflows/cloud-deploy.yml'
      - '.github/workflows/sh-observability.yml'
      - '.github/workflows/homepanel-unified-ci.yml'
      - '.github/scripts/ci/select-scopes.mjs'
      - 'tests/cloudflare-*.test.mjs'
      - 'tests/helpers/source-contract.mjs'
      - 'tests/homepanel-*.test.mjs'
      - 'tests/observability-*.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepanel-unified-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select HomePanel checks
    runs-on: ubuntu-latest
    outputs:
      cloud: ${{ steps.scope.outputs.cloud }}
      video: ${{ steps.scope.outputs.video }}
      bundle: ${{ steps.scope.outputs.bundle }}
      contracts: ${{ steps.scope.outputs.contracts }}
      integration: ${{ steps.scope.outputs.integration }}
      migrations: ${{ steps.scope.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select affected HomePanel checks
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            node .github/scripts/ci/select-scopes.mjs homepanel --all
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
              node .github/scripts/ci/select-scopes.mjs homepanel
          fi

  validate:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            hp/cloud/package-lock.json
            hp/video/package.json

      - name: Validate production contracts and observability policies
        if: needs.changes.outputs.contracts == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit-cloudflare-daily-usage.py --self-test
          python3 .github/scripts/audit-cloudflare-free-tier.py --self-test
          python3 .github/scripts/audit-observability-budget-gates.py --self-test
          python3 .github/scripts/audit-cloudflare-telemetry.py --self-test
          python3 .github/scripts/audit-deployed-cloudflare-telemetry.py --self-test
          python3 .github/scripts/query-cloudflare-d1-costs.py --self-test
          node --test \
            tests/cloudflare-*.test.mjs \
            tests/homepanel-*.test.mjs \
            tests/observability-*.test.mjs

      - name: Install HomePanel dependencies
        if: needs.changes.outputs.cloud == 'true' || needs.changes.outputs.video == 'true'
        working-directory: hp/cloud
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install video runtime dependencies
        if: needs.changes.outputs.bundle == 'true'
        working-directory: hp/video
        run: npm install --no-audit --no-fund

      - name: Check HomePanel sources
        if: needs.changes.outputs.cloud == 'true'
        working-directory: hp/cloud
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee source-check.log

      - name: Run fast HomePanel tests
        if: needs.changes.outputs.cloud == 'true' && needs.changes.outputs.integration != 'true' && github.event_name != 'workflow_dispatch'
        working-directory: hp/cloud
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci 2>&1 | tee test.log

      - name: Run full HomePanel tests
        if: needs.changes.outputs.cloud == 'true' && (needs.changes.outputs.integration == 'true' || github.event_name == 'workflow_dispatch')
        working-directory: hp/cloud
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Build the unified Worker
        if: needs.changes.outputs.bundle == 'true'
        working-directory: hp/cloud
        run: npm run check:unified-bundle

      - name: Verify local unified D1 migrations
        if: needs.changes.outputs.migrations == 'true'
        working-directory: hp/cloud
        shell: bash
        run: |
          set -o pipefail
          {
            rm -rf .wrangler-ci-state
            npx wrangler d1 migrations apply homepanel-data --local --persist-to .wrangler-ci-state --config wrangler.jsonc
            npx wrangler d1 execute homepanel-data --local --persist-to .wrangler-ci-state --config wrangler.jsonc --command "PRAGMA foreign_key_check;"
            npx wrangler d1 execute homepanel-data --local --persist-to .wrangler-ci-state --config wrangler.jsonc --command "SELECT COUNT(*) AS schema_object_count FROM sqlite_schema WHERE type IN ('table','index','trigger','view') AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%';"
          } 2>&1 | tee d1-validation.log

      - name: Upload failed validation output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: homepanel-unified-validation-output-${{ github.run_id }}
          path: |
            hp/cloud/source-check.log
            hp/cloud/test.log
            hp/cloud/d1-validation.log
          if-no-files-found: warn
          retention-days: 7
