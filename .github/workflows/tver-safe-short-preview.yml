name: TVer short items and previews

on:
  push:
    branches: [fix/tver-short-previews-safe-sync]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tver-short-previews-safe-sync
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/tver-safe-short-preview.py
      - name: Run TVer contract tests
        run: node --test hp/video/test/native-media-30-90-tver-alternation-contract.test.js hp/video/test/native-mv-panel-contract.test.js hp/video/test/native-tver-all-episodes-contract.test.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hp/native/src/renderer_panels.cpp hp/video/test/native-media-30-90-tver-alternation-contract.test.js hp/video/test/native-tver-all-episodes-contract.test.js
          git diff --cached --check
          git commit -m "fix: support short TVer items and previews"
          git push origin HEAD:fix/tver-short-previews-safe-sync
