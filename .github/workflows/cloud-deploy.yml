name: Deploy HomePanel Cloud services

on:
  push:
    branches: [main]
    paths:
      - "hp/cloud/**"
      - "hp/video/**"
      - ".github/actions/cloudflare-context/action.yml"
      - ".github/scripts/resolve-cloudflare-account.mjs"
      - ".github/workflows/cloud-deploy.yml"
      - ".github/scripts/assert-actions-only-cloudflare.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepanel-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      HOMEPANEL_D1_DATABASE_ID: ${{ secrets.HOMEPANEL_D1_DATABASE_ID }}
      HOMEPANEL_BASE_URL: ${{ vars.HOMEPANEL_BASE_URL }}
      HOMEPANEL_READY_TOKEN: ${{ secrets.HOMEPANEL_READY_TOKEN }}
      RADAR_DISPATCH_TOKEN: ${{ secrets.RADAR_DISPATCH_TOKEN || secrets.GITHUB_RADAR_DISPATCH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-homepanel-${{ hashFiles('hp/cloud/package-lock.json', 'hp/video/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-homepanel-

      - name: Install HomePanel dependencies
        working-directory: hp/cloud
        run: npm ci --no-audit --no-fund

      - name: Install video dependencies
        working-directory: hp/video
        run: npm install --no-audit --no-fund

      - name: Enforce GitHub Actions-only Cloudflare deployment
        run: node .github/scripts/assert-actions-only-cloudflare.mjs

      - name: Validate HomePanel gateway
        working-directory: hp/cloud
        run: |
          npm run check
          npm test
          npm run check:unified-bundle

      - name: Validate video service
        working-directory: hp/video
        run: |
          npm test
          npm run check

      - name: Deploy private video service
        working-directory: hp/video
        run: npm run deploy

      - name: Deploy HomePanel gateway
        working-directory: hp/cloud
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run deploy
            exit 0
          fi

          if [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            npm run deploy
            exit 0
          fi

          if ! git -C "$GITHUB_WORKSPACE" cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi

          if git -C "$GITHUB_WORKSPACE" diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
            hp/cloud/migrations \
            hp/cloud/scripts/deploy-existing.mjs \
            hp/cloud/wrangler.jsonc \
            hp/cloud/package.json \
            hp/cloud/package-lock.json; then
            npm run deploy:worker
          else
            echo "Migration-sensitive files changed; applying pending migrations before deployment."
            npm run deploy
          fi

      - name: Verify deployed readiness
        if: ${{ env.HOMEPANEL_BASE_URL != '' && env.HOMEPANEL_READY_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $HOMEPANEL_READY_TOKEN" \
            "$HOMEPANEL_BASE_URL/v1/ready" \
            > "$RUNNER_TEMP/homepanel-readiness.json"
          cat "$RUNNER_TEMP/homepanel-readiness.json"

      - name: Report disabled readiness verification
        if: ${{ env.HOMEPANEL_BASE_URL == '' || env.HOMEPANEL_READY_TOKEN == '' }}
        run: echo "::warning::Set HOMEPANEL_BASE_URL variable and HOMEPANEL_READY_TOKEN secret to enable post-deploy readiness verification."

      - name: Sync radar dispatcher token
        if: ${{ env.RADAR_DISPATCH_TOKEN != '' }}
        working-directory: hp/cloud
        run: printf '%s' "$RADAR_DISPATCH_TOKEN" | npx wrangler secret put GITHUB_RADAR_DISPATCH_TOKEN --name homepanel-cloud

      - name: Report missing radar dispatcher token
        if: ${{ env.RADAR_DISPATCH_TOKEN == '' }}
        run: echo "::warning::RADAR_DISPATCH_TOKEN is not configured; automatic radar workflow dispatch remains disabled"
