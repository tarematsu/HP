name: Deploy HomePanel Cloud services

on:
  push:
    branches: [main]
    paths:
      - "hp/package.json"
      - "hp/package-lock.json"
      - "hp/cloud/**"
      - "hp/video/**"
      - ".github/actions/cloudflare-context/action.yml"
      - ".github/scripts/resolve-cloudflare-account.mjs"
      - ".github/scripts/cloudflare-worker-public-url.mjs"
      - ".github/scripts/delete-cloudflare-worker.mjs"
      - ".github/scripts/summarize-homepanel-deploy-failure.mjs"
      - ".github/workflows/cloud-deploy.yml"
      - ".github/scripts/assert-actions-only-cloudflare.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepanel-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      HOMEPANEL_D1_DATABASE_ID: ${{ secrets.HOMEPANEL_D1_DATABASE_ID }}
      HOMEPANEL_READY_TOKEN: ${{ secrets.HOMEPANEL_READY_TOKEN }}
      RADAR_DISPATCH_TOKEN: ${{ secrets.RADAR_DISPATCH_TOKEN || secrets.GITHUB_RADAR_DISPATCH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hp/package-lock.json

      - name: Install HomePanel workspace dependencies
        working-directory: hp
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Enforce GitHub Actions-only Cloudflare deployment
        run: node .github/scripts/assert-actions-only-cloudflare.mjs

      - name: Validate integrated HomePanel runtime
        working-directory: hp
        run: |
          npm run check --workspace cloud
          npm test --workspace cloud
          npm test --workspace video
          npm run check --workspace video
          npm run check:unified-bundle --workspace cloud

      # Cloudflare Queues permits only one active push consumer per Queue. The
      # retired standalone Worker must release its consumer before the unified
      # Worker can attach to videoscraper-manual-imports. The Queue is explicit
      # because legacy consumer records may omit script_name.
      - name: Release manual import Queue consumer — Delete retired homepanel-video Worker
        run: node .github/scripts/delete-cloudflare-worker.mjs homepanel-video videoscraper-manual-imports

      - name: Deploy HomePanel Cloud
        working-directory: hp
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          deploy_log="$RUNNER_TEMP/homepanel-deploy.log"
          run_deploy() {
            set +e
            "$@" 2>&1 | tee "$deploy_log"
            status=${PIPESTATUS[0]}
            set -e
            if (( status != 0 )); then
              node "$GITHUB_WORKSPACE/.github/scripts/summarize-homepanel-deploy-failure.mjs" "$deploy_log" || true
              exit "$status"
            fi
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            run_deploy npm run deploy --workspace cloud
            exit 0
          fi

          if [ -z "${BEFORE_SHA:-}" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            run_deploy npm run deploy --workspace cloud
            exit 0
          fi

          if ! git -C "$GITHUB_WORKSPACE" cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          fi

          if git -C "$GITHUB_WORKSPACE" diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
            hp/package-lock.json \
            hp/cloud/migrations \
            hp/cloud/scripts/deploy-existing.mjs \
            hp/cloud/wrangler.jsonc \
            hp/cloud/package.json; then
            run_deploy npm run deploy:worker --workspace cloud
          else
            echo "Migration-sensitive files changed; applying pending migrations before deployment."
            run_deploy npm run deploy --workspace cloud
          fi

      - name: Upload HomePanel deployment failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: homepanel-deploy-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/homepanel-deploy.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Resolve deployed HomePanel public URL
        id: homepanel-public-url
        run: node .github/scripts/cloudflare-worker-public-url.mjs homepanel-cloud /api/health

      - name: Verify deployed readiness
        shell: bash
        env:
          HOMEPANEL_HEALTH_URL: ${{ steps.homepanel-public-url.outputs.health-url }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/homepanel-public-health.json"
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 5 --retry-all-errors \
            -H "Accept: application/json" \
            "$HOMEPANEL_HEALTH_URL" \
            > "$output"
          cat "$output"
          node -e '
            const fs = require("node:fs");
            const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (payload?.ok !== true || payload?.service !== "homepanel-video") {
              throw new Error(`Unexpected HomePanel public health response: ${JSON.stringify(payload)}`);
            }
          ' "$output"

      - name: Verify authenticated deployed readiness
        if: ${{ env.HOMEPANEL_READY_TOKEN != '' }}
        shell: bash
        env:
          HOMEPANEL_BASE_URL: ${{ steps.homepanel-public-url.outputs.base-url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 4 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $HOMEPANEL_READY_TOKEN" \
            "$HOMEPANEL_BASE_URL/v1/ready" \
            > "$RUNNER_TEMP/homepanel-readiness.json"
          cat "$RUNNER_TEMP/homepanel-readiness.json"

      - name: Report disabled authenticated readiness verification
        if: ${{ env.HOMEPANEL_READY_TOKEN == '' }}
        run: echo "::notice::Public HomePanel D1 health passed; set HOMEPANEL_READY_TOKEN to add the authenticated /v1/ready check."

      - name: Sync radar dispatcher token
        if: ${{ env.RADAR_DISPATCH_TOKEN != '' }}
        working-directory: hp
        run: printf '%s' "$RADAR_DISPATCH_TOKEN" | npm exec --workspace cloud -- wrangler secret put GITHUB_RADAR_DISPATCH_TOKEN --name homepanel-cloud

      - name: Report missing radar dispatcher token
        if: ${{ env.RADAR_DISPATCH_TOKEN == '' }}
        run: echo "::warning::RADAR_DISPATCH_TOKEN is not configured; automatic radar workflow dispatch remains disabled"
