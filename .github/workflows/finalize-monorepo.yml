name: Finalize monorepo

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/finalize-monorepo.yml
      - .github/scripts/finalize-monorepo.py
      - .github/scripts/trigger-monorepo.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/import-sh-snapshot' || github.ref_name == 'agent/import-sh-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-sh-snapshot
          fetch-depth: 0

      - name: Build unified repository layout
        run: python3 .github/scripts/finalize-monorepo.py

      - name: Exclude active workflow mutations from the bot commit
        run: |
          git checkout HEAD -- .github/workflows
          git clean -fd .github/workflows

      - name: Stage monorepo
        run: git add -A

      - name: Commit monorepo
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Unify SH and HP as a production monorepo"

      - name: Push monorepo
        run: git push origin HEAD:agent/import-sh-snapshot
