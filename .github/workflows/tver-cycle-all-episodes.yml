name: TVer all episodes patch

on:
  push:
    branches: [feat/tver-cycle-all-episodes]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tver-cycle-all-episodes
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/tver-cycle-all-episodes.py
      - name: Run TVer tests
        run: node --test hp/video/test/native-media-30-90-tver-alternation-contract.test.js hp/video/test/native-mv-panel-contract.test.js hp/video/test/native-tver-all-episodes-contract.test.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hp/native/src/renderer_panels.cpp hp/video/test/native-tver-all-episodes-contract.test.js
          git diff --cached --check
          git commit -m "feat: cycle all published TVer episodes"
          git push origin HEAD:feat/tver-cycle-all-episodes
