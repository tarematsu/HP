name: Apply window-named monitor/audio modes v2

on:
  push:
    branches:
      - feat/window-named-audio-monitor-modes
    paths:
      - .github/workflows/apply-window-named-modes-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply source and test patch
        shell: python
        run: |
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          def replace_test(path, title, replacement):
              s = read(path)
              needle = f"test('{title}', () => {{"
              start = s.index(needle)
              next_test = s.find("\n\ntest('", start + len(needle))
              end = len(s) if next_test < 0 else next_test
              s = s[:start] + replacement.rstrip() + s[end:]
              write(path, s)

          # Keep the existing MonitorMode enum but select one Stationhead profile while ServiceGrid is active.
          p = 'hp/native/src/power_saving_controller.h'
          s = read(p)
          s = replace_once(
              s,
              '  MonitorMode monitorMode_ = MonitorMode::Native;\n  bool monitorAuthForeground_ = false;',
              '  MonitorMode monitorMode_ = MonitorMode::Native;\n  unsigned monitorStationheadProfile_ = 6;\n  bool monitorAuthForeground_ = false;',
              'controller monitor profile state')
          write(p, s)

          p = 'hp/native/src/stationhead_monitor_probe.h'
          s = read(p)
          start = s.index('// Monitor placement and Stationhead WebView layout live in separate modules.')
          end = s.index('\n}  // namespace hp', start)
          block = '''// Monitor placement and Stationhead WebView layout live in separate modules.\n// A value of 1..6 identifies the single Stationhead window selected for the\n// monitor surface. Zero means no Stationhead monitor is selected.\ninline std::atomic<unsigned> gStationheadMonitorProfile{0};\n\ninline bool SetStationheadMonitorProfile(unsigned profile) noexcept {\n  if (profile > 6) profile = 0;\n  return gStationheadMonitorProfile.exchange(\n             profile, std::memory_order_acq_rel) != profile;\n}\n\ninline unsigned StationheadMonitorProfile() noexcept {\n  return gStationheadMonitorProfile.load(std::memory_order_acquire);\n}\n\ninline unsigned StationheadProfileNumber(\n    const std::wstring& profileName) noexcept {\n  if (profileName == L"spotify-v2-1") return 1;\n  if (profileName == L"spotify-v2-2") return 2;\n  if (profileName == L"spotify-v2-3") return 3;\n  if (profileName == L"spotify-v2-4") return 4;\n  if (profileName == L"spotify-v2-5") return 5;\n  if (profileName == L"spotify-v2-6") return 6;\n  return 0;\n}\n\ninline bool StationheadMonitorForegroundForProfile(\n    const std::wstring& profileName) noexcept {\n  const unsigned selected = StationheadMonitorProfile();\n  return selected != 0 && selected == StationheadProfileNumber(profileName);\n}\n\ninline bool SetStationheadMonitorForeground(bool foreground) noexcept {\n  return SetStationheadMonitorProfile(foreground ? 6u : 0u);\n}\n\ninline bool StationheadMonitorForeground() noexcept {\n  return StationheadMonitorProfile() != 0;\n}\n'''
          s = s[:start] + block + s[end:]
          write(p, s)

          p = 'hp/native/src/power_saving_schedule.inc'
          s = read(p)
          start = s.index('void PowerSavingController::CycleMonitorMode() noexcept {')
          end = s.index('\nvoid PowerSavingController::ApplyMonitorMode', start)
          cycle = '''void PowerSavingController::CycleMonitorMode() noexcept {\n  switch (monitorMode_) {\n    case MonitorMode::Native:\n      monitorStationheadProfile_ = 6;\n      ApplyMonitorMode(MonitorMode::ServiceGrid);\n      break;\n    case MonitorMode::ServiceGrid:\n      if (monitorStationheadProfile_ == 5) {\n        ApplyMonitorMode(MonitorMode::Off);\n      } else {\n        monitorStationheadProfile_ = monitorStationheadProfile_ == 6\n            ? 1\n            : std::clamp(monitorStationheadProfile_ + 1, 1u, 5u);\n        ApplyMonitorMode(MonitorMode::ServiceGrid);\n      }\n      break;\n    case MonitorMode::Off:\n      ApplyMonitorMode(MonitorMode::Native);\n      break;\n  }\n}\n'''
          s = s[:start] + cycle + s[end:]
          s = replace_once(
              s,
              '  monitorMode_ = mode;\n  powerSaving_ = nextPowerSaving;',
              '  monitorMode_ = mode;\n  const unsigned selectedMonitorProfile =\n      mode == MonitorMode::ServiceGrid ? monitorStationheadProfile_ : 0;\n  SetStationheadMonitorProfile(selectedMonitorProfile);\n  powerSaving_ = nextPowerSaving;',
              'apply monitor profile')
          s = s.replace(
              '  // Monitor S is a dedicated six-Stationhead surface. Hide the normal dashboard\n  // and YouTube/TVer panel without stopping their playback lifecycle.',
              '  // A named Stationhead monitor is a dedicated single-window surface. Hide the\n  // normal dashboard without stopping any Stationhead playback lifecycle.')
          write(p, s)

          p = 'hp/native/src/power_saving_overlay.inc'
          s = read(p)
          old_monitor = '''  const wchar_t* monitorLabel = L"モニターYT";\n  if (monitorMode_ == MonitorMode::ServiceGrid) {\n    monitorLabel = L"モニターS";\n  } else if (monitorMode_ == MonitorMode::Off) {\n    monitorLabel = L"モニターOFF";\n  }'''
          new_monitor = '''  const wchar_t* monitorLabel = L"モニターYT";\n  if (monitorMode_ == MonitorMode::ServiceGrid) {\n    switch (monitorStationheadProfile_) {\n      case 1: monitorLabel = L"モニターtgut"; break;\n      case 2: monitorLabel = L"モニターyuukiar"; break;\n      case 3: monitorLabel = L"モニターten"; break;\n      case 4: monitorLabel = L"モニターnagi"; break;\n      case 5: monitorLabel = L"モニターhinata"; break;\n      case 6: monitorLabel = L"モニターozeki"; break;\n      default: monitorLabel = L"モニターOFF"; break;\n    }\n  } else if (monitorMode_ == MonitorMode::Off) {\n    monitorLabel = L"モニターOFF";\n  }'''
          s = replace_once(s, old_monitor, new_monitor, 'monitor labels')
          old_audio = '''  const wchar_t* audioModeLabel = L"音声出力YT";\n  if (audioMode_ == AudioMode::Stationhead) {\n    audioModeLabel = L"音声出力ST";\n  } else if (audioMode_ == AudioMode::StationheadPeer1) {\n    audioModeLabel = L"音声出力S1";\n  } else if (audioMode_ == AudioMode::StationheadPeer2) {\n    audioModeLabel = L"音声出力S2";\n  } else if (audioMode_ == AudioMode::StationheadPeer3) {\n    audioModeLabel = L"音声出力S3";\n  } else if (audioMode_ == AudioMode::StationheadPeer4) {\n    audioModeLabel = L"音声出力S4";\n  } else if (audioMode_ == AudioMode::StationheadPeer5) {\n    audioModeLabel = L"音声出力S5";\n  } else if (audioMode_ == AudioMode::Muted) {\n    audioModeLabel = L"音声出力OFF";\n  }'''
          new_audio = '''  const wchar_t* audioModeLabel = L"音声出力YT";\n  if (audioMode_ == AudioMode::Stationhead) {\n    audioModeLabel = L"音声出力ozeki";\n  } else if (audioMode_ == AudioMode::StationheadPeer1) {\n    audioModeLabel = L"音声出力tgut";\n  } else if (audioMode_ == AudioMode::StationheadPeer2) {\n    audioModeLabel = L"音声出力yuukiar";\n  } else if (audioMode_ == AudioMode::StationheadPeer3) {\n    audioModeLabel = L"音声出力ten";\n  } else if (audioMode_ == AudioMode::StationheadPeer4) {\n    audioModeLabel = L"音声出力nagi";\n  } else if (audioMode_ == AudioMode::StationheadPeer5) {\n    audioModeLabel = L"音声出力hinata";\n  } else if (audioMode_ == AudioMode::Muted) {\n    audioModeLabel = L"音声出力OFF";\n  }'''
          s = replace_once(s, old_audio, new_audio, 'audio labels')
          write(p, s)

          p = 'hp/native/src/power_saving_window_routing.inc'
          s = read(p)
          marker = 'size_t StationheadServiceTileIndex(HWND window) noexcept {'
          idx = s.index(marker)
          helper = '''unsigned StationheadProfileNumberFromWindow(HWND window) noexcept {\n  wchar_t title[128]{};\n  if (!window || GetWindowTextW(window, title, _countof(title)) <= 0) return 0;\n  const wchar_t* profile = wcsstr(title, L"spotify-v2-");\n  if (!profile) return 0;\n  profile += wcslen(L"spotify-v2-");\n  wchar_t* end = nullptr;\n  const long number = wcstol(profile, &end, 10);\n  return end != profile && number >= 1 && number <= 6\n      ? static_cast<unsigned>(number)\n      : 0;\n}\n\n'''
          s = s[:idx] + helper + s[idx:]
          start = s.index('void PowerSavingController::ApplyStationheadMonitorPlacement() noexcept {')
          end = s.index('\nvoid PowerSavingController::Detach() noexcept {', start)
          placement = '''void PowerSavingController::ApplyStationheadMonitorPlacement() noexcept {\n  if (!parent_ || !IsWindow(parent_)) return;\n\n  const unsigned selectedProfile =\n      monitorMode_ == MonitorMode::ServiceGrid ? monitorStationheadProfile_ : 0;\n  const bool nativeMediaForeground =\n      monitorMode_ == MonitorMode::Native && !monitorAuthForeground_;\n\n  if (SetStationheadMonitorProfile(selectedProfile)) {\n    PostMessageW(parent_, WM_TIMER, 0, 0);\n  }\n\n  RECT parentClient{0, 0, 1, 1};\n  GetClientRect(parent_, &parentClient);\n\n  struct Context {\n    PowerSavingController* controller;\n    unsigned selectedProfile;\n    bool nativeMediaForeground;\n    RECT parentClient;\n  } context{this, selectedProfile, nativeMediaForeground, parentClient};\n\n  EnumChildWindows(\n      parent_,\n      [](HWND child, LPARAM value) -> BOOL {\n        auto* context = reinterpret_cast<Context*>(value);\n        PowerSavingController* controller = context->controller;\n\n        if (IsMvPanelWindow(child)) {\n          const RECT target = context->nativeMediaForeground\n              ? NativeMvForegroundBounds(child)\n              : RECT{0, 0, 1, 1};\n          if (!ChildBoundsMatch(child, target) || !IsWindowVisible(child)) {\n            SetWindowPos(\n                child, nullptr,\n                target.left, target.top,\n                std::max<LONG>(1, target.right - target.left),\n                std::max<LONG>(1, target.bottom - target.top),\n                SWP_NOACTIVATE | SWP_SHOWWINDOW | SWP_NOSENDCHANGING |\n                    SWP_NOZORDER);\n          }\n          return TRUE;\n        }\n\n        if (!IsStationheadPlaybackHost(child) || context->selectedProfile == 0 ||\n            StationheadProfileNumberFromWindow(child) != context->selectedProfile) {\n          return TRUE;\n        }\n\n        const RECT target = context->parentClient;\n        const HWND insertAfter = controller->overlay_ ? controller->overlay_ : HWND_TOP;\n        const bool zOrderMatches = controller->overlay_\n            ? GetWindow(child, GW_HWNDPREV) == controller->overlay_\n            : GetWindow(child, GW_HWNDPREV) == nullptr;\n        if (!ChildBoundsMatch(child, target) || !IsWindowVisible(child) || !zOrderMatches) {\n          SetWindowPos(\n              child, insertAfter,\n              target.left, target.top,\n              std::max<LONG>(1, target.right - target.left),\n              std::max<LONG>(1, target.bottom - target.top),\n              SWP_NOACTIVATE | SWP_SHOWWINDOW | SWP_NOSENDCHANGING);\n        }\n        return TRUE;\n      },\n      reinterpret_cast<LPARAM>(&context));\n}\n'''
          s = s[:start] + placement + s[end:]
          s = s.replace('  SetStationheadMonitorForeground(false);', '  SetStationheadMonitorProfile(0);')
          write(p, s)

          p = 'hp/native/src/sh_layout.cpp'
          s = read(p)
          s = replace_once(
              s,
              '                                 bool showPlayback,\n                                 bool hidePlayback) {\n  const bool monitorForeground = StationheadMonitorForeground();',
              '                                 bool showPlayback,\n                                 bool hidePlayback,\n                                 bool monitorForeground) {',
              'layout monitor argument')
          s = s.replace(
              '                              false, false, false);',
              '                              false, false, false,\n                              StationheadMonitorForegroundForProfile(profileName_));')
          s = replace_once(
              s,
              '                              showAuth,\n                              showPlayback,\n                              hidePlayback);',
              '                              showAuth,\n                              showPlayback,\n                              hidePlayback,\n                              monitorForeground);',
              'layout selected profile call')
          s = s.replace('StationheadMonitorForeground()', 'StationheadMonitorForegroundForProfile(profileName_)')
          write(p, s)

          # Update static tests that intentionally pinned the old six-tile Monitor S contract.
          p = 'hp/video/test/native-power-saving-button-layout.test.js'
          s = read(p)
          for old, new in [
              ('assert.match(overlay, /L"モニターS"/);', '''for (const name of ['ozeki', 'tgut', 'yuukiar', 'ten', 'nagi', 'hinata']) {\n    assert.match(overlay, new RegExp(`L"モニター${name}"`));\n  }'''),
              ('assert.doesNotMatch(overlay, /L"モニターST"|L"モニターS[1-5]"/);', 'assert.doesNotMatch(overlay, /L"モニターS(?:T|[1-5])"/);'),
              ('assert.match(overlay, /L"音声出力ST"/);\n  assert.match(overlay, /L"音声出力S1"/);\n  assert.match(overlay, /L"音声出力S2"/);\n  assert.match(overlay, /L"音声出力S3"/);\n  assert.match(overlay, /L"音声出力S4"/);\n  assert.match(overlay, /L"音声出力S5"/);', '''for (const name of ['ozeki', 'tgut', 'yuukiar', 'ten', 'nagi', 'hinata']) {\n    assert.match(overlay, new RegExp(`L"音声出力${name}"`));\n  }\n  assert.doesNotMatch(overlay, /L"音声出力S(?:T|[1-5])"/);''')]:
              s = replace_once(s, old, new, f'button labels {old[:20]}')
          write(p, s)

          replace_test(
              p,
              'monitor button cycles YT, six-Stationhead S grid, black OFF, then YT',
              r'''test('monitor button cycles YT, six named Stationhead windows, OFF, then YT', () => {
  assert.match(overlay, /controller->CycleMonitorMode\(\)/);
  assert.match(schedule, /monitorStationheadProfile_ = 6/);
  assert.match(schedule, /monitorStationheadProfile_ == 6[\s\S]*\? 1/);
  assert.match(schedule, /std::clamp\(monitorStationheadProfile_ \+ 1, 1u, 5u\)/);
  assert.match(schedule, /monitorStationheadProfile_ == 5[\s\S]*ApplyMonitorMode\(MonitorMode::Off\)/);
  assert.match(schedule, /case MonitorMode::Off:[\s\S]*ApplyMonitorMode\(MonitorMode::Native\)/);
  assert.match(routing, /StationheadProfileNumberFromWindow\(HWND window\)/);
  assert.match(routing, /StationheadProfileNumberFromWindow\(child\) != context->selectedProfile/);
  assert.match(routing, /const RECT target = context->parentClient/);
  assert.match(routing, /SetStationheadMonitorProfile\(selectedProfile\)/);
  assert.match(schedule, /powerSaving_ = nextPowerSaving/);
  assert.match(schedule, /ApplyStationheadMonitorPlacement\(\)/);
});''')
          s = read(p).replace(
              "test('audio output cycles YT, Stationhead ST/S1/S2/S3/S4/S5, then OFF', () => {",
              "test('audio output cycles YT and six named Stationhead windows, then OFF', () => {")
          write(p, s)

          replace_test(
              'hp/video/test/native-monitor-dom-probe.test.js',
              'monitor S stays foreground while all six Stationhead windows participate in auth polling',
              r'''test('named Stationhead monitor selects one foreground profile while all six windows participate in auth polling', () => {
  assert.match(routing, /monitorMode_ == MonitorMode::ServiceGrid \? monitorStationheadProfile_ : 0/);
  assert.match(routing, /SetStationheadMonitorProfile\(selectedProfile\)/);
  assert.match(routing, /StationheadProfileNumberFromWindow\(child\) != context->selectedProfile/);
  assert.match(routing, /monitorAuthSlots_/);
  assert.match(schedule, /if \(monitorMode_ != MonitorMode::Off\) \{[\s\S]*kMonitorAuthProbeIntervalMs/);
  assert.match(schedule, /if \(monitorMode_ == MonitorMode::Off \|\| powerSaving_\) return/);
});''')

          replace_test(
              'hp/video/test/native-media-panel-layout-shift.test.js',
              'Monitor S parks six Stationhead hosts across the full screen',
              r'''test('named Stationhead monitor promotes only its selected host to the full screen', () => {
  assert.match(stationhead, /gStationheadMonitorProfile\{0\}/);
  assert.match(stationhead, /StationheadMonitorForegroundForProfile/);
  assert.match(routing, /StationheadProfileNumberFromWindow\(HWND window\)/);
  assert.match(routing, /StationheadProfileNumberFromWindow\(child\) != context->selectedProfile/);
  assert.match(routing, /const RECT target = context->parentClient/);
  assert.doesNotMatch(routing, /SetSpotifyMonitorGridVisible|SetSpotifyMonitorForegroundSlot/);
});''')

          p = 'hp/video/test/stationhead-background-resource-mode.test.js'
          s = read(p).replace(
              'assert.match(layout, /StationheadMonitorForeground\\(\\)/);',
              'assert.match(layout, /StationheadMonitorForegroundForProfile\\(profileName_\\)/);')
          write(p, s)
          replace_test(
              p,
              'Monitor S drives the shared playback foreground while auth promotion remains per window',
              r'''test('named Stationhead monitor drives only the selected profile foreground while auth promotion remains per window', () => {
  assert.match(routing, /SetStationheadMonitorProfile\(selectedProfile\)/);
  assert.match(routing, /StationheadProfileNumberFromWindow\(child\) != context->selectedProfile/);
  assert.match(routing, /const bool nativeMediaForeground =\s*monitorMode_ == MonitorMode::Native && !monitorAuthForeground_/);
  assert.match(routing, /monitorAuthSlots_/);
  assert.match(routing, /PostMessageW\(parent_, WM_TIMER, 0, 0\)/);
  assert.match(bridge, /inline std::atomic<unsigned> gStationheadMonitorProfile\{0\}/);
  assert.match(layout, /ApplyHostVisualClip\(hostWindow, playbackForeground\)/);
  assert.match(layout, /authPlacement = showAuth \? HWND_TOP : HWND_BOTTOM/);
});''')

          replace_test(
              'hp/video/test/native-monitor-s-stationhead-auth-isolation.test.js',
              'Monitor S keeps auth probing active across the six Stationhead windows',
              r'''test('named Stationhead monitors keep auth probing active across all six windows', () => {
  assert.match(schedule, /if \(monitorMode_ != MonitorMode::Off\) RequestMonitorAuthProbe\(\)/);
  assert.match(schedule, /if \(monitorMode_ == MonitorMode::Off \|\| powerSaving_\) return/);
  assert.match(schedule, /monitorAuthSlots_ = 0;[\s\S]*monitorAuthForeground_ = false/);
  assert.doesNotMatch(schedule, /SetSpotifyMonitorGridVisible|SetSpotifyMonitorForegroundSlot/);
});''')
          replace_test(
              'hp/video/test/native-monitor-s-stationhead-auth-isolation.test.js',
              'Monitor S keeps all Stationhead playback tiles while auth surface owns its own foreground',
              r'''test('named Stationhead monitor keeps only its selected playback host in monitor foreground', () => {
  assert.match(routing, /SetStationheadMonitorProfile\(selectedProfile\)/);
  assert.match(routing, /StationheadProfileNumberFromWindow\(child\) != context->selectedProfile/);
  assert.match(routing, /const RECT target = context->parentClient/);
  assert.doesNotMatch(routing, /SetSpotifyMonitorGridVisible/);
});''')

          replace_test(
              'hp/video/test/stationhead-background-fullsize-until-playback.test.js',
              'Monitor S maps all six Stationhead playback hosts to fixed service tiles',
              r'''test('named Stationhead monitor promotes only the selected playback host', () => {
  const apply = section(
    layout,
    'void ApplyStationheadChildLayout(',
    '}  // namespace',
  );
  assert.match(apply, /bool monitorForeground/);
  assert.match(
    apply,
    /playbackForeground\s*=\s*[\s\S]*showPlayback \|\| \(!showAuth && !hidePlayback && monitorForeground\)/,
  );
  assert.match(apply, /StationheadPlaybackControllerBounds\(\)/);

  const placement = section(
    routing,
    'void PowerSavingController::ApplyStationheadMonitorPlacement() noexcept',
    'void PowerSavingController::Detach() noexcept',
  );
  assert.match(placement, /monitorMode_ == MonitorMode::ServiceGrid \? monitorStationheadProfile_ : 0/);
  assert.match(placement, /StationheadProfileNumberFromWindow\(child\) != context->selectedProfile/);
  assert.match(placement, /SetStationheadMonitorProfile\(selectedProfile\)/);
  assert.match(placement, /const HWND insertAfter = controller->overlay_/);
  assert.match(placement, /SetWindowPos\([\s\S]*target\.left, target\.top/);
});''')

          overlay = read('hp/native/src/power_saving_overlay.inc')
          for expected in [
              '音声出力ozeki', '音声出力tgut', '音声出力yuukiar', '音声出力ten', '音声出力nagi', '音声出力hinata',
              'モニターozeki', 'モニターtgut', 'モニターyuukiar', 'モニターten', 'モニターnagi', 'モニターhinata']:
              if expected not in overlay:
                  raise SystemExit(f'missing label: {expected}')
          if 'StationheadMonitorForegroundForProfile(profileName_)' not in read('hp/native/src/sh_layout.cpp'):
              raise SystemExit('profile-aware Stationhead monitor routing missing')
      - name: Run video tests
        run: npm test --prefix hp/video
      - name: Commit implementation
        shell: bash
        run: |
          git rm .github/workflows/apply-window-named-modes.yml .github/workflows/apply-window-named-modes-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hp/native/src hp/video/test
          git commit -m "Use window names for Stationhead audio and monitor modes"
          git push origin HEAD:feat/window-named-audio-monitor-modes
