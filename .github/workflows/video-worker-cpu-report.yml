name: Video · Worker CPU report

on:
  workflow_dispatch:
    inputs:
      hours:
        description: Analytics window in hours
        required: false
        default: '6'
      target_ms:
        description: CPU target in milliseconds
        required: false
        default: '10'

permissions:
  contents: read

concurrency:
  group: video-worker-cpu-report
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hp/video
    env:
      CLOUDFLARE_WORKER_NAME: ${{ secrets.HOMEPANEL_CLOUDFLARE_WORKER_NAME || vars.HOMEPANEL_CLOUDFLARE_WORKER_NAME || 'homepanel-cloud' }}
      REPORT_HOURS: ${{ inputs.hours || '6' }}
      CPU_TARGET_MS: ${{ inputs.target_ms || '10' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - name: Query aggregate production Worker CPU
        shell: bash
        run: |
          set -euo pipefail
          node scripts/report-worker-cpu.mjs \
            --hours "$REPORT_HOURS" \
            --target-ms "$CPU_TARGET_MS" \
            --out-json worker-cpu-report.json \
            --out-markdown worker-cpu-report.md
          cat worker-cpu-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Query exact returned invocation CPU
        shell: bash
        run: |
          set -euo pipefail
          node scripts/report-worker-invocations.mjs \
            --hours "$REPORT_HOURS" \
            --target-ms "$CPU_TARGET_MS" \
            --allow-unavailable true \
            --out-json worker-invocations-report.json \
            --out-markdown worker-invocations-report.md
          printf '\n' >> "$GITHUB_STEP_SUMMARY"
          cat worker-invocations-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload CPU reports
        uses: actions/upload-artifact@v4
        with:
          name: video-worker-cpu-report-${{ github.run_id }}
          path: |
            hp/video/worker-cpu-report.json
            hp/video/worker-cpu-report.md
            hp/video/worker-invocations-report.json
            hp/video/worker-invocations-report.md
          if-no-files-found: error
          retention-days: 30
