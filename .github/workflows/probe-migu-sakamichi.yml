name: Probe Migu Sakamichi

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/probe-migu-sakamichi.yml'
      - 'worker/scripts/probe-migu-sakamichi.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-migu-sakamichi.yml'
      - 'worker/scripts/probe-migu-sakamichi.mjs'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe Migu catalog, ranks, and play-count endpoints
        working-directory: worker
        run: node scripts/probe-migu-sakamichi.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migu-sakamichi-evidence
          path: worker/migu-sakamichi-evidence
          retention-days: 7
