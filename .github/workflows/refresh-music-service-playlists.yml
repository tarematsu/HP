name: Refresh Spotify and Apple Music playlists

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC: 17:00 = 02:00 JST, 05:00 = 14:00 JST.
    - cron: '0 5,17 * * *'

permissions:
  contents: read

concurrency:
  group: refresh-music-service-playlists
  cancel-in-progress: false

jobs:
  refresh:
    name: Collect full Spotify and Apple Music playlist sweeps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build remote-binding refresh config
        working-directory: worker
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const source = JSON.parse(readFileSync('wrangler.amazon-music.jsonc', 'utf8'));
          source.name = 'sh-music-service-playlist-refresh';
          source.main = 'scripts/music-service-playlist-refresh-entry.js';
          source.workers_dev = false;
          source.preview_urls = false;
          delete source.triggers;
          delete source.observability;
          source.d1_databases = (source.d1_databases || []).map((binding) => ({ ...binding, remote: true }));
          source.r2_buckets = (source.r2_buckets || []).map((binding) => ({ ...binding, remote: true }));
          writeFileSync('.music-playlist-refresh.wrangler.jsonc', JSON.stringify(source, null, 2));
          NODE
      - name: Collect Spotify and Apple Music playlist sweeps
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          : > music-playlist-refresh.log
          npx wrangler dev --config .music-playlist-refresh.wrangler.jsonc --port 8793 --log-level error > music-playlist-refresh.log 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT

          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error 'http://127.0.0.1:8793/refresh?service=spotify&discover=1' -o music-playlist-refresh-result.json; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat music-playlist-refresh.log
            exit 1
          fi

          run_sweep() {
            service="$1"
            first_result="${2:-false}"
            processed=0
            target=0
            batches=0

            while true; do
              batches=$((batches + 1))
              if [[ "$first_result" == true ]]; then
                first_result=false
              else
                discover=0
                if [[ "$batches" -eq 1 ]]; then discover=1; fi
                curl --fail --silent --show-error \
                  "http://127.0.0.1:8793/refresh?service=${service}&discover=${discover}" \
                  -o music-playlist-refresh-result.json
              fi
              cat music-playlist-refresh-result.json

              read -r ok scanned known < <(
                node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('music-playlist-refresh-result.json', 'utf8'));
          console.log([
            result?.ok === true ? 'true' : 'false',
            Number(result?.scanned_playlists || 0),
            Number(result?.known_playlists || 0),
          ].join(' '));
          NODE
              )

              if [[ "$ok" != true ]] || (( scanned <= 0 )) || (( known <= 0 )); then
                echo "Invalid ${service} playlist refresh result" >&2
                cat music-playlist-refresh.log
                exit 1
              fi
              if (( known > target )); then target=$known; fi
              processed=$((processed + scanned))
              echo "${service} playlist sweep: ${processed}/${target} attempts"

              if (( processed >= target )); then
                break
              fi
              if (( batches >= 100 )); then
                echo "${service} playlist sweep exceeded 100 batches" >&2
                exit 1
              fi
            done
            echo "Completed ${service} playlist sweep: ${processed} attempts across ${batches} batches"
          }

          # The readiness probe already performed Spotify batch 1 with discovery enabled.
          run_sweep spotify true
          run_sweep apple false

          curl --fail --silent --show-error \
            'http://127.0.0.1:8793/finalize?service=apple' \
            -o apple-playlist-finalize-result.json
          cat apple-playlist-finalize-result.json
