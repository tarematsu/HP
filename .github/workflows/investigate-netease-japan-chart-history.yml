name: Investigate NetEase Japan chart history

on:
  pull_request:
    paths:
      - '.github/workflows/investigate-netease-japan-chart-history.yml'
      - 'worker/scripts/investigate-netease-japan-chart-history.mjs'
      - 'worker/scripts/enrich-netease-japan-history-report.mjs'
      - 'worker/tests/netease-japan-chart-history-investigation.test.js'
      - 'worker/tests/netease-japan-chart-history-enrich.test.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netease-japan-chart-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test NetEase history parser
        working-directory: worker
        run: node --test tests/netease-japan-chart-history-investigation.test.js tests/netease-japan-chart-history-enrich.test.js

      - name: Probe current and archived NetEase 日本Oricon榜
        working-directory: worker
        run: |
          mkdir -p ../netease-japan-history
          node scripts/investigate-netease-japan-chart-history.mjs \
            --from 2015-01-01 \
            --output-json ../netease-japan-history/result.json \
            --output-markdown ../netease-japan-history/result.md
          node scripts/enrich-netease-japan-history-report.mjs \
            ../netease-japan-history/result.json \
            ../netease-japan-history/result.md

      - name: Publish investigation summary
        if: always()
        run: |
          if [ -f netease-japan-history/result.md ]; then
            cat netease-japan-history/result.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload investigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netease-japan-chart-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: netease-japan-history/
          if-no-files-found: warn
          retention-days: 30
