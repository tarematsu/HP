name: Read-only collection diagnostic validation
on:
  push:
    branches: [feat/collection-diagnostics]
    paths: ['.github/workflows/collection-diagnostic-probe.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ env.CLOUDFLARE_API_TOKEN }}
      - run: npm --prefix worker ci --ignore-scripts --no-audit --no-fund
      - name: Read persisted collection evidence
        run: node .github/scripts/audit-r2-collection-freshness.mjs
      - if: always()
        run: cat r2-collection-summary.md
