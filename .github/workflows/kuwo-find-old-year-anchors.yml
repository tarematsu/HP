name: Find old Kuwo Japanese chart year anchors
on:
  push:
    branches: [research/kuwo-jp-chart-probe]
    paths: [.github/workflows/kuwo-find-old-year-anchors.yml]
permissions:
  contents: read
jobs:
  find:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: '2024|228'
            lo: 216000
            hi: 220500
            label: '2024-08-15'
          - target: '2025|23'
            lo: 228000
            hi: 232000
            label: '2025-01-23'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan corrected global-id band
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LO: ${{ matrix.lo }}
          HI: ${{ matrix.hi }}
          LABEL: ${{ matrix.label }}
        run: |
          python3 <<'PY'
          import concurrent.futures,json,os,urllib.parse,urllib.request
          B='https://kbangserver.kuwo.cn/ksong.s'; H={'User-Agent':'Mozilla/5.0','Referer':'https://m.kuwo.cn/'}
          common={'from':'pc','fmt':'json','pn':'0','rn':'1','type':'bang','data':'content','id':'183','show_copyright_off':'0','pcmp4':'1','isbang':'1','userid':'0'}
          target=os.environ['TARGET']; lo=int(os.environ['LO']); hi=int(os.environ['HI']); label=os.environ['LABEL']
          def probe(bid):
            u=B+'?'+urllib.parse.urlencode({**common,'bangid':str(bid)})
            try:
              q=urllib.request.Request(u,headers=H)
              with urllib.request.urlopen(q,timeout=4) as r:j=json.loads(r.read().decode('utf-8','replace'))
              return bid,j.get('currentVolume')
            except:return bid,None
          found=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=30) as ex:
            for bid,cv in ex.map(probe,range(lo,hi),chunksize=1):
              if cv==target:
                found.append(bid);print('FOUND',label,target,bid);break
          print('RESULT',label,target,json.dumps(found))
          if found:
            bid=found[0]; u=B+'?'+urllib.parse.urlencode({**common,'rn':'100','bangid':str(bid)})
            q=urllib.request.Request(u,headers=H)
            with urllib.request.urlopen(q,timeout=15) as r:j=json.loads(r.read().decode('utf-8','replace'))
            rows=j.get('musiclist') or j.get('musicList') or []
            print('ROWS',len(rows),'TOP10',json.dumps([{'rank':i+1,'name':x.get('name'),'artist':x.get('artist'),'rid':x.get('rid') or x.get('id')} for i,x in enumerate(rows[:10])],ensure_ascii=False))
            aliases=['櫻坂46','樱坂46','Sakurazaka46','乃木坂46','Nogizaka46','日向坂46','Hinatazaka46','欅坂46','Keyakizaka46']
            for i,x in enumerate(rows,1):
              hay=(str(x.get('artist',''))+' '+str(x.get('name',''))).lower().replace(' ','')
              if any(a.lower().replace(' ','') in hay for a in aliases):print('SAKAMICHI',i,json.dumps(x,ensure_ascii=False))
          PY
