name: Temporary test Amazon overall rank

on:
  push:
    branches:
      - tmp/verify-amazon-readmodel

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/amazon-overall-rank
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker Amazon tests
        working-directory: worker
        run: node --test tests/amazon-music-collector.test.js
      - name: Pages Amazon tests
        run: node --test site/tests/amazon-music-tab.test.js
      - name: Syntax checks
        run: |
          node --check worker/src/amazon-music-web-client.js
          node --check worker/src/amazon-music-collector.js
          node --check site/public/amazon-music.js
          node --check site/public/amazon-music-shell.js
