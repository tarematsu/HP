name: Temporary sync Amazon overall branch

on:
  push:
    branches:
      - tmp/verify-amazon-readmodel

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/amazon-overall-rank
          fetch-depth: 0
      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name 'tarematsu'
          git config user.email 'yuukiar0202@gmail.com'
          git merge --no-edit origin/main
          git push origin HEAD:fix/amazon-overall-rank
