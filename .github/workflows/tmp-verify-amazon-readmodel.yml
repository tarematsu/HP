name: Temporary Amazon read model verification

on:
  push:
    branches:
      - tmp/verify-amazon-readmodel

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run initial Amazon Music collection
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --config wrangler.amazon-music.jsonc --remote --test-scheduled --port 8787 > ../amazon-initial.log 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          sleep 7
          curl --fail --silent --show-error 'http://127.0.0.1:8787/__scheduled?cron=30+1+*+*+*' | cat
          ok=0
          for i in $(seq 1 72); do
            code="$(curl --silent --show-error --output ../amazon-response.json --write-out '%{http_code}' https://skrzk.pages.dev/api/amazon-music || true)"
            if [ "$code" = "200" ] && jq -e '.ok == true and (.track_count // 0) > 0 and (.tracks | length) > 0' ../amazon-response.json >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 5
          done
          echo "API_HTTP=$(curl --silent --show-error --output ../amazon-response-final.json --write-out '%{http_code}' https://skrzk.pages.dev/api/amazon-music || true)"
          jq '{ok,generated_at,jst_date,follower,track_count,popular_count,japan_top50_hits,tracks_sample:(.tracks[0:8] // [])}' ../amazon-response-final.json 2>/dev/null || cat ../amazon-response-final.json
          echo '--- collector log tail ---'
          tail -n 160 ../amazon-initial.log || true
          test "$ok" = "1"
