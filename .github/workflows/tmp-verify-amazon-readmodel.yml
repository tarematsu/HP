name: Temporary Amazon read model verification

on:
  push:
    branches:
      - tmp/verify-amazon-readmodel

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe current Amazon Music client
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            createAmazonMusicWebClient,
            extractAmazonMusicTracks,
            extractFollowerCount,
          } from './worker/src/amazon-music-web-client.js';

          const client = createAmazonMusicWebClient();
          const artist = await client.fetchArtist('B08P3RHP1P');
          const popular = extractAmazonMusicTracks(artist);
          console.log('artistPopularCount', popular.length);
          console.log('artistPopularFirst', JSON.stringify(popular.slice(0, 5)));
          console.log('follower', JSON.stringify(extractFollowerCount(artist)));

          const tracks = await client.fetchArtistTracks('B08P3RHP1P');
          console.log('artistTracksCount', tracks.length);
          console.log('artistTracksFirst', JSON.stringify(tracks.slice(0, 5)));

          const top50 = await client.fetchPlaylist('B088FYHTR4');
          const top50Tracks = extractAmazonMusicTracks(top50);
          console.log('top50Count', top50Tracks.length);
          console.log('top50First', JSON.stringify(top50Tracks.slice(0, 5)));

          if (popular.length === 0 || tracks.length === 0) {
            throw new Error(`Amazon Music client returned empty data: popular=${popular.length}, tracks=${tracks.length}`);
          }
          NODE
