name: Temporary apply Amazon overall ranking

on:
  push:
    branches:
      - tmp/verify-amazon-readmodel

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/amazon-overall-rank
          fetch-depth: 0
      - name: Patch Amazon overall ranking
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing target in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          def sub_once(path, pattern, repl, flags=0):
              p = Path(path)
              s = p.read_text()
              out, n = re.subn(pattern, repl, s, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'regex target count={n} in {path}: {pattern[:100]!r}')
              p.write_text(out)

          client = 'worker/src/amazon-music-web-client.js'
          replace_once(client,
              "const MAX_TRACKS = 500;\nconst USER_HASH = JSON.stringify({ level: 'LIBRARY_MEMBER' });",
              "const MAX_TRACKS = 500;\nconst MAX_OVERALL_CHART_PAGES = 550;\nconst OVERALL_CHART_PAGE_URL = `${AMAZON_ORIGIN}/popular/songs/browsePanel/popularTracks`;\nconst OVERALL_CHART_INITIAL_URL = `${CATALOG_SKILL_BASE}/showChartsWidget?genreTitle=browsePanel&genreId=popularTracks&widgetId=top-songs&userHash=%7B%22level%22%3A%22LIBRARY_MEMBER%22%7D`;\nconst OVERALL_CHART_RETRY_ATTEMPTS = 6;\nconst USER_HASH = JSON.stringify({ level: 'LIBRARY_MEMBER' });")

          replace_once(client,
              "function isErrorOnlyPayload(document) {",
              """function nextChartsWidgetUrl(document) {
            let found = null;
            deepValues(document, (node) => {
              if (found) return;
              for (const value of Object.values(node)) {
                if (typeof value !== 'string'
                  || !value.includes('/api/showChartsWidget?')
                  || !value.includes('widgetId=top-songs')
                  || !value.includes('next=')) continue;
                try {
                  found = new URL(value, CATALOG_SKILL_BASE).toString();
                  return;
                } catch {
                  // Ignore malformed action URLs.
                }
              }
            });
            return found;
          }

          function sleep(milliseconds) {
            return new Promise((resolve) => setTimeout(resolve, milliseconds));
          }

          function isErrorOnlyPayload(document) {""")

          replace_once(client,
              "    async fetchPlaylist(playlistId) {",
              """    async fetchOverallTrackRanks(targetIds = null) {
              await primeWebPlayer(fetchImpl, 'B08P3RHP1P');
              const targets = targetIds == null
                ? null
                : new Set([...targetIds].map((value) => text(value)).filter(Boolean));
              const hits = [];
              const seenUrls = new Set();
              const seenTrackIds = new Set();
              let url = OVERALL_CHART_INITIAL_URL;
              let scannedTracks = 0;
              let exhausted = false;

              for (let page = 0; page < MAX_OVERALL_CHART_PAGES; page += 1) {
                if (!url || seenUrls.has(url)) {
                  exhausted = true;
                  break;
                }
                seenUrls.add(url);

                let document = null;
                for (let attempt = 0; attempt < OVERALL_CHART_RETRY_ATTEMPTS; attempt += 1) {
                  const configuration = await config(fetchImpl);
                  const response = await fetchImpl(url, {
                    method: 'POST',
                    headers: outerHeaders(),
                    body: JSON.stringify({
                      headers: JSON.stringify(amazonHeaders(configuration, OVERALL_CHART_PAGE_URL)),
                    }),
                  });
                  if (response.status === 429) {
                    await sleep(Math.min(15_000, 1_000 * (2 ** attempt)));
                    continue;
                  }
                  document = await responseJson(response, 'Amazon Music overall chart');
                  if (isErrorOnlyPayload(document)) {
                    throw new Error('Amazon Music overall chart returned an error template');
                  }
                  break;
                }
                if (!document) throw new Error('Amazon Music overall chart rate-limit retries exhausted');

                const pageTracks = extractAmazonMusicTracks(document);
                const fresh = pageTracks.filter((track) => {
                  const id = text(track?.amazon_music_id);
                  return id && !seenTrackIds.has(id);
                });
                if (!fresh.length) {
                  exhausted = true;
                  break;
                }

                for (const track of fresh) {
                  seenTrackIds.add(track.amazon_music_id);
                  scannedTracks += 1;
                  if (!targets || targets.has(track.amazon_music_id)) {
                    hits.push({ ...track, rank: scannedTracks });
                  }
                }
                if (targets && hits.length >= targets.size) {
                  exhausted = true;
                  break;
                }

                const next = nextChartsWidgetUrl(document);
                if (!next || seenUrls.has(next)) {
                  exhausted = true;
                  break;
                }
                url = next;
              }

              return { hits, scanned_tracks: scannedTracks, exhausted };
            },

            async fetchPlaylist(playlistId) {""")

          collector = 'worker/src/amazon-music-collector.js'
          p = Path(collector)
          s = p.read_text()

          # Both historical point and latest-track model should use the true overall chart.
          old_map = "const popularRank = new Map((snapshot.popular_tracks || [])\n    .map((track) => [track.amazon_music_id, Number(track.rank) || null]));"
          if s.count(old_map) != 2:
              raise SystemExit(f'expected 2 popular rank maps, got {s.count(old_map)}')
          s = s.replace(old_map,
              "const overallRank = new Map((snapshot.catalog_popular_hits || [])\n    .map((track) => [track.amazon_music_id, Number(track.rank) || null]));")
          old_pair = "amazon_rank: Number(track.rank) || null,\n      popular_rank: popularRank.get(track.amazon_music_id) ?? null,"
          if s.count(old_pair) != 2:
              raise SystemExit(f'expected 2 rank pairs, got {s.count(old_pair)}')
          s = s.replace(old_pair,
              "amazon_rank: overallRank.get(track.amazon_music_id) ?? null,\n      popular_rank: Number(track.rank) || null,")
          p.write_text(s)

          sub_once(collector,
              r"  const \[artistDocument, rawArtistTracks, top50Document, popularHtml\] = await Promise\.all\(\[\n\s*client\.fetchArtist\(AMAZON_MUSIC_ARTIST_ID\),\n\s*client\.fetchArtistTracks\(AMAZON_MUSIC_ARTIST_ID\),\n\s*client\.fetchPlaylist\(AMAZON_MUSIC_JAPAN_TOP50_ID\),\n\s*client\.fetchPopularPageHtml\(\)\.catch\(\(\) => ''\),\n\s*\]\);",
              """  const [artistDocument, rawArtistTracks, top50Document] = await Promise.all([
            client.fetchArtist(AMAZON_MUSIC_ARTIST_ID),
            client.fetchArtistTracks(AMAZON_MUSIC_ARTIST_ID),
            client.fetchPlaylist(AMAZON_MUSIC_JAPAN_TOP50_ID),
          ]);""")

          sub_once(collector,
              r"  const top50Ranking = rankTracks\(extractAmazonMusicTracks\(top50Document\)\);\n  const top50Hits = hitsFromRanking\(top50Ranking, artistIds\)\.map\(\(track\) => publicTrack\(track, trackIdByAmazonId\)\);\n  const catalogRanking = rankTracks\(extractAmazonMusicTracks\(popularHtml\)\);\n  const catalogHits = hitsFromRanking\(catalogRanking, artistIds\)\.map\(\(track\) => publicTrack\(track, trackIdByAmazonId\)\);\n  const follower = await followerInfo\(client, artistDocument\);",
              """  const top50Ranking = rankTracks(extractAmazonMusicTracks(top50Document));
          const top50Hits = hitsFromRanking(top50Ranking, artistIds).map((track) => publicTrack(track, trackIdByAmazonId));
          const overallRanking = typeof client.fetchOverallTrackRanks === 'function'
            ? await client.fetchOverallTrackRanks(artistIds)
            : { hits: [], scanned_tracks: 0, exhausted: false };
          const catalogHits = hitsFromRanking(
            Array.isArray(overallRanking?.hits) ? overallRanking.hits : [],
            artistIds,
          ).map((track) => publicTrack(track, trackIdByAmazonId));
          const follower = await followerInfo(client, artistDocument);""")

          replace_once(collector,
              "    catalog_popular_hits: catalogHits,\n    japan_top_50: top50Hits.length ? { week_key: weekKey, hits: top50Hits } : null,",
              "    catalog_popular_hits: catalogHits,\n    catalog_popular_scanned: Number(overallRanking?.scanned_tracks) || 0,\n    catalog_popular_exhausted: Boolean(overallRanking?.exhausted),\n    japan_top_50: top50Hits.length ? { week_key: weekKey, hits: top50Hits } : null,")
          replace_once(collector,
              "        observed_at: observedAt,\n        hits: catalogHits,",
              "        observed_at: observedAt,\n        scanned_tracks: Number(overallRanking?.scanned_tracks) || 0,\n        exhausted: Boolean(overallRanking?.exhausted),\n        hits: catalogHits,")
          replace_once(collector,
              "    catalog_popular_hits: catalogHits.length,\n    catalog_popular_stored: catalogStored,",
              "    catalog_popular_hits: catalogHits.length,\n    catalog_popular_scanned: Number(overallRanking?.scanned_tracks) || 0,\n    catalog_popular_exhausted: Boolean(overallRanking?.exhausted),\n    catalog_popular_stored: catalogStored,")

          tests = 'worker/tests/amazon-music-collector.test.js'
          sub_once(tests,
              r"    async fetchPopularPageHtml\(\) \{.*?\n    \},",
              """    async fetchOverallTrackRanks() {
              return {
                scanned_tracks: 10020,
                exhausted: true,
                hits: [{ amazon_music_id: 'A1', title: 'Song A', artist: '櫻坂46', rank: 42 }],
              };
            },""", flags=re.S)
          replace_once(tests,
              "  assert.equal(result.catalog_popular_hits, 1);\n  assert.equal(result.read_model_published, true);",
              "  assert.equal(result.catalog_popular_hits, 1);\n  assert.equal(result.catalog_popular_scanned, 10020);\n  assert.equal(result.catalog_popular_exhausted, true);\n  assert.equal(result.read_model_published, true);")
          replace_once(tests,
              "  assert.deepEqual(readModel.tracks.map((track) => track.amazon_rank), [1, 2, 3]);\n  assert.equal(readModel.tracks[0].popular_rank, null);\n  assert.equal(readModel.tracks[1].popular_rank, 1);\n  assert.equal(readModel.tracks[2].popular_rank, 2);",
              "  assert.deepEqual(readModel.tracks.map((track) => track.amazon_rank), [null, 42, null]);\n  assert.deepEqual(readModel.tracks.map((track) => track.popular_rank), [1, 2, 3]);")

          shell = Path('site/public/amazon-music-shell.js')
          s = shell.read_text().replace('全楽曲 Amazon内順位推移', '全楽曲 Amazon総合順位推移').replace('Amazon内順位</th>', 'Amazon総合順位</th>').replace('櫻坂46全楽曲のAmazon Music内順位推移', '櫻坂46全楽曲のAmazon Music総合順位推移')
          shell.write_text(s)
          runtime = Path('site/public/amazon-music.js')
          s = runtime.read_text().replace('Amazon Music順位の履歴はまだありません。', 'Amazon Music総合順位の履歴はまだありません。').replace('櫻坂46全楽曲のAmazon Music内順位推移。1位が上。', '櫻坂46全楽曲のAmazon Music総合順位推移。1位が上。')
          runtime.write_text(s)
          site_test = Path('site/tests/amazon-music-tab.test.js')
          s = site_test.read_text().replace('櫻坂46全楽曲のAmazon Music内順位推移。1位が上。', '櫻坂46全楽曲のAmazon Music総合順位推移。1位が上。')
          site_test.write_text(s)
          PY
          git diff --check
          git status --short
          git config user.name 'tarematsu'
          git config user.email 'yuukiar0202@gmail.com'
          git add worker/src/amazon-music-web-client.js worker/src/amazon-music-collector.js worker/tests/amazon-music-collector.test.js site/public/amazon-music.js site/public/amazon-music-shell.js site/tests/amazon-music-tab.test.js
          git commit -m 'Use true Amazon overall music ranks'
          git push origin HEAD:fix/amazon-overall-rank
