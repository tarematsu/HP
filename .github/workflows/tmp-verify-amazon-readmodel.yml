name: Temporary Amazon read model verification

on:
  push:
    branches:
      - tmp/verify-amazon-readmodel

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify normal and cache-busted Amazon read model
        shell: bash
        run: |
          set -euo pipefail
          echo '--- normal ---'
          curl --silent --show-error -D normal-headers.txt -o normal.json 'https://skrzk.pages.dev/api/amazon-music'
          cat normal-headers.txt
          jq '{ok,source,snapshot_date,follower,track_count,tracks_length:(.tracks|length)}' normal.json
          echo '--- cache-busted ---'
          ts="$(date +%s)"
          curl --silent --show-error -D bust-headers.txt -o bust.json -H 'Cache-Control: no-cache' "https://skrzk.pages.dev/api/amazon-music?ts=$ts"
          cat bust-headers.txt
          jq '{ok,source,snapshot_date,follower,track_count,tracks_length:(.tracks|length)}' bust.json
          jq -e '.ok == true and .snapshot_date == "2026-09-30" and .follower.count == 53000 and .track_count == 174 and (.tracks|length) == 174' bust.json >/dev/null
