name: Temporary locate Sakurazaka overall ranks

on:
  push:
    branches:
      - tmp/verify-amazon-readmodel

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan top 5000 sequentially
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createAmazonMusicWebClient, extractAmazonMusicTracks } from './src/amazon-music-web-client.js';
          const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          const artistId='B08P3RHP1P';
          const artistTracks=await createAmazonMusicWebClient().fetchArtistTracks(artistId);
          const target=new Map(artistTracks.map(t=>[t.amazon_music_id,t]).filter(([id])=>id));
          console.log('TARGETS',target.size);

          const origin='https://music.amazon.co.jp';
          const ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36';
          const cfg=await (await fetch(`${origin}/config.json?skipToken=false&clientApplication=skyfire`,{method:'POST',headers:{accept:'*/*','accept-language':'ja-JP,ja;q=0.9,en;q=0.5','user-agent':ua,referer:`${origin}/`}})).json();
          const csrf=cfg.csrf||{};
          const pageUrl=`${origin}/popular/songs/browsePanel/popularTracks`;
          function inner(){return {
            'x-amzn-authentication':JSON.stringify({interface:'ClientAuthenticationInterface.v1_0.ClientTokenElement',accessToken:cfg.accessToken||''}),
            'x-amzn-device-model':'WEBPLAYER','x-amzn-device-width':'1920','x-amzn-device-family':'WebPlayer','x-amzn-device-id':cfg.deviceId||'',
            'x-amzn-user-agent':ua,'x-amzn-session-id':cfg.sessionId||'','x-amzn-device-height':'1080','x-amzn-request-id':crypto.randomUUID(),
            'x-amzn-device-language':'ja_JP','x-amzn-currency-of-preference':'JPY','x-amzn-os-version':'1.0','x-amzn-application-version':cfg.version||'',
            'x-amzn-device-time-zone':'UTC','x-amzn-timestamp':String(Date.now()),'x-amzn-csrf':JSON.stringify({interface:'CSRFInterface.v1_0.CSRFHeaderElement',token:csrf.token||'',timestamp:csrf.ts==null?'':String(csrf.ts),rndNonce:csrf.rnd==null?'':String(csrf.rnd)}),
            'x-amzn-music-domain':'music.amazon.co.jp','x-amzn-referer':'','x-amzn-affiliate-tags':'','x-amzn-ref-marker':'','x-amzn-page-url':pageUrl,
            'x-amzn-weblab-id-overrides':'','x-amzn-video-player-token':'','x-amzn-feature-flags':'hd-supported,uhd-supported','x-amzn-has-profile-id':'','x-amzn-age-band':''};}
          async function call(url){
            for(let attempt=0;attempt<6;attempt++){
              const res=await fetch(url,{method:'POST',headers:{accept:'*/*','accept-language':'ja-JP,ja;q=0.9,en;q=0.5','content-type':'text/plain;charset=UTF-8',origin,referer:`${origin}/`,'user-agent':ua},body:JSON.stringify({headers:JSON.stringify(inner())})});
              if(res.status===429){const delay=Math.min(15000,1000*(2**attempt)); console.log('RATE_LIMIT',attempt+1,delay); await sleep(delay); continue;}
              if(!res.ok) throw new Error(`HTTP ${res.status}`);
              return res.json();
            }
            throw new Error('rate limit retries exhausted');
          }
          function findNext(v){
            let found=null;
            function walk(x){
              if(found||x==null)return;
              if(Array.isArray(x)){for(const y of x)walk(y);return;}
              if(typeof x!=='object')return;
              for(const y of Object.values(x)){
                if(typeof y==='string' && y.includes('/api/showChartsWidget?') && y.includes('widgetId=top-songs') && y.includes('next=')){found=y;return;}
                walk(y);
              }
            }
            walk(v); return found;
          }
          let url='https://fe.mesk.skill.music.a2z.com/api/showChartsWidget?genreTitle=browsePanel&genreId=popularTracks&widgetId=top-songs&userHash=%7B%22level%22%3A%22LIBRARY_MEMBER%22%7D';
          const hits=[]; const seenUrls=new Set(); let scanned=0;
          for(let page=1;page<=250;page++){
            if(seenUrls.has(url)) throw new Error('pagination loop');
            seenUrls.add(url);
            const doc=await call(url);
            const tracks=extractAmazonMusicTracks(doc);
            tracks.forEach((track,i)=>{
              const rank=scanned+i+1;
              if(target.has(track.amazon_music_id)){
                hits.push({rank,amazon_music_id:track.amazon_music_id,title:track.title,artist:track.artist});
                console.log('HIT',JSON.stringify(hits.at(-1)));
              }
            });
            scanned+=tracks.length;
            if(page%10===0) console.log('PROGRESS',JSON.stringify({page,scanned,hits:hits.length}));
            const next=findNext(doc);
            if(!next||tracks.length===0) break;
            url=next;
            await sleep(150);
          }
          hits.sort((a,b)=>a.rank-b.rank);
          console.log('SUMMARY',JSON.stringify({scanned,hits:hits.length,unfound:target.size-hits.length}));
          console.log('HITS_JSON',JSON.stringify(hits));
          NODE
