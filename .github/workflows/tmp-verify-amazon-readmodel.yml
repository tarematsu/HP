name: Temporary Amazon read model verification

on:
  push:
    branches:
      - tmp/verify-amazon-readmodel

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/amazon-music-web-player-flow
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exercise fixed Amazon Music client
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {
            createAmazonMusicWebClient,
            extractAmazonMusicTracks,
            extractFollowerCount,
            extractIsrc,
          } from './worker/src/amazon-music-web-client.js';
          const client = createAmazonMusicWebClient();
          const artist = await client.fetchArtist('B08P3RHP1P');
          const tracks = await client.fetchArtistTracks('B08P3RHP1P');
          const playlist = await client.fetchPlaylist('B088FYHTR4');
          const popular = extractAmazonMusicTracks(artist);
          const top50 = extractAmazonMusicTracks(playlist);
          const follower = extractFollowerCount(artist);
          const first = tracks[0];
          let sampleIsrc = null;
          if (first?.amazon_music_id) {
            try { sampleIsrc = extractIsrc(await client.fetchTrack(first.amazon_music_id)); } catch (error) { console.log('track-detail-error', String(error)); }
          }
          console.log(JSON.stringify({
            follower,
            artistPopularCount: popular.length,
            allTracksCount: tracks.length,
            firstTracks: tracks.slice(0, 8).map(({amazon_music_id,title,artist})=>({amazon_music_id,title,artist})),
            top50Count: top50.length,
            sakurazakaTop50: top50.filter((x)=>/櫻坂46|sakurazaka/i.test(String(x.artist||''))).map((x,i)=>({rank:i+1,title:x.title,artist:x.artist})),
            sampleIsrc,
          }, null, 2));
          if (!tracks.length) throw new Error('No Amazon Music artist tracks returned');
          if (!follower?.count) throw new Error('No Amazon Music follower count returned');
          NODE
