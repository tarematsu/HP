name: Temporary Amazon read model verification

on:
  push:
    branches:
      - tmp/verify-amazon-readmodel

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check Amazon Music read model status
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --output amazon-response.json --write-out '%{http_code}' https://skrzk.pages.dev/api/amazon-music || true)"
          echo "HTTP=$code"
          cat amazon-response.json
          test "$code" = "200"
          jq -e '.ok == true and (.track_count // 0) > 0' amazon-response.json >/dev/null
