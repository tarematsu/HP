name: Temporary Amazon web player bundle chart probe

on:
  push:
    branches:
      - tmp/verify-amazon-readmodel

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install puppeteer core
        run: npm install --no-save puppeteer-core@24.19.0
      - name: Inspect loaded web player bundles
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'].find(fs.existsSync);
          if (!executablePath) throw new Error('Chrome executable not found');
          const browser = await puppeteer.launch({ executablePath, headless:true, args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage'] });
          const page = await browser.newPage();
          await page.setExtraHTTPHeaders({'Accept-Language':'ja-JP,ja;q=0.9,en;q=0.5'});
          await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36');
          await page.goto('https://music.amazon.co.jp/popular/songs',{waitUntil:'networkidle2',timeout:60000});
          await new Promise(r=>setTimeout(r,2500));
          const scripts = await page.evaluate(() => [...document.scripts].map(s=>s.src).filter(Boolean));
          console.log('SCRIPT_COUNT', scripts.length);
          const needles = [
            '/v2/tracks/top','tracks/top','POPULAR_TRACKS','popularTracks','browsePanel/popularTracks',
            '/popular/songs','showCatalogTracks','showHome','nextPageToken','pagination','popularityRank',
            'chartRank','overallRank','ranking'
          ];
          for (const url of scripts) {
            try {
              const res = await fetch(url);
              const text = await res.text();
              const lower = text.toLowerCase();
              const matched = needles.filter(n=>lower.includes(n.toLowerCase()));
              if (!matched.length) continue;
              console.log('BUNDLE', url, 'BYTES', text.length, 'MATCH', matched.join(','));
              for (const needle of matched) {
                const target = needle.toLowerCase();
                let start = 0;
                let emitted = 0;
                while (emitted < 8) {
                  const idx = lower.indexOf(target,start);
                  if (idx < 0) break;
                  console.log('CTX', needle, text.slice(Math.max(0,idx-500),Math.min(text.length,idx+900)).replace(/\s+/g,' ').slice(0,1500));
                  start = idx + target.length;
                  emitted++;
                }
              }
            } catch (e) { console.log('FETCH_ERR', url, String(e)); }
          }
          await browser.close();
          NODE
