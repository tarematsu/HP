name: Temporary Amazon chart metadata probe

on:
  push:
    branches:
      - tmp/verify-amazon-readmodel

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe known charting track metadata
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createAmazonMusicWebClient } from './src/amazon-music-web-client.js';

          const client = createAmazonMusicWebClient();
          const doc = await client.fetchTrack('B0H5BRNDF5'); // Number_i - 3XL
          const hits = [];
          const seen = new Set();
          const interesting = /chart|rank|trend|popular|category|genre|総合|人気|急上昇|ポップ|ランキング|位/i;
          function walk(value, path = '$', depth = 0) {
            if (depth > 24 || value == null) return;
            if (typeof value === 'string' || typeof value === 'number' || typeof value === 'boolean') {
              const text = String(value);
              if (interesting.test(path) || interesting.test(text)) {
                const line = `${path} = ${text.slice(0, 500)}`;
                if (!seen.has(line)) { seen.add(line); hits.push(line); }
              }
              return;
            }
            if (Array.isArray(value)) {
              value.forEach((v, i) => walk(v, `${path}[${i}]`, depth + 1));
              return;
            }
            if (typeof value === 'object') {
              for (const [k, v] of Object.entries(value)) walk(v, `${path}.${k}`, depth + 1);
            }
          }
          walk(doc);
          console.log(`MATCHES=${hits.length}`);
          for (const line of hits.slice(0, 400)) console.log(line);
          NODE
