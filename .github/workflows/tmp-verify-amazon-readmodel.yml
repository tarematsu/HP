name: Temporary Amazon read model verification

on:
  push:
    branches:
      - tmp/verify-amazon-readmodel

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Amazon Music public and regional data paths
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const artistId='B08P3RHP1P';
          const ua='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Mobile Safari/537.36';
          const cases=[
            {domain:'music.amazon.co.jp',host:'fe.mesk.skill.music.a2z.com',lang:'ja_JP',currency:'JPY'},
            {domain:'music.amazon.com',host:'na.mesk.skill.music.a2z.com',lang:'en_US',currency:'USD'},
            {domain:'music.amazon.com',host:'eu.mesk.skill.music.a2z.com',lang:'en_US',currency:'USD'},
          ];
          async function runCase(c){
            const origin=`https://${c.domain}`;
            const cfgRes=await fetch(`${origin}/config.json`,{headers:{accept:'*/*','accept-language':c.lang.replace('_','-'),'user-agent':ua,referer:`${origin}/`}});
            const cfg=await cfgRes.json(); const csrf=cfg.csrf||{};
            const pageUrl=`${origin}/artists/${artistId}`;
            const inner={
              'x-amzn-authentication':JSON.stringify({interface:'ClientAuthenticationInterface.v1_0.ClientTokenElement',accessToken:cfg.accessToken||''}),
              'x-amzn-device-model':'WEBPLAYER','x-amzn-device-width':'1920','x-amzn-device-family':'WebPlayer','x-amzn-device-id':cfg.deviceId||'',
              'x-amzn-user-agent':ua,'x-amzn-session-id':cfg.sessionId||'','x-amzn-device-height':'1080','x-amzn-request-id':Math.random().toString(36).slice(2),
              'x-amzn-device-language':c.lang,'x-amzn-currency-of-preference':c.currency,'x-amzn-os-version':'1.0','x-amzn-application-version':cfg.version||'',
              'x-amzn-device-time-zone':'Asia/Tokyo','x-amzn-timestamp':String(Date.now()),
              'x-amzn-csrf':JSON.stringify({interface:'CSRFInterface.v1_0.CSRFHeaderElement',token:csrf.token||'',timestamp:csrf.ts==null?'':String(csrf.ts),rndNonce:csrf.rnd==null?'':String(csrf.rnd)}),
              'x-amzn-music-domain':c.domain,'x-amzn-referer':c.domain,'x-amzn-affiliate-tags':'','x-amzn-ref-marker':'','x-amzn-page-url':pageUrl,
              'x-amzn-weblab-id-overrides':'','x-amzn-video-player-token':'','x-amzn-feature-flags':'hd-supported,uhd-supported','x-amzn-has-profile-id':'','x-amzn-age-band':''
            };
            const outer={accept:'*/*','accept-language':c.lang.replace('_','-'),'content-type':'text/plain;charset=UTF-8',origin,referer:`${origin}/`,'user-agent':ua,'sec-ch-ua':'"Chromium";v="125", "Not.A/Brand";v="24"','sec-ch-ua-mobile':'?1','sec-ch-ua-platform':'"Android"','sec-fetch-dest':'empty','sec-fetch-mode':'cors','sec-fetch-site':'cross-site'};
            for(const path of ['/api/explore/v1/showCatalogArtist','/api/showCatalogTracks']){
              const res=await fetch(`https://${c.host}${path}`,{method:'POST',headers:outer,body:JSON.stringify({id:artistId,userHash:JSON.stringify({level:'LIBRARY_MEMBER'}),headers:JSON.stringify(inner)})});
              const text=await res.text();
              console.log(JSON.stringify({domain:c.domain,host:c.host,path,status:res.status,bytes:text.length,error:/アクションを完了|unable to complete/i.test(text),hasArtist:/櫻坂46|Sakurazaka/i.test(text),prefix:text.slice(0,160)}));
            }
            const page=await fetch(pageUrl,{headers:{'user-agent':ua,'accept-language':c.lang.replace('_','-')}});
            const html=await page.text();
            console.log(JSON.stringify({domain:c.domain,pageStatus:page.status,pageBytes:html.length,hasArtist:/櫻坂46|Sakurazaka/i.test(html),hasTracks:/\/tracks\/[A-Za-z0-9]+/i.test(html),hasFollower:/フォロワ|follower/i.test(html),scriptJson:(html.match(/application\/json/g)||[]).length}));
          }
          for(const c of cases){try{await runCase(c)}catch(error){console.log(JSON.stringify({case:c,error:String(error)}));}}
          NODE
