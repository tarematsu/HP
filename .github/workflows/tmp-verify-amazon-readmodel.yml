name: Temporary Amazon showHomeBrowse trace

on:
  push:
    branches:
      - tmp/verify-amazon-readmodel

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install puppeteer core
        run: npm install --no-save puppeteer-core@24.19.0
      - name: Trace legacy browse-panel ranking route
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          const executablePath = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium-browser','/usr/bin/chromium'].find(fs.existsSync);
          if (!executablePath) throw new Error('Chrome executable not found');
          const browser = await puppeteer.launch({executablePath,headless:true,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']});
          const page = await browser.newPage();
          await page.setViewport({width:1280,height:900});
          await page.setExtraHTTPHeaders({'Accept-Language':'ja-JP,ja;q=0.9,en;q=0.5'});
          await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36');
          const requests=[];
          page.on('request', req=>{
            const u=req.url();
            if (!u.includes('skill.music.a2z.com')) return;
            requests.push({method:req.method(),url:u,post:req.postData()||''});
            console.log('REQ',req.method(),u);
            if(req.postData()) console.log('POST',req.postData().slice(0,6000));
          });
          page.on('response',async res=>{
            const u=res.url();
            if(!u.includes('skill.music.a2z.com')) return;
            try{
              const text=await res.text();
              console.log('RESP',res.status(),u,'BYTES',text.length);
              const decoded=text.replace(/\\u002F/gi,'/').replace(/\\\//g,'/');
              for(const m of decoded.matchAll(/.{0,220}(?:next|pagination|showHomeBrowse|showCatalogTracks|popularTracks|POPULAR_TRACKS|browsePanel).{0,700}/gi)) console.log('CTX',m[0].replace(/\s+/g,' ').slice(0,1000));
            }catch{}
          });
          await page.goto('https://music.amazon.co.jp/popular/browsePanel/popularTracks',{waitUntil:'networkidle2',timeout:60000});
          await new Promise(r=>setTimeout(r,2500));
          for(let i=0;i<25;i++){
            await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
            await new Promise(r=>setTimeout(r,600));
          }
          const body=await page.evaluate(()=>document.body.innerText);
          const ranks=[...body.matchAll(/(?:^|\n)\s*(\d{1,4})\.\s*([^\n]+)/g)].map(m=>({rank:+m[1],title:m[2].trim()}));
          console.log('FINAL_URL',page.url());
          console.log('RANK_COUNT',ranks.length,'LAST',JSON.stringify(ranks.slice(-10)));
          console.log('REQUEST_COUNT',requests.length);
          await browser.close();
          NODE
