name: Temporary run Amazon daily collection once

on:
  push:
    branches:
      - tmp/verify-amazon-readmodel

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Worker dependencies
        working-directory: worker
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run production-bound Amazon scheduled collection once
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler dev --remote --test-scheduled --config wrangler.amazon-music.jsonc --ip 127.0.0.1 --port 8787 > /tmp/amazon-wrangler.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/amazon-wrangler.log || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl --fail-with-body --show-error --silent --get --data-urlencode 'cron=30 1 * * *' http://127.0.0.1:8787/__scheduled
          echo
          sleep 2
          cat /tmp/amazon-wrangler.log
