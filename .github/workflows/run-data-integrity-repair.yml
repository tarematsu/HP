name: Run data integrity repair

on:
  # This lane owns only source-gap discovery and one bounded minute rebuild.
  # Aggregate/read-model repair lives in the separate daily deep workflow.
  schedule:
    - cron: '31 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-integrity-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      BUDDIES_DATABASE_NAME: stationhead-buddies
      FACTS_DATABASE_NAME: stationhead-minute
      OTHER_DATABASE_NAME: stationhead-other
      RUNTIME_MAINTENANCE_DEADLINE_MS: '720000'
      RUNTIME_MAINTENANCE_COLLECTOR_ID: data-integrity-repair-actions
      RUNTIME_MAINTENANCE_FORCE: 'true'
      RUNTIME_MAINTENANCE_REBUILD_ONLY: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_BUILDS_API_TOKEN || secrets.CF_API_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Scan gaps and process at most one minute rebuild
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-minute-facts-gap-scan-actions.mjs 2>&1 | tee data-integrity-repair.log
          node scripts/run-runtime-offline-maintenance-actions.mjs 2>&1 | tee -a data-integrity-repair.log
      - name: Upload data repair failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: data-integrity-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: worker/data-integrity-repair.log
          if-no-files-found: error
          retention-days: 7
