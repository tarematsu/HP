name: Video CI

on:
  push:
    branches:
      - main
    paths:
      - 'hp/package.json'
      - 'hp/package-lock.json'
      - 'hp/video/src/**'
      - 'hp/video/public/**'
      - 'hp/video/migrations/**'
      - 'hp/video/test/**'
      - 'hp/video/scripts/**'
      - 'hp/video/package.json'
      - 'hp/video/wrangler.jsonc'
      - 'hp/video/.ci-full-trigger'
      - '.github/workflows/video-ci.yml'
  pull_request:
    paths:
      - 'hp/package.json'
      - 'hp/package-lock.json'
      - 'hp/video/src/**'
      - 'hp/video/public/**'
      - 'hp/video/migrations/**'
      - 'hp/video/test/**'
      - 'hp/video/scripts/**'
      - 'hp/video/package.json'
      - 'hp/video/wrangler.jsonc'
      - 'hp/video/.ci-full-trigger'
      - '.github/workflows/video-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hp/package-lock.json
      - name: Install HomePanel workspace dependencies
        working-directory: hp
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run syntax checks
        working-directory: hp
        run: npm run check:syntax --workspace video
      - name: Run repository audit
        working-directory: hp
        run: npm run check:audit --workspace video
      - name: Run tests
        working-directory: hp
        shell: bash
        run: |
          set -o pipefail
          npm test --workspace video 2>&1 | tee video/test-output.log
      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: video-ci-test-output-${{ github.run_id }}
          path: hp/video/test-output.log
          if-no-files-found: warn
          retention-days: 7
      - name: Validate Worker bundle
        working-directory: hp
        run: npm run check:bundle --workspace video
