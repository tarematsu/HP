name: Video CI

on:
  pull_request:
    paths:
      - 'hp/native/src/**'
      - 'hp/video/test/**'
      - '.github/scripts/fix_stationhead_remaining.py'
      - '.github/workflows/video-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stationhead-final-repair-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-stationhead-final-repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/rebuild-stationhead-play-stats'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply final audited repair
        run: python .github/scripts/fix_stationhead_remaining.py
      - name: Validate focused regressions
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          source = Path('hp/native/src/sh_stats_session_policy_fix.h').read_text()
          sizes = [len(value) for value in re.findall(r'LR"JS\((.*?)\)JS"', source, re.S)]
          if len(sizes) < 5 or max(sizes) >= 8000:
              raise SystemExit(f'unsafe raw literal sizes: {sizes}')
          print('raw literal sizes:', sizes)
          PY
          node --test \
            hp/video/test/stationhead-play-stats-rebuild-regression.test.js \
            hp/video/test/stationhead-play-stats-native-state-regression.test.js \
            hp/video/test/stationhead-stats-session-root-cause-regression.test.js \
            hp/video/test/stationhead-stats-july26-baseline-regression.test.js
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Stationhead MSVC literals and deterministic daily reduction"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
