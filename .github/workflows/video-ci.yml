name: Video CI

on:
  push:
    branches:
      - main
      - agent/rebuild-stationhead-play-stats
    paths:
      - 'hp/package.json'
      - 'hp/package-lock.json'
      - 'hp/cloud/src/unified_worker.js'
      - 'hp/cloud/wrangler.jsonc'
      - 'hp/video/src/**'
      - 'hp/video/public/**'
      - 'hp/video/migrations/**'
      - 'hp/video/test/**'
      - 'hp/video/scripts/**'
      - 'hp/video/package.json'
      - 'hp/video/.ci-full-trigger'
      - '.github/workflows/video-ci.yml'
  pull_request:
    paths:
      - 'hp/package.json'
      - 'hp/package-lock.json'
      - 'hp/cloud/src/unified_worker.js'
      - 'hp/cloud/wrangler.jsonc'
      - 'hp/video/src/**'
      - 'hp/video/public/**'
      - 'hp/video/migrations/**'
      - 'hp/video/test/**'
      - 'hp/video/scripts/**'
      - 'hp/video/package.json'
      - 'hp/video/.ci-full-trigger'
      - '.github/workflows/video-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply_stationhead_followup:
    if: (github.event_name == 'pull_request' && github.head_ref == 'agent/rebuild-stationhead-play-stats') || (github.event_name == 'push' && github.ref_name == 'agent/rebuild-stationhead-play-stats')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rebuild-stationhead-play-stats
          fetch-depth: 0
      - name: Apply reviewed Stationhead follow-up
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON_EXTRACT'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-stationhead-stats-followup.yml')
          source = workflow.read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          ) + '\n'
          strict = """def replace_one(text, old, new, label):
    count = text.count(old)
    if count != 1:
        raise SystemExit(f'{label}: expected one match, got {count}')
    return text.replace(old, new, 1)
"""
          scoped = """def replace_one(text, old, new, label):
    count = text.count(old)
    if label == 'timer clearing':
        if count < 1:
            raise SystemExit(f'{label}: expected at least one match, got {count}')
    elif count != 1:
        raise SystemExit(f'{label}: expected one match, got {count}')
    return text.replace(old, new, 1)
"""
          if script.count(strict) != 1:
              raise SystemExit('follow-up replacement helper changed unexpectedly')
          script = script.replace(strict, scoped, 1)
          exec(compile(script, str(workflow), 'exec'), {'__name__': '__main__'})
          PYTHON_EXTRACT
          rm -f .github/workflows/apply-stationhead-stats-followup.yml
          rm -f .github/workflows/apply-stationhead-native-stats-patch.yml
          rm -f .github/patches/stationhead-followup-trigger
          node --check hp/native/scripts/capture-stationhead-play-stats-safe.mjs
          node --test \
            hp/video/test/stationhead-play-stats-*.test.js \
            hp/video/test/stationhead-stats-*.test.js \
            hp/video/test/stationhead-safe-capture-regression.test.js
          git checkout origin/main -- .github/workflows/video-ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden Stationhead stats request ordering"
          git push origin HEAD:agent/rebuild-stationhead-play-stats

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hp/package-lock.json
      - name: Install HomePanel workspace dependencies
        working-directory: hp
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run syntax checks
        working-directory: hp
        run: npm run check:syntax --workspace video
      - name: Run repository audit
        working-directory: hp
        run: npm run check:audit --workspace video
      - name: Run tests
        working-directory: hp
        shell: bash
        run: |
          set -o pipefail
          npm test --workspace video 2>&1 | tee video/test-output.log
      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: video-ci-test-output-${{ github.run_id }}
          path: hp/video/test-output.log
          if-no-files-found: warn
          retention-days: 7
      - name: Validate integrated Worker bundle
        working-directory: hp
        run: npm run check:unified-bundle --workspace cloud
