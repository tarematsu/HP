name: Video CI

on:
  push:
    branches:
      - main
    paths:
      - 'hp/video/**'
      - '.github/workflows/video-ci.yml'
  pull_request:
    paths:
      - 'hp/video/**'
      - '.github/workflows/video-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-window-b-audit-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/fix-stationhead-window-b' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-stationhead-window-b
          fetch-depth: 0
      - name: Apply audited Stationhead fixes
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def block(value: str) -> str:
              return dedent(value).lstrip('\n')

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              old = block(old)
              new = block(new)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'hp/native/src/sh_shared.h',
              '''
              inline std::wstring StationheadAuthProbeScript(int channelId) {
                std::wostringstream script;
                script << LR"JS(
              (() => {
                const post = message => {
                  try { window.chrome?.webview?.postMessage(message); } catch (_) {}
                };
              ''',
              '''
              inline std::wstring StationheadAuthProbeScript(int channelId, int64_t probeStartedAt) {
                std::wostringstream script;
                script << LR"JS(
              (() => {
                const probeStartedAt = )JS" << probeStartedAt << LR"JS(;
                const post = message => {
                  message.probe_started_at = probeStartedAt;
                  try { window.chrome?.webview?.postMessage(message); } catch (_) {}
                };
              ''',
          )

          replace_once(
              'hp/native/src/sh.cpp',
              '''
                const bool changed =
                    audioPlaying_.exchange(playing, std::memory_order_relaxed) != playing;
              ''',
              '''
                const bool changed =
                    audioPlaying_.exchange(playing, std::memory_order_relaxed) != playing;
                const bool preserveSecondaryLogin = IsSecondary() && loginRequired_;
              ''',
          )
          replace_once(
              'hp/native/src/sh.cpp',
              '''
                      status_.audioPlaying = true;
                      status_.playing = true;
                      status_.loginRequired = false;
                      status_.detail = L"audio observed while track-boundary navigation is still pending";
              ''',
              '''
                      status_.audioPlaying = true;
                      status_.playing = true;
                      status_.loginRequired = preserveSecondaryLogin;
                      status_.detail = L"audio observed while track-boundary navigation is still pending";
              ''',
          )
          replace_once(
              'hp/native/src/sh.cpp',
              '''
                resourceBlockingArmed_ = true;
                loginRequired_ = false;
                {
                  std::lock_guard lock(mutex_);
                  status_.audioPlaying = true;
                  status_.playing = true;
                  status_.loginRequired = false;
              ''',
              '''
                resourceBlockingArmed_ = true;
                if (!preserveSecondaryLogin) loginRequired_ = false;
                {
                  std::lock_guard lock(mutex_);
                  status_.audioPlaying = true;
                  status_.playing = true;
                  status_.loginRequired = preserveSecondaryLogin;
              ''',
          )
          replace_once(
              'hp/native/src/sh.cpp',
              '''
                if (!startupPreviewActive_ && !spotifyAuthorization_) SetVisible(false);
                if (changed) log_.Info(L"Stationhead " + std::wstring(RoleTag()) + L" audio playing (" + source + L")");
                PostChange(StationheadChangeReturnMain);
              ''',
              '''
                if (!preserveSecondaryLogin && !startupPreviewActive_ && !spotifyAuthorization_) {
                  SetVisible(false);
                }
                if (changed) log_.Info(L"Stationhead " + std::wstring(RoleTag()) + L" audio playing (" + source + L")");
                PostChange(preserveSecondaryLogin ? StationheadChangeNone
                                                  : StationheadChangeReturnMain);
              ''',
          )
          replace_once(
              'hp/native/src/sh.cpp',
              '''
                const HRESULT result = webview_->ExecuteScript(
                    StationheadAuthProbeScript(config_.channelId).c_str(), nullptr);
              ''',
              '''
                const HRESULT result = webview_->ExecuteScript(
                    StationheadAuthProbeScript(config_.channelId, authProbeStartedAt_).c_str(),
                    nullptr);
              ''',
          )

          replace_once(
              'hp/native/src/sh_webview.cpp',
              '''
                            if (type == L"stationhead-auth-probe") {
                              authProbeInFlight_ = false;
                              authProbeStartedAt_ = 0;
                              const std::wstring state = message.GetNamedString(L"state", L"").c_str();
              ''',
              '''
                            if (type == L"stationhead-auth-probe") {
                              const int64_t probeStartedAt = static_cast<int64_t>(
                                  json::Number(message, L"probe_started_at", 0));
                              if (!IsSecondary() || !authProbeInFlight_ || probeStartedAt <= 0 ||
                                  probeStartedAt != authProbeStartedAt_) {
                                log_.Info(L"Secondary Stationhead ignored a stale auth probe result");
                                return S_OK;
                              }
                              authProbeInFlight_ = false;
                              authProbeStartedAt_ = 0;
                              const std::wstring state = message.GetNamedString(L"state", L"").c_str();
              ''',
          )
          replace_once(
              'hp/native/src/sh_webview.cpp',
              '''
                              } else if (state == L"no-auth-header") {
                                std::lock_guard lock(mutex_);
                                status_.detail = L"secondary Stationhead auth probe waiting for session";
                              } else {
                                log_.Warn(L"Secondary Stationhead auth probe returned an error");
                              }
              ''',
              '''
                              } else if (state == L"no-auth-header") {
                                std::lock_guard lock(mutex_);
                                status_.detail = L"secondary Stationhead auth probe waiting for session";
                              } else if (state == L"forbidden") {
                                {
                                  std::lock_guard lock(mutex_);
                                  status_.detail = L"secondary Stationhead auth probe forbidden; playback session retained";
                                }
                                log_.Warn(L"Secondary Stationhead authentication probe returned HTTP 403; retaining the current playback session");
                                PostChange();
                              } else {
                                log_.Warn(L"Secondary Stationhead auth probe returned an error");
                              }
              ''',
          )

          test_path = Path('hp/video/test/stationhead-window-b-interactive-regression.test.js')
          test_text = test_path.read_text(encoding='utf-8')
          anchor = block('''
          const appSource = readFileSync(
            new URL('../../native/src/app.cpp', import.meta.url),
            'utf8',
          );
          ''')
          addition = anchor + block('''
          const playerSource = readFileSync(
            new URL('../../native/src/sh.cpp', import.meta.url),
            'utf8',
          );
          const sharedSource = readFileSync(
            new URL('../../native/src/sh_shared.h', import.meta.url),
            'utf8',
          );
          const webviewSource = readFileSync(
            new URL('../../native/src/sh_webview.cpp', import.meta.url),
            'utf8',
          );
          ''')
          if test_text.count(anchor) != 1:
              raise SystemExit('test source anchor mismatch')
          test_text = test_text.replace(anchor, addition, 1)
          test_text += block(r'''

          test('Window B keeps confirmed login-required state while audio continues', () => {
            const applyAudio = section(
              playerSource,
              'void StationheadPlayer::ApplyAudioPlaybackState(',
              'void StationheadPlayer::NavigateCurrentUrl(',
            );
            assert.match(applyAudio, /preserveSecondaryLogin = IsSecondary\(\) && loginRequired_/);
            assert.match(applyAudio, /status_\.loginRequired = preserveSecondaryLogin;/);
            assert.match(applyAudio, /if \(!preserveSecondaryLogin && !startupPreviewActive_/);
            assert.match(
              applyAudio,
              /PostChange\(preserveSecondaryLogin \? StationheadChangeNone[\s\S]*StationheadChangeReturnMain\)/,
            );
          });

          test('Window B rejects auth-probe results from an obsolete execution', () => {
            assert.match(
              sharedSource,
              /StationheadAuthProbeScript\(int channelId, int64_t probeStartedAt\)/,
            );
            assert.match(sharedSource, /message\.probe_started_at = probeStartedAt;/);
            const poll = section(
              playerSource,
              'void StationheadPlayer::PollAuthProbe(',
              '// Locates the Start Listening control',
            );
            assert.match(
              poll,
              /StationheadAuthProbeScript\(config_\.channelId, authProbeStartedAt_\)/,
            );
            const handler = section(
              webviewSource,
              'if (type == L"stationhead-auth-probe")',
              'if (!spotifyAuthorization_',
            );
            assert.match(handler, /probeStartedAt != authProbeStartedAt_/);
            assert.match(handler, /ignored a stale auth probe result/);
            assert.match(handler, /state == L"forbidden"/);
          });
          ''')
          test_path.write_text(test_text, encoding='utf-8')

          import subprocess
          subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
          subprocess.run(['git', 'checkout', 'origin/main', '--', '.github/workflows/video-ci.yml'], check=True)
      - name: Commit audited fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Window B authentication state transitions"
          git push origin HEAD:agent/fix-stationhead-window-b

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hp/video
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-video-${{ hashFiles('hp/video/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-video-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run syntax checks
        run: npm run check:syntax
      - name: Run repository audit
        run: npm run check:audit
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: video-ci-test-output-${{ github.run_id }}
          path: hp/video/test-output.log
          if-no-files-found: warn
          retention-days: 7
      - name: Validate Worker bundle
        run: npm run check:bundle
