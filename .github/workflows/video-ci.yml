name: Video CI

on:
  push:
    branches:
      - main
      - fix/spotify-90m-music-30m-talkabout
    paths:
      - 'hp/package.json'
      - 'hp/package-lock.json'
      - 'hp/cloud/src/unified_worker.js'
      - 'hp/cloud/wrangler.jsonc'
      - 'hp/video/src/**'
      - 'hp/video/public/**'
      - 'hp/video/migrations/**'
      - 'hp/video/test/**'
      - 'hp/video/scripts/**'
      - 'hp/video/package.json'
      - 'hp/video/.ci-full-trigger'
      - '.github/workflows/video-ci.yml'
  pull_request:
    paths:
      - 'hp/package.json'
      - 'hp/package-lock.json'
      - 'hp/cloud/src/unified_worker.js'
      - 'hp/cloud/wrangler.jsonc'
      - 'hp/video/src/**'
      - 'hp/video/public/**'
      - 'hp/video/migrations/**'
      - 'hp/video/test/**'
      - 'hp/video/scripts/**'
      - 'hp/video/package.json'
      - 'hp/video/.ci-full-trigger'
      - '.github/workflows/video-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Apply one-time Spotify schedule patch
        if: github.event_name == 'push' && github.ref_name == 'fix/spotify-90m-music-30m-talkabout'
        run: python scripts/patch-spotify-90m-30m-once.py
      - name: Commit one-time Spotify schedule patch
        if: github.event_name == 'push' && github.ref_name == 'fix/spotify-90m-music-30m-talkabout'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hp/native/src/spotify_webviews.cpp hp/video/test/native-spotify-webviews-contract.test.js
          git commit -m 'Run Spotify 90m alternating music then 30m TALKABOUT'
          git push origin HEAD:fix/spotify-90m-music-30m-talkabout
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hp/package-lock.json
      - name: Install HomePanel workspace dependencies
        working-directory: hp
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Run syntax checks
        working-directory: hp
        run: npm run check:syntax --workspace video
      - name: Run repository audit
        working-directory: hp
        run: npm run check:audit --workspace video
      - name: Run tests
        working-directory: hp
        shell: bash
        run: |
          set -o pipefail
          npm test --workspace video 2>&1 | tee video/test-output.log
      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: video-ci-test-output-${{ github.run_id }}
          path: hp/video/test-output.log
          if-no-files-found: warn
          retention-days: 7
      - name: Validate integrated Worker bundle
        working-directory: hp
        run: npm run check:unified-bundle --workspace cloud
