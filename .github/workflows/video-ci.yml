name: Video CI

on:
  push:
    branches:
      - main
    paths:
      - 'hp/video/**'
      - '.github/workflows/video-ci.yml'
  pull_request:
    paths:
      - 'hp/video/**'
      - '.github/workflows/video-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: video-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-stationhead-ab-audit:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 268 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-stationhead-window-b
          fetch-depth: 0
      - name: Apply A/B audit fixes
        shell: bash
        run: |
          python -c "import base64,zlib;open('/tmp/apply_stationhead_ab.py','wb').write(zlib.decompress(base64.b64decode('')))"
          python /tmp/apply_stationhead_ab.py
          node --test hp/video/test/stationhead-window-b-interactive-regression.test.js
      - name: Commit audited fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout HEAD^ -- .github/workflows/video-ci.yml
          git rm .github/workflows/apply-stationhead-ab-audit.yml
          git add hp/native/src/app_stationhead_handles.h hp/native/src/sh.cpp hp/native/src/sh_shared.h hp/native/src/sh_webview.cpp hp/video/test/stationhead-window-b-interactive-regression.test.js .github/workflows/video-ci.yml
          git diff --cached --check
          git commit -m 'Fix Stationhead A/B interactive state and retry races'
          git push origin HEAD:agent/fix-stationhead-window-b

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: hp/video
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-video-${{ hashFiles('hp/video/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-video-
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run syntax checks
        run: npm run check:syntax
      - name: Run repository audit
        run: npm run check:audit
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Upload failed test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: video-ci-test-output-${{ github.run_id }}
          path: hp/video/test-output.log
          if-no-files-found: warn
          retention-days: 7
      - name: Validate Worker bundle
        run: npm run check:bundle
