name: Video CI

on:
  pull_request:
    paths:
      - 'hp/video/**'
      - '.github/workflows/video-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-stationhead-ab-audit:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 268 && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-stationhead-window-b
          fetch-depth: 0
      - name: Apply A/B audit fixes
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/apply-stationhead-ab.log 2>&1
          import base64
          import zlib
          payload = open('.github/stationhead-ab-patch.b64', encoding='utf-8').read().strip()
          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          exec(compile(source, '.github/stationhead-ab-patch.py', 'exec'))
          PY
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            {
              date -u
              cat /tmp/apply-stationhead-ab.log
            } > .github/stationhead-ab-apply-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/stationhead-ab-apply-error.txt
            git commit -m 'Record remaining Stationhead A/B patch mismatch'
            git push origin HEAD:agent/fix-stationhead-window-b
            exit "$status"
          fi
      - name: Commit audited fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git show 141c9e3552036ca9cd40aeaf7a5046bd560ef1e0:.github/workflows/video-ci.yml > .github/workflows/video-ci.yml
          git rm -f .github/workflows/apply-stationhead-ab-audit.yml .github/stationhead-ab-apply-error.txt .github/stationhead-ab-patch.b64
          git add hp/native/src/app_stationhead_handles.h hp/native/src/sh.cpp hp/native/src/sh_shared.h hp/native/src/sh_webview.cpp hp/video/test/stationhead-window-b-interactive-regression.test.js .github/workflows/video-ci.yml
          git diff --cached --check
          git commit -m 'Fix Stationhead A/B interactive state and retry races'
          git push origin HEAD:agent/fix-stationhead-window-b
