name: Probe Kuwo frontend history parameters
on:
  push:
    branches: [research/kuwo-jp-chart-probe]
    paths: [.github/workflows/kuwo-frontend-history-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect rank route bundle deeply
        shell: bash
        run: |
          python3 <<'PY'
          import re,urllib.request
          H={'User-Agent':'Mozilla/5.0','Referer':'https://m.kuwo.cn/'}
          urls=['https://h5s.kuwo.cn/www/m/947d3da.js','https://h5s.kuwo.cn/www/m/9bb6b60.js']
          for u in urls:
            try:
              q=urllib.request.Request(u,headers=H)
              with urllib.request.urlopen(q,timeout=20) as r: js=r.read().decode('utf-8','replace')
              low=js.lower(); print('BUNDLE',u,'LEN',len(js))
              pats=['ranklist_detail','getMobileHomeRankMusicList','bangId','bangid','musicList','releaseDate','currentVolume','third_id','volume','history','date']
              for pat in pats:
                poss=[m.start() for m in re.finditer(re.escape(pat.lower()),low)]
                print('PAT',pat,'COUNT',len(poss))
                for pos in poss[:8]:
                  print('CTX',pat,js[max(0,pos-900):min(len(js),pos+2200)].replace('\n',' ')[:3100])
            except Exception as e: print('ERR',u,repr(e))
          PY
