name: Pages live browser audit

on:
  pull_request:
    paths:
      - 'site/**'
      - 'worker/scripts/run-pages-read-model-actions.mjs'
      - 'scripts/audit-pages-live.mjs'
      - 'scripts/audit-pages-materialized.mjs'
      - '.github/actions/cloudflare-context/**'
      - '.github/workflows/pages-live-browser-audit.yml'
      - '.github/workflows/run-pages-read-model-rebuild.yml'
      - '.github/workflows/deploy-split-pipeline.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  workflow_run:
    workflows: ['Deploy production', 'Rebuild pages read models']
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: pages-live-browser-audit-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets['CLOUDFLARE_API_TOKEN'] || secrets['CF_API_TOKEN'] || secrets['CLOUDFLARE_BUILDS_API_TOKEN'] }}
    steps:
      - name: Checkout audit revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Cloudflare account context
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}

      - name: Install Pages deployment dependencies
        if: github.event_name == 'pull_request'
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: site

      - name: Deploy pull request Pages preview
        if: github.event_name == 'pull_request'
        id: preview
        shell: bash
        working-directory: site
        env:
          PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          npx wrangler pages deploy public \
            --project-name skrzk \
            --branch "$PREVIEW_BRANCH" \
            2>&1 | tee pages-preview-deploy.log
          preview_url="$(grep -Eo 'https://[[:alnum:]-]+\.skrzk\.pages\.dev' pages-preview-deploy.log | head -n 1 || true)"
          if [[ -z "$preview_url" ]]; then
            echo 'Could not find the deployed Pages preview URL in Wrangler output.' >&2
            exit 1
          fi
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Install browser audit dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.54.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture pull request preview entry
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PAGES_AUDIT_URL: ${{ steps.preview.outputs.url }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises';
          import { chromium } from 'playwright';
          await mkdir('.pages-preview-audit', { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1000 },
            colorScheme: 'light',
            locale: 'ja-JP',
            serviceWorkers: 'block',
          });
          const page = await context.newPage();
          let status = null;
          let error = null;
          try {
            const response = await page.goto(process.env.PAGES_AUDIT_URL, {
              waitUntil: 'domcontentloaded',
              timeout: 35000,
            });
            status = response?.status() ?? null;
            await page.waitForTimeout(750);
          } catch (caught) {
            error = caught instanceof Error ? caught.message : String(caught);
          }
          await page.screenshot({ path: '.pages-preview-audit/preview-entry.png', fullPage: true });
          const title = await page.title().catch(() => '');
          const finalUrl = page.url();
          const body = await page.locator('body').innerText().catch(() => '');
          const report = {
            requestedUrl: process.env.PAGES_AUDIT_URL,
            finalUrl,
            status,
            title,
            accessProtected: /cloudflare|access|sign in/i.test(`${title} ${body} ${finalUrl}`),
            error,
          };
          await writeFile('.pages-preview-audit/report.json', `${JSON.stringify(report, null, 2)}\n`);
          await context.close();
          await browser.close();
          console.log(JSON.stringify(report));
          NODE

      - name: Access production Pages in Chromium
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: >-
          node scripts/audit-pages-live.mjs
          --url=https://skrzk.pages.dev
          --attempts=3
          --retry-delay-ms=10000
          --out=.pages-production-audit

      - name: Require all production materializations
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          attempts=10
          retry_delay_ms=30000
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            attempts=1
            retry_delay_ms=0
          fi
          node scripts/audit-pages-materialized.mjs \
            --url=https://skrzk.pages.dev \
            --attempts="$attempts" \
            --retry-delay-ms="$retry_delay_ms" \
            --out=.pages-production-audit/materialized.json

      - name: Upload browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-live-browser-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .pages-preview-audit/
            .pages-production-audit/
            site/pages-preview-deploy.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
