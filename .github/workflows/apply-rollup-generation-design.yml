name: Apply rollup generation design

on:
  push:
    branches:
      - agent/finalize-rollup-generation-design

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finalize-rollup-generation-design
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply design
        run: node .github/scripts/apply-rollup-generation-design.mjs
      - name: Run focused tests
        run: |
          node --test tests/immutable-summary-rollups.test.mjs
          node --test tests/history-minute-summary.test.mjs
          node --test worker/tests/rollup-stream-repair.test.js
      - name: Commit design
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Persist dirty rollups and propagate generations"
          git push origin HEAD:agent/finalize-rollup-generation-design
