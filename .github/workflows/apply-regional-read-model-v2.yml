name: Apply regional read-model split onto latest main

on:
  push:
    branches:
      - refactor/regional-read-models-by-service-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/regional-read-models-by-service-v2

      - name: Apply original PR delta with three-way merge
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refactor/regional-read-models-by-service
          files=(
            site/functions/api/regional-music.js
            site/functions/lib/api-contract.js
            site/public/netease-japan-chart-ui.js
            site/public/qq-japan-chart-ui.js
            site/public/regional-music.js
            site/public/youtube-music.js
            site/tests/api-catalog-files.test.js
            site/tests/api-contract.test.js
            site/tests/pages-api-gateway.test.js
            site/tests/regional-music-navigation.test.js
            worker/src/regional-music-read-model.js
            worker/tests/genie-catalog-snapshot.test.js
            worker/tests/netease-japan-read-model.test.js
            worker/tests/producer-read-model-bootstrap.test.js
            worker/tests/regional-music-read-model.test.js
          )
          git diff 11311c5fda9ec8a8feb3934d489d71f751e10b14..origin/refactor/regional-read-models-by-service -- "${files[@]}" > /tmp/regional-read-model.patch
          git apply --3way --index /tmp/regional-read-model.patch

      - name: Run focused checks
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix worker ci --prefer-offline --no-audit --no-fund
          npm --prefix site ci --prefer-offline --no-audit --no-fund
          node --test \
            worker/tests/regional-music-read-model.test.js \
            worker/tests/netease-japan-read-model.test.js \
            worker/tests/genie-catalog-snapshot.test.js \
            worker/tests/producer-read-model-bootstrap.test.js
          node --test \
            site/tests/api-contract.test.js \
            site/tests/api-catalog-files.test.js \
            site/tests/pages-api-gateway.test.js \
            site/tests/regional-music-navigation.test.js

      - name: Commit resolved implementation and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-regional-read-model-v2.yml
          git add -A
          git commit -m 'Split regional read models by service on latest main'
          git push origin HEAD:refactor/regional-read-models-by-service-v2
