name: Apply regional read-model split onto latest main
on:
  push:
    branches: [refactor/regional-read-models-by-service-v2]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/regional-read-models-by-service-v2
      - name: Apply and resolve
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refactor/regional-read-models-by-service
          files=(site/functions/api/regional-music.js site/functions/lib/api-contract.js site/public/netease-japan-chart-ui.js site/public/qq-japan-chart-ui.js site/public/regional-music.js site/public/youtube-music.js site/tests/api-catalog-files.test.js site/tests/api-contract.test.js site/tests/pages-api-gateway.test.js site/tests/regional-music-navigation.test.js worker/src/regional-music-read-model.js worker/tests/genie-catalog-snapshot.test.js worker/tests/netease-japan-read-model.test.js worker/tests/producer-read-model-bootstrap.test.js worker/tests/regional-music-read-model.test.js)
          git diff 11311c5fda9ec8a8feb3934d489d71f751e10b14..origin/refactor/regional-read-models-by-service -- "${files[@]}" > /tmp/change.patch
          git apply --3way --index /tmp/change.patch || true
          git checkout --theirs -- worker/src/regional-music-read-model.js worker/tests/regional-music-read-model.test.js
          echo ' " 1>/dev/null
