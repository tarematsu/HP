name: Refresh Amazon Music track playlists

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC: 17:00 = 02:00 JST, 05:00 = 14:00 JST.
    - cron: '0 5,17 * * *'

permissions:
  contents: read

jobs:
  refresh:
    name: Collect all Amazon Music track playlists
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets['CLOUDFLARE_API_TOKEN'] || secrets['CF_API_TOKEN'] || secrets['CLOUDFLARE_BUILDS_API_TOKEN'] }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Cloudflare account context
        uses: ./.github/actions/cloudflare-context
        with:
          api-token: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: worker
      - name: Build remote-binding refresh config
        working-directory: worker
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const source = JSON.parse(readFileSync('wrangler.amazon-music.jsonc', 'utf8'));
          source.name = 'sh-amazon-music-track-playlist-refresh';
          source.main = 'scripts/amazon-music-track-playlist-refresh-entry.js';
          source.workers_dev = false;
          source.preview_urls = false;
          delete source.triggers;
          delete source.observability;
          source.d1_databases = (source.d1_databases || []).map((binding) => ({ ...binding, remote: true }));
          source.r2_buckets = (source.r2_buckets || []).map((binding) => ({ ...binding, remote: true }));
          writeFileSync('.amazon-track-playlist-refresh.wrangler.jsonc', JSON.stringify(source, null, 2));
          NODE
      - name: Collect one full track-playlist sweep
        working-directory: worker
        shell: bash
        run: |
          set -euo pipefail
          : > amazon-track-playlist-refresh.log
          npx wrangler dev --config .amazon-track-playlist-refresh.wrangler.jsonc --port 8792 --log-level error > amazon-track-playlist-refresh.log 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT

          ready=false
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8792/refresh -o amazon-track-playlist-refresh-result.json; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat amazon-track-playlist-refresh.log
            exit 1
          fi

          processed=0
          target=0
          batches=0
          succeeded_total=0
          failed_total=0

          while true; do
            batches=$((batches + 1))
            if (( batches > 1 )); then
              curl --fail --silent --show-error http://127.0.0.1:8792/refresh -o amazon-track-playlist-refresh-result.json
            fi
            cat amazon-track-playlist-refresh-result.json

            read -r handled batch_tracks total_tracks succeeded failed < <(
              node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('amazon-track-playlist-refresh-result.json', 'utf8'));
          console.log([
            result?.handled === true ? 'true' : 'false',
            Number(result?.batch_tracks || 0),
            Number(result?.total_tracks || 0),
            Number(result?.succeeded || 0),
            Number(result?.failed || 0),
          ].join(' '));
          NODE
            )

            if [[ "$handled" != true ]] || (( batch_tracks <= 0 )) || (( total_tracks <= 0 )); then
              echo "Invalid Amazon Music playlist refresh result" >&2
              cat amazon-track-playlist-refresh.log
              exit 1
            fi
            if (( target == 0 )); then
              target=$total_tracks
            fi
            processed=$((processed + batch_tracks))
            succeeded_total=$((succeeded_total + succeeded))
            failed_total=$((failed_total + failed))

            echo "Amazon Music playlist sweep: ${processed}/${target} attempts (${succeeded_total} succeeded, ${failed_total} failed)"
            if (( processed >= target )); then
              break
            fi
            if (( batches >= 100 )); then
              echo "Amazon Music playlist sweep exceeded 100 batches" >&2
              exit 1
            fi
          done

          echo "Completed Amazon Music playlist sweep: ${processed} attempts across ${batches} batches; ${succeeded_total} succeeded, ${failed_total} failed"
