name: Probe Kuwo Wayback embedded history
on:
  push:
    branches: [research/kuwo-jp-chart-probe]
    paths: [.github/workflows/kuwo-wayback-embedded-history.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Find archived rank pages with embedded volume metadata
        shell: bash
        run: |
          python3 <<'PY'
          import json,re,time,urllib.parse,urllib.request
          UA={'User-Agent':'Mozilla/5.0'}
          def read(u,t=20):
            req=urllib.request.Request(u,headers=UA)
            with urllib.request.urlopen(req,timeout=t) as r:return r.read().decode('utf-8','replace')
          patterns=['m.kuwo.cn/newh5/bang/index*','www.kuwo.cn/newh5/bang/index*','kuwo.cn/newh5/bang/index*','m.kuwo.cn/newh5app/ranklist_detail/183*']
          captures=[]
          for pat in patterns:
            q='https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode({'url':pat,'output':'json','filter':'statuscode:200','fl':'timestamp,original,digest','collapse':'digest','limit':'200'})
            try:
              arr=json.loads(read(q,30)); print('CDX',pat,'ROWS',max(0,len(arr)-1))
              for x in arr[1:]: captures.append(x)
            except Exception as e: print('CDX_ERR',pat,repr(e))
          # unique and sample across years / newest-first; inspect up to 80 captures
          uniq={}
          for ts,u,d in captures: uniq[(ts,u)]=(ts,u,d)
          caps=sorted(uniq.values(),reverse=True)
          print('CAPTURES',len(caps))
          hits=0
          for ts,u,d in caps[:80]:
            replay=f'https://web.archive.org/web/{ts}id_/{u}'
            try:
              body=read(replay,20)
            except Exception as e:
              print('REPLAY_ERR',ts,u,repr(e)); continue
            keys=[k for k in ['third_id','currentVolume','currentvolume','bangid','volume','酷我日语榜'] if k.lower() in body.lower()]
            # print every useful page; search nearby JSON-like volume metadata
            if keys:
              hits+=1; print('PAGE_HIT',ts,u,'LEN',len(body),'KEYS',keys)
              for pat in ['third_id','currentVolume','酷我日语榜','bangid']:
                pos=body.lower().find(pat.lower())
                if pos>=0: print('CTX',pat,body[max(0,pos-700):pos+1800].replace('\n',' ')[:2500])
              # extract any candidate edition IDs beside second_id 183
              for m in re.finditer(r'(?:second_id|secondId)[^0-9]{0,20}["\']?183["\']?.{0,180}?(?:third_id|thirdId)[^0-9]{0,20}["\']?(\d+)',body,re.I|re.S):
                print('EDITION_ID',ts,m.group(1))
            time.sleep(.1)
          print('USEFUL_PAGES',hits)
          PY
