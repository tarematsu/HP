name: Test Kuwo historical issue IDs on legacy API
on:
  push:
    paths: ['.github/workflows/kuwo-jp-oldid-direct-v2.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe historical IDs
        shell: python
        run: |
          import json, urllib.request
          ids=[272685,272610,268368,268291,183]
          aliases=['櫻坂46','樱坂46','Sakurazaka46','乃木坂46','Nogizaka46','日向坂46','Hinatazaka46','欅坂46','Keyakizaka46']
          def fetch(url):
            try:
              q=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://m.kuwo.cn/'})
              with urllib.request.urlopen(q,timeout=10) as r:return r.status,r.read().decode('utf-8','replace')
            except Exception as e:return 0,repr(e)
          for bid in ids:
            print('\n=== ID',bid,'===')
            variants=[
              f'https://kbangserver.kuwo.cn/ksong.s?from=pc&fmt=json&pn=0&rn=100&type=bang&data=content&id={bid}&show_copyright_off=0&pcmp4=1&isbang=1&userid=0',
              f'https://kbangserver.kuwo.cn/ksong.s?from=pc&fmt=json&pn=0&rn=100&type=bang&data=content&sourceid={bid}&show_copyright_off=0&pcmp4=1&isbang=1&userid=0',
              f'https://kbangserver.kuwo.cn/ksong.s?from=pc&fmt=json&pn=0&rn=100&type=bang&data=content&bangid={bid}&show_copyright_off=0&pcmp4=1&isbang=1&userid=0'
            ]
            for vi,u in enumerate(variants):
              st,body=fetch(u)
              print('VAR',vi,'HTTP',st,'LEN',len(body),'HEAD',body[:180].replace('\n',' '))
              if st!=200: continue
              try:p=json.loads(body)
              except: continue
              rows=p.get('musiclist') or p.get('musicList') or (p.get('data') or {}).get('musicList') or (p.get('data') or {}).get('musiclist') or []
              print('KEYS',sorted(p.keys())[:60])
              print('META',{k:p.get(k) for k in p.keys() if any(x in k.lower() for x in ['name','title','pub','date','total','num','bang','id']) and not isinstance(p.get(k),(list,dict))})
              print('ROWS',len(rows))
              if rows:
                for i,x in enumerate(rows[:8],1): print('TOP',i,x.get('name'),x.get('artist'),x.get('id'),x.get('rank_change'),x.get('trend'))
                matches=[]
                for i,x in enumerate(rows,1):
                  s=' '.join(str(x.get(k,'')) for k in ('artist','aartist','name','album'))
                  if any(a.lower() in s.lower() for a in aliases): matches.append((i,x.get('name'),x.get('artist')))
                print('SAKAMICHI',json.dumps(matches,ensure_ascii=False))
                break
