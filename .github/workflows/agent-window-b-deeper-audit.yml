name: Apply Window B deeper audit fixes

on:
  push:
    branches:
      - agent/fix-stationhead-window-b
    paths:
      - .github/workflows/agent-window-b-deeper-audit.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-stationhead-window-b
          fetch-depth: 0
      - name: Apply authentication latch and navigation fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'hp/native/src/sh_shared.h',
              "  let loginReported = false;\n  let lastPlaying = null;\n  const observedAt = Date.now();",
              "  let loginReported = false;\n  let lastPlaying = null;\n  const observedAt = Date.now();\n  const rejectCapturedAuth = () => {\n    const authorization = window.__homepanelStationheadAuthHeaders?.authorization || '';\n    if (authorization) window.__homepanelStationheadRejectedAuthorization = authorization;\n    window.__homepanelStationheadAuthHeaders = null;\n  };",
          )
          replace_once(
              'hp/native/src/sh_shared.h',
              "    } else if (login && !loginReported && Date.now() - observedAt >= 15000) {\n      loginReported = true;\n      try { window.chrome?.webview?.postMessage('{{PREFIX}}-login-required'); } catch (_) {}\n    }",
              "    } else if (login && !loginReported && Date.now() - observedAt >= 15000) {\n      loginReported = true;\n      rejectCapturedAuth();\n      try { window.chrome?.webview?.postMessage('{{PREFIX}}-login-required'); } catch (_) {}\n    }",
          )
          replace_once(
              'hp/native/src/sh_shared.h',
              "  document.addEventListener('DOMContentLoaded', scheduleUnlessPlaying, { once: true });\n  window.addEventListener('load', scheduleUnlessPlaying, { once: true });",
              "  window.addEventListener('homepanel-stationhead-auth-ready', () => {\n    loginReported = false;\n    lastSignalAt = 0;\n    scheduleUnlessPlaying(0);\n  });\n  document.addEventListener('DOMContentLoaded', scheduleUnlessPlaying, { once: true });\n  window.addEventListener('load', scheduleUnlessPlaying, { once: true });",
          )
          replace_once(
              'hp/native/src/sh_shared.h',
              "    if (changed) {\n      try { window.chrome?.webview?.postMessage({ type: 'stationhead-auth-ready' }); } catch (_) {}\n    }",
              "    if (changed) {\n      try { window.dispatchEvent(new Event('homepanel-stationhead-auth-ready')); } catch (_) {}\n      try { window.chrome?.webview?.postMessage({ type: 'stationhead-auth-ready' }); } catch (_) {}\n    }",
          )

          replace_once(
              'hp/native/src/sh_webview.cpp',
              "            trackBoundaryRefreshPending_ = false;\n            UINT64 navigationId = 0;",
              "            trackBoundaryRefreshPending_ = false;\n            if (IsSecondary()) {\n              // Invalidate a local probe started by the outgoing document.\n              // Internal redirects do not pass through NavigateStationheadUrl(),\n              // so they must clear the execution token here as well.\n              authProbeInFlight_ = false;\n              authProbeStartedAt_ = 0;\n              lastAuthProbeAt_ = 0;\n            }\n            UINT64 navigationId = 0;",
          )

          replace_once(
              'hp/native/src/sh.cpp',
              "        status_.detail = L\"audio observed while track-boundary navigation is still pending\";",
              "        status_.detail = preserveSecondaryLogin\n            ? L\"secondary Stationhead login required; audio still present during navigation\"\n            : L\"audio observed while track-boundary navigation is still pending\";",
          )
          replace_once(
              'hp/native/src/sh.cpp',
              "      status_.detail = (usingFallback_ ? L\"fallback audio detected\" : L\"audio detected\") +\n                       (source.empty() ? L\"\" : L\" (\" + source + L\")\");",
              "      status_.detail = preserveSecondaryLogin\n          ? L\"secondary Stationhead login required; audio continues\"\n          : (usingFallback_ ? L\"fallback audio detected\" : L\"audio detected\") +\n                (source.empty() ? L\"\" : L\" (\" + source + L\")\");",
          )

          Path('.github/workflows/agent-window-b-deeper-audit.yml').unlink()
      - name: Commit deeper audit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Window B auth latch across navigation"
          git push origin HEAD:agent/fix-stationhead-window-b
