<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>sakurazaka46jp Stationhead status</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;background:#000;color:#fff}body{margin:0;padding:24px;max-width:1180px}h1{font-size:24px;margin:0 0 8px}h2{font-size:17px;margin:24px 0 8px}.muted{opacity:.62}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:18px 0 22px}.card{background:#0b0b0b;border:1px solid #444;border-radius:8px;padding:12px}.label{font-size:12px;opacity:.62}.value{font-size:16px;margin-top:4px;word-break:break-all}.table-wrap{overflow:auto;border:1px solid #444;border-radius:8px;margin:8px 0 22px}table{width:100%;border-collapse:collapse;font-size:13px;background:#050505}th,td{border-bottom:1px solid #333;padding:8px;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#111}.raw-invalid{font-weight:700;text-decoration:underline}button{padding:8px 12px;border-radius:6px;border:1px solid #777;background:#000;color:#fff}@media (prefers-color-scheme:light){:root{background:#fff;color:#000}.card,table{background:#fff}.card,.table-wrap,th,td{border-color:#bbb}th{background:#f4f4f4}button{background:#fff;color:#000;border-color:#555}}
  </style>
</head>
<body>
  <h1>sakurazaka46jp</h1>
  <div id="notice" class="muted"></div>
  <div id="meta" class="meta" hidden></div>
  <h2>main 毎分収集</h2>
  <div class="table-wrap"><table><thead><tr><th>JST</th><th>間隔</th><th>station</th><th>live</th><th>listeners</th><th>guests</th><th>total</th><th>status</th><th>chat</th><th>channel</th><th>raw</th></tr></thead><tbody id="samples"></tbody></table></div>
  <h2>chat 毎分収集</h2>
  <div class="table-wrap"><table><thead><tr><th>JST</th><th>間隔</th><th>station</th><th>raw</th></tr></thead><tbody id="chats"></tbody></table></div>
  <button id="reload" type="button">再読み込み</button>
<script>
const api='/api/sakurazaka46jp-status';
const intFmt=new Intl.NumberFormat('ja-JP',{maximumFractionDigits:0});
const avgFmt=new Intl.NumberFormat('ja-JP',{minimumFractionDigits:1,maximumFractionDigits:1});
const ftime=(ms)=>Number.isFinite(Number(ms))?new Date(Number(ms)).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',hour12:false}):'-';
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const age=(ms)=>{const n=Number(ms);if(!Number.isFinite(n))return '-';if(n<60000)return `${Math.max(0,Math.round(n/1000))}秒`;if(n<3600000)return `${Math.round(n/60000)}分`;return `${(n/3600000).toFixed(1)}時間`};
const gap=(rows,i)=>{if(i>=rows.length-1)return '-';const diff=Number(rows[i]?.observed_at)-Number(rows[i+1]?.observed_at);return Number.isFinite(diff)?`${Math.round(diff/60000)}分`:'-'};
const live=(v)=>v===true||Number(v)===1||String(v).toLowerCase()==='true';
function card(label,value){return `<div class="card"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div></div>`}
function rawCell(row){const valid=Number(row?.raw_valid)===1;return `<td class="${valid?'':'raw-invalid'}">${valid?'valid':'invalid'} / ${esc(row?.raw_bytes??0)} B</td>`}
function listenerStats(rows){
  const anchor=rows.find((row)=>live(row?.is_broadcasting)&&Number.isFinite(Number(row?.listener_count)));
  if(!anchor)return null;
  const anchorBroadcast=anchor?.broadcast_id==null?'':String(anchor.broadcast_id);
  const anchorStart=anchor?.broadcast_start_time==null?null:Number(anchor.broadcast_start_time);
  const values=rows
    .filter((row)=>{
      if(!live(row?.is_broadcasting))return false;
      if(anchorBroadcast)return String(row?.broadcast_id??'')===anchorBroadcast;
      if(Number.isFinite(anchorStart))return Number(row?.broadcast_start_time)===anchorStart;
      return true;
    })
    .map((row)=>Number(row?.listener_count))
    .filter((value)=>Number.isFinite(value)&&value>=0);
  if(!values.length)return null;
  return {
    min:Math.min(...values),
    max:Math.max(...values),
    avg:values.reduce((sum,value)=>sum+value,0)/values.length,
  };
}
async function load(){
  const notice=document.querySelector('#notice');
  try{
    const r=await fetch(api,{cache:'no-store'});const d=await r.json();
    if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);
    const samples=d.samples||[];const chats=d.chats||[];const stats=listenerStats(samples);
    if(!d.latest_main){notice.textContent='収集データはまだありません。';document.querySelector('#meta').hidden=true}
    else{
      notice.textContent=`15秒ごとに自動更新 / 最新${d.sample_count}件の毎分収集結果を表示`;
      const m=document.querySelector('#meta');m.hidden=false;m.innerHTML=card('target',d.handle)+card('main 最新',ftime(d.latest_main.observed_at))+card('main 経過',age(d.latest_main_age_ms))+card('chat 最新',ftime(d.latest_chat?.observed_at))+card('chat 経過',age(d.latest_chat_age_ms))+card('live',d.latest_main.is_broadcasting??'-')+card('listeners',d.latest_main.listener_count??'-')+card('同接 最小',stats?intFmt.format(stats.min):'-')+card('同接 最大',stats?intFmt.format(stats.max):'-')+card('同接 平均',stats?avgFmt.format(stats.avg):'-')+card('status',d.latest_main.status??'-')+card('chat status',d.latest_main.chat_status??'-')+card('station',d.latest_main.station_id??'-')+card('broadcast',d.latest_main.broadcast_id??'-');
    }
    document.querySelector('#samples').innerHTML=samples.map((x,i)=>`<tr><td>${esc(ftime(x.observed_at))}</td><td>${esc(gap(samples,i))}</td><td>${esc(x.station_id??'-')}</td><td>${esc(x.is_broadcasting??'-')}</td><td>${esc(x.listener_count??'-')}</td><td>${esc(x.guest_count??'-')}</td><td>${esc(x.total_listens??'-')}</td><td>${esc(x.status??'-')}</td><td>${esc(x.chat_status??'-')}</td><td>${esc(x.channel_alias??'-')}</td>${rawCell(x)}</tr>`).join('')||'<tr><td colspan="11" class="muted">なし</td></tr>';
    document.querySelector('#chats').innerHTML=chats.map((x,i)=>`<tr><td>${esc(ftime(x.observed_at))}</td><td>${esc(gap(chats,i))}</td><td>${esc(x.station_id??'-')}</td>${rawCell(x)}</tr>`).join('')||'<tr><td colspan="4" class="muted">なし</td></tr>';
  }catch(e){notice.textContent=`取得失敗: ${e.message}`}
}
document.querySelector('#reload').addEventListener('click',load);
load();
setInterval(()=>{if(!document.hidden)load()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script>
</body>
</html>
