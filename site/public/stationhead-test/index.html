<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Stationhead collection test</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;background:#111;color:#eee}body{margin:0;padding:24px;max-width:1100px}h1{font-size:22px;margin:0 0 16px}.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:20px}.card{background:#1c1c1c;border:1px solid #333;border-radius:8px;padding:12px}.label{font-size:12px;color:#aaa}.value{font-size:16px;margin-top:4px;word-break:break-all}table{width:100%;border-collapse:collapse;font-size:13px;background:#181818}th,td{border-bottom:1px solid #333;padding:8px;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#222}.ok{color:#80d88a}.bad{color:#ff8b8b}.muted{color:#aaa}.table-wrap{overflow:auto;border:1px solid #333;border-radius:8px;margin:10px 0 22px}button{padding:8px 12px;border-radius:6px;border:1px solid #555;background:#222;color:#eee}@media (prefers-color-scheme:light){:root{background:#fff;color:#111}.card,table{background:#fafafa}.card,.table-wrap,th,td{border-color:#ddd}th{background:#f2f2f2}button{background:#fff;color:#111;border-color:#aaa}}
  </style>
</head>
<body>
  <h1>Stationhead 5分収集テスト</h1>
  <div id="notice" class="muted">読み込み中…</div>
  <div id="meta" class="meta" hidden></div>
  <h2>main samples</h2>
  <div class="table-wrap"><table><thead><tr><th>JST</th><th>station</th><th>live</th><th>listeners</th><th>guests</th><th>total</th><th>channel</th><th>raw</th></tr></thead><tbody id="samples"></tbody></table></div>
  <h2>chat samples</h2>
  <div class="table-wrap"><table><thead><tr><th>JST</th><th>station</th><th>raw</th></tr></thead><tbody id="chats"></tbody></table></div>
  <button id="reload" type="button">再読み込み</button>
<script>
const api='/api/stationhead-collection-test';
const ftime=(ms)=>Number.isFinite(Number(ms))?new Date(Number(ms)).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',hour12:false}):'-';
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(label,value){return `<div class="card"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div></div>`}
async function load(){
  const notice=document.querySelector('#notice');
  try{
    const r=await fetch(api,{cache:'no-store'});const d=await r.json();
    if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);
    if(!d.test){notice.textContent='テスト実行データはまだありません。';document.querySelector('#meta').hidden=true;return}
    notice.textContent=`15秒ごとに自動更新 / main ${d.sample_count}件 / chat ${d.chat_sample_count}件`;
    const m=document.querySelector('#meta');m.hidden=false;m.innerHTML=card('target',d.test.handle)+card('status',d.test.status)+card('start',ftime(d.test.started_at))+card('end',ftime(d.test.ends_at))+card('duration',`${Math.round(d.test.duration_ms/60000)}分`)+card('test id',d.test.id);
    document.querySelector('#samples').innerHTML=(d.samples||[]).map(x=>`<tr><td>${esc(ftime(x.observed_at))}</td><td>${esc(x.station_id??'-')}</td><td class="${x.is_broadcasting===1?'ok':''}">${esc(x.is_broadcasting??'-')}</td><td>${esc(x.listener_count??'-')}</td><td>${esc(x.guest_count??'-')}</td><td>${esc(x.total_listens??'-')}</td><td>${esc(x.channel_alias??'-')}</td><td class="${x.raw_valid===1?'ok':'bad'}">${x.raw_valid===1?'valid':'invalid'} / ${esc(x.raw_bytes??0)} B</td></tr>`).join('')||'<tr><td colspan="8" class="muted">なし</td></tr>';
    document.querySelector('#chats').innerHTML=(d.chats||[]).map(x=>`<tr><td>${esc(ftime(x.observed_at))}</td><td>${esc(x.station_id??'-')}</td><td class="${x.raw_valid===1?'ok':'bad'}">${x.raw_valid===1?'valid':'invalid'} / ${esc(x.raw_bytes??0)} B</td></tr>`).join('')||'<tr><td colspan="3" class="muted">なし</td></tr>';
  }catch(e){notice.innerHTML=`<span class="bad">${esc(e.message)}</span>`}
}
document.querySelector('#reload').addEventListener('click',load);load();setInterval(load,15000);
</script>
</body>
</html>
