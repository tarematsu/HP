<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Buddies</title>
  <link rel="stylesheet" href="/app-lite.css?v=20260923.1">
  <link rel="stylesheet" href="/monochrome.css?v=20260923.1">
</head>
<body>
  <a class="skip-link" href="#content">本文へ移動</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="channel-head">
        <img id="channelImage" alt="" width="54" height="54" hidden>
        <div>
          <h1 id="channelName">Buddies</h1>
          <p id="updated" class="subtle">-</p>
        </div>
      </div>
      <nav id="modeTabs" class="mode-tabs dashboard-tabs" aria-label="表示種類">
        <button type="button" data-view="current" class="active" aria-current="page">現在</button>
        <button type="button" data-view="history" data-mode="daily">日次</button>
        <button type="button" data-view="history" data-mode="ranking">リーダーボード</button>
        <button type="button" data-view="history" data-mode="broadcasts">リスパ</button>
        <button type="button" data-view="likes">いいね</button>
      </nav>
    </div>
  </header>

  <main id="content" class="wrap">
    <p id="statusMessage" class="notice" role="status" hidden></p>

    <section id="currentView" class="dashboard-view current-view">
      <section class="summary-cards current-summary" aria-label="現在の集計概要">
        <article><span>オンライン数</span><strong id="listenerCount">-</strong></article>
        <article><span>累計再生数</span><strong id="currentStreamCount">-</strong></article>
        <article><span>総メンバー数</span><strong id="totalMemberCount">-</strong></article>
      </section>

      <section class="card chart-panel" id="currentChartPanel">
        <div class="section-head chart-head">
          <div><p class="kicker">CURRENT</p><h2 id="currentChartTitle">オンライン数</h2></div>
          <div id="currentChartLegend" class="chart-legend"></div>
        </div>
        <canvas id="currentChart" width="960" height="360" aria-label="現在のオンライン数グラフ"></canvas>
        <div id="currentChartDetail" class="chart-detail"></div>
      </section>

      <section class="card current-track-panel">
        <div class="section-head"><div><p class="kicker">NOW PLAYING</p><h2>再生中の曲</h2></div></div>
        <div class="current-track">
          <img id="trackImage" alt="" width="96" height="96" hidden>
          <div class="current-track-copy">
            <strong id="trackTitle">-</strong>
            <span id="trackArtist" class="subtle">-</span>
          </div>
        </div>
      </section>

      <section class="card current-queue-panel">
        <div class="section-head"><div><p class="kicker">UP NEXT</p><h2>今後の予定</h2></div></div>
        <div id="queueList" class="queue-list"></div>
      </section>
    </section>

    <section id="historyView" class="dashboard-view history-view" hidden>
      <div class="history-toolbar">
        <div class="history-range-controls" id="historyRangeControls"></div>
      </div>
      <p id="notice" class="notice" role="status" hidden></p>
      <section class="summary-cards" id="summaryCards" aria-label="過去データ集計概要"></section>
      <section id="chartPanel" class="card chart-panel">
        <div class="section-head chart-head">
          <div><p class="kicker">HISTORY</p><h2 id="chartTitle">推移</h2></div>
          <div id="chartLegend" class="chart-legend"></div>
        </div>
        <canvas id="chart" width="960" height="360" aria-label="過去データの推移グラフ"></canvas>
        <div class="chart-axis"><span id="chartStartDate">-</span><span id="chartEndDate">-</span></div>
        <div id="chartDetail" class="chart-detail"></div>
        <p id="chartFoot" class="chart-foot"></p>
      </section>
      <section class="card data-panel">
        <div class="section-head"><div><p class="kicker">DATA</p><h2 id="tableTitle">一覧</h2></div></div>
        <div class="table-wrap">
          <table>
            <thead id="historyThead"></thead>
            <tbody id="historyTbody"></tbody>
          </table>
        </div>
      </section>
    </section>

    <section id="likesView" class="dashboard-view likes-view" hidden>
      <p id="likesNotice" class="notice" role="status" hidden></p>
      <section class="summary-cards likes-summary" aria-label="いいね集計概要">
        <article><span>対象曲数</span><strong id="likesTrackCount">-</strong></article>
        <article><span>いいね合計</span><strong id="likesTotal">-</strong></article>
      </section>
      <section class="card chart-panel">
        <div class="section-head"><div><p class="kicker">LIKES</p><h2>いいねランキング</h2></div></div>
        <canvas id="likesChart" width="960" height="360" aria-label="楽曲別いいね数ランキング"></canvas>
      </section>
      <section class="card data-panel">
        <div class="section-head">
          <div><p class="kicker">DATA</p><h2>楽曲別一覧</h2></div>
          <button id="likesCsv" class="button" type="button">CSV</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>順位</th><th>曲名</th><th>アーティスト</th><th>最新いいね数</th><th>最終取得</th></tr></thead>
            <tbody id="likesTbody"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
  <script type="module" src="/dashboard-metrics.js?v=20260927.7"></script>
</body>
</html>
