<!doctype html>
<html lang="ja" data-dashboard-css-bundled="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <title>Buddies Station Monitor</title>
  <style id="dashboard-prepaint-guard">
    html[data-dashboard-booting] #content { visibility: hidden; }
  </style>
  <script>
    document.documentElement.setAttribute('data-dashboard-booting', '');
    const revealDashboard = () => document.documentElement.removeAttribute('data-dashboard-booting');
    window.addEventListener('dashboard:route-ready', revealDashboard, { once: true });
    window.addEventListener('DOMContentLoaded', () => setTimeout(revealDashboard, 1200), { once: true });
  </script>
  <noscript><style>#content { visibility: visible !important; }</style></noscript>
  <link rel="stylesheet" href="/assets/dashboard.min.css?v=20260930.2">
</head>
<body>
  <a class="skip-link" href="#content">本文へ移動</a>
  <main id="content" class="shell">
    <header class="top-card dashboard-header">
      <div class="channel">
        <span class="channel-visual" aria-hidden="true">
          <span id="channelFallback" class="channel-fallback">B</span>
          <img id="channelImage" class="channel-image" alt="" width="72" height="72" decoding="async" hidden>
        </span>
        <div class="channel-copy">
          <p class="kicker">STATIONHEAD LIVE MONITOR</p>
          <h1 id="channelName">Buddies</h1>
          <p id="updated" class="subtle">-</p>
        </div>
      </div>
      <nav id="modeTabs" class="mode-tabs dashboard-tabs" aria-label="表示種類"></nav>
    </header>
  </main>
  <script type="module" src="/assets/dashboard.min.js?v=20260930.4"></script>
</body>
</html>
