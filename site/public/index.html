<!doctype html>
<html lang="ja" data-dashboard-css-bundled="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <title>Buddies Station Monitor</title>
  <style id="dashboard-prepaint-guard">
    html[data-dashboard-booting] #content { visibility: hidden; }
  </style>
  <script>
    document.documentElement.setAttribute('data-dashboard-booting', '');
    const revealDashboard = () => document.documentElement.removeAttribute('data-dashboard-booting');
    window.addEventListener('dashboard:route-ready', revealDashboard, { once: true });
    window.addEventListener('DOMContentLoaded', () => setTimeout(revealDashboard, 1200), { once: true });
  </script>
  <noscript><style>#content { visibility: visible !important; }</style></noscript>
  <link rel="stylesheet" href="/assets/dashboard.min.css?v=20260930.2">
</head>
<body>
  <a class="skip-link" href="#content">本文へ移動</a>
  <main id="content" class="shell">
    <header class="top-card dashboard-header">
      <div class="channel">
        <span class="channel-visual" aria-hidden="true">
          <span id="channelFallback" class="channel-fallback">B</span>
          <img id="channelImage" class="channel-image" alt="" width="72" height="72" decoding="async" hidden>
        </span>
        <div class="channel-copy">
          <p class="kicker">STATIONHEAD LIVE MONITOR</p>
          <h1 id="channelName">Buddies</h1>
          <p id="updated" class="subtle">-</p>
        </div>
      </div>
      <nav id="modeTabs" class="mode-tabs dashboard-tabs" aria-label="表示種類">
        <button type="button" data-view="current" class="active" aria-current="page">現在</button>
        <button type="button" data-view="history" data-mode="daily">過去</button>
        <button type="button" data-view="first-week">初週比較</button>
        <button type="button" data-view="played-tracks">再生履歴</button>
        <button type="button" data-view="spotify">Spotify</button>
        <button type="button" data-view="likes" data-mode="likes">いいね</button>
        <button type="button" data-view="history" data-mode="ranking">リーダーボード</button>
        <button type="button" data-view="history" data-mode="broadcasts">リスパ</button>
      </nav>
    </header>

    <div id="currentView" class="dashboard-view">
      <section class="metrics" aria-label="現在の指標">
        <article class="metric featured">
          <span>オンライン</span>
          <div class="metric-value"><strong id="online">-</strong></div>
          <div id="onlineYesterdayAvg" class="delta" hidden></div>
        </article>
        <article class="metric">
          <span>累計再生数</span>
          <div class="metric-value"><strong id="totalStreams">-</strong></div>
          <div id="streamsYesterdayDelta" class="delta" hidden></div>
          <div id="streamsDayBeforeDelta" class="delta" hidden></div>
          <div id="metricGoalCompact" class="metric-goal-compact">
            <span class="metric-goal-row">目標 <b id="streamGoal">-</b> 予想 <strong id="goalEta">-</strong></span>
          </div>
        </article>
        <article class="metric">
          <span>総メンバー数</span>
          <div class="metric-value"><strong id="members">-</strong></div>
          <div id="membersYesterdayDelta" class="delta" hidden></div>
          <div id="membersDayBeforeDelta" class="delta" hidden></div>
          <div id="membersThreeDaysAgoDelta" class="delta" hidden></div>
        </article>
      </section>

      <section class="card chart-card">
        <div class="section-head chart-head">
          <div class="legend" aria-label="グラフ凡例"><span class="online-key">オンライン</span><span class="stream-growth-key">再生数</span></div>
        </div>
        <canvas id="audienceChart" width="960" height="360" aria-label="過去24時間のオンライン人数"></canvas>
        <div id="currentChartDetail" class="chart-detail" data-current-chart-detail></div>
      </section>

      <section class="card chart-card">
        <div class="section-head chart-head"><div><p class="kicker">STREAMS</p><h2>再生数増加</h2></div></div>
        <canvas id="streamGrowthChart" width="960" height="320" aria-label="1分ごとの再生数増加"></canvas>
        <div id="streamGrowthDetail" class="chart-detail" data-stream-growth-detail></div>
      </section>

      <section class="card data-panel">
        <div class="section-head"><div><p class="kicker">NOW PLAYING</p><h2>現在の再生状況</h2></div></div>
        <div id="nowPlaying" class="now-playing"></div>
      </section>
    </div>

    <section id="historyView" class="dashboard-view history-view" hidden>
      <p id="notice" class="notice" role="status" hidden></p>
      <div class="controls history-controls" id="historyControls">
        <div class="history-control-row">
          <div id="rangeButtons" class="range-buttons" aria-label="表示期間"></div>
          <div id="historyNavigator" class="history-navigator"></div>
        </div>
      </div>

      <section class="summary-cards" id="summaryCards" aria-label="履歴集計概要"></section>

      <section class="card chart-panel">
        <div class="section-head chart-head">
          <div><p class="kicker">TREND</p><h2 id="chartTitle">推移</h2></div>
          <div id="chartLegend" class="chart-legend" aria-label="グラフ凡例"></div>
        </div>
        <canvas id="chart" width="960" height="360" aria-label="履歴推移グラフ"></canvas>
        <div class="chart-axis"><span id="chartStartDate">-</span><span id="chartEndDate">-</span></div>
        <div id="chartDetail" class="chart-detail" data-history-chart-detail></div>
        <p id="chartFoot" class="chart-foot"></p>
      </section>

      <section class="card data-panel">
        <div class="section-head">
          <div><p class="kicker">DATA</p><h2 id="tableTitle">集計一覧</h2></div>
          <button id="csv" class="button" type="button">CSV</button>
        </div>
        <div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
        <button id="more" class="button more-button" type="button" hidden>さらに表示</button>
      </section>

      <section id="rankingWeeklyPanel" class="card data-panel" hidden>
        <div class="section-head"><div><p class="kicker">BUDDIES WEEKLY METRICS</p><h2>Buddies週間実績</h2></div></div>
        <div class="table-wrap"><table class="weekly-ranking-table"><thead id="rankingWeeklyThead"></thead><tbody id="rankingWeeklyTbody"></tbody></table></div>
      </section>
    </section>

    <section id="likesView" class="dashboard-view likes-view" hidden>
      <p id="likesNotice" class="notice" role="status" hidden></p>

      <section class="summary-cards likes-summary" aria-label="いいね集計概要" style="grid-template-columns:repeat(4,minmax(0,1fr)) !important">
        <article><span>最終取得</span><strong id="likesLatestAt" class="summary-date">-</strong></article>
        <article><span>対象楽曲数</span><strong id="likesTrackCount">-</strong></article>
        <article><span>合計いいね数</span><strong id="likesTotalLikes">-</strong></article>
        <article style="grid-column:auto !important"><span>合計いいね数 前日比</span><strong id="likesTotalDelta">-</strong></article>
      </section>

      <section class="card data-panel">
        <div class="section-head"><div><p class="kicker">TOP TRACKS</p><h2>最新いいねランキング</h2></div></div>
        <ol id="likesRankingList" class="like-ranking"></ol>
      </section>

      <section class="card data-panel">
        <div class="section-head">
          <div><p class="kicker">DATA</p><h2>楽曲別一覧</h2></div>
          <button id="likesCsv" class="button" type="button">CSV</button>
        </div>
        <div class="table-wrap table-fit-mobile">
          <table>
            <colgroup>
              <col class="col-compact">
              <col>
              <col class="col-artist">
              <col class="col-number">
              <col class="col-date">
            </colgroup>
            <thead><tr><th>順位</th><th>曲名</th><th>アーティスト</th><th>最新いいね数</th><th>最終取得</th></tr></thead>
            <tbody id="likesTbody"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>
  <script type="module" src="/assets/dashboard.min.js?v=20260930.2"></script>
</body>
</html>
